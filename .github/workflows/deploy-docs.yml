name: 构建、检查并部署文档

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 部署到 gh-pages 分支需要写权限；PR 只做构建与检查
permissions:
  contents: write

# 同一分支只保留最新一次运行
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: npm run docs:build

      # SVG 规范、文章规范、站内链接与锚点，任一不通过即失败，不会部署
      - name: 质量检查
        run: npm run docs:check

      - name: 写入 .nojekyll
        if: github.event_name != 'pull_request'
        run: touch docs/.vuepress/dist/.nojekyll

      - name: 发布到 gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/.vuepress/dist
