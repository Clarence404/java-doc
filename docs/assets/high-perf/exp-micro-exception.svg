<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="720" height="294" role="img" aria-label="在不同深度的调用栈下抛一次业务异常的耗时">
<style>
:root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
:root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
@media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
text { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--fg); }
.m { fill: var(--muted); }
</style>
<rect x="0" y="0" width="720" height="294" rx="8" fill="var(--bg)"/>
<text x="360" y="26" text-anchor="middle" font-size="14" font-weight="700">在不同深度的调用栈下抛一次业务异常的耗时</text>
<line x1="140" y1="48" x2="154" y2="48" stroke="var(--r)" stroke-width="8"/>
<text x="160" y="52" font-size="12">抛异常，带调用栈</text>
<line x1="278" y1="48" x2="292" y2="48" stroke="var(--y)" stroke-width="8"/>
<text x="298" y="52" font-size="12">抛异常，不采集调用栈</text>
<line x1="440" y1="48" x2="454" y2="48" stroke="var(--g)" stroke-width="8"/>
<text x="460" y="52" font-size="12">不抛，逐层返回错误码</text>
<text x="110" y="99.0" text-anchor="end" font-size="12">调用栈 1 层</text>
<line x1="120" y1="73.0" x2="162.7" y2="73.0" stroke="var(--r)" stroke-width="14"/>
<text class="m" x="168.7" y="77.0" font-size="11">634 ns</text>
<line x1="120" y1="95.0" x2="121.1" y2="95.0" stroke="var(--y)" stroke-width="14"/>
<text class="m" x="127.1" y="99.0" font-size="11">16 ns</text>
<line x1="120" y1="117.0" x2="121.0" y2="117.0" stroke="var(--g)" stroke-width="14"/>
<text class="m" x="127.0" y="121.0" font-size="11">0 ns</text>
<text x="110" y="173.0" text-anchor="end" font-size="12">调用栈 30 层</text>
<line x1="120" y1="147.0" x2="267.2" y2="147.0" stroke="var(--r)" stroke-width="14"/>
<text class="m" x="273.2" y="151.0" font-size="11">2,185 ns</text>
<line x1="120" y1="169.0" x2="174.3" y2="169.0" stroke="var(--y)" stroke-width="14"/>
<text class="m" x="180.3" y="173.0" font-size="11">806 ns</text>
<line x1="120" y1="191.0" x2="121.0" y2="191.0" stroke="var(--g)" stroke-width="14"/>
<text class="m" x="127.0" y="195.0" font-size="11">10 ns</text>
<text x="110" y="247.0" text-anchor="end" font-size="12">调用栈 120 层</text>
<line x1="120" y1="221.0" x2="630.0" y2="221.0" stroke="var(--r)" stroke-width="14"/>
<text class="m" x="636.0" y="225.0" font-size="11">7,572 ns</text>
<line x1="120" y1="243.0" x2="348.0" y2="243.0" stroke="var(--y)" stroke-width="14"/>
<text class="m" x="354.0" y="247.0" font-size="11">3,385 ns</text>
<line x1="120" y1="265.0" x2="133.6" y2="265.0" stroke="var(--g)" stroke-width="14"/>
<text class="m" x="139.6" y="269.0" font-size="11">201 ns</text>
</svg>
