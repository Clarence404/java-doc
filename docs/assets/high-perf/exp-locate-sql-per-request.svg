<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" width="720" height="246" role="img" aria-label="平均每个请求发给 MySQL 几条语句">
<style>
:root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
:root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
@media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
text { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--fg); }
.m { fill: var(--muted); }
</style>
<rect x="0" y="0" width="720" height="246" rx="8" fill="var(--bg)"/>
<text x="360" y="26" text-anchor="middle" font-size="14" font-weight="700">平均每个请求发给 MySQL 几条语句</text>
<line x1="233" y1="48" x2="247" y2="48" stroke="var(--r)" stroke-width="8"/>
<text x="253" y="52" font-size="12">驱动默认连接属性</text>
<line x1="371" y1="48" x2="385" y2="48" stroke="var(--g)" stroke-width="8"/>
<text x="391" y="52" font-size="12">记住会话状态之后</text>
<text x="126" y="88.0" text-anchor="end" font-size="12">业务语句</text>
<line x1="136" y1="73.0" x2="613.3" y2="73.0" stroke="var(--r)" stroke-width="14"/>
<text class="m" x="619.3" y="77.0" font-size="11">4.82 条</text>
<line x1="136" y1="95.0" x2="613.8" y2="95.0" stroke="var(--g)" stroke-width="14"/>
<text class="m" x="619.8" y="99.0" font-size="11">4.82 条</text>
<text x="126" y="140.0" text-anchor="end" font-size="12">COMMIT</text>
<line x1="136" y1="125.0" x2="234.9" y2="125.0" stroke="var(--r)" stroke-width="14"/>
<text class="m" x="240.9" y="129.0" font-size="11">1.00 条</text>
<line x1="136" y1="147.0" x2="235.0" y2="147.0" stroke="var(--g)" stroke-width="14"/>
<text class="m" x="241.0" y="151.0" font-size="11">1.00 条</text>
<text x="126" y="192.0" text-anchor="end" font-size="12">会话状态的查询与设置</text>
<line x1="136" y1="177.0" x2="630.0" y2="177.0" stroke="var(--r)" stroke-width="14"/>
<text class="m" x="636.0" y="181.0" font-size="11">4.99 条</text>
<line x1="136" y1="199.0" x2="391.2" y2="199.0" stroke="var(--g)" stroke-width="14"/>
<text class="m" x="397.2" y="203.0" font-size="11">2.58 条</text>
<text class="m" x="360" y="234" text-anchor="middle" font-size="11">三个库合计（含后台的关单与消息中继），除以同一段时间里前台的请求数</text>
</svg>
