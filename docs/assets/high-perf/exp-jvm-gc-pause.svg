<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-label="240 秒里垃圾回收一共让业务线程停了多久">
<style>
:root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
:root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
@media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
text { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--fg); }
.m { fill: var(--muted); }
</style>
<rect x="0" y="0" width="720" height="310" rx="8" fill="var(--bg)"/>
<text x="360" y="26" text-anchor="middle" font-size="14" font-weight="700">240 秒里垃圾回收一共让业务线程停了多久</text>
<text x="110" y="57.0" text-anchor="end" font-size="12">Serial 512MB</text>
<line x1="120" y1="53.0" x2="630.0" y2="53.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="636.0" y="57.0" font-size="11">2,623 ms</text>
<text x="110" y="87.0" text-anchor="end" font-size="12">Serial 1GB</text>
<line x1="120" y1="83.0" x2="453.9" y2="83.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="459.9" y="87.0" font-size="11">1,717 ms</text>
<text x="110" y="117.0" text-anchor="end" font-size="12">Parallel 512MB</text>
<line x1="120" y1="113.0" x2="276.9" y2="113.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="282.9" y="117.0" font-size="11">807 ms</text>
<text x="110" y="147.0" text-anchor="end" font-size="12">Parallel 1GB</text>
<line x1="120" y1="143.0" x2="215.1" y2="143.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="221.1" y="147.0" font-size="11">489 ms</text>
<text x="110" y="177.0" text-anchor="end" font-size="12">G1 512MB</text>
<line x1="120" y1="173.0" x2="268.1" y2="173.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="274.1" y="177.0" font-size="11">762 ms</text>
<text x="110" y="207.0" text-anchor="end" font-size="12">G1 1GB</text>
<line x1="120" y1="203.0" x2="217.4" y2="203.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="223.4" y="207.0" font-size="11">501 ms</text>
<text x="110" y="237.0" text-anchor="end" font-size="12">ZGC 512MB</text>
<line x1="120" y1="233.0" x2="125.8" y2="233.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="131.8" y="237.0" font-size="11">30 ms</text>
<text x="110" y="267.0" text-anchor="end" font-size="12">ZGC 1GB</text>
<line x1="120" y1="263.0" x2="122.5" y2="263.0" stroke="var(--b)" stroke-width="14"/>
<text class="m" x="128.5" y="267.0" font-size="11">13 ms</text>
<text class="m" x="360" y="298" text-anchor="middle" font-size="11">GC 日志里计数阶段全部停顿相加，同一变体各轮取中位数；240 秒的 1% 是 2400 ms</text>
</svg>
