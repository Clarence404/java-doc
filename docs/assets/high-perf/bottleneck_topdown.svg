<svg viewBox="0 0 710 134" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
    .tag { font-weight:700; font-size:13px; }
    .txt { fill:var(--fg); font-size:11px; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="355" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">自顶向下的瓶颈定位</text>

  <rect class="box" x="20" y="44" width="145" height="70" stroke="var(--p)"/>
  <text x="92.5" y="66" text-anchor="middle" class="tag" fill="var(--p)">① 系统资源</text>
  <text x="92.5" y="84" text-anchor="middle" class="txt">top / vmstat / iostat</text>
  <text x="92.5" y="100" text-anchor="middle" class="txt">CPU · 内存 · IO · 网络</text>
  <line class="arr" x1="165" y1="79" x2="193" y2="79"/>

  <rect class="box" x="195" y="44" width="145" height="70" stroke="var(--b)"/>
  <text x="267.5" y="66" text-anchor="middle" class="tag" fill="var(--b)">② JVM</text>
  <text x="267.5" y="84" text-anchor="middle" class="txt">GC 日志 / jstat / JFR</text>
  <text x="267.5" y="100" text-anchor="middle" class="txt">停顿 · 分配 · 堆占用</text>
  <line class="arr" x1="340" y1="79" x2="368" y2="79"/>

  <rect class="box" x="370" y="44" width="145" height="70" stroke="var(--g)"/>
  <text x="442.5" y="66" text-anchor="middle" class="tag" fill="var(--g)">③ 应用线程 / 锁</text>
  <text x="442.5" y="84" text-anchor="middle" class="txt">jstack / 火焰图</text>
  <text x="442.5" y="100" text-anchor="middle" class="txt">热点方法 · 锁竞争</text>
  <line class="arr" x1="515" y1="79" x2="543" y2="79"/>

  <rect class="box" x="545" y="44" width="145" height="70" stroke="var(--y)"/>
  <text x="617.5" y="66" text-anchor="middle" class="tag" fill="var(--y)">④ 外部依赖</text>
  <text x="617.5" y="84" text-anchor="middle" class="txt">链路追踪 / 慢日志</text>
  <text x="617.5" y="100" text-anchor="middle" class="txt">DB · 缓存 · RPC · MQ</text>
</svg>
