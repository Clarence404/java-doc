<svg viewBox="0 0 760 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .row { fill:var(--card); stroke-width:1.5; }
    .tag { font-weight:700; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .ef { fill:var(--fg); font-size:12px; }
    .ar { stroke:var(--muted); stroke-width:1.5; fill:none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">从 Spring Boot 迁移到 Quarkus 的推荐步骤</text>
  <rect class="row" x="20" y="44" width="720" height="60" rx="6" ry="6" stroke="var(--muted)"/>
  <text x="34" y="70" class="tag" fill="var(--muted)">评估</text>
  <text x="34" y="88" class="sub">盘点依赖与 Spring 特性使用面</text>
  <text x="726" y="70" text-anchor="end" class="ef">AOP、@Conditional、Starter 生态最难迁</text>
  <text x="726" y="88" text-anchor="end" class="sub">先选边界清晰、无状态的服务试点</text>
  <line class="ar" x1="380" y1="104" x2="380" y2="132" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="134" width="720" height="60" rx="6" ry="6" stroke="var(--p)"/>
  <text x="34" y="160" class="tag" fill="var(--p)">搭骨架</text>
  <text x="34" y="178" class="sub">quarkus create app 生成项目</text>
  <text x="726" y="160" text-anchor="end" class="ef">按依赖逐个找对应扩展</text>
  <text x="726" y="178" text-anchor="end" class="sub">没有扩展的库：确认 JVM 模式可用</text>
  <line class="ar" x1="380" y1="194" x2="380" y2="222" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="224" width="720" height="60" rx="6" ry="6" stroke="var(--b)"/>
  <text x="34" y="250" class="tag" fill="var(--b)">代码迁移</text>
  <text x="34" y="268" class="sub">兼容扩展过渡：spring-di / web / data-jpa</text>
  <text x="726" y="250" text-anchor="end" class="ef">逐步替换为 CDI、Jakarta REST、Panache</text>
  <text x="726" y="268" text-anchor="end" class="sub">去掉运行期反射与动态条件装配</text>
  <line class="ar" x1="380" y1="284" x2="380" y2="312" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="314" width="720" height="60" rx="6" ry="6" stroke="var(--y)"/>
  <text x="34" y="340" class="tag" fill="var(--y)">配置与测试</text>
  <text x="34" y="358" class="sub">application.yml → application.properties + Profile</text>
  <text x="726" y="340" text-anchor="end" class="ef">@SpringBootTest → @QuarkusTest</text>
  <text x="726" y="358" text-anchor="end" class="sub">Dev Services 替代手写 Testcontainers</text>
  <line class="ar" x1="380" y1="374" x2="380" y2="402" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="404" width="720" height="60" rx="6" ry="6" stroke="var(--g)"/>
  <text x="34" y="430" class="tag" fill="var(--g)">上线与原生化</text>
  <text x="34" y="448" class="sub">先以 JVM 模式灰度上线</text>
  <text x="726" y="430" text-anchor="end" class="ef">压测对比启动、内存与吞吐</text>
  <text x="726" y="448" text-anchor="end" class="sub">确有收益再切原生镜像</text>
</svg>
