<svg viewBox="0 0 760 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .row { fill:var(--card); stroke-width:1.5; }
    .tag { font-weight:700; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .ef { fill:var(--fg); font-size:12px; }
    .ar { stroke:var(--muted); stroke-width:1.5; fill:none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Quarkus 原生镜像构建流水线</text>
  <rect class="row" x="20" y="44" width="720" height="60" rx="6" ry="6" stroke="var(--p)"/>
  <text x="34" y="70" class="tag" fill="var(--p)">构建期增强</text>
  <text x="34" y="88" class="sub">Quarkus 扩展完成 Bean 图与配置固化</text>
  <text x="726" y="70" text-anchor="end" class="ef">自动生成反射、资源、代理等注册信息</text>
  <text x="726" y="88" text-anchor="end" class="sub">大部分 native-image 配置无需手写</text>
  <line class="ar" x1="380" y1="104" x2="380" y2="132" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="134" width="720" height="60" rx="6" ry="6" stroke="var(--b)"/>
  <text x="34" y="160" class="tag" fill="var(--b)">静态可达性分析</text>
  <text x="34" y="178" class="sub">从 main 出发做 points-to 分析</text>
  <text x="726" y="160" text-anchor="end" class="ef">闭世界假设：不可达的类与方法全部删除</text>
  <text x="726" y="178" text-anchor="end" class="sub">反射、动态代理、资源需提前登记</text>
  <line class="ar" x1="380" y1="194" x2="380" y2="222" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="224" width="720" height="60" rx="6" ry="6" stroke="var(--y)"/>
  <text x="34" y="250" class="tag" fill="var(--y)">构建期初始化</text>
  <text x="34" y="268" class="sub">Quarkus 默认在构建期初始化类</text>
  <text x="726" y="250" text-anchor="end" class="ef">static 初始化结果写入镜像堆快照</text>
  <text x="726" y="268" text-anchor="end" class="sub">随机数、时间戳等需改为运行期初始化</text>
  <line class="ar" x1="380" y1="284" x2="380" y2="312" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="314" width="720" height="60" rx="6" ry="6" stroke="var(--muted)"/>
  <text x="34" y="340" class="tag" fill="var(--muted)">AOT 编译</text>
  <text x="34" y="358" class="sub">Graal 编译器把可达代码编译为机器码</text>
  <text x="726" y="340" text-anchor="end" class="ef">无 JIT 预热，峰值性能依赖 PGO 等手段</text>
  <text x="726" y="358" text-anchor="end" class="sub">构建耗时长、内存占用 4~8 GB</text>
  <line class="ar" x1="380" y1="374" x2="380" y2="402" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="404" width="720" height="60" rx="6" ry="6" stroke="var(--g)"/>
  <text x="34" y="430" class="tag" fill="var(--g)">产物</text>
  <text x="34" y="448" class="sub">原生可执行文件（平台相关）</text>
  <text x="726" y="430" text-anchor="end" class="ef">打入精简基础镜像，毫秒级启动</text>
  <text x="726" y="448" text-anchor="end" class="sub">配合 Kubernetes 扩展生成部署清单</text>
</svg>
