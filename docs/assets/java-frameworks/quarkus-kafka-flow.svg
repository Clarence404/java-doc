<svg viewBox="0 0 760 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .row { fill:var(--card); stroke-width:1.5; }
    .tag { font-weight:700; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .ef { fill:var(--fg); font-size:12px; }
    .ar { stroke:var(--muted); stroke-width:1.5; fill:none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">SmallRye Reactive Messaging 的 Kafka 消费链路</text>
  <rect class="row" x="20" y="44" width="720" height="60" rx="6" ry="6" stroke="var(--muted)"/>
  <text x="34" y="70" class="tag" fill="var(--muted)">Kafka Topic：orders</text>
  <text x="34" y="88" class="sub">按分区存储消息</text>
  <text x="726" y="70" text-anchor="end" class="ef">由 smallrye-kafka 连接器拉取</text>
  <text x="726" y="88" text-anchor="end" class="sub">mp.messaging.incoming.orders.connector</text>
  <line class="ar" x1="380" y1="104" x2="380" y2="132" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="134" width="720" height="60" rx="6" ry="6" stroke="var(--b)"/>
  <text x="34" y="160" class="tag" fill="var(--b)">入站通道 orders</text>
  <text x="34" y="178" class="sub">反序列化为 Message&lt;T&gt;</text>
  <text x="726" y="160" text-anchor="end" class="ef">在 Vert.x 事件循环上投递</text>
  <text x="726" y="178" text-anchor="end" class="sub">concurrency 控制消费线程数</text>
  <line class="ar" x1="380" y1="194" x2="380" y2="222" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="224" width="720" height="60" rx="6" ry="6" stroke="var(--p)"/>
  <text x="34" y="250" class="tag" fill="var(--p)">@Incoming 处理方法</text>
  <text x="34" y="268" class="sub">默认运行在 I/O 线程</text>
  <text x="726" y="250" text-anchor="end" class="ef">阻塞逻辑加 @Blocking 或 @RunOnVirtualThread</text>
  <text x="726" y="268" text-anchor="end" class="sub">默认 POST_PROCESSING：方法返回后 ack</text>
  <line class="ar" x1="380" y1="284" x2="380" y2="312" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="314" width="720" height="60" rx="6" ry="6" stroke="var(--y)"/>
  <text x="34" y="340" class="tag" fill="var(--y)">确认与提交</text>
  <text x="34" y="358" class="sub">ack：throttled 策略按 offset 连续性提交</text>
  <text x="726" y="340" text-anchor="end" class="ef">nack：按 failure-strategy 处理</text>
  <text x="726" y="358" text-anchor="end" class="sub">fail（默认）/ ignore / dead-letter-queue / delayed-retry-topic</text>
  <line class="ar" x1="380" y1="374" x2="380" y2="402" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="404" width="720" height="60" rx="6" ry="6" stroke="var(--g)"/>
  <text x="34" y="430" class="tag" fill="var(--g)">出站通道 / Emitter</text>
  <text x="34" y="448" class="sub">@Outgoing 或 Emitter 发送</text>
  <text x="726" y="430" text-anchor="end" class="ef">下游 ack 后上游才算完成</text>
  <text x="726" y="448" text-anchor="end" class="sub">mp.messaging.outgoing.xxx.connector</text>
</svg>
