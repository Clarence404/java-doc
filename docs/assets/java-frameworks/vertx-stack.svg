<svg viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .tag { font-size: 13px; font-weight: 600; }
    .item { font-size: 12px; }
    .sub { font-size: 11px; fill: var(--muted); }
    .lbl { font-size: 11px; fill: var(--muted); }
    .rowlbl { font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" class="title">Vert.x 技术栈分层</text>
  <rect x="20" y="40" width="640" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="340" y="62" text-anchor="middle" class="tag" style="fill:var(--p)">上层框架与应用</text>
  <text x="180" y="84" text-anchor="middle" class="item">Quarkus（底层使用 Vert.x）</text>
  <text x="500" y="84" text-anchor="middle" class="item">自研 Vert.x 服务 / 网关 / IoT 接入</text>
  <rect x="20" y="112" width="640" height="80" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="340" y="134" text-anchor="middle" class="tag" style="fill:var(--b)">Vert.x 生态模块（按需引入）</text>
  <text x="180" y="156" text-anchor="middle" class="item">Web / Web Client / OpenAPI Router</text>
  <text x="500" y="156" text-anchor="middle" class="item">Pg / MySQL / Redis / Mongo Client</text>
  <text x="180" y="176" text-anchor="middle" class="item">Kafka / MQTT / AMQP / gRPC</text>
  <text x="500" y="176" text-anchor="middle" class="item">Auth / Config / Health / Micrometer</text>
  <rect x="20" y="204" width="640" height="80" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="340" y="226" text-anchor="middle" class="tag" style="fill:var(--g)">Vert.x Core</text>
  <text x="180" y="248" text-anchor="middle" class="item">Event Loop / Verticle / Context</text>
  <text x="500" y="248" text-anchor="middle" class="item">Future / Promise / Event Bus</text>
  <text x="180" y="268" text-anchor="middle" class="item">HTTP 1.x / 2 / 3、TCP、UDP、DNS</text>
  <text x="500" y="268" text-anchor="middle" class="item">文件系统 / 共享数据 / 集群 SPI</text>
  <rect x="20" y="296" width="640" height="80" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="340" y="318" text-anchor="middle" class="tag" style="fill:var(--y)">Netty 4.2</text>
  <text x="180" y="340" text-anchor="middle" class="item">EventLoopGroup / Channel / Pipeline</text>
  <text x="500" y="340" text-anchor="middle" class="item">ByteBuf / 编解码器</text>
  <text x="180" y="360" text-anchor="middle" class="item">NIO / epoll / kqueue / io_uring</text>
  <text x="500" y="360" text-anchor="middle" class="item">Vert.x 5 起不再对外暴露 Netty API</text>
  <rect x="20" y="388" width="640" height="44" rx="6" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="340" y="416" text-anchor="middle" class="tag" style="fill:var(--r)">JVM：JDK 11+（虚拟线程 Verticle 需 JDK 21+）</text>
</svg>
