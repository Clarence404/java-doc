<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .tag { font-size: 13px; font-weight: 600; }
    .item { font-size: 12px; }
    .sub { font-size: 11px; fill: var(--muted); }
    .lbl { font-size: 11px; fill: var(--muted); }
    .rowlbl { font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" class="title">JDBC 阻塞模型 vs Vert.x 响应式 SQL 客户端</text>
  <text x="175" y="48" text-anchor="middle" class="rowlbl">JDBC + 连接池</text>
  <text x="525" y="48" text-anchor="middle" class="rowlbl">Vert.x SQL Client</text>
  <rect x="20" y="60" width="310" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="175" y="84" text-anchor="middle" class="tag" style="fill:var(--y)">请求线程 × N</text>
  <text x="175" y="104" text-anchor="middle" class="sub">等待结果期间线程被阻塞</text>
  <rect x="370" y="60" width="310" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="525" y="84" text-anchor="middle" class="tag" style="fill:var(--g)">Event Loop × 2C</text>
  <text x="525" y="104" text-anchor="middle" class="sub">发出查询立即返回，结果回调</text>
  <line x1="175" y1="120" x2="175" y2="158" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="525" y1="120" x2="525" y2="158" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="160" width="310" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="175" y="184" text-anchor="middle" class="tag" style="fill:var(--y)">HikariCP 连接池</text>
  <text x="175" y="204" text-anchor="middle" class="sub">1 个连接同一时刻只服务 1 个线程</text>
  <rect x="370" y="160" width="310" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="525" y="184" text-anchor="middle" class="tag" style="fill:var(--g)">Pool（maxSize 默认 4）</text>
  <text x="525" y="204" text-anchor="middle" class="sub">等待队列默认无界，需显式设上限</text>
  <line x1="175" y1="220" x2="175" y2="258" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="525" y1="220" x2="525" y2="258" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="260" width="310" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="175" y="284" text-anchor="middle" class="tag" style="fill:var(--y)">数据库</text>
  <text x="175" y="304" text-anchor="middle" class="sub">同步驱动：发请求后阻塞等响应</text>
  <rect x="370" y="260" width="310" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="525" y="284" text-anchor="middle" class="tag" style="fill:var(--g)">数据库</text>
  <text x="525" y="304" text-anchor="middle" class="sub">借出的连接上可流水线发送多条查询</text>
</svg>
