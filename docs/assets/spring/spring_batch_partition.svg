<svg viewBox="0 0 720 348" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .layer-bg{fill:var(--bg);stroke:var(--border);stroke-width:1;}
    .label-p{fill:var(--p);font-weight:700;}
    .label-b{fill:var(--b);font-weight:700;}
    .label-g{fill:var(--g);font-weight:700;}
    .label-y{fill:var(--y);font-weight:700;}
    .label-r{fill:var(--r);font-weight:700;}
    .arrow{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ah);}
    .code{font-family:Consolas,'JetBrains Mono',monospace;}
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700">Spring Batch 分区处理</text>
  <rect class="card" x="210" y="44" width="300" height="60" rx="6"/>
  <text x="360" y="66" text-anchor="middle" class="label-p" font-size="12">Manager Step</text>
  <text x="360" y="88" text-anchor="middle" class="muted" font-size="11">Partitioner 按 ID 范围切成 4 份</text>
  <line x1="360" y1="104" x2="360" y2="144" class="arrow"/>
  <rect class="layer-bg" x="20" y="146" width="680" height="64" rx="8"/>
  <text x="190" y="170" text-anchor="middle" class="label-b" font-size="12">本地：TaskExecutorPartitionHandler</text>
  <text x="190" y="190" text-anchor="middle" class="muted" font-size="11">Worker 在本 JVM 的线程池中并行</text>
  <text x="530" y="170" text-anchor="middle" class="label-y" font-size="12">远程：MessageChannelPartitionHandler</text>
  <text x="530" y="190" text-anchor="middle" class="muted" font-size="11">Worker 在其他节点，经 MQ 收发分区</text>
  <line x1="97.5" y1="210" x2="97.5" y2="250" class="arrow"/>
  <rect class="card" x="20" y="252" width="155" height="76" rx="6"/>
  <text x="97.5" y="274" text-anchor="middle" class="label-g" font-size="12">Worker Step 1</text>
  <text x="97.5" y="294" text-anchor="middle" class="muted" font-size="11">id 1 – 250万</text>
  <text x="97.5" y="312" text-anchor="middle" font-size="11">独立 StepExecution</text>
  <line x1="272.5" y1="210" x2="272.5" y2="250" class="arrow"/>
  <rect class="card" x="195" y="252" width="155" height="76" rx="6"/>
  <text x="272.5" y="274" text-anchor="middle" class="label-g" font-size="12">Worker Step 2</text>
  <text x="272.5" y="294" text-anchor="middle" class="muted" font-size="11">id 250万 – 500万</text>
  <text x="272.5" y="312" text-anchor="middle" font-size="11">独立 StepExecution</text>
  <line x1="447.5" y1="210" x2="447.5" y2="250" class="arrow"/>
  <rect class="card" x="370" y="252" width="155" height="76" rx="6"/>
  <text x="447.5" y="274" text-anchor="middle" class="label-g" font-size="12">Worker Step 3</text>
  <text x="447.5" y="294" text-anchor="middle" class="muted" font-size="11">id 500万 – 750万</text>
  <text x="447.5" y="312" text-anchor="middle" font-size="11">独立 StepExecution</text>
  <line x1="622.5" y1="210" x2="622.5" y2="250" class="arrow"/>
  <rect class="card" x="545" y="252" width="155" height="76" rx="6"/>
  <text x="622.5" y="274" text-anchor="middle" class="label-g" font-size="12">Worker Step 4</text>
  <text x="622.5" y="294" text-anchor="middle" class="muted" font-size="11">id 750万 – 1000万</text>
  <text x="622.5" y="312" text-anchor="middle" font-size="11">独立 StepExecution</text>
</svg>
