<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .layer-bg{fill:var(--bg);stroke:var(--border);stroke-width:1;}
    .stripe-p{fill:var(--p);opacity:0.12;}
    .stripe-b{fill:var(--b);opacity:0.12;}
    .stripe-g{fill:var(--g);opacity:0.12;}
    .label-p{fill:var(--p);font-weight:700;}
    .label-b{fill:var(--b);font-weight:700;}
    .label-g{fill:var(--g);font-weight:700;}
    .label-y{fill:var(--y);font-weight:700;}
    .arrow{stroke:var(--b);stroke-width:1.8;fill:none;marker-end:url(#ah);}
    .arrow-gray{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ahg);}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--b)"/>
    </marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="700">Spring Integration 消息流架构</text>

  <!-- External System A (inbound) -->
  <rect class="card" x="20" y="46" width="110" height="62" rx="6"/>
  <text x="75" y="66" text-anchor="middle" class="label-g" font-size="11">外部系统</text>
  <text x="75" y="82" text-anchor="middle" class="muted" font-size="10">文件 / HTTP</text>
  <text x="75" y="96" text-anchor="middle" class="muted" font-size="10">JMS / AMQP</text>

  <!-- Inbound Adapter -->
  <rect class="card" x="152" y="46" width="110" height="62" rx="6"/>
  <text x="207" y="66" text-anchor="middle" class="label-g" font-size="11">Inbound</text>
  <text x="207" y="82" text-anchor="middle" class="label-g" font-size="11">Adapter</text>
  <text x="207" y="98" text-anchor="middle" class="muted" font-size="10">入站适配器</text>

  <!-- Message Channel 1 -->
  <rect class="stripe-b" x="284" y="46" width="110" height="62" rx="6"/>
  <rect fill="none" stroke="var(--b)" stroke-width="1.5" x="284" y="46" width="110" height="62" rx="6"/>
  <text x="339" y="70" text-anchor="middle" class="label-b" font-size="11">Message</text>
  <text x="339" y="86" text-anchor="middle" class="label-b" font-size="11">Channel</text>
  <text x="339" y="100" text-anchor="middle" class="muted" font-size="10">解耦缓冲</text>

  <!-- Endpoint group -->
  <rect class="layer-bg" x="416" y="36" width="264" height="82" rx="8"/>
  <text x="548" y="54" text-anchor="middle" class="label-p" font-size="11">Endpoints（消息处理节点）</text>
  <rect class="card" x="426" y="60" width="66" height="46" rx="4"/>
  <text x="459" y="78" text-anchor="middle" font-size="10">Filter</text>
  <text x="459" y="93" text-anchor="middle" class="muted" font-size="9">过滤</text>
  <rect class="card" x="500" y="60" width="68" height="46" rx="4"/>
  <text x="534" y="78" text-anchor="middle" font-size="10">Transform</text>
  <text x="534" y="93" text-anchor="middle" class="muted" font-size="9">转换</text>
  <rect class="card" x="576" y="60" width="94" height="46" rx="4"/>
  <text x="623" y="78" text-anchor="middle" font-size="10">Router/Splitter</text>
  <text x="623" y="93" text-anchor="middle" class="muted" font-size="9">路由 / 拆分</text>

  <!-- Second Channel -->
  <rect class="stripe-b" x="284" y="166" width="110" height="62" rx="6"/>
  <rect fill="none" stroke="var(--b)" stroke-width="1.5" x="284" y="166" width="110" height="62" rx="6"/>
  <text x="339" y="190" text-anchor="middle" class="label-b" font-size="11">Message</text>
  <text x="339" y="206" text-anchor="middle" class="label-b" font-size="11">Channel</text>
  <text x="339" y="220" text-anchor="middle" class="muted" font-size="10">处理结果</text>

  <!-- Outbound Adapter -->
  <rect class="card" x="152" y="166" width="110" height="62" rx="6"/>
  <text x="207" y="186" text-anchor="middle" class="label-y" font-size="11">Outbound</text>
  <text x="207" y="202" text-anchor="middle" class="label-y" font-size="11">Adapter</text>
  <text x="207" y="218" text-anchor="middle" class="muted" font-size="10">出站适配器</text>

  <!-- External System B (outbound) -->
  <rect class="card" x="20" y="166" width="110" height="62" rx="6"/>
  <text x="75" y="186" text-anchor="middle" class="label-y" font-size="11">目标系统</text>
  <text x="75" y="202" text-anchor="middle" class="muted" font-size="10">DB / MQ</text>
  <text x="75" y="218" text-anchor="middle" class="muted" font-size="10">REST / 文件</text>

  <!-- Arrows top row -->
  <line x1="130" y1="77" x2="146" y2="77" class="arrow"/>
  <line x1="262" y1="77" x2="278" y2="77" class="arrow"/>
  <line x1="394" y1="77" x2="410" y2="77" class="arrow"/>

  <!-- Endpoints → Channel 2 (down) -->
  <line x1="548" y1="118" x2="548" y2="152" class="arrow"/>
  <line x1="548" y1="152" x2="400" y2="152" class="arrow-gray"/>
  <line x1="344" y1="152" x2="344" y2="160" class="arrow"/>

  <!-- Channel 2 → Outbound → Target -->
  <line x1="284" y1="197" x2="268" y2="197" class="arrow"/>
  <line x1="152" y1="197" x2="136" y2="197" class="arrow"/>

  <!-- Message anatomy -->
  <rect class="layer-bg" x="20" y="266" width="660" height="72" rx="8"/>
  <text x="350" y="285" text-anchor="middle" class="muted" font-size="11" font-weight="600">Message 结构</text>
  <rect class="card" x="36" y="295" width="140" height="32" rx="4"/>
  <text x="106" y="316" text-anchor="middle" class="label-b" font-size="11">MessageHeaders</text>
  <text x="220" y="316" text-anchor="middle" class="muted" font-size="10">id · timestamp · correlationId · 自定义 key</text>
  <rect class="card" x="400" y="295" width="120" height="32" rx="4"/>
  <text x="460" y="316" text-anchor="middle" class="label-g" font-size="11">Payload</text>
  <text x="560" y="316" text-anchor="middle" class="muted" font-size="10">任意 Java 对象</text>

  <!-- Gateway note -->
  <rect class="card" x="416" y="166" width="264" height="62" rx="8"/>
  <text x="548" y="186" text-anchor="middle" class="label-p" font-size="11">Gateway（同步调用入口）</text>
  <text x="548" y="204" text-anchor="middle" class="muted" font-size="10">@MessagingGateway 将消息流包装为</text>
  <text x="548" y="218" text-anchor="middle" class="muted" font-size="10">同步接口，调用方无感知</text>
</svg>
