<svg viewBox="0 0 720 370" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .layer-bg{fill:var(--bg);stroke:var(--border);stroke-width:1;}
    .label-p{fill:var(--p);font-weight:700;}
    .label-b{fill:var(--b);font-weight:700;}
    .label-g{fill:var(--g);font-weight:700;}
    .label-y{fill:var(--y);font-weight:700;}
    .label-r{fill:var(--r);font-weight:700;}
    .arrow{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ah);}
    .code{font-family:Consolas,'JetBrains Mono',monospace;}
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700">JobInstance 与重启语义</text>
  <rect class="layer-bg" x="20" y="44" width="680" height="60" rx="8"/>
  <text x="360" y="66" text-anchor="middle" class="label-p" font-size="12">JobInstance</text>
  <text x="360" y="88" text-anchor="middle" class="muted" font-size="11">作业名 importJob + 标识性参数 {inputFile, bizDate=2026-10-08}</text>
  <line x1="120" y1="104" x2="120" y2="144" class="arrow"/>
  <line x1="360" y1="104" x2="360" y2="144" class="arrow"/>
  <rect class="card" x="20" y="146" width="200" height="100" rx="6"/>
  <text x="120" y="168" text-anchor="middle" class="label-b" font-size="12">JobExecution #1</text>
  <text x="120" y="188" text-anchor="middle" class="label-r" font-size="11">FAILED</text>
  <text x="120" y="208" text-anchor="middle" font-size="11">chunk 1–40 已提交</text>
  <text x="120" y="226" text-anchor="middle" class="muted" font-size="11">第 41 个 chunk 回滚</text>
  <rect class="card" x="260" y="146" width="200" height="100" rx="6"/>
  <text x="360" y="168" text-anchor="middle" class="label-b" font-size="12">JobExecution #2</text>
  <text x="360" y="188" text-anchor="middle" class="label-g" font-size="11">COMPLETED</text>
  <text x="360" y="208" text-anchor="middle" font-size="11">相同参数 restart</text>
  <text x="360" y="226" text-anchor="middle" class="muted" font-size="11">从第 41 个 chunk 续跑</text>
  <rect x="500" y="146" width="200" height="100" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="600" y="168" text-anchor="middle" font-size="12" font-weight="700">相同参数再次 start</text>
  <text x="600" y="188" text-anchor="middle" class="label-r" font-size="11">拒绝执行</text>
  <text x="600" y="208" text-anchor="middle" font-size="11">COMPLETED 实例不可重跑</text>
  <text x="600" y="226" text-anchor="middle" class="muted" font-size="11">抛 AlreadyComplete 异常</text>
  <line x1="220" y1="196" x2="258" y2="196" class="arrow"/>
  <line x1="460" y1="196" x2="498" y2="196" class="arrow"/>
  <line x1="120" y1="246" x2="120" y2="288" class="arrow"/>
  <text x="128" y="272" text-anchor="start" class="muted" font-size="10">写入断点</text>
  <line x1="360" y1="290" x2="360" y2="248" class="arrow"/>
  <text x="368" y="272" text-anchor="start" class="muted" font-size="10">读取断点</text>
  <rect class="layer-bg" x="20" y="290" width="680" height="60" rx="8"/>
  <text x="360" y="312" text-anchor="middle" class="label-y" font-size="12">JobRepository（JDBC 元数据表）</text>
  <text x="360" y="334" text-anchor="middle" class="muted" font-size="11">每个 chunk 提交时把读取位置写入 ExecutionContext（BATCH_STEP_EXECUTION_CONTEXT）</text>
</svg>
