<svg viewBox="0 0 760 530" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .label-p{fill:var(--p);font-weight:700;}
    .label-b{fill:var(--b);font-weight:700;}
    .label-g{fill:var(--g);font-weight:700;}
    .label-y{fill:var(--y);font-weight:700;}
    .label-r{fill:var(--r);font-weight:700;}
    .arrow{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ah);}
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="700">@TransactionalEventListener 各阶段执行时机</text>

  <!-- 行 1：业务方法 -->
  <rect class="card" x="60" y="50" width="640" height="60" rx="6"/>
  <text x="380" y="76" text-anchor="middle" class="label-p">@Transactional 方法：写库 + publishEvent()</text>
  <text x="380" y="96" text-anchor="middle" class="muted" font-size="11">事件登记为事务同步回调，不立即执行；无事务时默认不执行（fallbackExecution 可改）</text>

  <line x1="380" y1="110" x2="380" y2="148" class="arrow"/>

  <!-- 行 2：BEFORE_COMMIT -->
  <rect class="card" x="60" y="150" width="640" height="60" rx="6"/>
  <text x="380" y="176" text-anchor="middle" class="label-y">BEFORE_COMMIT</text>
  <text x="380" y="196" text-anchor="middle" class="muted" font-size="11">仍在原事务内，写库随原事务一起提交；监听器抛异常会导致原事务回滚</text>

  <line x1="210" y1="210" x2="210" y2="248" class="arrow"/>
  <line x1="550" y1="210" x2="550" y2="248" class="arrow"/>

  <!-- 行 3：提交 / 回滚 -->
  <rect class="card" x="60" y="250" width="300" height="60" rx="6"/>
  <text x="210" y="276" text-anchor="middle" class="label-g">事务提交</text>
  <text x="210" y="296" text-anchor="middle" class="muted" font-size="11">数据已落库</text>

  <rect class="card" x="400" y="250" width="300" height="60" rx="6"/>
  <text x="550" y="276" text-anchor="middle" class="label-r">事务回滚</text>
  <text x="550" y="296" text-anchor="middle" class="muted" font-size="11">数据未落库</text>

  <line x1="210" y1="310" x2="210" y2="348" class="arrow"/>
  <line x1="550" y1="310" x2="550" y2="348" class="arrow"/>

  <!-- 行 4：AFTER_COMMIT / AFTER_ROLLBACK -->
  <rect class="card" x="60" y="350" width="300" height="60" rx="6"/>
  <text x="210" y="376" text-anchor="middle" class="label-g">AFTER_COMMIT（默认）</text>
  <text x="210" y="396" text-anchor="middle" class="muted" font-size="11">写库需 REQUIRES_NEW；进程崩溃会丢事件</text>

  <rect class="card" x="400" y="350" width="300" height="60" rx="6"/>
  <text x="550" y="376" text-anchor="middle" class="label-r">AFTER_ROLLBACK</text>
  <text x="550" y="396" text-anchor="middle" class="muted" font-size="11">补偿、告警</text>

  <line x1="210" y1="410" x2="210" y2="448" class="arrow"/>
  <line x1="550" y1="410" x2="550" y2="448" class="arrow"/>

  <!-- 行 5：AFTER_COMPLETION -->
  <rect class="card" x="60" y="450" width="640" height="60" rx="6"/>
  <text x="380" y="476" text-anchor="middle" class="label-b">AFTER_COMPLETION</text>
  <text x="380" y="496" text-anchor="middle" class="muted" font-size="11">提交或回滚之后都会执行，适合指标记录、资源清理</text>
</svg>
