<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .label { font-size:11px; fill:var(--fg); }
  </style>
  <defs>
    <marker id="arrow-sso1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="26" text-anchor="middle">SSO 三方票据模型（通用骨架）</text>

  <!-- 参与者 -->
  <rect x="40" y="44" width="140" height="44" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text class="box-title" x="110" y="72" text-anchor="middle">浏览器</text>
  <rect x="210" y="44" width="140" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="280" y="72" text-anchor="middle">子系统 A</text>
  <rect x="380" y="44" width="140" height="44" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="450" y="72" text-anchor="middle">认证中心</text>
  <rect x="550" y="44" width="140" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="620" y="72" text-anchor="middle">子系统 B</text>

  <!-- 生命线 -->
  <line x1="110" y1="92" x2="110" y2="460" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="280" y1="92" x2="280" y2="460" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="450" y1="92" x2="450" y2="460" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="620" y1="92" x2="620" y2="460" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>

  <text class="label" x="195" y="116" text-anchor="middle">① 访问（无会话）</text>
  <line x1="116" y1="124" x2="274" y2="124" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sso1)"/>

  <text class="label" x="365" y="168" text-anchor="middle">② 302 重定向到认证中心</text>
  <line x1="286" y1="176" x2="444" y2="176" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sso1)"/>

  <text class="label" x="280" y="220" text-anchor="middle">③ 登录成功：种全局会话 + 签发票据</text>
  <line x1="444" y1="228" x2="116" y2="228" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sso1)"/>

  <text class="label" x="195" y="272" text-anchor="middle">④ 携票据回跳</text>
  <line x1="116" y1="280" x2="274" y2="280" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sso1)"/>

  <text class="label" x="365" y="324" text-anchor="middle">⑤ 后端验票 → 建立局部会话</text>
  <line x1="286" y1="332" x2="444" y2="332" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sso1)"/>

  <text class="label" x="365" y="376" text-anchor="middle">⑥ 访问子系统 B（同样被重定向到认证中心）</text>
  <line x1="116" y1="384" x2="614" y2="384" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sso1)"/>

  <text class="label" x="540" y="428" text-anchor="middle">⑦ 全局会话仍在 → 发票据免登录</text>
  <line x1="456" y1="436" x2="614" y2="436" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sso1)"/>
</svg>
