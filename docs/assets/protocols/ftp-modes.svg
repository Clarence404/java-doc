<svg viewBox="0 0 680 364" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .lbl { fill:var(--fg); font-size:12px; }
    .arrb { stroke:var(--b); stroke-width:1.6; fill:none; }
    .arrg { stroke:var(--g); stroke-width:1.6; fill:none; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--b)"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--g)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">FTP 主动模式与被动模式</text>
  <rect x="20" y="44" width="310" height="300" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2"/>
  <text class="name" x="175" y="68" text-anchor="middle" fill="var(--r)">主动模式（PORT）</text>
  <rect class="layer" x="40" y="84" width="125" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="102.5" y="110" text-anchor="middle" fill="var(--b)">客户端</text>
  <text class="sub" x="102.5" y="128" text-anchor="middle">随机端口 N</text>
  <rect class="layer" x="185" y="84" width="125" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="247.5" y="110" text-anchor="middle" fill="var(--b)">客户端</text>
  <text class="sub" x="247.5" y="128" text-anchor="middle">PORT 告知的端口</text>
  <rect class="layer" x="40" y="224" width="125" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="102.5" y="250" text-anchor="middle" fill="var(--g)">服务端</text>
  <text class="sub" x="102.5" y="268" text-anchor="middle">21 端口</text>
  <rect class="layer" x="185" y="224" width="125" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="247.5" y="250" text-anchor="middle" fill="var(--g)">服务端</text>
  <text class="sub" x="247.5" y="268" text-anchor="middle">20 端口</text>
  <line class="arrb" x1="102.5" y1="144" x2="102.5" y2="222" marker-end="url(#ab)"/>
  <text class="desc" x="110.5" y="188">控制连接</text>
  <line class="arrg" x1="247.5" y1="224" x2="247.5" y2="146" marker-end="url(#ag)"/>
  <text class="desc" x="239.5" y="188" text-anchor="end">数据连接</text>
  <text class="sub" x="175" y="320" text-anchor="middle">服务端主动连回，客户端 NAT / 防火墙常拦截</text>
  <rect x="350" y="44" width="310" height="300" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2"/>
  <text class="name" x="505" y="68" text-anchor="middle" fill="var(--g)">被动模式（PASV）</text>
  <rect class="layer" x="370" y="84" width="125" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="432.5" y="110" text-anchor="middle" fill="var(--b)">客户端</text>
  <text class="sub" x="432.5" y="128" text-anchor="middle">随机端口 N</text>
  <rect class="layer" x="515" y="84" width="125" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="577.5" y="110" text-anchor="middle" fill="var(--b)">客户端</text>
  <text class="sub" x="577.5" y="128" text-anchor="middle">随机端口 M</text>
  <rect class="layer" x="370" y="224" width="125" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="432.5" y="250" text-anchor="middle" fill="var(--g)">服务端</text>
  <text class="sub" x="432.5" y="268" text-anchor="middle">21 端口</text>
  <rect class="layer" x="515" y="224" width="125" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="577.5" y="250" text-anchor="middle" fill="var(--g)">服务端</text>
  <text class="sub" x="577.5" y="268" text-anchor="middle">PASV 返回的端口</text>
  <line class="arrb" x1="432.5" y1="144" x2="432.5" y2="222" marker-end="url(#ab)"/>
  <text class="desc" x="440.5" y="188">控制连接</text>
  <line class="arrb" x1="577.5" y1="144" x2="577.5" y2="222" marker-end="url(#ab)"/>
  <text class="desc" x="569.5" y="188" text-anchor="end">数据连接</text>
  <text class="sub" x="505" y="320" text-anchor="middle">客户端主动连，服务端放行被动端口范围即可</text>
</svg>
