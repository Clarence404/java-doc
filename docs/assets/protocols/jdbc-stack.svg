<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .lbl { fill:var(--fg); font-size:12px; }
    .arrb { stroke:var(--b); stroke-width:1.6; fill:none; }
    .arrg { stroke:var(--g); stroke-width:1.6; fill:none; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--b)"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--g)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Java 访问数据库的分层</text>
  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">业务代码 / ORM</text>
  <text class="sub" x="40" y="88">MyBatis / JPA / JdbcTemplate</text>
  <text class="desc" x="650" y="70" text-anchor="end">只面向 java.sql / javax.sql 接口编程</text>
  <text class="desc" x="650" y="88" text-anchor="end">不感知底层是哪种数据库协议</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132" marker-end="url(#a)"/>
  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">连接池（DataSource）</text>
  <text class="sub" x="40" y="178">HikariCP</text>
  <text class="desc" x="650" y="160" text-anchor="end">复用物理连接，控制并发上限</text>
  <text class="desc" x="650" y="178" text-anchor="end">池参数见数据库模块「数据库连接池」</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222" marker-end="url(#a)"/>
  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">JDBC 驱动</text>
  <text class="sub" x="40" y="268">mysql-connector-j / pgjdbc</text>
  <text class="desc" x="650" y="250" text-anchor="end">把 JDBC 调用翻译成数据库私有协议包</text>
  <text class="desc" x="650" y="268" text-anchor="end">负责握手、认证、TLS、结果集解码</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312" marker-end="url(#a)"/>
  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">数据库线路协议</text>
  <text class="sub" x="40" y="358">MySQL 协议 / PostgreSQL 协议</text>
  <text class="desc" x="650" y="340" text-anchor="end">跑在 TCP 之上，默认端口 3306 / 5432</text>
  <text class="desc" x="650" y="358" text-anchor="end">可在握手阶段升级为 TLS</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402" marker-end="url(#a)"/>
  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">数据库服务端</text>
  <text class="sub" x="40" y="448">MySQL / PostgreSQL</text>
  <text class="desc" x="650" y="430" text-anchor="end">解析、优化、执行 SQL</text>
  <text class="desc" x="650" y="448" text-anchor="end">按协议格式回传结果集与错误</text>
</svg>
