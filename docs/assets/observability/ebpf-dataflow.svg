<svg viewBox="0 0 920 410" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
    .lane { font-size:12px; font-weight:700; fill:var(--p); }
  </style>
  <defs>
    <marker id="arrow-ebpf-flow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="460" y="28" text-anchor="middle">eBPF 程序加载与数据流：编译 → 校验 → JIT → 挂载 → 写 Map → 用户态读取</text>

  <rect x="20" y="50" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="115" y="80" text-anchor="middle">eBPF 程序</text>
  <text class="desc" x="115" y="102" text-anchor="middle">C 源码，描述内核侧逻辑</text>
  <rect x="250" y="50" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="345" y="80" text-anchor="middle">clang / LLVM</text>
  <text class="desc" x="345" y="102" text-anchor="middle">编译为字节码 + BTF</text>
  <rect x="480" y="50" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="575" y="80" text-anchor="middle">libbpf 加载器</text>
  <text class="desc" x="575" y="102" text-anchor="middle">CO-RE 重定位 · bpf() 调用</text>
  <rect x="710" y="50" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="805" y="80" text-anchor="middle">用户态 Agent</text>
  <text class="desc" x="805" y="102" text-anchor="middle">读 Map · 符号化 · 上报</text>

  <line x1="20" y1="155" x2="900" y2="155" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="lane" x="20" y="149">用户态</text>
  <text class="lane" x="20" y="173">内核态</text>

  <rect x="20" y="180" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="115" y="206" text-anchor="middle">挂载点</text>
  <text class="desc" x="115" y="226" text-anchor="middle">kprobe · uprobe</text>
  <text class="desc" x="115" y="242" text-anchor="middle">tracepoint · perf_event</text>
  <rect x="250" y="180" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="345" y="210" text-anchor="middle">JIT 编译</text>
  <text class="desc" x="345" y="232" text-anchor="middle">字节码 → 本机指令</text>
  <rect x="480" y="180" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="575" y="210" text-anchor="middle">Verifier 校验</text>
  <text class="desc" x="575" y="232" text-anchor="middle">必须终止 · 内存访问安全</text>

  <rect x="20" y="310" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="115" y="340" text-anchor="middle">事件触发</text>
  <text class="desc" x="115" y="362" text-anchor="middle">程序在内核上下文运行</text>
  <rect x="710" y="310" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="805" y="340" text-anchor="middle">BPF Map / Ring Buffer</text>
  <text class="desc" x="805" y="362" text-anchor="middle">调用栈计数 · 事件记录</text>

  <line x1="210" y1="90" x2="248" y2="90" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <line x1="440" y1="90" x2="478" y2="90" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <line x1="575" y1="130" x2="575" y2="178" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <text class="label" x="585" y="149">BPF_PROG_LOAD</text>
  <line x1="480" y1="220" x2="442" y2="220" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <line x1="250" y1="220" x2="212" y2="220" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <line x1="115" y1="260" x2="115" y2="308" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <line x1="210" y1="350" x2="708" y2="350" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <text class="label" x="459" y="343" text-anchor="middle">写入栈 ID 与计数</text>
  <line x1="805" y1="310" x2="805" y2="132" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ebpf-flow)"/>
  <text class="label" x="815" y="225">轮询读取</text>
</svg>
