<svg viewBox="0 0 720 318" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box  { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr  { stroke-width:1.5; fill:none; marker-end:url(#a); }
    .ttl  { font-weight:700; font-size:13px; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="20" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">MVCC 版本链 与 Read View 可见性</text>

  <!-- ===== VERSION CHAIN ===== -->
  <text class="ttl" x="14" y="46" fill="var(--b)">版本链（同一行数据的历史版本，存于 undo log）</text>

  <!-- Current row -->
  <rect class="box" x="14" y="54" width="150" height="44" stroke="var(--b)"/>
  <text x="89" y="70" text-anchor="middle" fill="var(--b)" font-weight="600">当前行</text>
  <text x="89" y="86" text-anchor="middle" fill="var(--fg)">trx_id = 100</text>

  <line class="arr" x1="164" y1="76" x2="194" y2="76" stroke="var(--muted)"/>
  <text x="182" y="68" text-anchor="middle" fill="var(--muted)" font-size="10">roll_ptr</text>

  <!-- Version 2 -->
  <rect class="box" x="200" y="54" width="150" height="44" stroke="var(--y)"/>
  <text x="275" y="70" text-anchor="middle" fill="var(--y)" font-weight="600">undo 版本 2</text>
  <text x="275" y="86" text-anchor="middle" fill="var(--fg)">trx_id = 80</text>

  <line class="arr" x1="350" y1="76" x2="380" y2="76" stroke="var(--muted)"/>
  <text x="368" y="68" text-anchor="middle" fill="var(--muted)" font-size="10">roll_ptr</text>

  <!-- Version 1 -->
  <rect class="box" x="386" y="54" width="150" height="44" stroke="var(--muted)"/>
  <text x="461" y="70" text-anchor="middle" fill="var(--muted)" font-weight="600">undo 版本 1</text>
  <text x="461" y="86" text-anchor="middle" fill="var(--fg)">trx_id = 60</text>

  <line class="arr" x1="536" y1="76" x2="572" y2="76" stroke="var(--muted)"/>
  <text x="554" y="68" text-anchor="middle" fill="var(--muted)" font-size="10">roll_ptr</text>

  <text x="590" y="82" fill="var(--muted)" font-size="14">…</text>

  <!-- ===== READ VIEW ===== -->
  <text class="ttl" x="14" y="124" fill="var(--p)">Read View（事务开始快照读时生成）</text>

  <rect class="box" x="14" y="132" width="680" height="60" stroke="var(--p)"/>
  <text x="354" y="150" text-anchor="middle" fill="var(--p)" font-weight="600">Read View 四字段</text>

  <text x="40"  y="170" fill="var(--fg)" font-size="11">m_ids：活跃（未提交）事务 ID 列表 [70, 90, 100]</text>
  <text x="40"  y="185" fill="var(--fg)" font-size="11">min_trx_id = 70（m_ids 最小值）</text>
  <text x="380" y="170" fill="var(--fg)" font-size="11">max_trx_id = 101（下一个待分配 ID）</text>
  <text x="380" y="185" fill="var(--fg)" font-size="11">creator_trx_id = 当前事务自身 ID</text>

  <!-- ===== VISIBILITY RULES ===== -->
  <text class="ttl" x="14" y="218" fill="var(--g)">可见性判断（对版本链每个 trx_id 逐一检查）</text>

  <rect class="box" x="14" y="226" width="210" height="72" stroke="var(--g)"/>
  <text x="119" y="242" text-anchor="middle" fill="var(--g)" font-weight="600">可见</text>
  <text x="119" y="258" text-anchor="middle" fill="var(--fg)" font-size="11">= creator_trx_id（自己改的）</text>
  <text x="119" y="272" text-anchor="middle" fill="var(--fg)" font-size="11">&lt; min_trx_id（已提交的旧事务）</text>
  <text x="119" y="286" text-anchor="middle" fill="var(--fg)" font-size="11">不在 m_ids 且 &lt; max_trx_id</text>

  <rect class="box" x="250" y="226" width="210" height="72" stroke="var(--r)"/>
  <text x="355" y="242" text-anchor="middle" fill="var(--r)" font-weight="600">不可见</text>
  <text x="355" y="258" text-anchor="middle" fill="var(--fg)" font-size="11">≥ max_trx_id（快照后才开始）</text>
  <text x="355" y="272" text-anchor="middle" fill="var(--fg)" font-size="11">在 m_ids 中（生成时未提交）</text>
  <text x="355" y="286" text-anchor="middle" fill="var(--muted)" font-size="11">→ 沿 roll_ptr 继续向前找</text>

  <rect class="box" x="486" y="226" width="208" height="72" stroke="var(--y)"/>
  <text x="590" y="242" text-anchor="middle" fill="var(--y)" font-weight="600">RC vs RR 差异</text>
  <text x="590" y="258" text-anchor="middle" fill="var(--fg)" font-size="11">RC：每次快照读重新生成 RV</text>
  <text x="590" y="272" text-anchor="middle" fill="var(--fg)" font-size="11">RR：复用同一个 Read View</text>
  <text x="590" y="286" text-anchor="middle" fill="var(--muted)" font-size="11">（RR 可重复读的根本原因）</text>
</svg>
