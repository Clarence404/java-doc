<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" rx="8" fill="var(--bg)"/>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">一致性哈希环：新增节点 D 只接管一段弧</text>
  <circle cx="230" cy="210" r="140" fill="none" stroke="var(--border)" stroke-width="2"/>
  <path d="M351.2,140.0 A140,140 0 0 1 351.2,280.0" fill="none" stroke="var(--r)" stroke-width="4"/>
  <circle cx="351.2" cy="140.0" r="9" fill="var(--card)" stroke="var(--b)" stroke-width="2"/>
  <text x="375.5" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">A</text>
  <circle cx="351.2" cy="280.0" r="9" fill="var(--card)" stroke="var(--r)" stroke-width="2"/>
  <text x="375.5" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">D（新增）</text>
  <circle cx="230.0" cy="350.0" r="9" fill="var(--card)" stroke="var(--b)" stroke-width="2"/>
  <text x="230" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">B</text>
  <circle cx="108.8" cy="140.0" r="9" fill="var(--card)" stroke="var(--b)" stroke-width="2"/>
  <text x="84.5" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">C</text>
  <circle cx="369.5" cy="222.2" r="4" fill="var(--y)"/>
  <text x="347.6" y="224.3" text-anchor="middle" font-size="12" fill="var(--y)">k1</text>
  <circle cx="277.9" cy="78.4" r="4" fill="var(--y)"/>
  <text x="270.4" y="103.1" text-anchor="middle" font-size="12" fill="var(--y)">k2</text>
  <circle cx="108.8" cy="280.0" r="4" fill="var(--y)"/>
  <text x="127.8" y="273" text-anchor="middle" font-size="12" fill="var(--y)">k3</text>
  <text x="230" y="62" text-anchor="middle" font-size="11" fill="var(--muted)">0 / 2^32 - 1</text>
  <text x="230" y="214" text-anchor="middle" font-size="12" fill="var(--muted)">顺时针查找</text>
  <text x="420" y="140" text-anchor="start" font-size="12" fill="var(--fg)">key 顺时针找到的第一个节点负责它</text>
  <text x="420" y="168" text-anchor="start" font-size="12" fill="var(--fg)">k2 → A，k3 → C</text>
  <text x="420" y="196" text-anchor="start" font-size="12" fill="var(--fg)">k1 原属 B；加入 D 后归 D</text>
  <text x="420" y="224" text-anchor="start" font-size="12" fill="var(--fg)">红色弧段 (A, D] 是唯一需要迁移的数据</text>
  <text x="420" y="252" text-anchor="start" font-size="12" fill="var(--fg)">其余 key 的归属不变</text>
  <text x="420" y="280" text-anchor="start" font-size="12" fill="var(--fg)">取模路由下节点数变化几乎全量迁移</text>
</svg>
