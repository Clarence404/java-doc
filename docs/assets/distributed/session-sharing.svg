<svg viewBox="0 0 680 384" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="384" rx="8" fill="var(--bg)"/>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">集中式 Session：任意实例都能读到会话</text>
  <rect x="220" y="44" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">浏览器</text>
  <text x="340" y="90" text-anchor="middle" font-size="12" fill="var(--fg)">Cookie: SESSION=&lt;id&gt;</text>
  <line x1="340" y1="104" x2="340" y2="132" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="134" width="440" height="60" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="340" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">负载均衡（Nginx / 网关）</text>
  <text x="340" y="180" text-anchor="middle" font-size="12" fill="var(--fg)">无需粘性会话，可任意转发到健康实例</text>
  <line x1="230" y1="194" x2="230" y2="222" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="194" x2="450" y2="222" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="224" width="220" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="230" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">应用实例 A</text>
  <text x="230" y="270" text-anchor="middle" font-size="12" fill="var(--fg)">SessionRepositoryFilter</text>
  <rect x="340" y="224" width="220" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="450" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">应用实例 B</text>
  <text x="450" y="270" text-anchor="middle" font-size="12" fill="var(--fg)">SessionRepositoryFilter</text>
  <line x1="230" y1="284" x2="230" y2="312" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="284" x2="450" y2="312" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="314" width="440" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="340" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Redis / Valkey</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="var(--fg)">spring:session:sessions:&lt;id&gt;（Hash + TTL）</text>
</svg>
