<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="300" rx="8" fill="var(--bg)"/>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">XXL-JOB 调度架构</text>
  <rect x="20" y="44" width="640" height="90" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">调度中心集群（xxl-job-admin，多实例 + 共享 MySQL）</text>
  <text x="340" y="90" text-anchor="middle" font-size="12" fill="var(--fg)">xxl_job_lock 行锁保证同一时刻只有一个实例扫描到期任务，时间轮预读即将触发的任务</text>
  <text x="340" y="112" text-anchor="middle" font-size="12" fill="var(--fg)">按路由策略选一个执行器，或分片广播给全部执行器（HTTP 触发）</text>
  <line x1="110" y1="134" x2="110" y2="162" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="164" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="110" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">执行器 1</text>
  <text x="110" y="210" text-anchor="middle" font-size="12" fill="var(--fg)">shardIndex=0，shardTotal=3</text>
  <line x1="340" y1="134" x2="340" y2="162" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250" y="164" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="340" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">执行器 2</text>
  <text x="340" y="210" text-anchor="middle" font-size="12" fill="var(--fg)">shardIndex=1，shardTotal=3</text>
  <line x1="570" y1="134" x2="570" y2="162" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="480" y="164" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="570" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">执行器 3</text>
  <text x="570" y="210" text-anchor="middle" font-size="12" fill="var(--fg)">shardIndex=2，shardTotal=3</text>
  <text x="340" y="254" text-anchor="middle" font-size="12" fill="var(--muted)">执行器启动后自动注册并定时心跳；执行结果异步回调调度中心写入日志</text>
  <text x="340" y="278" text-anchor="middle" font-size="12" fill="var(--muted)">阻塞策略、超时、失败重试与告警都在调度中心按任务配置</text>
</svg>
