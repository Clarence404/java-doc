<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" rx="8" fill="var(--bg)"/>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">RocketMQ 事务消息与回查</text>
  <rect x="40" y="44" width="140" height="36" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="110" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Producer</text>
  <line x1="110" y1="80" x2="110" y2="380" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="270" y="44" width="140" height="36" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="340" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Broker</text>
  <line x1="340" y1="80" x2="340" y2="380" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="500" y="44" width="140" height="36" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="570" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Consumer</text>
  <line x1="570" y1="80" x2="570" y2="380" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="110" y1="110" x2="338" y2="110" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="104" text-anchor="middle" font-size="12" fill="var(--fg)">① 发送半消息（消费者不可见）</text>
  <line x1="340" y1="145" x2="112" y2="145" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="226" y="139" text-anchor="middle" font-size="12" fill="var(--fg)">② 半消息写入成功</text>
  <rect x="20" y="160" width="180" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="110" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">③ 执行本地事务</text>
  <text x="110" y="206" text-anchor="middle" font-size="12" fill="var(--fg)">业务表 + 事务日志同库提交</text>
  <line x1="110" y1="245" x2="338" y2="245" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="239" text-anchor="middle" font-size="12" fill="var(--fg)">④ COMMIT / ROLLBACK</text>
  <line x1="340" y1="280" x2="568" y2="280" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="455" y="274" text-anchor="middle" font-size="12" fill="var(--fg)">⑤ COMMIT 后才投递</text>
  <line x1="340" y1="320" x2="112" y2="320" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="226" y="314" text-anchor="middle" font-size="12" fill="var(--fg)">⑥ 未收到二次确认：回查</text>
  <line x1="110" y1="360" x2="338" y2="360" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="354" text-anchor="middle" font-size="12" fill="var(--fg)">⑦ 查事务日志：提交 / 回滚 / UNKNOW</text>
</svg>
