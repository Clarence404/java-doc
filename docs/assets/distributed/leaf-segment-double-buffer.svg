<svg viewBox="0 0 680 214" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="214" rx="8" fill="var(--bg)"/>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">Leaf-Segment 双 Buffer</text>
  <rect x="20" y="44" width="290" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="165" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Segment A（当前使用）</text>
  <text x="165" y="90" text-anchor="middle" font-size="12" fill="var(--fg)">[1001, 2000]，已发到 1150</text>
  <rect x="370" y="44" width="290" height="60" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="515" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Segment B（预加载）</text>
  <text x="515" y="90" text-anchor="middle" font-size="12" fill="var(--fg)">[2001, 3000]，就绪待切换</text>
  <line x1="310" y1="74" x2="368" y2="74" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="339" y="68" text-anchor="middle" font-size="12" fill="var(--fg)">用完切换</text>
  <rect x="20" y="134" width="290" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="165" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">触发条件</text>
  <text x="165" y="180" text-anchor="middle" font-size="12" fill="var(--fg)">当前号段消耗超过 10% 且备用号段为空</text>
  <rect x="370" y="134" width="290" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="515" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">MySQL leaf_alloc</text>
  <text x="515" y="180" text-anchor="middle" font-size="12" fill="var(--fg)">UPDATE max_id = max_id + step</text>
  <line x1="515" y1="134" x2="515" y2="106" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
