<svg viewBox="0 0 580 95" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 13px; font-weight: 700; }
    .fname { font-size: 12px; font-weight: 600; }
    .fsize { font-size: 10px; fill: var(--muted); }
  </style>

  <!-- Title: baseline y=17, visual top ≈ 4 -->
  <text x="290" y="17" text-anchor="middle" class="title">私有协议帧格式</text>

  <!--
    All rects: y=28, height=60, bottom=88
    Line 1 (fname) baseline: y=28+22=50
    Line 2 (fsize) baseline: y=28+44=72
    Bottom margin: 88-72=16 ≥ 12 ✓
    viewBox height=95, bottom whitespace=95-88=7
    Top whitespace (title visual top ≈ 4), diff=7-4=3 ≤ 10 ✓

    Field positions (8px gaps between rects):
      Magic:   x=14,  w=100, right=114
      Version: x=122, w=80,  right=202  gap=8 ✓
      Command: x=210, w=80,  right=290  gap=8 ✓
      Length:  x=298, w=100, right=398  gap=8 ✓
      Payload: x=406, w=160, right=566  gap=8 ✓
    Left margin=14, right margin=580-566=14 ✓ (symmetric)
  -->

  <!-- Magic (header field, blue) -->
  <rect x="14" y="28" width="100" height="60" rx="4"
        fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="64" y="50" text-anchor="middle" class="fname" fill="var(--b)">Magic</text>
  <text x="64" y="72" text-anchor="middle" class="fsize">2 byte</text>

  <!-- Version (header field, blue) -->
  <rect x="122" y="28" width="80" height="60" rx="4"
        fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="162" y="50" text-anchor="middle" class="fname" fill="var(--b)">Version</text>
  <text x="162" y="72" text-anchor="middle" class="fsize">1 byte</text>

  <!-- Command (header field, blue) -->
  <rect x="210" y="28" width="80" height="60" rx="4"
        fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="250" y="50" text-anchor="middle" class="fname" fill="var(--b)">Command</text>
  <text x="250" y="72" text-anchor="middle" class="fsize">1 byte</text>

  <!-- Length (header field, blue) -->
  <rect x="298" y="28" width="100" height="60" rx="4"
        fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="348" y="50" text-anchor="middle" class="fname" fill="var(--b)">Length</text>
  <text x="348" y="72" text-anchor="middle" class="fsize">2 bytes</text>

  <!-- Payload (data field, green) -->
  <rect x="406" y="28" width="160" height="60" rx="4"
        fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="486" y="50" text-anchor="middle" class="fname" fill="var(--g)">Payload</text>
  <text x="486" y="72" text-anchor="middle" class="fsize">N byte</text>
</svg>
