<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .idx   { font-size: 12px; font-weight: 600; }
    .note  { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="360" y="24" text-anchor="middle" class="title">ByteBuf 内存布局</text>

  <!-- 三段区域 + 扩容空间：y=44, h=64 -->
  <rect x="20" y="44" width="150" height="64" rx="4" fill="var(--muted)" fill-opacity="0.15" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="95" y="70" text-anchor="middle" class="name">可丢弃字节</text>
  <text x="95" y="92" text-anchor="middle" class="desc">discardable bytes</text>

  <rect x="178" y="44" width="200" height="64" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="278" y="70" text-anchor="middle" class="name" fill="var(--b)">可读字节</text>
  <text x="278" y="92" text-anchor="middle" class="desc">readable bytes（read* 消费）</text>

  <rect x="386" y="44" width="180" height="64" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="476" y="70" text-anchor="middle" class="name" fill="var(--g)">可写字节</text>
  <text x="476" y="92" text-anchor="middle" class="desc">writable bytes（write* 填充）</text>

  <rect x="574" y="44" width="126" height="64" rx="4" fill="none" stroke="var(--y)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="637" y="70" text-anchor="middle" class="name" fill="var(--y)">自动扩容</text>
  <text x="637" y="92" text-anchor="middle" class="desc">上限 maxCapacity</text>

  <!-- 指针：自下向上指向边界 -->
  <line x1="20" y1="150" x2="20" y2="110" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="20" y="172" text-anchor="middle" class="idx">0</text>

  <line x1="174" y1="150" x2="174" y2="110" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="174" y="172" text-anchor="middle" class="idx" fill="var(--b)">readerIndex</text>

  <line x1="382" y1="150" x2="382" y2="110" stroke="var(--g)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="382" y="172" text-anchor="middle" class="idx" fill="var(--g)">writerIndex</text>

  <line x1="570" y1="150" x2="570" y2="110" stroke="var(--y)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="570" y="172" text-anchor="middle" class="idx" fill="var(--y)">capacity</text>

  <!-- 不变式 -->
  <text x="360" y="200" text-anchor="middle" class="note">0 ≤ readerIndex ≤ writerIndex ≤ capacity ≤ maxCapacity</text>
</svg>
