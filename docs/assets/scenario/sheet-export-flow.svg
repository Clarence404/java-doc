<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">异步导出整体流程</text>
  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">提交导出任务</text>
  <text class="sub" x="40" y="88">接口层</text>
  <text class="desc" x="650" y="70" text-anchor="end">校验权限与筛选条件，条件存入任务表，状态 PENDING</text>
  <text class="desc" x="650" y="88" text-anchor="end">每人同时只允许一个进行中任务，立即返回 taskId</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>
  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">异步执行</text>
  <text class="sub" x="40" y="178">独立线程池</text>
  <text class="desc" x="650" y="160" text-anchor="end">抢占任务改为 RUNNING，全局并发上限如 4 个</text>
  <text class="desc" x="650" y="178" text-anchor="end">定期写心跳与进度，超时未心跳的任务重新调度</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>
  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">流式查询分批写文件</text>
  <text class="sub" x="40" y="268">从库 + 本地临时文件</text>
  <text class="desc" x="650" y="250" text-anchor="end">按主键游标每批 5000 行读从库，逐批写入文件</text>
  <text class="desc" x="650" y="268" text-anchor="end">Excel 满 100 万行换 sheet，内存只保留一批数据</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>
  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">上传对象存储</text>
  <text class="sub" x="40" y="358">export/ 前缀</text>
  <text class="desc" x="650" y="340" text-anchor="end">CSV 先压缩再分片上传，记录 objectKey 与文件大小</text>
  <text class="desc" x="650" y="358" text-anchor="end">状态改为 SUCCESS，本地临时文件删除</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>
  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">通知与下载</text>
  <text class="sub" x="40" y="448">站内信 / 前端轮询</text>
  <text class="desc" x="650" y="430" text-anchor="end">提交后通知用户，下载时校验任务归属</text>
  <text class="desc" x="650" y="448" text-anchor="end">签发 15 分钟有效的预签名 URL，文件 7 天后清理</text>
</svg>
