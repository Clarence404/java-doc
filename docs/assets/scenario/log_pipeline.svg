<svg viewBox="0 0 720 124" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">海量日志处理链路</text>

  <rect class="box" x="20" y="44" width="112" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="76" y="70" text-anchor="middle" fill="var(--p)">应用</text>
  <text class="sub" x="76" y="88" text-anchor="middle">结构化日志</text>

  <rect class="box" x="162" y="44" width="112" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="218" y="70" text-anchor="middle" fill="var(--b)">采集</text>
  <text class="sub" x="218" y="88" text-anchor="middle">Filebeat 等</text>

  <rect class="box" x="304" y="44" width="112" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="360" y="70" text-anchor="middle" fill="var(--y)">Kafka</text>
  <text class="sub" x="360" y="88" text-anchor="middle">缓冲削峰</text>

  <rect class="box" x="446" y="44" width="112" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="502" y="70" text-anchor="middle" fill="var(--g)">Flink</text>
  <text class="sub" x="502" y="88" text-anchor="middle">清洗 / 聚合</text>

  <rect class="box" x="588" y="44" width="112" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="644" y="70" text-anchor="middle" fill="var(--r)">存储</text>
  <text class="sub" x="644" y="88" text-anchor="middle">ES / OLAP / 归档</text>

  <line class="arr" x1="132" y1="74" x2="160" y2="74"/>
  <line class="arr" x1="274" y1="74" x2="302" y2="74"/>
  <line class="arr" x1="416" y1="74" x2="444" y2="74"/>
  <line class="arr" x1="558" y1="74" x2="586" y2="74"/>
</svg>
