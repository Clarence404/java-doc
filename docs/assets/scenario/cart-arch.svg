<svg viewBox="0 0 680 574" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">购物车整体架构</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">客户端</text>
  <text class="sub" x="40" y="88">App / Web / 小程序</text>
  <text class="desc" x="650" y="70" text-anchor="end">已登录带 token，未登录带服务端签发的 guestId</text>
  <text class="desc" x="650" y="88" text-anchor="end">以操作提交：加购 / 改数量 / 勾选 / 删除</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>
  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">网关</text>
  <text class="sub" x="40" y="178">鉴权与限流</text>
  <text class="desc" x="650" y="160" text-anchor="end">解析出 userId 或 guestId，不信任客户端传的用户 ID</text>
  <text class="desc" x="650" y="178" text-anchor="end">按用户限流，大促时单独保护结算接口</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>
  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">购物车服务</text>
  <text class="sub" x="40" y="268">无状态，水平扩展</text>
  <text class="desc" x="650" y="250" text-anchor="end">写：Lua 脚本校验上限与幂等，并记录脏用户</text>
  <text class="desc" x="650" y="268" text-anchor="end">读：批量查价格、库存、商品状态并打标</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>
  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">Redis Cluster</text>
  <text class="sub" x="40" y="358">主存储（在线数据）</text>
  <text class="desc" x="650" y="340" text-anchor="end">每个用户一个 Hash，field 为 skuId</text>
  <text class="desc" x="650" y="358" text-anchor="end">用户分桶号做 hash tag，相关 key 同槽</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>
  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">持久化任务</text>
  <text class="sub" x="40" y="448">异步批量刷盘</text>
  <text class="desc" x="650" y="430" text-anchor="end">按桶取出脏用户，整车快照写库</text>
  <text class="desc" x="650" y="448" text-anchor="end">版本号大于库中版本才覆盖，成功后清脏标记</text>
  <line class="arr" x1="340" y1="464" x2="340" y2="492"/>
  <rect class="layer" x="20" y="494" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="520" fill="var(--p)">MySQL</text>
  <text class="sub" x="40" y="538">按 user_id 分库分表</text>
  <text class="desc" x="650" y="520" text-anchor="end">每个用户一行快照，供恢复与冷数据加载</text>
  <text class="desc" x="650" y="538" text-anchor="end">Redis 未命中时回源，按版本写回 Redis</text>

</svg>
