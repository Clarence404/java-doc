<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">扫码登录流程</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">1 PC 申请二维码</text>
  <text class="sub" x="40" y="88">未登录</text>
  <text class="desc" x="650" y="70" text-anchor="end">生成随机 qrId，Redis 写入 WAITING，TTL 120 秒</text>
  <text class="desc" x="650" y="88" text-anchor="end">下发绑定 Cookie，Redis 只存其哈希</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">2 PC 等待结果</text>
  <text class="sub" x="40" y="178">长轮询 / WebSocket</text>
  <text class="desc" x="650" y="160" text-anchor="end">按 qrId 等待状态变化</text>
  <text class="desc" x="650" y="178" text-anchor="end">只能看到状态，看不到任何令牌</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">3 手机扫码</text>
  <text class="sub" x="40" y="268">携带手机令牌</text>
  <text class="desc" x="650" y="250" text-anchor="end">WAITING 迁移到 SCANNED，记录 userId</text>
  <text class="desc" x="650" y="268" text-anchor="end">返回 PC 的设备、IP 归属地供用户核对</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">4 用户确认</text>
  <text class="sub" x="40" y="358">二次确认页</text>
  <text class="desc" x="650" y="340" text-anchor="end">SCANNED 迁移到 CONFIRMED，校验同一 userId</text>
  <text class="desc" x="650" y="358" text-anchor="end">发布状态变化，唤醒等待中的 PC</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>

  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">5 PC 换发令牌</text>
  <text class="sub" x="40" y="448">携带绑定 Cookie</text>
  <text class="desc" x="650" y="430" text-anchor="end">Lua 校验 CONFIRMED 与绑定哈希，并删除 key</text>
  <text class="desc" x="650" y="448" text-anchor="end">认证中心签发 PC 会话，写入 HttpOnly Cookie</text>
</svg>
