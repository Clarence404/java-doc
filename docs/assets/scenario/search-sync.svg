<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">MySQL → Elasticsearch 同步链路</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">MySQL</text>
  <text class="sub" x="40" y="88">业务库（事实源）</text>
  <text class="desc" x="650" y="70" text-anchor="end">商品、类目、品牌、库存等表</text>
  <text class="desc" x="650" y="88" text-anchor="end">binlog 使用 ROW 格式并开启 GTID</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">CDC</text>
  <text class="sub" x="40" y="178">Canal / Debezium</text>
  <text class="desc" x="650" y="160" text-anchor="end">解析 binlog 中的行变更</text>
  <text class="desc" x="650" y="178" text-anchor="end">按表投递到 MQ Topic</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">MQ</text>
  <text class="sub" x="40" y="268">Kafka / RocketMQ</text>
  <text class="desc" x="650" y="250" text-anchor="end">以商品 ID 作为消息 key 分区</text>
  <text class="desc" x="650" y="268" text-anchor="end">同一商品的变更按顺序消费</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">同步消费者</text>
  <text class="sub" x="40" y="358">每个物理索引一个消费组</text>
  <text class="desc" x="650" y="340" text-anchor="end">按 ID 回查最新行，组装宽文档</text>
  <text class="desc" x="650" y="358" text-anchor="end">外部版本号写入，409 冲突直接忽略</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>

  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">Elasticsearch</text>
  <text class="sub" x="40" y="448">别名 products</text>
  <text class="desc" x="650" y="430" text-anchor="end">别名指向当前的 products_vN</text>
  <text class="desc" x="650" y="448" text-anchor="end">重建时新消费组写 v2，校验后切换别名</text>

</svg>
