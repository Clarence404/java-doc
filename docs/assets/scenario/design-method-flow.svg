<svg viewBox="0 0 680 552" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .desc { fill:var(--fg); font-size:12px; }
    .sub { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">系统设计答题流程（以 45 分钟面试为例）</text>
  <rect class="box" x="20" y="44" width="640" height="44" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="71" fill="var(--p)">1  需求澄清</text>
  <text class="desc" x="340" y="71" text-anchor="middle">功能边界、非功能指标、约束</text>
  <text class="sub" x="640" y="71" text-anchor="end">约 5 分钟</text>
  <line class="arr" x1="340" y1="88" x2="340" y2="116"/>
  <rect class="box" x="20" y="118" width="640" height="44" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="145" fill="var(--b)">2  容量估算</text>
  <text class="desc" x="340" y="145" text-anchor="middle">QPS、存储、带宽的数量级</text>
  <text class="sub" x="640" y="145" text-anchor="end">约 5 分钟</text>
  <line class="arr" x1="340" y1="162" x2="340" y2="190"/>
  <rect class="box" x="20" y="192" width="640" height="44" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="219" fill="var(--g)">3  接口设计</text>
  <text class="desc" x="340" y="219" text-anchor="middle">核心 API、入参出参、幂等</text>
  <text class="sub" x="640" y="219" text-anchor="end">约 5 分钟</text>
  <line class="arr" x1="340" y1="236" x2="340" y2="264"/>
  <rect class="box" x="20" y="266" width="640" height="44" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="293" fill="var(--y)">4  数据模型</text>
  <text class="desc" x="340" y="293" text-anchor="middle">实体、主键与索引、分片键</text>
  <text class="sub" x="640" y="293" text-anchor="end">约 5 分钟</text>
  <line class="arr" x1="340" y1="310" x2="340" y2="338"/>
  <rect class="box" x="20" y="340" width="640" height="44" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="367" fill="var(--p)">5  高层架构</text>
  <text class="desc" x="340" y="367" text-anchor="middle">组件与数据流，先跑通主链路</text>
  <text class="sub" x="640" y="367" text-anchor="end">约 10 分钟</text>
  <line class="arr" x1="340" y1="384" x2="340" y2="412"/>
  <rect class="box" x="20" y="414" width="640" height="44" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="441" fill="var(--r)">6  深入瓶颈</text>
  <text class="desc" x="340" y="441" text-anchor="middle">热点、一致性、可用性</text>
  <text class="sub" x="640" y="441" text-anchor="end">约 10 分钟</text>
  <line class="arr" x1="340" y1="458" x2="340" y2="486"/>
  <rect class="box" x="20" y="488" width="640" height="44" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="515" fill="var(--b)">7  扩展与取舍</text>
  <text class="desc" x="340" y="515" text-anchor="middle">规模 ×10、故障演练、演进方向</text>
  <text class="sub" x="640" y="515" text-anchor="end">约 5 分钟</text>
</svg>
