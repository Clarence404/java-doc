<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .st { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .enum { fill:var(--muted); font-size:11px; }
    .lbl { fill:var(--fg); font-size:11px; }
    .note { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">订单主状态流转</text>

  <!-- Row 1 -->
  <rect class="st" x="20" y="50" width="180" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="110" y="76" text-anchor="middle" fill="var(--y)">待支付</text>
  <text class="enum" x="110" y="94" text-anchor="middle">PENDING_PAYMENT</text>

  <rect class="st" x="250" y="50" width="180" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="340" y="76" text-anchor="middle" fill="var(--b)">待发货</text>
  <text class="enum" x="340" y="94" text-anchor="middle">PENDING_SHIPMENT</text>

  <rect class="st" x="480" y="50" width="180" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="570" y="76" text-anchor="middle" fill="var(--p)">已发货</text>
  <text class="enum" x="570" y="94" text-anchor="middle">SHIPPED</text>

  <!-- Row 2 -->
  <rect class="st" x="20" y="190" width="180" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="110" y="216" text-anchor="middle" fill="var(--muted)">已取消</text>
  <text class="enum" x="110" y="234" text-anchor="middle">CANCELLED</text>

  <rect class="st" x="250" y="190" width="180" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="340" y="216" text-anchor="middle" fill="var(--r)">已关闭</text>
  <text class="enum" x="340" y="234" text-anchor="middle">CLOSED（全额退款）</text>

  <rect class="st" x="480" y="190" width="180" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="570" y="216" text-anchor="middle" fill="var(--g)">已完成</text>
  <text class="enum" x="570" y="234" text-anchor="middle">COMPLETED</text>

  <!-- Transitions -->
  <line class="arr" x1="200" y1="80" x2="248" y2="80"/>
  <text class="lbl" x="225" y="72" text-anchor="middle">支付</text>

  <line class="arr" x1="430" y1="80" x2="478" y2="80"/>
  <text class="lbl" x="455" y="72" text-anchor="middle">发货</text>

  <line class="arr" x1="110" y1="110" x2="110" y2="188"/>
  <text class="lbl" x="118" y="154">超时 / 用户取消</text>

  <line class="arr" x1="340" y1="110" x2="340" y2="188"/>
  <text class="lbl" x="348" y="154">全额退款</text>

  <line class="arr" x1="570" y1="110" x2="570" y2="188"/>
  <text class="lbl" x="578" y="154">确认收货</text>

  <line class="arr" x1="480" y1="220" x2="432" y2="220"/>
  <text class="lbl" x="456" y="212" text-anchor="middle">退款</text>

  <text class="note" x="340" y="280" text-anchor="middle">已发货后退货退款同样流转到已关闭；部分退款不改主状态，由退款单单独记录</text>
</svg>
