<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; }
    .sub { fill:var(--muted); }
    .lbl { fill:var(--fg); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">售后与退款整体架构</text>
  <rect class="box" x="30" y="50" width="170" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="115" y="76" text-anchor="middle" font-size="13" fill="var(--b)">用户与商家</text>
  <text class="sub" x="115" y="95" text-anchor="middle" font-size="11">申请、审核、寄回、收货</text>
  <rect class="box" x="270" y="50" width="250" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="395" y="76" text-anchor="middle" font-size="13" fill="var(--p)">售后服务</text>
  <text class="sub" x="395" y="95" text-anchor="middle" font-size="11">售后单、状态机、金额计算、编排</text>
  <rect class="box" x="590" y="50" width="240" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="710" y="76" text-anchor="middle" font-size="13" fill="var(--g)">支付中心</text>
  <text class="sub" x="710" y="95" text-anchor="middle" font-size="11">占用可退额度、调渠道，结果发事件</text>
  <rect class="box" x="30" y="180" width="800" height="50" rx="8" stroke="var(--y)"/>
  <text class="name" x="430" y="210" text-anchor="middle" font-size="13" fill="var(--y)">售后完成事件（和售后单的状态变更同一个事务落库，再投递）</text>
  <rect class="box" x="30" y="300" width="170" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="115" y="326" text-anchor="middle" font-size="13" fill="var(--muted)">订单</text>
  <text class="sub" x="115" y="345" text-anchor="middle" font-size="11">行上累计已退，退完关闭</text>
  <rect class="box" x="240" y="300" width="170" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="325" y="326" text-anchor="middle" font-size="13" fill="var(--muted)">库存</text>
  <text class="sub" x="325" y="345" text-anchor="middle" font-size="11">未发货回可售，退货质检后入库</text>
  <rect class="box" x="450" y="300" width="170" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="535" y="326" text-anchor="middle" font-size="13" fill="var(--muted)">优惠券</text>
  <text class="sub" x="535" y="345" text-anchor="middle" font-size="11">整单退完才返还</text>
  <rect class="box" x="660" y="300" width="170" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="745" y="326" text-anchor="middle" font-size="13" fill="var(--muted)">积分与账户</text>
  <text class="sub" x="745" y="345" text-anchor="middle" font-size="11">退回抵扣的，扣回赠送的</text>
  <line class="arr" x1="200" y1="80" x2="268" y2="80"/>
  <line class="arr" x1="520" y1="80" x2="588" y2="80"/>
  <text class="lbl" x="554" y="72" text-anchor="middle" font-size="11">退款</text>
  <line class="arr" x1="395" y1="110" x2="395" y2="178"/>
  <line class="arr" x1="115" y1="230" x2="115" y2="298"/>
  <line class="arr" x1="325" y1="230" x2="325" y2="298"/>
  <line class="arr" x1="535" y1="230" x2="535" y2="298"/>
  <line class="arr" x1="745" y1="230" x2="745" y2="298"/>
</svg>
