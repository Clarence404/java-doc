<svg viewBox="0 0 720 424" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">哈希分桶 + 桶内处理 + 归并</text>

  <!-- 第 1 层：海量输入 -->
  <rect class="box" x="20" y="44" width="680" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="360" y="70" text-anchor="middle" fill="var(--p)">① 海量输入：50 亿 URL ≈ 298GB，远超 4GB 内存</text>
  <text class="sub" x="360" y="88" text-anchor="middle">顺序扫描一遍，按 hash(key) % N 写入 N 个分桶文件，同一个 key 必定落在同一个桶</text>

  <line class="arr" x1="96" y1="104" x2="96" y2="142"/>
  <line class="arr" x1="272" y1="104" x2="272" y2="142"/>
  <line class="arr" x1="448" y1="104" x2="448" y2="142"/>
  <line class="arr" x1="624" y1="104" x2="624" y2="142"/>

  <!-- 第 2 层：分桶文件 -->
  <rect class="box" x="20" y="144" width="152" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="96" y="170" text-anchor="middle" fill="var(--b)">桶 0</text>
  <text class="sub" x="96" y="188" text-anchor="middle">≈ 305MB，装得进内存</text>

  <rect class="box" x="196" y="144" width="152" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="272" y="170" text-anchor="middle" fill="var(--b)">桶 1</text>
  <text class="sub" x="272" y="188" text-anchor="middle">≈ 305MB，装得进内存</text>

  <rect class="box" x="372" y="144" width="152" height="60" rx="8" stroke="var(--b)" stroke-dasharray="4 3"/>
  <text class="name" x="448" y="170" text-anchor="middle" fill="var(--b)">……</text>
  <text class="sub" x="448" y="188" text-anchor="middle">共 N = 1000 个</text>

  <rect class="box" x="548" y="144" width="152" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="624" y="170" text-anchor="middle" fill="var(--b)">桶 N-1</text>
  <text class="sub" x="624" y="188" text-anchor="middle">≈ 305MB，装得进内存</text>

  <line class="arr" x1="96" y1="204" x2="96" y2="242"/>
  <line class="arr" x1="272" y1="204" x2="272" y2="242"/>
  <line class="arr" x1="448" y1="204" x2="448" y2="242"/>
  <line class="arr" x1="624" y1="204" x2="624" y2="242"/>

  <!-- 第 3 层：桶内处理 -->
  <rect class="box" x="20" y="244" width="152" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="96" y="270" text-anchor="middle" fill="var(--g)">② 桶内处理</text>
  <text class="sub" x="96" y="288" text-anchor="middle">计数 / 去重 / 局部 Top K</text>

  <rect class="box" x="196" y="244" width="152" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="272" y="270" text-anchor="middle" fill="var(--g)">② 桶内处理</text>
  <text class="sub" x="272" y="288" text-anchor="middle">计数 / 去重 / 局部 Top K</text>

  <rect class="box" x="372" y="244" width="152" height="60" rx="8" stroke="var(--g)" stroke-dasharray="4 3"/>
  <text class="name" x="448" y="270" text-anchor="middle" fill="var(--g)">……</text>
  <text class="sub" x="448" y="288" text-anchor="middle">逐个桶装入内存</text>

  <rect class="box" x="548" y="244" width="152" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="624" y="270" text-anchor="middle" fill="var(--g)">② 桶内处理</text>
  <text class="sub" x="624" y="288" text-anchor="middle">计数 / 去重 / 局部 Top K</text>

  <line class="arr" x1="96" y1="304" x2="96" y2="342"/>
  <line class="arr" x1="272" y1="304" x2="272" y2="342"/>
  <line class="arr" x1="448" y1="304" x2="448" y2="342"/>
  <line class="arr" x1="624" y1="304" x2="624" y2="342"/>

  <!-- 第 4 层：归并 -->
  <rect class="box" x="20" y="344" width="680" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="360" y="370" text-anchor="middle" fill="var(--y)">③ 汇总 / 归并</text>
  <text class="sub" x="360" y="388" text-anchor="middle">各桶的 key 互不重叠：Top K 用小顶堆合并，去重计数直接相加，交集结果直接拼接</text>
</svg>
