<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .st { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .enum { fill:var(--muted); font-size:11px; }
    .lbl { fill:var(--fg); font-size:11px; }
    .note { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">二维码状态机</text>

  <rect class="st" x="20" y="50" width="180" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="110" y="76" text-anchor="middle" fill="var(--y)">待扫描</text>
  <text class="enum" x="110" y="94" text-anchor="middle">WAITING</text>

  <rect class="st" x="250" y="50" width="180" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="340" y="76" text-anchor="middle" fill="var(--b)">已扫描</text>
  <text class="enum" x="340" y="94" text-anchor="middle">SCANNED（绑定 userId）</text>

  <rect class="st" x="480" y="50" width="180" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="570" y="76" text-anchor="middle" fill="var(--g)">已确认</text>
  <text class="enum" x="570" y="94" text-anchor="middle">CONFIRMED</text>

  <rect class="st" x="20" y="190" width="180" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="110" y="216" text-anchor="middle" fill="var(--muted)">已过期</text>
  <text class="enum" x="110" y="234" text-anchor="middle">EXPIRED（key 不存在）</text>

  <rect class="st" x="250" y="190" width="180" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="340" y="216" text-anchor="middle" fill="var(--r)">已取消</text>
  <text class="enum" x="340" y="234" text-anchor="middle">CANCELLED</text>

  <rect class="st" x="480" y="190" width="180" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="570" y="216" text-anchor="middle" fill="var(--p)">已领取</text>
  <text class="enum" x="570" y="234" text-anchor="middle">PC 换发令牌后删除 key</text>

  <line class="arr" x1="200" y1="80" x2="248" y2="80"/>
  <text class="lbl" x="224" y="72" text-anchor="middle">扫码</text>

  <line class="arr" x1="430" y1="80" x2="478" y2="80"/>
  <text class="lbl" x="454" y="72" text-anchor="middle">确认</text>

  <line class="arr" x1="110" y1="110" x2="110" y2="188"/>
  <text class="lbl" x="118" y="154">TTL 到期</text>

  <line class="arr" x1="340" y1="110" x2="340" y2="188"/>
  <text class="lbl" x="348" y="154">手机取消</text>

  <line class="arr" x1="570" y1="110" x2="570" y2="188"/>
  <text class="lbl" x="578" y="154">PC 换发</text>

  <text class="note" x="340" y="280" text-anchor="middle">任何状态在 TTL 到期后 key 被删除，统一按已过期处理；</text>
  <text class="note" x="340" y="298" text-anchor="middle">已取消与已过期都是终态，PC 只能重新申请二维码</text>
</svg>
