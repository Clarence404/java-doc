<svg viewBox="0 0 680 504" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">楼中楼两级结构：root_id 与 parent_id</text>

  <rect class="layer" x="220" y="44" width="240" height="40" rx="8" stroke="var(--p)"/>
  <text class="name" x="340" y="69" text-anchor="middle" fill="var(--p)">内容 obj_id = 9001</text>
  <path class="arr" d="M340 84 V104 H175 V122"/>
  <path class="arr" d="M340 84 V104 H505 V122"/>

  <rect class="layer" x="20" y="124" width="310" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="175" y="148" text-anchor="middle" fill="var(--b)">#101 一级评论（用户 A）</text>
  <text class="sub" x="175" y="168" text-anchor="middle">root_id = 0，parent_id = 0</text>
  <line class="arr" x1="175" y1="184" x2="175" y2="222"/>

  <rect class="layer" x="350" y="124" width="310" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="505" y="148" text-anchor="middle" fill="var(--b)">#102 一级评论（用户 D）</text>
  <text class="sub" x="505" y="168" text-anchor="middle">root_id = 0，parent_id = 0</text>
  <line class="arr" x1="505" y1="184" x2="505" y2="222"/>

  <rect class="layer" x="20" y="224" width="310" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="175" y="248" text-anchor="middle" fill="var(--g)">#205 B 回复 A</text>
  <text class="sub" x="175" y="268" text-anchor="middle">root_id = 101，parent_id = 101</text>
  <line class="arr" x1="175" y1="284" x2="175" y2="322"/>

  <rect class="layer" x="350" y="224" width="310" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="505" y="248" text-anchor="middle" fill="var(--g)">#301 E 回复 D</text>
  <text class="sub" x="505" y="268" text-anchor="middle">root_id = 102，parent_id = 102</text>

  <rect class="layer" x="20" y="324" width="310" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="175" y="348" text-anchor="middle" fill="var(--y)">#208 C 回复 B（显示「回复 @B」）</text>
  <text class="sub" x="175" y="368" text-anchor="middle">root_id = 101，parent_id = 205</text>

  <rect class="layer" x="350" y="324" width="310" height="60" rx="8" stroke="var(--border)"/>
  <text class="desc" x="505" y="348" text-anchor="middle">一级评论按 obj_id + root_id = 0 查</text>
  <text class="desc" x="505" y="368" text-anchor="middle">楼中楼按 obj_id + root_id 查</text>

  <rect class="layer" x="20" y="424" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="desc" x="340" y="448" text-anchor="middle">展示只有两级：同一 root_id 的回复平铺在一级评论下，按 id 升序翻页</text>
  <text class="desc" x="340" y="468" text-anchor="middle">parent_id 不等于 root_id 时显示「回复 @某人」，reply_to_uid 冗余被回复人</text>
</svg>
