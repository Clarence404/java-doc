<svg viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .cell { fill:var(--card); stroke:var(--border); stroke-width:1.2; }
    .hit { fill:var(--card); stroke-width:2; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .num { fill:var(--fg); font-size:12px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .note { fill:var(--muted); font-size:11px; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">多级时间轮：任务随到期临近逐级下沉</text>

  <!-- 小时轮 -->
  <rect class="layer" x="20" y="44" width="160" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="100" y="70" text-anchor="middle" fill="var(--p)">小时轮</text>
  <text class="sub" x="100" y="88" text-anchor="middle">24 槽 × 1 小时</text>
  <rect class="cell" x="200" y="59" width="56" height="30" rx="4"/><text class="num" x="228" y="77" text-anchor="middle">0</text>
  <rect class="cell" x="264" y="59" width="56" height="30" rx="4"/><text class="num" x="292" y="77" text-anchor="middle">1</text>
  <rect class="cell" x="328" y="59" width="56" height="30" rx="4"/><text class="num" x="356" y="77" text-anchor="middle">2</text>
  <rect class="hit" x="392" y="59" width="56" height="30" rx="4" stroke="var(--p)"/><text class="num" x="420" y="77" text-anchor="middle">3</text>
  <rect class="cell" x="456" y="59" width="56" height="30" rx="4"/><text class="num" x="484" y="77" text-anchor="middle">…</text>
  <rect class="cell" x="520" y="59" width="56" height="30" rx="4"/><text class="num" x="548" y="77" text-anchor="middle">22</text>
  <rect class="cell" x="584" y="59" width="56" height="30" rx="4"/><text class="num" x="612" y="77" text-anchor="middle">23</text>

  <line class="arr" x1="420" y1="89" x2="420" y2="147"/>
  <text class="note" x="430" y="122">第 3 小时到了：按剩余 25 分 10 秒放入分钟轮</text>

  <!-- 分钟轮 -->
  <rect class="layer" x="20" y="134" width="160" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="100" y="160" text-anchor="middle" fill="var(--b)">分钟轮</text>
  <text class="sub" x="100" y="178" text-anchor="middle">60 槽 × 1 分钟</text>
  <rect class="cell" x="200" y="149" width="56" height="30" rx="4"/><text class="num" x="228" y="167" text-anchor="middle">0</text>
  <rect class="cell" x="264" y="149" width="56" height="30" rx="4"/><text class="num" x="292" y="167" text-anchor="middle">1</text>
  <rect class="cell" x="328" y="149" width="56" height="30" rx="4"/><text class="num" x="356" y="167" text-anchor="middle">…</text>
  <rect class="hit" x="392" y="149" width="56" height="30" rx="4" stroke="var(--b)"/><text class="num" x="420" y="167" text-anchor="middle">25</text>
  <rect class="cell" x="456" y="149" width="56" height="30" rx="4"/><text class="num" x="484" y="167" text-anchor="middle">…</text>
  <rect class="cell" x="520" y="149" width="56" height="30" rx="4"/><text class="num" x="548" y="167" text-anchor="middle">58</text>
  <rect class="cell" x="584" y="149" width="56" height="30" rx="4"/><text class="num" x="612" y="167" text-anchor="middle">59</text>

  <line class="arr" x1="420" y1="179" x2="420" y2="237"/>
  <text class="note" x="430" y="212">第 25 分钟到了：按剩余 10 秒放入秒轮</text>

  <!-- 秒轮 -->
  <rect class="layer" x="20" y="224" width="160" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="100" y="250" text-anchor="middle" fill="var(--g)">秒轮</text>
  <text class="sub" x="100" y="268" text-anchor="middle">60 槽 × 1 秒</text>
  <rect class="cell" x="200" y="239" width="56" height="30" rx="4"/><text class="num" x="228" y="257" text-anchor="middle">0</text>
  <rect class="cell" x="264" y="239" width="56" height="30" rx="4"/><text class="num" x="292" y="257" text-anchor="middle">1</text>
  <rect class="cell" x="328" y="239" width="56" height="30" rx="4"/><text class="num" x="356" y="257" text-anchor="middle">…</text>
  <rect class="hit" x="392" y="239" width="56" height="30" rx="4" stroke="var(--g)"/><text class="num" x="420" y="257" text-anchor="middle">10</text>
  <rect class="cell" x="456" y="239" width="56" height="30" rx="4"/><text class="num" x="484" y="257" text-anchor="middle">…</text>
  <rect class="cell" x="520" y="239" width="56" height="30" rx="4"/><text class="num" x="548" y="257" text-anchor="middle">58</text>
  <rect class="cell" x="584" y="239" width="56" height="30" rx="4"/><text class="num" x="612" y="257" text-anchor="middle">59</text>

  <line class="arr" x1="420" y1="269" x2="420" y2="312"/>

  <!-- 到期 -->
  <rect class="layer" x="320" y="314" width="200" height="40" rx="8" stroke="var(--r)"/>
  <text class="name" x="420" y="339" text-anchor="middle" fill="var(--r)">到期：交给投递器</text>

  <text class="note" x="340" y="384" text-anchor="middle">例：3 小时 25 分 10 秒后到期的任务，依次经过小时轮第 3 槽、分钟轮第 25 槽、秒轮第 10 槽</text>
</svg>
