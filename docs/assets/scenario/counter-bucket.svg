<svg viewBox="0 0 680 304" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">热点计数分桶</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="340" y="70" text-anchor="middle" fill="var(--p)">写入：热点对象随机选一个桶</text>
  <text class="sub" x="340" y="88" text-anchor="middle">INCR view:id:b，b 取 1 到 N 的随机数，各桶落在不同分片</text>
  <line class="arr" x1="92.5" y1="104" x2="92.5" y2="132"/>
  <line class="arr" x1="257.5" y1="104" x2="257.5" y2="132"/>
  <line class="arr" x1="422.5" y1="104" x2="422.5" y2="132"/>
  <line class="arr" x1="587.5" y1="104" x2="587.5" y2="132"/>

  <rect class="layer" x="20" y="134" width="145" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="92.5" y="160" text-anchor="middle" fill="var(--r)">桶 1</text>
  <text class="sub" x="92.5" y="178" text-anchor="middle">分片 A</text>
  <rect class="layer" x="185" y="134" width="145" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="257.5" y="160" text-anchor="middle" fill="var(--r)">桶 2</text>
  <text class="sub" x="257.5" y="178" text-anchor="middle">分片 B</text>
  <rect class="layer" x="350" y="134" width="145" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="422.5" y="160" text-anchor="middle" fill="var(--r)">桶 3</text>
  <text class="sub" x="422.5" y="178" text-anchor="middle">分片 C</text>
  <rect class="layer" x="515" y="134" width="145" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="587.5" y="160" text-anchor="middle" fill="var(--r)">桶 N</text>
  <text class="sub" x="587.5" y="178" text-anchor="middle">分片 D</text>
  <line class="arr" x1="92.5" y1="194" x2="92.5" y2="222"/>
  <line class="arr" x1="257.5" y1="194" x2="257.5" y2="222"/>
  <line class="arr" x1="422.5" y1="194" x2="422.5" y2="222"/>
  <line class="arr" x1="587.5" y1="194" x2="587.5" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="175" y="250" text-anchor="middle" fill="var(--g)">读取：基数加全部桶求和</text>
  <text class="sub" x="175" y="268" text-anchor="middle">结果在本地缓存 1 秒</text>
  <text class="name" x="505" y="250" text-anchor="middle" fill="var(--g)">刷盘：同样求和后写库</text>
  <text class="sub" x="505" y="268" text-anchor="middle">写绝对值，GREATEST 只增不减</text>

</svg>
