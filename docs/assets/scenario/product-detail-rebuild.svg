<svg viewBox="0 0 680 574" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">数据变更与缓存重建链路</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">商品服务</text>
  <text class="sub" x="40" y="88">本地事务</text>
  <text class="desc" x="650" y="70" text-anchor="end">更新商品行，version 加 1</text>
  <text class="desc" x="650" y="88" text-anchor="end">同一事务写入 outbox 表</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">Outbox 中继</text>
  <text class="sub" x="40" y="178">定时扫描 / CDC</text>
  <text class="desc" x="650" y="160" text-anchor="end">读取未发送记录投递到 MQ</text>
  <text class="desc" x="650" y="178" text-anchor="end">发送成功后标记，至少投递一次</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">MQ</text>
  <text class="sub" x="40" y="268">Kafka / RocketMQ</text>
  <text class="desc" x="650" y="250" text-anchor="end">消息只带 skuId 与 version</text>
  <text class="desc" x="650" y="268" text-anchor="end">以 skuId 为 key 分区，同一 SKU 有序</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">重建服务</text>
  <text class="sub" x="40" y="358">批量消费</text>
  <text class="desc" x="650" y="340" text-anchor="end">一批消息内按 skuId 去重，合并重复事件</text>
  <text class="desc" x="650" y="358" text-anchor="end">回查最新数据，组装缓存快照</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>

  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">Redis</text>
  <text class="sub" x="40" y="448">版本号校验写入</text>
  <text class="desc" x="650" y="430" text-anchor="end">新 version 大于已有值才覆盖</text>
  <text class="desc" x="650" y="448" text-anchor="end">写入成功后广播 L1 失效</text>
  <line class="arr" x1="340" y1="464" x2="340" y2="492"/>

  <rect class="layer" x="20" y="494" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="520" fill="var(--p)">聚合服务 L1</text>
  <text class="sub" x="40" y="538">Caffeine</text>
  <text class="desc" x="650" y="520" text-anchor="end">收到失效广播后删除本地条目</text>
  <text class="desc" x="650" y="538" text-anchor="end">Nginx L0 依靠 5 秒 TTL 自然过期</text>

</svg>
