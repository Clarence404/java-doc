<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; }
    .sub { fill:var(--muted); }
    .lbl { fill:var(--fg); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">一次抽奖的步骤</text>
  <rect class="box" x="30" y="60" width="170" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="115" y="86" text-anchor="middle" font-size="13" fill="var(--muted)">校验资格</text>
  <text class="sub" x="115" y="105" text-anchor="middle" font-size="11">活动时间、风控结果</text>
  <rect class="box" x="240" y="60" width="170" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="325" y="86" text-anchor="middle" font-size="13" fill="var(--b)">选出一个奖品</text>
  <text class="sub" x="325" y="105" text-anchor="middle" font-size="11">应用内按权重随机</text>
  <rect class="box" x="450" y="60" width="170" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="535" y="86" text-anchor="middle" font-size="13" fill="var(--p)">脚本里扣</text>
  <text class="sub" x="535" y="105" text-anchor="middle" font-size="11">次数 + 1，奖品库存 − 1</text>
  <rect class="box" x="660" y="60" width="170" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="745" y="86" text-anchor="middle" font-size="13" fill="var(--g)">返回结果</text>
  <text class="sub" x="745" y="105" text-anchor="middle" font-size="11">用户立刻看到</text>
  <rect class="box" x="450" y="190" width="170" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="535" y="216" text-anchor="middle" font-size="13" fill="var(--y)">改发兜底奖</text>
  <text class="sub" x="535" y="235" text-anchor="middle" font-size="11">概率不摊给别的奖品</text>
  <rect class="box" x="660" y="190" width="170" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="745" y="216" text-anchor="middle" font-size="13" fill="var(--g)">落库、发奖</text>
  <text class="sub" x="745" y="235" text-anchor="middle" font-size="11">异步，失败就重试</text>
  <line class="arr" x1="200" y1="90" x2="238" y2="90"/>
  <line class="arr" x1="410" y1="90" x2="448" y2="90"/>
  <line class="arr" x1="620" y1="90" x2="658" y2="90"/>
  <line class="arr" x1="535" y1="120" x2="535" y2="188"/>
  <text class="lbl" x="543" y="158" text-anchor="start" font-size="11">库存没了</text>
  <line class="arr" x1="745" y1="120" x2="745" y2="188"/>
  <text class="lbl" x="753" y="158" text-anchor="start" font-size="11">中了</text>
  <text class="sub" x="430" y="282" text-anchor="middle" font-size="11">次数在脚本里先扣：没抽中也算抽过一次；选奖放在脚本外面，脚本只做判断和扣减</text>
</svg>
