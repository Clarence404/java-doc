<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; }
    .sub { fill:var(--muted); }
    .lbl { fill:var(--fg); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">冻结、扣减与解冻</text>
  <rect class="box" x="40" y="60" width="200" height="70" rx="8" stroke="var(--g)"/>
  <text class="name" x="140" y="86" text-anchor="middle" font-size="13" fill="var(--g)">可用</text>
  <text class="sub" x="140" y="105" text-anchor="middle" font-size="11">可用 = 余额 − 冻结</text>
  <rect class="box" x="330" y="60" width="200" height="70" rx="8" stroke="var(--y)"/>
  <text class="name" x="430" y="86" text-anchor="middle" font-size="13" fill="var(--y)">冻结中 FROZEN</text>
  <text class="sub" x="430" y="105" text-anchor="middle" font-size="11">钱还在账上，但不能再用</text>
  <rect class="box" x="620" y="60" width="200" height="70" rx="8" stroke="var(--p)"/>
  <text class="name" x="720" y="86" text-anchor="middle" font-size="13" fill="var(--p)">已扣减 DEDUCTED</text>
  <text class="sub" x="720" y="105" text-anchor="middle" font-size="11">余额 − n，冻结 − n，记分录</text>
  <rect class="box" x="330" y="200" width="200" height="70" rx="8" stroke="var(--muted)"/>
  <text class="name" x="430" y="226" text-anchor="middle" font-size="13" fill="var(--muted)">已解冻 UNFROZEN</text>
  <text class="sub" x="430" y="245" text-anchor="middle" font-size="11">冻结 − n，可用恢复</text>
  <line class="arr" x1="240" y1="95" x2="328" y2="95"/>
  <text class="lbl" x="284" y="87" text-anchor="middle" font-size="11">冻结 n</text>
  <line class="arr" x1="530" y1="95" x2="618" y2="95"/>
  <text class="lbl" x="574" y="87" text-anchor="middle" font-size="11">结果成功</text>
  <line class="arr" x1="430" y1="130" x2="430" y2="198"/>
  <text class="lbl" x="438" y="168" text-anchor="start" font-size="11">失败或取消</text>
  <text class="sub" x="430" y="300" text-anchor="middle" font-size="11">三步都是带条件的更新：冻结要求可用 ≥ n，扣减和解冻要求冻结记录仍是「冻结中」，重复请求影响 0 行</text>
</svg>
