<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">登录后合并临时购物车</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">登录成功</text>
  <text class="sub" x="40" y="88">客户端带上 guestId</text>
  <text class="desc" x="650" y="70" text-anchor="end">调用合并接口，服务端先校验 guestId 签名</text>
  <text class="desc" x="650" y="88" text-anchor="end">只能合并本设备持有的临时车</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>
  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">读取临时车</text>
  <text class="sub" x="40" y="178">HGETALL 临时车 key</text>
  <text class="desc" x="650" y="160" text-anchor="end">临时车为空则直接结束</text>
  <text class="desc" x="650" y="178" text-anchor="end">按加购时间倒序排列，新加的优先保留</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>
  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">合并脚本</text>
  <text class="sub" x="40" y="268">在用户所在槽原子执行</text>
  <text class="desc" x="650" y="250" text-anchor="end">先查合并标记：已合并过则跳过</text>
  <text class="desc" x="650" y="268" text-anchor="end">同款数量累加并封顶，新款受商品数上限约束</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>
  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">删除临时车</text>
  <text class="sub" x="40" y="358">DEL 临时车 key</text>
  <text class="desc" x="650" y="340" text-anchor="end">删除失败可以整体重试</text>
  <text class="desc" x="650" y="358" text-anchor="end">合并标记保证重试时不会重复累加</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>
  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">返回结果</text>
  <text class="sub" x="40" y="448">未能合并的商品数</text>
  <text class="desc" x="650" y="430" text-anchor="end">超出上限的商品不写入，提示用户</text>
  <text class="desc" x="650" y="448" text-anchor="end">客户端丢弃 guestId，之后只用登录态</text>

</svg>
