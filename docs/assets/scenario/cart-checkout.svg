<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">结算校验与下单后清理</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">购物车页</text>
  <text class="sub" x="40" y="88">勾选商品</text>
  <text class="desc" x="650" y="70" text-anchor="end">展示实时价格与库存状态</text>
  <text class="desc" x="650" y="88" text-anchor="end">降价、缺货、下架分别打标，不可买的不能勾选</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>
  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">结算页</text>
  <text class="sub" x="40" y="178">第一次校验</text>
  <text class="desc" x="650" y="160" text-anchor="end">重新查价、查库存、算优惠、校验状态与限购</text>
  <text class="desc" x="650" y="178" text-anchor="end">返回应付总额与每件商品的成交价</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>
  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">提交订单</text>
  <text class="sub" x="40" y="268">第二次校验</text>
  <text class="desc" x="650" y="250" text-anchor="end">服务端重算应付总额，与页面确认的金额比对</text>
  <text class="desc" x="650" y="268" text-anchor="end">不一致则拒绝下单，提示价格已变化</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>
  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">订单服务</text>
  <text class="sub" x="40" y="358">本地事务</text>
  <text class="desc" x="650" y="340" text-anchor="end">建单、扣减库存、锁定优惠券</text>
  <text class="desc" x="650" y="358" text-anchor="end">同一事务写 outbox，提交后投递订单已创建消息</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>
  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">购物车服务</text>
  <text class="sub" x="40" y="448">消费订单消息</text>
  <text class="desc" x="650" y="430" text-anchor="end">删除已下单的商品（加购早于下单时间的才删）</text>
  <text class="desc" x="650" y="448" text-anchor="end">重复消息再删一次没有副作用</text>

</svg>
