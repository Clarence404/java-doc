<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .st { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .enum { fill:var(--muted); font-size:11px; }
    .lbl { fill:var(--fg); font-size:11px; }
    .note { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">券实例状态流转</text>

  <rect class="st" x="20" y="70" width="160" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="100" y="96" text-anchor="middle" fill="var(--g)">未使用</text>
  <text class="enum" x="100" y="114" text-anchor="middle">UNUSED</text>

  <rect class="st" x="260" y="70" width="160" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="340" y="96" text-anchor="middle" fill="var(--y)">已锁定</text>
  <text class="enum" x="340" y="114" text-anchor="middle">LOCKED</text>

  <rect class="st" x="500" y="70" width="160" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="580" y="96" text-anchor="middle" fill="var(--b)">已使用</text>
  <text class="enum" x="580" y="114" text-anchor="middle">USED</text>

  <rect class="st" x="20" y="210" width="160" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="100" y="236" text-anchor="middle" fill="var(--r)">已作废</text>
  <text class="enum" x="100" y="254" text-anchor="middle">INVALID</text>

  <rect class="st" x="260" y="210" width="160" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="340" y="236" text-anchor="middle" fill="var(--muted)">已过期</text>
  <text class="enum" x="340" y="254" text-anchor="middle">EXPIRED</text>

  <path class="arr" d="M180 90 H258"/>
  <text class="lbl" x="220" y="84" text-anchor="middle">下单锁券</text>
  <path class="arr" d="M260 112 H182"/>
  <text class="lbl" x="220" y="127" text-anchor="middle">取消 / 关单</text>

  <line class="arr" x1="420" y1="100" x2="498" y2="100"/>
  <text class="lbl" x="460" y="94" text-anchor="middle">支付核销</text>

  <path class="arr" d="M580 70 V46 H100 V68"/>
  <text class="lbl" x="340" y="41" text-anchor="middle">退款返还（仍在有效期内）</text>

  <line class="arr" x1="100" y1="130" x2="100" y2="208"/>
  <text class="lbl" x="108" y="174">作废</text>

  <line class="arr" x1="160" y1="130" x2="294" y2="208"/>
  <text class="lbl" x="236" y="160">到期</text>

  <path class="arr" d="M580 130 V240 H422"/>
  <text class="lbl" x="588" y="184">退款时已过期</text>

  <text class="note" x="340" y="300" text-anchor="middle">已锁定的券不参与过期扫描，由订单关单或支付结果决定去向</text>
</svg>
