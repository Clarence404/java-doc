<svg viewBox="0 0 760 228" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="380" y="24" text-anchor="middle" class="title">Cloudflare Tunnel：由内网主动向外建立连接</text>

  <rect x="20" y="88" width="130" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="85" y="112" text-anchor="middle" class="name">用户</text>
  <text x="85" y="132" text-anchor="middle" class="desc">app.example.com</text>

  <rect x="200" y="88" width="150" height="60" rx="4" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="275" y="112" text-anchor="middle" class="name">Cloudflare 边缘</text>
  <text x="275" y="132" text-anchor="middle" class="desc">CNAME 指向隧道</text>

  <rect x="440" y="44" width="300" height="124" rx="6" fill="var(--g)" fill-opacity="0.05" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="590" y="66" text-anchor="middle" class="lbl">内网：无公网 IP、不开放入站端口</text>

  <rect x="456" y="88" width="120" height="60" rx="4" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="516" y="112" text-anchor="middle" class="name">cloudflared</text>
  <text x="516" y="132" text-anchor="middle" class="desc">隧道客户端</text>

  <rect x="604" y="88" width="120" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="664" y="112" text-anchor="middle" class="name">本地服务</text>
  <text x="664" y="132" text-anchor="middle" class="desc">localhost:8080</text>

  <line x1="150" y1="118" x2="198" y2="118" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="174" y="110" text-anchor="middle" class="lbl">HTTPS</text>
  <line x1="456" y1="118" x2="352" y2="118" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="404" y="110" text-anchor="middle" class="lbl">出站连接</text>
  <line x1="576" y1="118" x2="602" y2="118" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="380" y="200" text-anchor="middle" class="desc">用户请求沿 cloudflared 预先建立的出站连接反向送达，再由它转发给本地服务</text>
</svg>
