<svg viewBox="0 0 770 248" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
    .lane { font-size:12px; font-weight:700; fill:var(--p); }
  </style>
  <defs>
    <marker id="arrow-iac-oidc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="385" y="26" text-anchor="middle">OIDC 换取云凭证：仓库里不存长期 AccessKey</text>
  <rect x="20" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="76" text-anchor="middle">Actions Job</text>
  <text class="desc" x="100" y="98" text-anchor="middle">申请 OIDC 令牌</text>
  <rect x="210" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="290" y="76" text-anchor="middle">GitHub OIDC</text>
  <text class="desc" x="290" y="98" text-anchor="middle">签发含 sub 的 JWT</text>
  <rect x="400" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="480" y="76" text-anchor="middle">云厂商 STS</text>
  <text class="desc" x="480" y="98" text-anchor="middle">校验 aud / sub</text>
  <rect x="590" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="76" text-anchor="middle">短期凭证</text>
  <text class="desc" x="670" y="98" text-anchor="middle">约 1 小时后过期</text>
  <line x1="180" y1="82" x2="208" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-iac-oidc)"/>
  <line x1="370" y1="82" x2="398" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-iac-oidc)"/>
  <line x1="560" y1="82" x2="588" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-iac-oidc)"/>

  <line x1="670" y1="114" x2="670" y2="162" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-iac-oidc)"/>
  <text class="label" x="678" y="143">注入环境变量</text>

  <rect x="20" y="164" width="730" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="385" y="190" text-anchor="middle">terraform plan / apply 调用云 API</text>
  <text class="desc" x="385" y="212" text-anchor="middle">plan 用只读角色，apply 角色的信任策略只认 environment:production 这个 sub</text>
</svg>
