<svg viewBox="0 0 720 276" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-ansible" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="26" text-anchor="middle">Ansible 无 Agent 架构</text>

  <!-- 控制节点 -->
  <rect x="40" y="60" width="240" height="196" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="160" y="84" text-anchor="middle">控制节点（Control Node）</text>
  <text class="desc" x="160" y="110" text-anchor="middle">Inventory（主机清单）</text>
  <text class="desc" x="160" y="134" text-anchor="middle">Playbook（任务编排 YAML）</text>
  <text class="desc" x="160" y="158" text-anchor="middle">模块库（yum / copy / systemd…）</text>
  <text class="desc" x="160" y="182" text-anchor="middle">ansible / ansible-playbook CLI</text>
  <text class="desc" x="160" y="206" text-anchor="middle">无守护进程、无数据库</text>

  <!-- SSH 箭头 -->
  <line x1="284" y1="90"  x2="454" y2="90"  stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ansible)"/>
  <text class="label" x="369" y="150" text-anchor="middle">SSH（无 Agent）</text>
  <line x1="284" y1="158" x2="454" y2="158" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ansible)"/>
  <line x1="284" y1="226" x2="454" y2="226" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ansible)"/>

  <!-- 被管节点 -->
  <rect x="460" y="60" width="220" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="570" y="84" text-anchor="middle">被管节点 1</text>
  <text class="desc" x="570" y="106" text-anchor="middle">只需 SSH + Python</text>

  <rect x="460" y="128" width="220" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="570" y="152" text-anchor="middle">被管节点 2</text>
  <text class="desc" x="570" y="174" text-anchor="middle">只需 SSH + Python</text>

  <rect x="460" y="196" width="220" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="570" y="220" text-anchor="middle">被管节点 3</text>
  <text class="desc" x="570" y="242" text-anchor="middle">只需 SSH + Python</text>
</svg>
