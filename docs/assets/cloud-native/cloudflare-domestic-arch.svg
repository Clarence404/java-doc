<svg viewBox="0 0 720 566" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">Cloudflare 叠加在国内云之前</text>

  <rect x="260" y="40" width="200" height="44" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="360" y="67" text-anchor="middle" class="name">用户</text>

  <rect x="160" y="118" width="400" height="60" rx="4" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="360" y="142" text-anchor="middle" class="name">Cloudflare</text>
  <text x="360" y="162" text-anchor="middle" class="desc">DNS + CDN + WAF + DDoS 防护</text>

  <rect x="20" y="240" width="680" height="306" rx="6" fill="var(--b)" fill-opacity="0.04" stroke="var(--b)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="262" class="lbl">国内云 VPC（安全组只放行 Cloudflare 回源 IP 段）</text>

  <rect x="210" y="278" width="300" height="60" rx="4" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="360" y="302" text-anchor="middle" class="name">负载均衡 CLB / ALB</text>
  <text x="360" y="322" text-anchor="middle" class="desc">提供有效证书，转发到应用</text>

  <rect x="210" y="372" width="300" height="60" rx="4" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="360" y="396" text-anchor="middle" class="name">ECS / ACK</text>
  <text x="360" y="416" text-anchor="middle" class="desc">Spring Boot 应用</text>

  <rect x="110" y="466" width="500" height="60" rx="4" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="360" y="490" text-anchor="middle" class="name">数据层</text>
  <text x="193" y="510" text-anchor="middle" class="desc">RDS / PolarDB</text>
  <text x="360" y="510" text-anchor="middle" class="desc">Redis</text>
  <text x="527" y="510" text-anchor="middle" class="desc">OSS</text>

  <line x1="360" y1="84" x2="360" y2="116" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="178" x2="360" y2="276" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="231" class="lbl">回源：Full (strict) + 源站 IP 白名单 / Tunnel</text>
  <line x1="360" y1="338" x2="360" y2="370" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="432" x2="360" y2="464" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
