<svg viewBox="0 0 796 160" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { fill:var(--card); stroke-width:1.5; }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="390" y="24" text-anchor="middle" fill="var(--fg)" font-size="14" font-weight="700">Elasticsearch 分析器（Analyzer）处理链</text>
  <rect x="20" y="40" width="136" height="76" rx="6" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="88" y="62" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="700">原始文本</text>
  <text x="88" y="82" text-anchor="middle" fill="var(--fg)" font-size="10">写入或查询的字段值</text>
  <text x="88" y="100" text-anchor="middle" fill="var(--muted)" font-size="9">&lt;b&gt;Quick&lt;/b&gt; Foxes!</text>
  <line class="arr" x1="156" y1="78" x2="178" y2="78"/>
  <rect x="180" y="40" width="136" height="76" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="248" y="62" text-anchor="middle" fill="var(--y)" font-size="12" font-weight="700">Char Filter</text>
  <text x="248" y="82" text-anchor="middle" fill="var(--fg)" font-size="10">字符预处理</text>
  <text x="248" y="100" text-anchor="middle" fill="var(--muted)" font-size="9">html_strip → Quick Foxes!</text>
  <line class="arr" x1="316" y1="78" x2="338" y2="78"/>
  <rect x="340" y="40" width="136" height="76" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="408" y="62" text-anchor="middle" fill="var(--b)" font-size="12" font-weight="700">Tokenizer</text>
  <text x="408" y="82" text-anchor="middle" fill="var(--fg)" font-size="10">切分词元（只能 1 个）</text>
  <text x="408" y="100" text-anchor="middle" fill="var(--muted)" font-size="9">standard → Quick, Foxes</text>
  <line class="arr" x1="476" y1="78" x2="498" y2="78"/>
  <rect x="500" y="40" width="136" height="76" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="568" y="62" text-anchor="middle" fill="var(--g)" font-size="12" font-weight="700">Token Filter</text>
  <text x="568" y="82" text-anchor="middle" fill="var(--fg)" font-size="10">词元加工（可多个）</text>
  <text x="568" y="100" text-anchor="middle" fill="var(--muted)" font-size="9">lowercase、stemmer</text>
  <line class="arr" x1="636" y1="78" x2="658" y2="78"/>
  <rect x="660" y="40" width="136" height="76" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="728" y="62" text-anchor="middle" fill="var(--p)" font-size="12" font-weight="700">Terms</text>
  <text x="728" y="82" text-anchor="middle" fill="var(--fg)" font-size="10">写入倒排索引</text>
  <text x="728" y="100" text-anchor="middle" fill="var(--muted)" font-size="9">quick, fox</text>
  <text x="390" y="142" text-anchor="middle" fill="var(--muted)" font-size="11">standard 按 Unicode 文本分段（UAX #29）切词，中文会被切成单字；中文分词用 IK（第三方插件）、smartcn 或 ICU</text>
</svg>
