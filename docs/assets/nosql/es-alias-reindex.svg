<svg viewBox="0 0 740 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="370" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">别名切换实现零停机 Reindex</text>

  <!-- 四个步骤 -->
  <rect class="box" x="10" y="44" width="160" height="74" stroke="var(--p)"/>
  <text x="90" y="68" text-anchor="middle" fill="var(--p)" font-weight="700">① 建新索引</text>
  <text x="90" y="88" text-anchor="middle" fill="var(--fg)" font-size="10">products_v2 用新 mapping</text>
  <text x="90" y="104" text-anchor="middle" fill="var(--muted)" font-size="10">关 refresh、副本数设 0</text>

  <line class="arr" x1="170" y1="81" x2="194" y2="81"/>

  <rect class="box" x="196" y="44" width="160" height="74" stroke="var(--b)"/>
  <text x="276" y="68" text-anchor="middle" fill="var(--b)" font-weight="700">② 全量导入</text>
  <text x="276" y="88" text-anchor="middle" fill="var(--fg)" font-size="10">_reindex 或从主库重灌</text>
  <text x="276" y="104" text-anchor="middle" fill="var(--muted)" font-size="10">带外部版本号写入</text>

  <line class="arr" x1="356" y1="81" x2="380" y2="81"/>

  <rect class="box" x="382" y="44" width="160" height="74" stroke="var(--y)"/>
  <text x="462" y="68" text-anchor="middle" fill="var(--y)" font-weight="700">③ 增量追平</text>
  <text x="462" y="88" text-anchor="middle" fill="var(--fg)" font-size="10">新消费组同时写 v2</text>
  <text x="462" y="104" text-anchor="middle" fill="var(--muted)" font-size="10">恢复 refresh 与副本、对账</text>

  <line class="arr" x1="542" y1="81" x2="566" y2="81"/>

  <rect class="box" x="568" y="44" width="160" height="74" stroke="var(--g)"/>
  <text x="648" y="68" text-anchor="middle" fill="var(--g)" font-weight="700">④ 原子切换别名</text>
  <text x="648" y="88" text-anchor="middle" fill="var(--fg)" font-size="10">一次 _aliases 请求</text>
  <text x="648" y="104" text-anchor="middle" fill="var(--muted)" font-size="10">remove v1 + add v2</text>

  <!-- 切换前后 -->
  <text x="10" y="156" fill="var(--fg)" font-weight="700" font-size="12">切换前后的指向</text>

  <rect class="box" x="10" y="170" width="160" height="70" stroke="var(--muted)"/>
  <text x="90" y="198" text-anchor="middle" fill="var(--fg)" font-weight="700">应用</text>
  <text x="90" y="218" text-anchor="middle" fill="var(--muted)" font-size="10">只访问别名 products</text>

  <line class="arr" x1="170" y1="205" x2="228" y2="205"/>

  <rect class="box" x="230" y="170" width="160" height="70" stroke="var(--p)"/>
  <text x="310" y="198" text-anchor="middle" fill="var(--p)" font-weight="700">别名 products</text>
  <text x="310" y="218" text-anchor="middle" fill="var(--muted)" font-size="10">切换是原子操作</text>

  <line class="arr" x1="390" y1="205" x2="468" y2="205"/>
  <text x="429" y="197" text-anchor="middle" fill="var(--g)" font-size="10">切换后</text>

  <rect class="box" x="470" y="170" width="258" height="70" stroke="var(--g)"/>
  <text x="599" y="198" text-anchor="middle" fill="var(--g)" font-weight="700">products_v2（新）</text>
  <text x="599" y="218" text-anchor="middle" fill="var(--muted)" font-size="10">切换后所有读写都落到这里</text>

  <path d="M310 240 V290 H468" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="389" y="283" text-anchor="middle" fill="var(--muted)" font-size="10">切换前（已摘除）</text>

  <rect class="box" x="470" y="260" width="258" height="60" stroke="var(--border)" stroke-dasharray="4 3"/>
  <text x="599" y="284" text-anchor="middle" fill="var(--muted)" font-weight="700">products_v1（旧）</text>
  <text x="599" y="302" text-anchor="middle" fill="var(--muted)" font-size="10">保留一段时间用于回滚</text>
</svg>
