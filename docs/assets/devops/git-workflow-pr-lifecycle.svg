<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .sub { fill: var(--muted); font-size: 12px; }
    .lane { fill: var(--muted); font-size: 12px; }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .box-b { fill: var(--b); fill-opacity: 0.10; stroke: var(--b); stroke-width: 1.5; }
    .box-g { fill: var(--g); fill-opacity: 0.10; stroke: var(--g); stroke-width: 1.5; }
    .box-p { fill: var(--p); fill-opacity: 0.10; stroke: var(--p); stroke-width: 1.5; }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text class="title" x="380" y="28" text-anchor="middle">一次变更从分支到上线</text>
  <rect class="box-b" x="10" y="50" width="220" height="70" rx="8"/>
  <text class="label" x="120" y="78" text-anchor="middle">1. 从 main 切短命分支</text>
  <text class="sub" x="120" y="100" text-anchor="middle">git switch -c feat/ORD-128</text>
  <rect class="box-b" x="270" y="50" width="220" height="70" rx="8"/>
  <text class="label" x="380" y="78" text-anchor="middle">2. 本地提交</text>
  <text class="sub" x="380" y="100" text-anchor="middle">pre-commit + commit-msg 校验</text>
  <rect class="box-b" x="530" y="50" width="220" height="70" rx="8"/>
  <text class="label" x="640" y="78" text-anchor="middle">3. 推送并开 PR</text>
  <text class="sub" x="640" y="100" text-anchor="middle">模板 + CODEOWNERS 自动指派</text>
  <rect class="box-p" x="530" y="170" width="220" height="70" rx="8"/>
  <text class="label" x="640" y="198" text-anchor="middle">4. CI 与 Review</text>
  <text class="sub" x="640" y="220" text-anchor="middle">必需检查全绿 + 至少 1 人批准</text>
  <rect class="box-g" x="270" y="170" width="220" height="70" rx="8"/>
  <text class="label" x="380" y="198" text-anchor="middle">5. Squash 合并</text>
  <text class="sub" x="380" y="220" text-anchor="middle">PR 标题成为 main 上的提交信息</text>
  <rect class="box-g" x="10" y="170" width="220" height="70" rx="8"/>
  <text class="label" x="120" y="198" text-anchor="middle">6. 部署 / 打 tag</text>
  <text class="sub" x="120" y="220" text-anchor="middle">合并即部署，按 tag 发布版本</text>
  <line class="arrow" x1="230" y1="85" x2="268" y2="85"/>
  <line class="arrow" x1="490" y1="85" x2="528" y2="85"/>
  <line class="arrow" x1="640" y1="120" x2="640" y2="168"/>
  <line class="arrow" x1="530" y1="205" x2="492" y2="205"/>
  <line class="arrow" x1="270" y1="205" x2="232" y2="205"/>
</svg>
