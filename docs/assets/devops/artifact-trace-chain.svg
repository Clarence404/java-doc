<svg viewBox="0 0 810 134" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-artifact-trace" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="405" y="26" text-anchor="middle">构建追溯：从线上 Pod 反查到代码变更</text>
  <rect x="20" y="50" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="85" y="76" text-anchor="middle">线上 Pod</text>
  <text class="desc" x="85" y="98" text-anchor="middle">查 imageID</text>
  <line x1="150" y1="82" x2="178" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-trace)"/>
  <rect x="180" y="50" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="245" y="76" text-anchor="middle">镜像 digest</text>
  <text class="desc" x="245" y="98" text-anchor="middle">sha256 唯一标识</text>
  <line x1="310" y1="82" x2="338" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-trace)"/>
  <rect x="340" y="50" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="405" y="76" text-anchor="middle">CI 运行记录</text>
  <text class="desc" x="405" y="98" text-anchor="middle">provenance 中的 run</text>
  <line x1="470" y1="82" x2="498" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-trace)"/>
  <rect x="500" y="50" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="565" y="76" text-anchor="middle">Git 提交</text>
  <text class="desc" x="565" y="98" text-anchor="middle">revision 标签</text>
  <line x1="630" y1="82" x2="658" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-trace)"/>
  <rect x="660" y="50" width="130" height="64" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="725" y="76" text-anchor="middle">代码 diff</text>
  <text class="desc" x="725" y="98" text-anchor="middle">git show 定位变更</text>
</svg>
