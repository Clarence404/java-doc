<svg viewBox="0 0 790 248" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-env-flag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="395" y="26" text-anchor="middle">功能开关判定：总开关 → 白名单 → 稳定分桶</text>
  <rect x="20" y="50" width="150" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="95" y="76" text-anchor="middle">请求</text>
  <text class="desc" x="95" y="98" text-anchor="middle">featureKey + userId</text>
  <line x1="170" y1="82" x2="218" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-env-flag)"/>
  <rect x="220" y="50" width="150" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="295" y="76" text-anchor="middle">总开关</text>
  <text class="desc" x="295" y="98" text-anchor="middle">enabled ?</text>
  <line x1="370" y1="82" x2="418" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-env-flag)"/>
  <text class="label" x="394" y="76" text-anchor="middle">开启</text>
  <rect x="420" y="50" width="150" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="495" y="76" text-anchor="middle">白名单</text>
  <text class="desc" x="495" y="98" text-anchor="middle">userId 在名单中 ?</text>
  <line x1="570" y1="82" x2="618" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-env-flag)"/>
  <text class="label" x="594" y="76" text-anchor="middle">未命中</text>
  <rect x="620" y="50" width="150" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="695" y="76" text-anchor="middle">稳定分桶</text>
  <text class="desc" x="695" y="98" text-anchor="middle">bucket < 比例 ?</text>
  <rect x="220" y="164" width="150" height="64" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="295" y="190" text-anchor="middle">旧逻辑</text>
  <text class="desc" x="295" y="212" text-anchor="middle">开关关闭直接返回</text>
  <line x1="295" y1="114" x2="295" y2="162" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-env-flag)"/>
  <text class="label" x="303" y="143" text-anchor="start">关闭</text>
  <rect x="420" y="164" width="150" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="495" y="190" text-anchor="middle">新逻辑</text>
  <text class="desc" x="495" y="212" text-anchor="middle">命中白名单</text>
  <line x1="495" y1="114" x2="495" y2="162" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-env-flag)"/>
  <text class="label" x="503" y="143" text-anchor="start">命中</text>
  <rect x="620" y="164" width="150" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="695" y="190" text-anchor="middle">按结果分流</text>
  <text class="desc" x="695" y="212" text-anchor="middle">是走新逻辑，否走旧逻辑</text>
  <line x1="695" y1="114" x2="695" y2="162" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-env-flag)"/>
  <text class="label" x="703" y="143" text-anchor="start">计算</text>
</svg>
