<svg viewBox="0 0 780 124" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="390" y="24" text-anchor="middle" class="title">指标链路：埋点 → 注册表 → 暴露端点 → 抓取与展示</text>

  <rect x="30" y="40" width="150" height="64" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="105" y="66" text-anchor="middle" class="name">业务代码 / 框架</text>
  <text x="105" y="86" text-anchor="middle" class="desc">Counter · Timer · Gauge</text>

  <rect x="220" y="40" width="150" height="64" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="295" y="66" text-anchor="middle" class="name">MeterRegistry</text>
  <text x="295" y="86" text-anchor="middle" class="desc">Micrometer 聚合、加标签</text>

  <rect x="410" y="40" width="150" height="64" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="485" y="66" text-anchor="middle" class="name">/actuator/prometheus</text>
  <text x="485" y="86" text-anchor="middle" class="desc">文本格式，建议走管理端口</text>

  <rect x="600" y="40" width="150" height="64" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="675" y="66" text-anchor="middle" class="name">Prometheus + Grafana</text>
  <text x="675" y="86" text-anchor="middle" class="desc">定时抓取、看板、告警</text>

  <line x1="180" y1="72" x2="218" y2="72" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="72" x2="408" y2="72" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="72" x2="562" y2="72" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
