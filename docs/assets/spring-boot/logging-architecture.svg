<svg viewBox="0 0 760 570" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="380" y="24" text-anchor="middle" class="title">Spring Boot 日志链路：门面 → 实现 → Appender → 输出</text>

  <!-- 第 1 层：调用方 -->
  <rect x="20" y="40" width="165" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="102" y="64" text-anchor="middle" class="name">业务代码</text>
  <text x="102" y="84" text-anchor="middle" class="desc">SLF4J Logger / MDC</text>
  <rect x="205" y="40" width="165" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="287" y="64" text-anchor="middle" class="name">三方库 · JUL</text>
  <text x="287" y="84" text-anchor="middle" class="desc">java.util.logging</text>
  <rect x="390" y="40" width="165" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="472" y="64" text-anchor="middle" class="name">三方库 · Log4j API</text>
  <text x="472" y="84" text-anchor="middle" class="desc">org.apache.logging.log4j</text>
  <rect x="575" y="40" width="165" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="657" y="64" text-anchor="middle" class="name">三方库 · JCL</text>
  <text x="657" y="84" text-anchor="middle" class="desc">commons-logging</text>

  <line x1="287" y1="100" x2="287" y2="128" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="472" y1="100" x2="472" y2="128" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="657" y1="100" x2="657" y2="128" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第 2 层：桥接 -->
  <rect x="205" y="130" width="165" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="287" y="154" text-anchor="middle" class="name">jul-to-slf4j</text>
  <text x="287" y="174" text-anchor="middle" class="desc">桥接器（Boot 自动安装）</text>
  <rect x="390" y="130" width="165" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="472" y="154" text-anchor="middle" class="name">log4j-to-slf4j</text>
  <text x="472" y="174" text-anchor="middle" class="desc">桥接器（Log4j API）</text>
  <rect x="575" y="130" width="165" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="657" y="154" text-anchor="middle" class="name">commons-logging 1.3</text>
  <text x="657" y="174" text-anchor="middle" class="desc">自动探测并转发</text>

  <line x1="102" y1="100" x2="102" y2="218" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="287" y1="190" x2="287" y2="218" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="472" y1="190" x2="472" y2="218" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="657" y1="190" x2="657" y2="218" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第 3 层：门面 -->
  <rect x="20" y="220" width="720" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="380" y="244" text-anchor="middle" class="name">SLF4J 2.x API（门面）</text>
  <text x="380" y="264" text-anchor="middle" class="desc">ServiceLoader 查找 Provider，只应有一个；多个时告警且选择不可控</text>

  <line x1="197" y1="280" x2="197" y2="308" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="562" y1="280" x2="562" y2="308" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- 第 4 层：实现 -->
  <rect x="20" y="310" width="355" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="197" y="334" text-anchor="middle" class="name">logback-classic（Boot 默认）</text>
  <text x="197" y="354" text-anchor="middle" class="desc">spring-boot-starter-logging</text>
  <rect x="385" y="310" width="355" height="60" rx="4" fill="var(--card)" stroke="var(--b)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="562" y="334" text-anchor="middle" class="name">log4j-slf4j2-impl + log4j-core</text>
  <text x="562" y="354" text-anchor="middle" class="desc">spring-boot-starter-log4j2（与左侧二选一）</text>

  <line x1="197" y1="370" x2="197" y2="398" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="562" y1="370" x2="562" y2="398" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- 第 5 层：Appender -->
  <rect x="20" y="400" width="720" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="380" y="420" text-anchor="middle" class="name">Appender（目的地）+ Encoder / Layout（格式：文本或结构化 JSON）</text>
  <text x="136" y="444" text-anchor="middle" class="desc">Console → stdout</text>
  <text x="380" y="444" text-anchor="middle" class="desc">RollingFile → 滚动 + 保留</text>
  <text x="624" y="444" text-anchor="middle" class="desc">Async：队列解耦，包装前两者</text>

  <line x1="380" y1="460" x2="380" y2="488" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第 6 层：采集平台 -->
  <rect x="20" y="490" width="720" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="380" y="514" text-anchor="middle" class="name">采集与存储（平台侧，见可观测性模块）</text>
  <text x="210" y="534" text-anchor="middle" class="desc">容器 stdout / 文件 → Fluent Bit / Filebeat</text>
  <text x="550" y="534" text-anchor="middle" class="desc">Elasticsearch / Loki → 检索与告警</text>
</svg>
