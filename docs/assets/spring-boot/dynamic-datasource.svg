<svg viewBox="0 0 760 394" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .row { fill:var(--card); stroke-width:1.5; }
    .tag { font-weight:700; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .ef { fill:var(--fg); font-size:12px; }
    .ar { stroke:var(--muted); stroke-width:1.5; fill:none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">dynamic-datasource 的路由过程</text>
  <rect class="row" x="20" y="44" width="720" height="60" rx="6" ry="6" stroke="var(--p)"/>
  <text x="34" y="70" class="tag" fill="var(--p)">@DS("slave") 切面</text>
  <text x="34" y="88" class="sub">进入方法时把数据源名压入 ThreadLocal 栈，退出时弹出</text>
  <text x="726" y="70" text-anchor="end" class="ef">方法上的 @DS 优先于类上的</text>
  <text x="726" y="88" text-anchor="end" class="sub">自调用不经过代理，注解不生效</text>
  <line class="ar" x1="380" y1="104" x2="380" y2="132" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="134" width="720" height="60" rx="6" ry="6" stroke="var(--b)"/>
  <text x="34" y="160" class="tag" fill="var(--b)">DynamicRoutingDataSource</text>
  <text x="34" y="178" class="sub">getConnection() 时读取栈顶的数据源名</text>
  <text x="726" y="160" text-anchor="end" class="ef">找不到名称时：strict=true 报错</text>
  <text x="726" y="178" text-anchor="end" class="sub">strict=false 回落到 primary</text>
  <line class="ar" x1="380" y1="194" x2="380" y2="222" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="224" width="720" height="60" rx="6" ry="6" stroke="var(--b)"/>
  <text x="34" y="250" class="tag" fill="var(--b)">选择目标连接池</text>
  <text x="34" y="268" class="sub">master / slave_1 / slave_2 等，每个都是独立的 HikariCP</text>
  <text x="726" y="250" text-anchor="end" class="ef">分组名如 slave 会在组内负载均衡</text>
  <line class="ar" x1="380" y1="284" x2="380" y2="312" marker-end="url(#arr)"/>
  <rect class="row" x="20" y="314" width="720" height="60" rx="6" ry="6" stroke="var(--r)"/>
  <text x="34" y="340" class="tag" fill="var(--r)">事务中的连接已绑定</text>
  <text x="34" y="358" class="sub">外层 @Transactional 开启后连接绑到当前线程</text>
  <text x="726" y="340" text-anchor="end" class="ef">内层 @DS 切换不再生效</text>
  <text x="726" y="358" text-anchor="end" class="sub">跨库写入改用 @DSTransactional 或分布式事务</text>
</svg>
