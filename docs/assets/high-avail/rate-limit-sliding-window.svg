<svg viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .old { fill:var(--bg); stroke:var(--border); stroke-width:1.2; }
    .cur { fill:var(--card); stroke:var(--b); stroke-width:1.5; }
    .span-old { fill:var(--bg); stroke:var(--muted); stroke-width:1; stroke-dasharray:4 3; }
    .span-cur { fill:var(--card); stroke:var(--b); stroke-width:1.5; }
    .t-old { fill:var(--muted); font-size:12px; }
    .t-cur { fill:var(--fg); font-size:12px; font-weight:600; }
    .label { fill:var(--b); font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:12px; }
  </style>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">滑动窗口：1s 窗口拆成 10 个 100ms 子窗口（当前 t = 1.8s）</text>

  <rect class="old" x="32" y="50" width="44" height="44" rx="4"/>
  <text class="t-old" x="54" y="77" text-anchor="middle">0.6</text>
  <rect class="old" x="84" y="50" width="44" height="44" rx="4"/>
  <text class="t-old" x="106" y="77" text-anchor="middle">0.7</text>

  <rect class="cur" x="136" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="158" y="77" text-anchor="middle">0.8</text>
  <rect class="cur" x="188" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="210" y="77" text-anchor="middle">0.9</text>
  <rect class="cur" x="240" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="262" y="77" text-anchor="middle">1.0</text>
  <rect class="cur" x="292" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="314" y="77" text-anchor="middle">1.1</text>
  <rect class="cur" x="344" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="366" y="77" text-anchor="middle">1.2</text>
  <rect class="cur" x="396" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="418" y="77" text-anchor="middle">1.3</text>
  <rect class="cur" x="448" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="470" y="77" text-anchor="middle">1.4</text>
  <rect class="cur" x="500" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="522" y="77" text-anchor="middle">1.5</text>
  <rect class="cur" x="552" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="574" y="77" text-anchor="middle">1.6</text>
  <rect class="cur" x="604" y="50" width="44" height="44" rx="4"/>
  <text class="t-cur" x="626" y="77" text-anchor="middle">1.7</text>

  <rect class="span-old" x="32" y="110" width="96" height="40" rx="6"/>
  <text class="sub" x="80" y="135" text-anchor="middle">已过期，丢弃</text>
  <rect class="span-cur" x="136" y="110" width="512" height="40" rx="6"/>
  <text class="label" x="392" y="135" text-anchor="middle">当前窗口计数 = 0.8 ~ 1.8s 这 10 个子窗口之和，超过阈值即拒绝</text>
</svg>
