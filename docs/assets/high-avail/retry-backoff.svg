<svg viewBox="0 0 680 314" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <rect x="0" y="0" width="680" height="314" rx="8" fill="var(--bg)"/>

  <text x="340" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">指数退避 + 随机抖动（初始 1s，倍数 2）</text>

  <!-- 第 1 次重试 -->
  <text x="40" y="68" fill="var(--fg)">第 1 次重试前</text>
  <rect x="150" y="52" width="40" height="22" rx="3" fill="var(--b)" opacity="0.85"/>
  <text x="198" y="68" font-size="12" fill="var(--muted)">1s</text>
  <line x1="170" y1="86" x2="210" y2="86" stroke="var(--y)" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="170" y1="81" x2="170" y2="91" stroke="var(--y)" stroke-width="1.5"/>
  <line x1="210" y1="81" x2="210" y2="91" stroke="var(--y)" stroke-width="1.5"/>

  <!-- 第 2 次重试 -->
  <text x="40" y="124" fill="var(--fg)">第 2 次重试前</text>
  <rect x="150" y="108" width="80" height="22" rx="3" fill="var(--b)" opacity="0.85"/>
  <text x="238" y="124" font-size="12" fill="var(--muted)">2s</text>
  <line x1="190" y1="142" x2="270" y2="142" stroke="var(--y)" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="190" y1="137" x2="190" y2="147" stroke="var(--y)" stroke-width="1.5"/>
  <line x1="270" y1="137" x2="270" y2="147" stroke="var(--y)" stroke-width="1.5"/>

  <!-- 第 3 次重试 -->
  <text x="40" y="180" fill="var(--fg)">第 3 次重试前</text>
  <rect x="150" y="164" width="160" height="22" rx="3" fill="var(--b)" opacity="0.85"/>
  <text x="318" y="180" font-size="12" fill="var(--muted)">4s</text>
  <line x1="230" y1="198" x2="390" y2="198" stroke="var(--y)" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="230" y1="193" x2="230" y2="203" stroke="var(--y)" stroke-width="1.5"/>
  <line x1="390" y1="193" x2="390" y2="203" stroke="var(--y)" stroke-width="1.5"/>

  <!-- 第 4 次重试 -->
  <text x="40" y="236" fill="var(--fg)">第 4 次重试前</text>
  <rect x="150" y="220" width="320" height="22" rx="3" fill="var(--b)" opacity="0.85"/>
  <text x="478" y="236" font-size="12" fill="var(--muted)">8s</text>
  <line x1="310" y1="254" x2="630" y2="254" stroke="var(--y)" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="310" y1="249" x2="310" y2="259" stroke="var(--y)" stroke-width="1.5"/>
  <line x1="630" y1="249" x2="630" y2="259" stroke="var(--y)" stroke-width="1.5"/>

  <!-- 图例 -->
  <rect x="40" y="280" width="24" height="12" rx="2" fill="var(--b)" opacity="0.85"/>
  <text x="72" y="291" font-size="12" fill="var(--muted)">基础等待 = 1s × 2^(n-1)，并设上限</text>
  <line x1="340" y1="286" x2="370" y2="286" stroke="var(--y)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="378" y="291" font-size="12" fill="var(--muted)">加抖动后的实际等待区间（±50%）</text>
</svg>
