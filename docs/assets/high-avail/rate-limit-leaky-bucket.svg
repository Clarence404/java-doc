<svg viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .label { fill:var(--fg); font-weight:600; font-size:14px; }
    .sub { fill:var(--muted); font-size:12px; }
    .arrow { stroke:var(--muted); stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">漏桶：请求排队，以固定速率流出</text>

  <rect class="box" x="20" y="50" width="130" height="60" rx="8" stroke="var(--p)"/>
  <text class="label" x="85" y="74" text-anchor="middle">请求流入</text>
  <text class="sub" x="85" y="96" text-anchor="middle">速率忽快忽慢</text>

  <line class="arrow" x1="150" y1="80" x2="188" y2="80" marker-end="url(#arr)"/>

  <rect class="box" x="190" y="50" width="130" height="60" rx="8" stroke="var(--b)"/>
  <text class="label" x="255" y="74" text-anchor="middle">漏桶（队列）</text>
  <text class="sub" x="255" y="96" text-anchor="middle">容量 b，排队等待</text>

  <line class="arrow" x1="320" y1="80" x2="358" y2="80" marker-end="url(#arr)"/>

  <rect class="box" x="360" y="50" width="130" height="60" rx="8" stroke="var(--g)"/>
  <text class="label" x="425" y="74" text-anchor="middle">匀速流出</text>
  <text class="sub" x="425" y="96" text-anchor="middle">每秒固定 r 个</text>

  <line class="arrow" x1="490" y1="80" x2="528" y2="80" marker-end="url(#arr)"/>

  <rect class="box" x="530" y="50" width="130" height="60" rx="8" stroke="var(--g)"/>
  <text class="label" x="595" y="74" text-anchor="middle">下游处理</text>
  <text class="sub" x="595" y="96" text-anchor="middle">输出平滑，无突发</text>

  <line class="arrow" x1="255" y1="110" x2="255" y2="148" marker-end="url(#arr)"/>

  <rect class="box" x="190" y="150" width="130" height="40" rx="8" stroke="var(--r)"/>
  <text class="sub" x="255" y="175" text-anchor="middle">桶满：新请求被拒绝</text>
</svg>
