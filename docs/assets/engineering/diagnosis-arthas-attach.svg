<svg viewBox="0 0 800 234" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .cmd { font-size:12px; font-weight:700; fill:var(--g); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-diag-attach" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="400" y="26" text-anchor="middle">Arthas 如何附着到运行中的 JVM</text>
  <rect x="20" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="76" text-anchor="middle">arthas-boot</text>
  <text class="desc" x="100" y="98" text-anchor="middle">列出进程、选择 PID</text>
  <line x1="180" y1="82" x2="218" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-attach)"/>
  <rect x="220" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="300" y="76" text-anchor="middle">Attach API</text>
  <text class="desc" x="300" y="98" text-anchor="middle">/tmp/.java_pid&lt;pid&gt;</text>
  <line x1="380" y1="82" x2="418" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-attach)"/>
  <rect x="420" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="500" y="76" text-anchor="middle">目标 JVM</text>
  <text class="desc" x="500" y="98" text-anchor="middle">加载 arthas-agent</text>
  <line x1="580" y1="82" x2="618" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-attach)"/>
  <rect x="620" y="50" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="700" y="76" text-anchor="middle">字节码增强</text>
  <text class="desc" x="700" y="98" text-anchor="middle">Instrumentation + ASM</text>
  <line x1="500" y1="114" x2="500" y2="148" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-attach)"/>
  <text class="label" x="508" y="136">启动</text>
  <rect x="20" y="150" width="360" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="200" y="176" text-anchor="middle">客户端</text>
  <text class="desc" x="200" y="198" text-anchor="middle">终端 / Web Console / Tunnel Server</text>
  <line x1="380" y1="182" x2="418" y2="182" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-attach)"/>
  <text class="label" x="399" y="174" text-anchor="middle">连接</text>
  <rect x="420" y="150" width="360" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="600" y="176" text-anchor="middle">Arthas Server（在目标 JVM 内）</text>
  <text class="desc" x="600" y="198" text-anchor="middle">默认 127.0.0.1:3658 telnet / 8563 HTTP</text>
</svg>
