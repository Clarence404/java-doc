<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-dg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="410" y="26" text-anchor="middle">依赖治理闭环</text>

  <rect x="40" y="50" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="150" y="74" text-anchor="middle">1. 声明</text>
  <text class="desc" x="150" y="92" text-anchor="middle">BOM / Version Catalog</text>
  <text class="desc" x="150" y="108" text-anchor="middle">版本集中在一处</text>
  <rect x="300" y="50" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="410" y="74" text-anchor="middle">2. 约束</text>
  <text class="desc" x="410" y="92" text-anchor="middle">Enforcer / 依赖锁定</text>
  <text class="desc" x="410" y="108" text-anchor="middle">构建期拦截冲突与禁用库</text>
  <rect x="560" y="50" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="74" text-anchor="middle">3. 扫描</text>
  <text class="desc" x="670" y="92" text-anchor="middle">Dependency-Check / OSV / Trivy</text>
  <text class="desc" x="670" y="108" text-anchor="middle">PR 增量 + 每日全量</text>
  <rect x="560" y="176" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="200" text-anchor="middle">4. 研判</text>
  <text class="desc" x="670" y="218" text-anchor="middle">升级修复，或带到期日抑制</text>
  <text class="desc" x="670" y="234" text-anchor="middle">抑制必须写明理由</text>
  <rect x="300" y="176" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="410" y="200" text-anchor="middle">5. 升级</text>
  <text class="desc" x="410" y="218" text-anchor="middle">Renovate / Dependabot PR</text>
  <text class="desc" x="410" y="234" text-anchor="middle">patch 自动合并，major 人工评审</text>
  <rect x="40" y="176" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="150" y="200" text-anchor="middle">6. 合规与留档</text>
  <text class="desc" x="150" y="218" text-anchor="middle">License 白名单 / CycloneDX SBOM</text>
  <text class="desc" x="150" y="234" text-anchor="middle">SBOM 随制品发布</text>

  <line x1="260" y1="88" x2="298" y2="88" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-dg)"/>
  <line x1="520" y1="88" x2="558" y2="88" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-dg)"/>
  <line x1="670" y1="126" x2="670" y2="174" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-dg)"/>
  <line x1="560" y1="214" x2="522" y2="214" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-dg)"/>
  <line x1="300" y1="214" x2="262" y2="214" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-dg)"/>

  <text class="desc" x="410" y="280" text-anchor="middle">新依赖、新版本、新漏洞不断进入，治理是循环而不是一次性动作：6 之后回到 1</text>
</svg>
