<svg viewBox="0 0 920 198" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .t { font-weight: 700; font-size: 14px; }
    .s { font-size: 12px; fill: var(--muted); }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="920" height="198" fill="var(--bg)" rx="8"/>
  <rect x="20" y="20" width="190" height="64" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="115" y="45" text-anchor="middle" class="t" fill="var(--g)">发布 v2</text>
  <text x="115" y="64" text-anchor="middle" class="s">v1 与 v2 并行运行</text>
  <rect x="250" y="20" width="190" height="64" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="345" y="45" text-anchor="middle" class="t" fill="var(--y)">宣布废弃 v1</text>
  <text x="345" y="64" text-anchor="middle" class="s">响应带 Deprecation + Link</text>
  <rect x="480" y="20" width="190" height="64" rx="6" fill="var(--r)" fill-opacity="0.10" stroke="var(--r)" stroke-width="1.5"/>
  <text x="575" y="45" text-anchor="middle" class="t" fill="var(--r)">到达 Sunset 日期</text>
  <text x="575" y="64" text-anchor="middle" class="s">按调用量确认迁移完成</text>
  <rect x="710" y="20" width="190" height="64" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="805" y="45" text-anchor="middle" class="t" fill="var(--p)">下线 v1</text>
  <text x="805" y="64" text-anchor="middle" class="s">返回 410 Gone</text>
  <line x1="210" y1="52" x2="248" y2="52" class="arrow"/>
  <line x1="440" y1="52" x2="478" y2="52" class="arrow"/>
  <line x1="670" y1="52" x2="708" y2="52" class="arrow"/>
  <rect x="250" y="114" width="650" height="64" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="575" y="139" text-anchor="middle" class="t">迁移窗口</text>
  <text x="575" y="158" text-anchor="middle" class="s">逐个通知调用方，按版本统计调用量；对外 API 通常不少于 6 个月，Sunset 不早于 Deprecation</text>
</svg>
