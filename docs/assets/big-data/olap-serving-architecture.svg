<svg viewBox="0 0 780 506" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="390" y="24" text-anchor="middle" class="title">数据服务架构：消费方 → 查询服务 → OLAP 引擎 ← 离线 / 实时写入</text>

  <!-- 消费方 -->
  <rect x="20" y="44" width="230" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="135" y="70" text-anchor="middle" class="name">运营看板 / BI</text>
  <text x="135" y="90" text-anchor="middle" class="desc">固定报表、下钻</text>

  <rect x="275" y="44" width="230" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="390" y="70" text-anchor="middle" class="name">业务系统 / 开放 API</text>
  <text x="390" y="90" text-anchor="middle" class="desc">商家后台、数据产品</text>

  <rect x="530" y="44" width="230" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="645" y="70" text-anchor="middle" class="name">导出请求</text>
  <text x="645" y="90" text-anchor="middle" class="desc">明细 / 大结果集下载</text>

  <line x1="135" y1="104" x2="135" y2="136" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="104" x2="390" y2="136" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="645" y1="104" x2="645" y2="136" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 查询服务 -->
  <rect x="20" y="138" width="740" height="120" rx="6" fill="var(--b)" fill-opacity="0.06" stroke="var(--b)" stroke-width="1.5"/>
  <text x="390" y="160" text-anchor="middle" class="name">report-service（Spring Boot 4 + JdbcClient）</text>

  <rect x="30" y="172" width="171" height="72" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.2"/>
  <text x="115" y="200" text-anchor="middle" class="name">鉴权与租户注入</text>
  <text x="115" y="220" text-anchor="middle" class="desc">tenant_id 强制过滤</text>

  <rect x="213" y="172" width="171" height="72" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.2"/>
  <text x="298" y="200" text-anchor="middle" class="name">参数校验与限流</text>
  <text x="298" y="220" text-anchor="middle" class="desc">范围上限 / 并发舱壁</text>

  <rect x="396" y="172" width="171" height="72" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.2"/>
  <text x="481" y="200" text-anchor="middle" class="name">结果缓存</text>
  <text x="481" y="220" text-anchor="middle" class="desc">Redis + 数据版本号</text>

  <rect x="579" y="172" width="171" height="72" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.2"/>
  <text x="664" y="200" text-anchor="middle" class="name">异步导出</text>
  <text x="664" y="220" text-anchor="middle" class="desc">任务表 + 状态轮询</text>

  <line x1="270" y1="258" x2="270" y2="290" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="280" y="279" class="lbl">JDBC（MySQL 协议）</text>
  <line x1="650" y1="258" x2="650" y2="290" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="660" y="279" class="lbl">卸数到文件</text>

  <!-- OLAP 与对象存储 -->
  <rect x="20" y="292" width="500" height="100" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="270" y="318" text-anchor="middle" class="name">StarRocks / Doris（FE 查询端口 9030）</text>
  <text x="270" y="342" text-anchor="middle" class="desc">ADS 汇总表、异步物化视图（透明改写）</text>
  <text x="270" y="366" text-anchor="middle" class="desc">资源组 / Workload Group 隔离、查询超时、SQL 拦截</text>

  <rect x="540" y="292" width="220" height="100" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="650" y="318" text-anchor="middle" class="name">对象存储</text>
  <text x="650" y="342" text-anchor="middle" class="desc">INTO OUTFILE / FILES()</text>
  <text x="650" y="366" text-anchor="middle" class="desc">预签名 URL 下载</text>

  <!-- 写入 -->
  <rect x="20" y="426" width="240" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="140" y="452" text-anchor="middle" class="name">离线：调度 + Spark / SQL 任务</text>
  <text x="140" y="472" text-anchor="middle" class="desc">T+1 覆盖写 ADS 分区</text>

  <rect x="280" y="426" width="240" height="60" rx="6" fill="var(--r)" fill-opacity="0.08" stroke="var(--r)" stroke-width="1.5"/>
  <text x="400" y="452" text-anchor="middle" class="name">实时：Flink / Routine Load</text>
  <text x="400" y="472" text-anchor="middle" class="desc">订单变更秒级入主键表</text>

  <line x1="140" y1="426" x2="140" y2="394" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="400" y1="426" x2="400" y2="394" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
</svg>
