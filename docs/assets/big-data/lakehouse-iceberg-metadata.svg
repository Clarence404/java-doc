<svg viewBox="0 0 800 484" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="400" y="24" text-anchor="middle" class="title">Iceberg 元数据树：Catalog → 元数据文件 → 清单列表 → 清单文件 → 数据文件</text>

  <rect x="415" y="44" width="220" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="525" y="70" text-anchor="middle" class="name">Catalog</text>
  <text x="525" y="90" text-anchor="middle" class="desc">ods.orders → v3.metadata.json</text>

  <path d="M415,74 L275,74 L275,132" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="345" y="66" text-anchor="middle" class="desc">提交前的指针</text>
  <line x1="525" y1="104" x2="525" y2="132" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="165" y="134" width="220" height="60" rx="6" fill="var(--card)" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="275" y="160" text-anchor="middle" class="name">v2.metadata.json</text>
  <text x="275" y="180" text-anchor="middle" class="desc">旧版本：只含快照 S1</text>

  <rect x="415" y="134" width="220" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="525" y="160" text-anchor="middle" class="name">v3.metadata.json</text>
  <text x="525" y="180" text-anchor="middle" class="desc">schema / 分区规范 / 快照 S1、S2</text>

  <line x1="275" y1="194" x2="275" y2="222" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="460" y1="194" x2="332" y2="223" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="525" y1="194" x2="525" y2="222" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="165" y="224" width="220" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="275" y="250" text-anchor="middle" class="name">snap-S1 manifest list</text>
  <text x="275" y="270" text-anchor="middle" class="desc">快照 S1：首次写入 data-a</text>

  <rect x="415" y="224" width="220" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="525" y="250" text-anchor="middle" class="name">snap-S2 manifest list</text>
  <text x="525" y="270" text-anchor="middle" class="desc">快照 S2：复用 + 新增清单</text>

  <line x1="220" y1="284" x2="160" y2="312" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="440" y1="284" x2="250" y2="313" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="500" y1="284" x2="420" y2="312" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="580" y1="284" x2="640" y2="312" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="40" y="314" width="220" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="150" y="340" text-anchor="middle" class="name">manifest-1.avro</text>
  <text x="150" y="360" text-anchor="middle" class="desc">data-a：S1、S2 共用</text>

  <rect x="290" y="314" width="220" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="400" y="340" text-anchor="middle" class="name">manifest-2.avro</text>
  <text x="400" y="360" text-anchor="middle" class="desc">data-b：分区值、行数、列统计</text>

  <rect x="540" y="314" width="220" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="650" y="340" text-anchor="middle" class="name">manifest-3.avro</text>
  <text x="650" y="360" text-anchor="middle" class="desc">删除清单：S2 新增</text>

  <line x1="150" y1="374" x2="150" y2="402" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="400" y1="374" x2="400" y2="402" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="650" y1="374" x2="650" y2="402" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="40" y="404" width="220" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="150" y="430" text-anchor="middle" class="name">data-a.parquet</text>
  <text x="150" y="450" text-anchor="middle" class="desc">S1 写入的 10-08 订单</text>

  <rect x="290" y="404" width="220" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="400" y="430" text-anchor="middle" class="name">data-b.parquet</text>
  <text x="400" y="450" text-anchor="middle" class="desc">S2 追加的 10-09 订单</text>

  <rect x="540" y="404" width="220" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="650" y="430" text-anchor="middle" class="name">删除向量（Puffin）</text>
  <text x="650" y="450" text-anchor="middle" class="desc">位图：data-a 第 3、7 行已删除</text>
</svg>
