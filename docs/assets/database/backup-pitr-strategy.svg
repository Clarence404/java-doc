<svg viewBox="0 0 680 198" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">全量 + 增量 + binlog 的备份与 PITR 恢复</text>

  <!-- 备份时间线 -->
  <rect x="20" y="44" width="130" height="44" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="85" y="71" text-anchor="middle" fill="var(--p)" font-weight="700">周日 全量</text>
  <rect x="170" y="44" width="110" height="44" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="225" y="71" text-anchor="middle" fill="var(--b)">周一 增量</text>
  <rect x="300" y="44" width="110" height="44" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="355" y="71" text-anchor="middle" fill="var(--b)">周二 增量</text>
  <rect x="430" y="44" width="150" height="44" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="505" y="71" text-anchor="middle" fill="var(--g)">binlog 持续拉取</text>
  <rect x="590" y="44" width="70" height="44" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="625" y="71" text-anchor="middle" fill="var(--r)" font-weight="700">故障</text>

  <text x="340" y="108" text-anchor="middle" fill="var(--muted)" font-size="11">恢复路径（PITR）</text>

  <!-- 恢复路径 -->
  <rect x="20" y="118" width="190" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="115" y="142" text-anchor="middle" fill="var(--fg)" font-weight="700">1、prepare 全量</text>
  <text x="115" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">--apply-log-only</text>

  <rect x="245" y="118" width="190" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="340" y="142" text-anchor="middle" fill="var(--fg)" font-weight="700">2、依次合并增量</text>
  <text x="340" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">最后一个做完整 prepare</text>

  <rect x="470" y="118" width="190" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="565" y="142" text-anchor="middle" fill="var(--fg)" font-weight="700">3、重放 binlog</text>
  <text x="565" y="162" text-anchor="middle" fill="var(--muted)" font-size="11">停在误操作之前</text>

  <line class="arr" x1="210" y1="148" x2="243" y2="148"/>
  <line class="arr" x1="435" y1="148" x2="468" y2="148"/>
</svg>
