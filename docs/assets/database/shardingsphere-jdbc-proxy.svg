<svg viewBox="0 0 680 288" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">ShardingSphere-JDBC 与 ShardingSphere-Proxy 部署形态</text>

  <!-- JDBC：应用进程内 -->
  <rect x="20" y="44" width="310" height="150" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="175" y="66" text-anchor="middle" fill="var(--p)" font-weight="700">Java 应用进程（JDBC 形态）</text>
  <rect x="40" y="80" width="270" height="34" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1.2"/>
  <text x="175" y="101" text-anchor="middle" fill="var(--fg)">业务代码 / MyBatis / JPA</text>
  <line class="arr" x1="175" y1="114" x2="175" y2="142"/>
  <rect x="40" y="144" width="270" height="36" rx="5" fill="var(--card)" stroke="var(--p)" stroke-width="1.2"/>
  <text x="175" y="166" text-anchor="middle" fill="var(--p)">ShardingSphere-JDBC（jar 内路由）</text>

  <!-- Proxy：独立进程 -->
  <rect x="350" y="44" width="310" height="60" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="505" y="68" text-anchor="middle" fill="var(--b)" font-weight="700">任意语言应用 / 命令行客户端</text>
  <text x="505" y="88" text-anchor="middle" fill="var(--muted)" font-size="11">按 MySQL / PostgreSQL 协议连接</text>
  <line class="arr" x1="505" y1="104" x2="505" y2="132"/>
  <rect x="350" y="134" width="310" height="60" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="505" y="158" text-anchor="middle" fill="var(--b)" font-weight="700">ShardingSphere-Proxy（独立进程）</text>
  <text x="505" y="178" text-anchor="middle" fill="var(--muted)" font-size="11">解析、路由、改写、归并</text>

  <!-- 数据库 -->
  <rect x="20" y="224" width="145" height="44" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="92" y="251" text-anchor="middle" fill="var(--g)">ds_0</text>
  <rect x="185" y="224" width="145" height="44" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="257" y="251" text-anchor="middle" fill="var(--g)">ds_1</text>
  <rect x="350" y="224" width="145" height="44" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="422" y="251" text-anchor="middle" fill="var(--g)">ds_0</text>
  <rect x="515" y="224" width="145" height="44" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="587" y="251" text-anchor="middle" fill="var(--g)">ds_1</text>

  <line class="arr" x1="92" y1="194" x2="92" y2="222"/>
  <line class="arr" x1="257" y1="194" x2="257" y2="222"/>
  <line class="arr" x1="422" y1="194" x2="422" y2="222"/>
  <line class="arr" x1="587" y1="194" x2="587" y2="222"/>
</svg>
