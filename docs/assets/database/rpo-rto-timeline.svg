<svg viewBox="0 0 680 278" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">RPO / RTO 时间线</text>

  <!-- Time axis -->
  <line x1="30" y1="110" x2="660" y2="110" stroke="var(--border)" stroke-width="2"/>
  <polygon points="656,106 664,110 656,114" fill="var(--border)"/>
  <text x="650" y="128" fill="var(--muted)" font-size="10">时间轴</text>

  <!-- Event points -->
  <!-- Last backup -->
  <line x1="100" y1="90" x2="100" y2="130" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" fill="var(--muted)" font-size="10">上次备份</text>
  <circle cx="100" cy="110" r="4" fill="var(--muted)"/>

  <!-- Disaster -->
  <line x1="300" y1="80" x2="300" y2="140" stroke="var(--r)" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="300" y="70" text-anchor="middle" fill="var(--r)" font-weight="700" font-size="11">故障发生</text>
  <circle cx="300" cy="110" r="5" fill="var(--r)"/>

  <!-- Service restored -->
  <line x1="520" y1="90" x2="520" y2="130" stroke="var(--g)" stroke-width="1.5"/>
  <text x="520" y="82" text-anchor="middle" fill="var(--g)" font-size="10">服务恢复</text>
  <circle cx="520" cy="110" r="4" fill="var(--g)"/>

  <!-- RPO brace -->
  <line x1="100" y1="148" x2="300" y2="148" stroke="var(--y)" stroke-width="2"/>
  <line x1="100" y1="142" x2="100" y2="154" stroke="var(--y)" stroke-width="2"/>
  <line x1="300" y1="142" x2="300" y2="154" stroke="var(--y)" stroke-width="2"/>
  <text x="200" y="166" text-anchor="middle" fill="var(--y)" font-weight="700" font-size="12">RPO</text>
  <text x="200" y="180" text-anchor="middle" fill="var(--y)" font-size="10">（最大可容忍数据丢失量）</text>
  <text x="200" y="194" text-anchor="middle" fill="var(--muted)" font-size="9">备份周期越短，RPO 越小</text>

  <!-- RTO brace -->
  <line x1="300" y1="148" x2="520" y2="148" stroke="var(--b)" stroke-width="2"/>
  <line x1="300" y1="142" x2="300" y2="154" stroke="var(--b)" stroke-width="2"/>
  <line x1="520" y1="142" x2="520" y2="154" stroke="var(--b)" stroke-width="2"/>
  <text x="410" y="166" text-anchor="middle" fill="var(--b)" font-weight="700" font-size="12">RTO</text>
  <text x="410" y="180" text-anchor="middle" fill="var(--b)" font-size="10">（最大可容忍停机时间）</text>
  <text x="410" y="194" text-anchor="middle" fill="var(--muted)" font-size="9">自动化程度越高，RTO 越短</text>

  <!-- Strategy table -->
  <rect x="30" y="210" width="620" height="42" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="226" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="11">备份策略与 RPO/RTO 对照</text>
  <text x="340" y="244" text-anchor="middle" fill="var(--fg)" font-size="10">冷备：RPO 小时级，RTO 小时级 ｜ 温备（日志传输）：RPO 分钟级，RTO 分钟级 ｜ 热备（同步复制）：RPO≈0，RTO 秒级</text>

  <!-- Data loss area fill -->
  <rect x="100" y="92" width="200" height="18" rx="2" fill="var(--y)" opacity="0.15"/>
  <text x="200" y="104" text-anchor="middle" fill="var(--y)" font-size="9">数据丢失区间</text>

  <!-- Downtime area fill -->
  <rect x="300" y="92" width="220" height="18" rx="2" fill="var(--b)" opacity="0.12"/>
  <text x="410" y="104" text-anchor="middle" fill="var(--b)" font-size="9">停机时间区间</text>
</svg>
