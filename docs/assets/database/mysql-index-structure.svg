<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .ttl { font-weight:700; font-size:13px; }
    .lbl { font-size:10px; fill:var(--muted); }
    .node { rx:4; ry:4; fill:var(--card); stroke-width:1.5; }
    .leaf { rx:4; ry:4; fill:var(--card); stroke-width:1.5; }
    .arr  { stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .chain { stroke-width:1; stroke-dasharray:3,2; fill:none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- ===== LEFT: 聚簇索引 ===== -->
  <text class="ttl" x="185" y="22" text-anchor="middle" fill="var(--b)">聚簇索引（主键索引）</text>
  <text class="lbl" x="185" y="36" text-anchor="middle">叶节点存储完整行数据</text>

  <!-- root node -->
  <rect class="node" x="110" y="48" width="150" height="30" stroke="var(--b)"/>
  <text x="185" y="66" text-anchor="middle" fill="var(--fg)">id=1 | id=50 | id=100</text>

  <!-- arrows down -->
  <line class="arr" x1="145" y1="82" x2="66" y2="106" stroke="var(--muted)"/>
  <line class="arr" x1="185" y1="78" x2="185" y2="110" stroke="var(--muted)"/>
  <line class="arr" x1="225" y1="82" x2="304" y2="106" stroke="var(--muted)"/>

  <!-- leaf nodes -->
  <rect class="leaf" x="10"  y="112" width="100" height="64" stroke="var(--b)"/>
  <text x="60" y="130" text-anchor="middle" fill="var(--fg)" font-size="11">id=1</text>
  <text x="60" y="146" text-anchor="middle" fill="var(--g)" font-size="10">Alice | 25 | ...</text>
  <text class="lbl" x="60" y="162" text-anchor="middle">完整行数据</text>

  <rect class="leaf" x="135" y="112" width="100" height="64" stroke="var(--b)"/>
  <text x="185" y="130" text-anchor="middle" fill="var(--fg)" font-size="11">id=50</text>
  <text x="185" y="146" text-anchor="middle" fill="var(--g)" font-size="10">Bob | 30 | ...</text>
  <text class="lbl" x="185" y="162" text-anchor="middle">完整行数据</text>

  <rect class="leaf" x="260" y="112" width="100" height="64" stroke="var(--b)"/>
  <text x="310" y="130" text-anchor="middle" fill="var(--fg)" font-size="11">id=100</text>
  <text x="310" y="146" text-anchor="middle" fill="var(--g)" font-size="10">Carol | 28 | ...</text>
  <text class="lbl" x="310" y="162" text-anchor="middle">完整行数据</text>

  <!-- leaf chain -->
  <line class="chain" x1="110" y1="144" x2="135" y2="144" stroke="var(--b)"/>
  <line class="chain" x1="235" y1="144" x2="260" y2="144" stroke="var(--b)"/>
  <text x="185" y="192" text-anchor="middle" fill="var(--muted)" font-size="10">← 叶节点双向链表，支持范围扫描 →</text>

  <!-- ===== Divider ===== -->
  <line x1="375" y1="15" x2="375" y2="280" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ===== RIGHT: 二级索引 ===== -->
  <text class="ttl" x="568" y="22" text-anchor="middle" fill="var(--p)">二级索引（非聚簇索引）</text>
  <text class="lbl" x="568" y="36" text-anchor="middle">叶节点存储 索引列 + 主键，不存完整行</text>

  <!-- root node -->
  <rect class="node" x="493" y="48" width="150" height="30" stroke="var(--p)"/>
  <text x="568" y="66" text-anchor="middle" fill="var(--fg)">Alice | Bob | Carol</text>

  <!-- arrows down -->
  <line class="arr" x1="528" y1="82" x2="449" y2="106" stroke="var(--muted)"/>
  <line class="arr" x1="568" y1="78" x2="568" y2="110" stroke="var(--muted)"/>
  <line class="arr" x1="608" y1="82" x2="687" y2="106" stroke="var(--muted)"/>

  <!-- leaf nodes -->
  <rect class="leaf" x="393" y="112" width="100" height="64" stroke="var(--p)"/>
  <text x="443" y="130" text-anchor="middle" fill="var(--fg)" font-size="11">name=Alice</text>
  <text x="443" y="146" text-anchor="middle" fill="var(--r)" font-size="10">→ 主键 id=1</text>
  <text class="lbl" x="443" y="162" text-anchor="middle">需回表取完整行</text>

  <rect class="leaf" x="518" y="112" width="100" height="64" stroke="var(--p)"/>
  <text x="568" y="130" text-anchor="middle" fill="var(--fg)" font-size="11">name=Bob</text>
  <text x="568" y="146" text-anchor="middle" fill="var(--r)" font-size="10">→ 主键 id=50</text>
  <text class="lbl" x="568" y="162" text-anchor="middle">需回表取完整行</text>

  <rect class="leaf" x="643" y="112" width="100" height="64" stroke="var(--p)"/>
  <text x="693" y="130" text-anchor="middle" fill="var(--fg)" font-size="11">name=Carol</text>
  <text x="693" y="146" text-anchor="middle" fill="var(--r)" font-size="10">→ 主键 id=100</text>
  <text class="lbl" x="693" y="162" text-anchor="middle">需回表取完整行</text>

  <!-- leaf chain -->
  <line class="chain" x1="493" y1="144" x2="518" y2="144" stroke="var(--p)"/>
  <line class="chain" x1="618" y1="144" x2="643" y2="144" stroke="var(--p)"/>
  <text x="568" y="192" text-anchor="middle" fill="var(--muted)" font-size="10">← 叶节点双向链表 →</text>

  <!-- ===== 底部注释：左右对称 ===== -->
  <rect x="30" y="216" width="320" height="64" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="190" y="234" text-anchor="middle" fill="var(--r)" font-weight="700" font-size="12">回表（Back to Table）</text>
  <text x="190" y="250" text-anchor="middle" fill="var(--fg)" font-size="11">二级索引 → 得到主键</text>
  <text x="190" y="266" text-anchor="middle" fill="var(--fg)" font-size="11">→ 聚簇索引再取完整行</text>

  <rect x="410" y="216" width="320" height="64" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="570" y="234" text-anchor="middle" fill="var(--g)" font-weight="700" font-size="12">覆盖索引：避免回表</text>
  <text x="570" y="252" text-anchor="middle" fill="var(--fg)" font-size="11">查询列已在索引中，Extra: Using index</text>
</svg>
