<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">MyBatis 初始化流程</text>

  <!-- Step 1 -->
  <rect class="box" x="10" y="50" width="130" height="54" stroke="var(--b)"/>
  <text x="75" y="70" text-anchor="middle" fill="var(--b)" font-weight="700">SqlSessionFactoryBuilder</text>
  <text x="75" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">读取 mybatis-config.xml</text>
  <text x="75" y="100" text-anchor="middle" fill="var(--fg)" font-size="10">或 Java 配置类</text>
  <line class="arr" x1="140" y1="77" x2="154" y2="77" stroke="var(--muted)"/>

  <!-- Step 2 -->
  <rect class="box" x="160" y="50" width="130" height="54" stroke="var(--y)"/>
  <text x="225" y="70" text-anchor="middle" fill="var(--y)" font-weight="700">XMLConfigBuilder</text>
  <text x="225" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">解析全局配置</text>
  <text x="225" y="100" text-anchor="middle" fill="var(--fg)" font-size="10">plugins / typeHandlers</text>
  <line class="arr" x1="290" y1="77" x2="304" y2="77" stroke="var(--muted)"/>

  <!-- Step 3 -->
  <rect class="box" x="310" y="50" width="130" height="54" stroke="var(--p)"/>
  <text x="375" y="70" text-anchor="middle" fill="var(--p)" font-weight="700">XMLMapperBuilder</text>
  <text x="375" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">解析 Mapper XML</text>
  <text x="375" y="100" text-anchor="middle" fill="var(--fg)" font-size="10">注册 MappedStatement</text>
  <line class="arr" x1="440" y1="77" x2="454" y2="77" stroke="var(--muted)"/>

  <!-- Step 4 -->
  <rect class="box" x="460" y="50" width="130" height="54" stroke="var(--g)"/>
  <text x="525" y="70" text-anchor="middle" fill="var(--g)" font-weight="700">Configuration</text>
  <text x="525" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">全局配置对象</text>
  <text x="525" y="100" text-anchor="middle" fill="var(--fg)" font-size="10">mappedStatements Map</text>
  <line class="arr" x1="590" y1="77" x2="604" y2="77" stroke="var(--muted)"/>

  <!-- Step 5 -->
  <rect class="box" x="610" y="50" width="60" height="54" stroke="var(--r)"/>
  <text x="640" y="70" text-anchor="middle" fill="var(--r)" font-weight="700">SqlSession</text>
  <text x="640" y="86" text-anchor="middle" fill="var(--fg)" font-size="9">Factory</text>
  <text x="640" y="100" text-anchor="middle" fill="var(--fg)" font-size="9">单例</text>

  <!-- Sub-flows -->
  <!-- Mapper XML contents -->
  <rect x="10" y="122" width="680" height="84" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="140" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="11">XMLMapperBuilder 解析内容</text>

  <rect x="20" y="148" width="130" height="20" rx="3" fill="var(--b)" opacity="0.15" stroke="var(--b)" stroke-width="1"/>
  <text x="85" y="162" text-anchor="middle" fill="var(--b)" font-size="10">namespace（接口全路径）</text>

  <rect x="160" y="148" width="130" height="20" rx="3" fill="var(--g)" opacity="0.15" stroke="var(--g)" stroke-width="1"/>
  <text x="225" y="162" text-anchor="middle" fill="var(--g)" font-size="10">resultMap（结果映射）</text>

  <rect x="300" y="148" width="130" height="20" rx="3" fill="var(--y)" opacity="0.15" stroke="var(--y)" stroke-width="1"/>
  <text x="365" y="162" text-anchor="middle" fill="var(--y)" font-size="10">SQL 片段（sql 标签）</text>

  <rect x="440" y="148" width="130" height="20" rx="3" fill="var(--p)" opacity="0.15" stroke="var(--p)" stroke-width="1"/>
  <text x="505" y="162" text-anchor="middle" fill="var(--p)" font-size="10">CRUD 语句 → MappedStatement</text>

  <rect x="580" y="148" width="100" height="20" rx="3" fill="var(--r)" opacity="0.15" stroke="var(--r)" stroke-width="1"/>
  <text x="630" y="162" text-anchor="middle" fill="var(--r)" font-size="10">动态 SQL（if/foreach）</text>

  <text x="340" y="196" text-anchor="middle" fill="var(--muted)" font-size="10">MapperRegistry 注册接口 → JDK 动态代理生成 Mapper 实现；Spring Boot 通过 @MapperScan 自动扫描</text>
</svg>
