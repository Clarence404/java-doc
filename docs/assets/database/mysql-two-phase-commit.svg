<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .grp { fill:var(--bg); stroke-width:1.5; }
    .box { fill:var(--card); stroke-width:1.5; }
    .arr { stroke:var(--muted); stroke-width:2; fill:none; marker-end:url(#a2pc); }
  </style>
  <defs>
    <marker id="a2pc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">redo / undo / binlog 与两阶段提交</text>

  <!-- 执行阶段 -->
  <rect class="grp" x="10" y="40" width="660" height="110" rx="8" stroke="var(--b)"/>
  <text x="340" y="60" text-anchor="middle" fill="var(--b)" font-weight="700">执行阶段：DML 执行时（尚未提交）</text>

  <rect class="box" x="22" y="72" width="150" height="60" rx="6" stroke="var(--p)"/>
  <text x="97" y="94" text-anchor="middle" fill="var(--p)" font-weight="600" font-size="11">① 写 undo log</text>
  <text x="97" y="114" text-anchor="middle" fill="var(--fg)" font-size="10">记录旧值，用于回滚与 MVCC</text>

  <rect class="box" x="184" y="72" width="150" height="60" rx="6" stroke="var(--b)"/>
  <text x="259" y="94" text-anchor="middle" fill="var(--b)" font-weight="600" font-size="11">② 修改 Buffer Pool</text>
  <text x="259" y="114" text-anchor="middle" fill="var(--fg)" font-size="10">数据页变为脏页</text>

  <rect class="box" x="346" y="72" width="150" height="60" rx="6" stroke="var(--b)"/>
  <text x="421" y="94" text-anchor="middle" fill="var(--b)" font-weight="600" font-size="11">③ 生成 redo</text>
  <text x="421" y="114" text-anchor="middle" fill="var(--fg)" font-size="10">写入 log buffer，不要求落盘</text>

  <rect class="box" x="508" y="72" width="150" height="60" rx="6" stroke="var(--y)"/>
  <text x="583" y="94" text-anchor="middle" fill="var(--y)" font-weight="600" font-size="11">④ 生成 binlog 事件</text>
  <text x="583" y="114" text-anchor="middle" fill="var(--fg)" font-size="10">写入会话 binlog cache</text>

  <!-- COMMIT -->
  <line class="arr" x1="340" y1="150" x2="340" y2="188"/>
  <text x="350" y="174" fill="var(--muted)" font-size="11" font-weight="600">COMMIT</text>

  <!-- 提交阶段 -->
  <rect class="grp" x="10" y="190" width="660" height="110" rx="8" stroke="var(--y)"/>
  <text x="340" y="210" text-anchor="middle" fill="var(--y)" font-weight="700">提交阶段：两阶段提交 + binlog 组提交</text>

  <rect class="box" x="22" y="222" width="136" height="60" rx="6" stroke="var(--b)"/>
  <text x="90" y="240" text-anchor="middle" fill="var(--b)" font-weight="600" font-size="11">① Prepare</text>
  <text x="90" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">InnoDB 标记 prepared</text>
  <text x="90" y="270" text-anchor="middle" fill="var(--fg)" font-size="10">记录 XID</text>

  <line class="arr" x1="158" y1="252" x2="186" y2="252"/>

  <rect class="box" x="188" y="222" width="136" height="60" rx="6" stroke="var(--y)"/>
  <text x="256" y="240" text-anchor="middle" fill="var(--y)" font-weight="600" font-size="11">② Flush</text>
  <text x="256" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">redo 刷盘</text>
  <text x="256" y="270" text-anchor="middle" fill="var(--fg)" font-size="10">binlog cache 写入文件</text>

  <line class="arr" x1="324" y1="252" x2="352" y2="252"/>

  <rect class="box" x="354" y="222" width="136" height="60" rx="6" stroke="var(--y)"/>
  <text x="422" y="240" text-anchor="middle" fill="var(--y)" font-weight="600" font-size="11">③ Sync</text>
  <text x="422" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">binlog 文件 fsync</text>
  <text x="422" y="270" text-anchor="middle" fill="var(--fg)" font-size="10">由 sync_binlog 控制</text>

  <line class="arr" x1="490" y1="252" x2="518" y2="252"/>

  <rect class="box" x="520" y="222" width="136" height="60" rx="6" stroke="var(--g)"/>
  <text x="588" y="240" text-anchor="middle" fill="var(--g)" font-weight="600" font-size="11">④ Commit</text>
  <text x="588" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">InnoDB 按 binlog 顺序提交</text>
  <text x="588" y="270" text-anchor="middle" fill="var(--fg)" font-size="10">释放锁</text>

  <!-- 宕机重启 -->
  <line class="arr" x1="340" y1="300" x2="340" y2="338"/>
  <text x="350" y="324" fill="var(--muted)" font-size="11" font-weight="600">宕机重启</text>

  <!-- 崩溃恢复 -->
  <rect class="grp" x="10" y="340" width="660" height="80" rx="8" stroke="var(--border)"/>
  <text x="340" y="360" text-anchor="middle" fill="var(--fg)" font-weight="700">崩溃恢复：以 binlog 中是否有该事务的 XID 为准</text>
  <text x="170" y="384" text-anchor="middle" fill="var(--g)" font-size="11">prepared + binlog 有 XID → 提交</text>
  <text x="510" y="384" text-anchor="middle" fill="var(--r)" font-size="11">prepared + binlog 无 XID → 回滚</text>
  <text x="340" y="404" text-anchor="middle" fill="var(--muted)" font-size="10">已 commit 的保持提交；未 prepare 的用 undo 回滚</text>
</svg>
