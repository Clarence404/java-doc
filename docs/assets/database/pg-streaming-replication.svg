<svg viewBox="0 0 690 362" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { fill:var(--card); stroke-width:1.5; }
    .arrow { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="345" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">流复制链路与 synchronous_commit 等待点</text>

  <text x="20" y="50" font-weight="700" fill="var(--b)">主库 Primary</text>

  <rect class="box" x="20" y="60" width="140" height="60" rx="6" stroke="var(--b)"/>
  <text x="90" y="82" text-anchor="middle" font-weight="600" fill="var(--fg)">后端进程</text>
  <text x="90" y="104" text-anchor="middle" font-size="11" fill="var(--muted)">生成 WAL 记录</text>

  <line class="arrow" x1="160" y1="90" x2="188" y2="90"/>

  <rect class="box" x="190" y="60" width="140" height="60" rx="6" stroke="var(--b)"/>
  <text x="260" y="82" text-anchor="middle" font-weight="600" fill="var(--fg)">WAL Buffers</text>
  <text x="260" y="104" text-anchor="middle" font-size="11" fill="var(--muted)">共享内存</text>

  <line class="arrow" x1="330" y1="90" x2="358" y2="90"/>

  <rect class="box" x="360" y="60" width="140" height="60" rx="6" stroke="var(--b)"/>
  <text x="430" y="82" text-anchor="middle" font-weight="600" fill="var(--fg)">pg_wal 段文件</text>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="var(--y)">① local：提交时刷盘</text>

  <line class="arrow" x1="500" y1="90" x2="528" y2="90"/>

  <rect class="box" x="530" y="60" width="140" height="60" rx="6" stroke="var(--b)"/>
  <text x="600" y="82" text-anchor="middle" font-weight="600" fill="var(--fg)">walsender</text>
  <text x="600" y="104" text-anchor="middle" font-size="11" fill="var(--muted)">读 WAL 发送</text>

  <line class="arrow" x1="600" y1="120" x2="600" y2="168"/>
  <text x="592" y="148" text-anchor="end" font-size="10" fill="var(--muted)">复制协议（TCP）</text>

  <text x="95" y="204" text-anchor="middle" font-weight="700" fill="var(--g)">备库 Standby</text>

  <rect class="box" x="530" y="170" width="140" height="60" rx="6" stroke="var(--g)"/>
  <text x="600" y="192" text-anchor="middle" font-weight="600" fill="var(--fg)">walreceiver</text>
  <text x="600" y="214" text-anchor="middle" font-size="11" fill="var(--y)">② remote_write</text>

  <line class="arrow" x1="530" y1="200" x2="502" y2="200"/>

  <rect class="box" x="360" y="170" width="140" height="60" rx="6" stroke="var(--g)"/>
  <text x="430" y="192" text-anchor="middle" font-weight="600" fill="var(--fg)">备库 pg_wal</text>
  <text x="430" y="214" text-anchor="middle" font-size="11" fill="var(--y)">③ on：已 flush</text>

  <line class="arrow" x1="360" y1="200" x2="332" y2="200"/>

  <rect class="box" x="190" y="170" width="140" height="60" rx="6" stroke="var(--g)"/>
  <text x="260" y="192" text-anchor="middle" font-weight="600" fill="var(--fg)">startup 进程</text>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="var(--y)">④ remote_apply</text>

  <rect class="box" x="20" y="280" width="650" height="62" rx="6" stroke="var(--border)"/>
  <text x="180" y="302" text-anchor="middle" font-size="11" fill="var(--fg)">① local：只等主库 WAL 落盘</text>
  <text x="510" y="302" text-anchor="middle" font-size="11" fill="var(--fg)">② remote_write：备库写入 OS 缓存</text>
  <text x="180" y="324" text-anchor="middle" font-size="11" fill="var(--fg)">③ on（默认）：备库 WAL 已落盘</text>
  <text x="510" y="324" text-anchor="middle" font-size="11" fill="var(--fg)">④ remote_apply：备库已重放、可读到</text>
</svg>
