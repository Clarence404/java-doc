<svg viewBox="0 0 814 252" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .txt   { font-size: 12px; }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>
  <text x="407.0" y="24" text-anchor="middle" class="title">MDL 阻塞链：一个长事务拖垮整张表</text>
  <rect x="20" y="44" width="168" height="78" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="104.0" y="68" text-anchor="middle" class="name">长事务</text>
  <text x="104.0" y="89" text-anchor="middle" class="desc">未提交的事务访问过 orders</text>
  <text x="104.0" y="106" text-anchor="middle" class="desc">一直持有 MDL 读锁</text>
  <line x1="188" y1="83.0" x2="220" y2="83.0" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <rect x="222" y="44" width="168" height="78" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="306.0" y="68" text-anchor="middle" class="name">ALTER TABLE orders</text>
  <text x="306.0" y="89" text-anchor="middle" class="desc">申请 MDL 写锁</text>
  <text x="306.0" y="106" text-anchor="middle" class="desc">被长事务阻塞，进入等待</text>
  <line x1="390" y1="83.0" x2="422" y2="83.0" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <rect x="424" y="44" width="168" height="78" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="508.0" y="68" text-anchor="middle" class="name">后续 SELECT / DML</text>
  <text x="508.0" y="89" text-anchor="middle" class="desc">申请 MDL 读锁</text>
  <text x="508.0" y="106" text-anchor="middle" class="desc">排在等待中的写锁之后</text>
  <line x1="592" y1="83.0" x2="624" y2="83.0" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <rect x="626" y="44" width="168" height="78" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="710.0" y="68" text-anchor="middle" class="name">连接堆积</text>
  <text x="710.0" y="89" text-anchor="middle" class="desc">请求全部挂起，连接池耗尽</text>
  <text x="710.0" y="106" text-anchor="middle" class="desc">整张表对业务不可用</text>
  <rect x="20" y="152" width="774" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="407.0" y="176" text-anchor="middle" class="name">对策</text>
  <text x="407.0" y="196" text-anchor="middle" class="desc">DDL 前先查长事务并处理 · 设置较短的 lock_wait_timeout，拿不到锁就放弃 · 放在低峰期执行</text>
</svg>
