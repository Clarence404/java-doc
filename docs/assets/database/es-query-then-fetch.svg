<svg viewBox="0 0 720 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Elasticsearch 查询两阶段：Query then Fetch</text>

  <text x="10" y="52" fill="var(--b)" font-weight="700" font-size="12">① Query 阶段：只拿 docID 与分数</text>

  <rect class="box" x="10" y="62" width="200" height="70" stroke="var(--b)"/>
  <text x="110" y="86" text-anchor="middle" fill="var(--b)" font-weight="700">协调节点</text>
  <text x="110" y="104" text-anchor="middle" fill="var(--fg)" font-size="10">把查询广播到每个分片</text>
  <text x="110" y="118" text-anchor="middle" fill="var(--muted)" font-size="10">每个分片选主或副本中的一份</text>

  <line class="arr" x1="210" y1="97" x2="258" y2="97"/>

  <rect class="box" x="260" y="62" width="200" height="70" stroke="var(--g)"/>
  <text x="360" y="86" text-anchor="middle" fill="var(--g)" font-weight="700">各分片本地执行</text>
  <text x="360" y="104" text-anchor="middle" fill="var(--fg)" font-size="10">倒排检索 + BM25 打分</text>
  <text x="360" y="118" text-anchor="middle" fill="var(--muted)" font-size="10">返回 from+size 个 docID 与分数</text>

  <line class="arr" x1="460" y1="97" x2="508" y2="97"/>

  <rect class="box" x="510" y="62" width="200" height="70" stroke="var(--b)"/>
  <text x="610" y="86" text-anchor="middle" fill="var(--b)" font-weight="700">协调节点合并</text>
  <text x="610" y="104" text-anchor="middle" fill="var(--fg)" font-size="10">按分数 / 排序字段全局排序</text>
  <text x="610" y="118" text-anchor="middle" fill="var(--muted)" font-size="10">只留下最终的 size 个 docID</text>

  <line class="arr" x1="610" y1="132" x2="610" y2="190"/>

  <text x="10" y="180" fill="var(--y)" font-weight="700" font-size="12">② Fetch 阶段：按 docID 取文档</text>

  <rect class="box" x="510" y="192" width="200" height="70" stroke="var(--b)"/>
  <text x="610" y="216" text-anchor="middle" fill="var(--b)" font-weight="700">协调节点</text>
  <text x="610" y="234" text-anchor="middle" fill="var(--fg)" font-size="10">按 docID 找到所属分片</text>
  <text x="610" y="248" text-anchor="middle" fill="var(--muted)" font-size="10">只向相关分片发 multi-get</text>

  <line class="arr" x1="510" y1="227" x2="462" y2="227"/>

  <rect class="box" x="260" y="192" width="200" height="70" stroke="var(--y)"/>
  <text x="360" y="216" text-anchor="middle" fill="var(--y)" font-weight="700">相关分片</text>
  <text x="360" y="234" text-anchor="middle" fill="var(--fg)" font-size="10">读取 _source</text>
  <text x="360" y="248" text-anchor="middle" fill="var(--muted)" font-size="10">生成高亮等附加内容</text>

  <line class="arr" x1="260" y1="227" x2="212" y2="227"/>

  <rect class="box" x="10" y="192" width="200" height="70" stroke="var(--b)"/>
  <text x="110" y="216" text-anchor="middle" fill="var(--b)" font-weight="700">协调节点</text>
  <text x="110" y="234" text-anchor="middle" fill="var(--fg)" font-size="10">按排序组装结果</text>
  <text x="110" y="248" text-anchor="middle" fill="var(--muted)" font-size="10">返回给客户端</text>

  <text x="360" y="290" text-anchor="middle" fill="var(--muted)" font-size="11">深分页代价：协调节点要排序「分片数 ×（from + size）」条记录，from 越大越慢</text>
</svg>
