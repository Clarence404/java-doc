<svg viewBox="0 0 760 176" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .seg { stroke-width:14; fill:none; }
    .tick { stroke:var(--muted); stroke-width:1; }
  </style>

  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">age(relfrozenxid) 增长时的保护阈值（默认值）</text>

  <text x="105" y="60" text-anchor="middle" font-size="11" fill="var(--g)">正常</text>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="var(--b)">强制反回卷 autovacuum</text>
  <text x="480" y="60" text-anchor="middle" font-size="11" fill="var(--y)">failsafe：跳过限速与索引清理</text>
  <text x="615" y="60" text-anchor="middle" font-size="11" fill="var(--r)">告警</text>
  <text x="690" y="60" text-anchor="middle" font-size="11" fill="var(--r)">停写</text>

  <line class="seg" x1="40" y1="80" x2="170" y2="80" stroke="var(--g)"/>
  <line class="seg" x1="170" y1="80" x2="390" y2="80" stroke="var(--b)"/>
  <line class="seg" x1="390" y1="80" x2="570" y2="80" stroke="var(--y)"/>
  <line class="seg" x1="570" y1="80" x2="660" y2="80" stroke="var(--r)" opacity="0.6"/>
  <line class="seg" x1="660" y1="80" x2="720" y2="80" stroke="var(--r)"/>

  <line class="tick" x1="40" y1="88" x2="40" y2="98"/>
  <line class="tick" x1="170" y1="88" x2="170" y2="98"/>
  <line class="tick" x1="390" y1="88" x2="390" y2="98"/>
  <line class="tick" x1="570" y1="88" x2="570" y2="98"/>
  <line class="tick" x1="660" y1="88" x2="660" y2="98"/>
  <line class="tick" x1="720" y1="88" x2="720" y2="98"/>

  <text x="40" y="114" text-anchor="middle" font-size="11" fill="var(--fg)">0</text>
  <text x="170" y="114" text-anchor="middle" font-size="11" fill="var(--fg)">2 亿</text>
  <text x="390" y="114" text-anchor="middle" font-size="11" fill="var(--fg)">16 亿</text>
  <text x="570" y="114" text-anchor="middle" font-size="11" fill="var(--fg)">剩 4000 万</text>
  <text x="660" y="114" text-anchor="middle" font-size="11" fill="var(--fg)">剩 300 万</text>
  <text x="720" y="114" text-anchor="middle" font-size="11" fill="var(--fg)">2^31</text>

  <text x="40" y="130" text-anchor="middle" font-size="10" fill="var(--muted)">刚冻结</text>
  <text x="170" y="130" text-anchor="middle" font-size="10" fill="var(--muted)">autovacuum_freeze_max_age</text>
  <text x="390" y="130" text-anchor="middle" font-size="10" fill="var(--muted)">vacuum_failsafe_age</text>
  <text x="570" y="130" text-anchor="middle" font-size="10" fill="var(--muted)">WARNING</text>
  <text x="660" y="130" text-anchor="middle" font-size="10" fill="var(--muted)">ERROR</text>

  <text x="380" y="158" text-anchor="middle" font-size="11" fill="var(--muted)">age = 当前 XID − relfrozenxid；示意图，刻度非等比例（PG 14 起的阈值）</text>
</svg>
