<svg viewBox="0 0 720 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">OceanBase 存储引擎：LSM 树变体</text>

  <!-- Write path -->
  <rect class="box" x="10" y="50" width="90" height="60" stroke="var(--muted)"/>
  <text x="55" y="66" text-anchor="middle" fill="var(--fg)" font-weight="600">写入请求</text>
  <text x="55" y="82" text-anchor="middle" fill="var(--muted)" font-size="10">DML / Redo Log</text>

  <line class="arr" x1="100" y1="80" x2="124" y2="80" stroke="var(--muted)"/>

  <!-- MemTable -->
  <rect class="box" x="126" y="40" width="130" height="84" stroke="var(--y)"/>
  <text x="191" y="62" text-anchor="middle" fill="var(--y)" font-weight="700">MemTable</text>
  <text x="191" y="78" text-anchor="middle" fill="var(--fg)" font-size="10">内存中（跳表有序）</text>
  <text x="191" y="112" text-anchor="middle" fill="var(--fg)" font-size="10">读写最新数据</text>

  <line class="arr" x1="256" y1="82" x2="284" y2="82" stroke="var(--muted)"/>
  <text x="271" y="76" text-anchor="middle" fill="var(--muted)" font-size="9">Flush</text>

  <!-- Minor SSTable -->
  <rect class="box" x="286" y="40" width="150" height="84" stroke="var(--b)"/>
  <text x="361" y="62" text-anchor="middle" fill="var(--b)" font-weight="700">Minor SSTable</text>
  <text x="361" y="78" text-anchor="middle" fill="var(--fg)" font-size="10">增量数据（磁盘）</text>
  <text x="361" y="112" text-anchor="middle" fill="var(--fg)" font-size="10">多个 Minor 文件并存</text>

  <line class="arr" x1="436" y1="82" x2="498" y2="82" stroke="var(--muted)"/>
  <text x="468" y="48" text-anchor="middle" fill="var(--muted)" font-size="9">Major</text>
  <text x="468" y="73" text-anchor="middle" fill="var(--muted)" font-size="9">Compaction</text>
  <text x="468" y="96" text-anchor="middle" fill="var(--muted)" font-size="9">（定期）</text>

  <!-- Major SSTable -->
  <rect class="box" x="500" y="40" width="210" height="84" stroke="var(--g)"/>
  <text x="605" y="62" text-anchor="middle" fill="var(--g)" font-weight="700">Major SSTable（基线）</text>
  <text x="605" y="78" text-anchor="middle" fill="var(--fg)" font-size="10">编码压缩（微块内行列混存）</text>
  <text x="605" y="112" text-anchor="middle" fill="var(--fg)" font-size="10">字典 / RLE / 差值等编码 + 通用压缩</text>

  <!-- Compression detail -->
  <rect x="10" y="144" width="700" height="96" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="360" y="162" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="11">压缩与混合存储策略</text>

  <rect x="20" y="170" width="206" height="28" rx="4" fill="var(--y)" opacity="0.15" stroke="var(--y)" stroke-width="1"/>
  <text x="126" y="186" text-anchor="middle" fill="var(--y)" font-weight="600" font-size="10">MemTable（行存）</text>

  <rect x="234" y="170" width="200" height="28" rx="4" fill="var(--b)" opacity="0.15" stroke="var(--b)" stroke-width="1"/>
  <text x="334" y="186" text-anchor="middle" fill="var(--b)" font-weight="600" font-size="10">Minor SSTable（行存增量）</text>

  <rect x="442" y="170" width="258" height="28" rx="4" fill="var(--g)" opacity="0.15" stroke="var(--g)" stroke-width="1"/>
  <text x="571" y="186" text-anchor="middle" fill="var(--g)" font-weight="600" font-size="10">Major SSTable（基线；4.3+ 可为列存）</text>

  <text x="360" y="213" text-anchor="middle" fill="var(--fg)" font-size="10">OLTP 点查：先查 MemTable → Minor SSTable → Major SSTable（读路径合并）</text>
  <text x="360" y="228" text-anchor="middle" fill="var(--muted)" font-size="10">OLAP 扫描：4.3+ 列存表 / 列存副本按列读基线，向量化执行；Major Compaction 时重新编码压缩基线</text>
</svg>
