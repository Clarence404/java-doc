<svg viewBox="0 0 720 276" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .tag { font-size:13px; font-weight:700; }
    .name { font-size:12px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-join" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="24" text-anchor="middle">MySQL JOIN 算法</text>

  <!-- NLJ -->
  <rect x="20" y="40" width="330" height="216" rx="10" fill="var(--bg)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="tag" x="185" y="62" text-anchor="middle" fill="var(--g)">Index Nested-Loop Join</text>

  <rect x="40" y="78" width="290" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="name" x="185" y="102" text-anchor="middle">驱动表（过滤后 N 行）</text>
  <text class="desc" x="185" y="122" text-anchor="middle">逐行取出关联字段的值</text>

  <line x1="185" y1="138" x2="185" y2="174" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-join)"/>
  <text class="label" x="195" y="160">用关联值查索引</text>

  <rect x="40" y="176" width="290" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="name" x="185" y="200" text-anchor="middle">被驱动表的 B+ 树索引</text>
  <text class="desc" x="185" y="220" text-anchor="middle">每行一次查找，代价约为 N × 树高</text>

  <!-- Hash Join -->
  <rect x="370" y="40" width="330" height="216" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="tag" x="535" y="62" text-anchor="middle" fill="var(--p)">Hash Join（8.0.20 起取代 BNL）</text>

  <rect x="390" y="78" width="135" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="name" x="457" y="102" text-anchor="middle">build 侧</text>
  <text class="desc" x="457" y="122" text-anchor="middle">较小的输入</text>

  <rect x="545" y="78" width="135" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="name" x="612" y="102" text-anchor="middle">probe 侧</text>
  <text class="desc" x="612" y="122" text-anchor="middle">较大的输入</text>

  <line x1="457" y1="138" x2="457" y2="174" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-join)"/>
  <text class="label" x="467" y="160">建哈希表</text>
  <line x1="612" y1="138" x2="612" y2="174" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-join)"/>
  <text class="label" x="622" y="160">逐行探测</text>

  <rect x="390" y="176" width="290" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="name" x="535" y="200" text-anchor="middle">join_buffer 中的哈希表</text>
  <text class="desc" x="535" y="220" text-anchor="middle">超出 join_buffer_size 时分片写入磁盘</text>
</svg>
