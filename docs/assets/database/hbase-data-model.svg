<svg viewBox="0 0 830 150" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { fill:var(--card); stroke-width:1.5; }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="415" y="24" text-anchor="middle" fill="var(--fg)" font-size="14" font-weight="700">HBase 数据模型：一个 Cell 的定位路径</text>
  <rect x="20" y="40" width="110" height="64" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="75" y="66" text-anchor="middle" fill="var(--p)" font-size="12" font-weight="700">Table</text>
  <text x="75" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">按 Region 切分</text>
  <line class="arr" x1="130" y1="72" x2="154" y2="72"/>
  <rect x="156" y="40" width="110" height="64" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="211" y="66" text-anchor="middle" fill="var(--b)" font-size="12" font-weight="700">RowKey</text>
  <text x="211" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">行键，字典序</text>
  <line class="arr" x1="266" y1="72" x2="290" y2="72"/>
  <rect x="292" y="40" width="110" height="64" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="347" y="66" text-anchor="middle" fill="var(--g)" font-size="12" font-weight="700">Column Family</text>
  <text x="347" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">列族，建表时定义</text>
  <line class="arr" x1="402" y1="72" x2="426" y2="72"/>
  <rect x="428" y="40" width="110" height="64" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="483" y="66" text-anchor="middle" fill="var(--g)" font-size="12" font-weight="700">Qualifier</text>
  <text x="483" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">列名，可动态增加</text>
  <line class="arr" x1="538" y1="72" x2="562" y2="72"/>
  <rect x="564" y="40" width="110" height="64" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="619" y="66" text-anchor="middle" fill="var(--y)" font-size="12" font-weight="700">Timestamp</text>
  <text x="619" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">版本号，多版本</text>
  <line class="arr" x1="674" y1="72" x2="698" y2="72"/>
  <rect x="700" y="40" width="110" height="64" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="755" y="66" text-anchor="middle" fill="var(--r)" font-size="12" font-weight="700">Value</text>
  <text x="755" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">字节数组 byte[]</text>
  <text x="415" y="132" text-anchor="middle" fill="var(--muted)" font-size="11">同一列族的数据存放在同一组 HFile 中；Cell = {RowKey, CF:Qualifier, Timestamp} → Value</text>
</svg>
