<svg viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
  </style>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">一次数据库调用经过的四层超时</text>

  <rect x="20" y="44" width="640" height="44" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="40" y="71" fill="var(--p)" font-weight="700">连接池：connectionTimeout / maxLifetime</text>
  <text x="650" y="71" text-anchor="end" fill="var(--muted)" font-size="11">借连接的等待时间、连接寿命</text>

  <rect x="20" y="98" width="640" height="44" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="40" y="125" fill="var(--b)" font-weight="700">驱动建连：connectTimeout</text>
  <text x="650" y="125" text-anchor="end" fill="var(--muted)" font-size="11">池补充新连接时的 TCP 握手与认证</text>

  <rect x="20" y="152" width="640" height="44" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="40" y="179" fill="var(--g)" font-weight="700">语句：queryTimeout</text>
  <text x="650" y="179" text-anchor="end" fill="var(--muted)" font-size="11">单条 SQL 执行时长，到期发 KILL QUERY</text>

  <rect x="20" y="206" width="640" height="44" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="40" y="233" fill="var(--y)" font-weight="700">驱动读写：socketTimeout</text>
  <text x="650" y="233" text-anchor="end" fill="var(--muted)" font-size="11">每次网络读的等待上限，网络分区时的兜底</text>
</svg>
