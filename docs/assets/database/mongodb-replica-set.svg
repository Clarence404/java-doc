<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
    .rep { stroke-width:1.5; stroke-dasharray:4,2; fill:none; marker-end:url(#ag); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--g)"/>
    </marker>
  </defs>

  <text x="310" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">MongoDB 副本集（Replica Set）</text>

  <!-- Client -->
  <rect class="box" x="10" y="96" width="90" height="38" stroke="var(--muted)"/>
  <text x="55" y="112" text-anchor="middle" fill="var(--fg)" font-weight="600">Client</text>
  <text x="55" y="127" text-anchor="middle" fill="var(--muted)" font-size="10">读写请求</text>

  <line class="arr" x1="100" y1="115" x2="142" y2="115" stroke="var(--muted)"/>

  <!-- Primary -->
  <rect class="box" x="148" y="74" width="160" height="80" stroke="var(--g)"/>
  <text x="228" y="94" text-anchor="middle" fill="var(--g)" font-weight="700" font-size="13">Primary</text>
  <text x="228" y="110" text-anchor="middle" fill="var(--fg)" font-size="11">接受所有写操作</text>
  <text x="228" y="126" text-anchor="middle" fill="var(--fg)" font-size="11">记录 oplog</text>
  <text x="228" y="142" text-anchor="middle" fill="var(--muted)" font-size="10">readPreference: primary</text>

  <!-- Replication arrows -->
  <line class="rep" x1="308" y1="100" x2="374" y2="70" stroke="var(--g)"/>
  <line class="rep" x1="308" y1="130" x2="374" y2="160" stroke="var(--g)"/>

  <!-- Secondary 1 -->
  <rect class="box" x="380" y="44" width="160" height="68" stroke="var(--b)"/>
  <text x="460" y="62" text-anchor="middle" fill="var(--b)" font-weight="700">Secondary 1</text>
  <text x="460" y="78" text-anchor="middle" fill="var(--fg)" font-size="11">异步复制 oplog</text>
  <text x="460" y="94" text-anchor="middle" fill="var(--fg)" font-size="11">可配置为只读节点</text>
  <text x="460" y="108" text-anchor="middle" fill="var(--muted)" font-size="10">secondaryPreferred</text>

  <!-- Secondary 2 -->
  <rect class="box" x="380" y="134" width="160" height="68" stroke="var(--b)"/>
  <text x="460" y="152" text-anchor="middle" fill="var(--b)" font-weight="700">Secondary 2</text>
  <text x="460" y="168" text-anchor="middle" fill="var(--fg)" font-size="11">异步复制 oplog</text>
  <text x="460" y="184" text-anchor="middle" fill="var(--fg)" font-size="11">可设为 Hidden / Delayed</text>
  <text x="460" y="198" text-anchor="middle" fill="var(--muted)" font-size="10">secondaryPreferred</text>

  <!-- Election annotation -->
  <rect x="10" y="184" width="340" height="60" rx="5" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="175" y="202" text-anchor="middle" fill="var(--r)" font-weight="700" font-size="11">自动故障切换（Raft 选举）</text>
  <text x="175" y="218" text-anchor="middle" fill="var(--fg)" font-size="10">Primary 宕机 → Secondary 投票选新 Primary → 恢复 &lt; 10s</text>
  <text x="175" y="230" text-anchor="middle" fill="var(--muted)" font-size="10">奇数节点（建议 3 / 5），保证多数派选举</text>

  <!-- oplog label -->
  <text x="332" y="85" text-anchor="middle" fill="var(--g)" font-size="10">oplog 复制</text>
  <text x="332" y="158" text-anchor="middle" fill="var(--g)" font-size="10">oplog 复制</text>
</svg>
