<svg viewBox="0 0 690 266" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12" role="img" aria-label="倍数扩容：2 个分片扩到 4 个，每个旧分片只迁出一半数据">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .pan { rx:8; ry:8; fill:var(--bg); stroke-width:1.5; }
    .ttl { font-weight:700; font-size:13px; }
    .sub { font-size:11px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="345" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">倍数扩容：2 分片 → 4 分片</text>
  <rect class="box" x="45" y="44" width="260" height="60" stroke="var(--p)"/>
  <text class="ttl" x="175" y="68" text-anchor="middle" fill="var(--p)">分片 0（h % 2 = 0）</text>
  <text class="sub" x="175" y="88" text-anchor="middle">h = 0, 2, 4, 6 …</text>
  <rect class="box" x="385" y="44" width="260" height="60" stroke="var(--p)"/>
  <text class="ttl" x="515" y="68" text-anchor="middle" fill="var(--p)">分片 1（h % 2 = 1）</text>
  <text class="sub" x="515" y="88" text-anchor="middle">h = 1, 3, 5, 7 …</text>
  <line class="arr" x1="130" y1="104" x2="91" y2="152"/>
  <line class="arr" x1="220" y1="104" x2="259" y2="152" stroke-dasharray="5 4"/>
  <line class="arr" x1="470" y1="104" x2="431" y2="152"/>
  <line class="arr" x1="560" y1="104" x2="599" y2="152" stroke-dasharray="5 4"/>
  <rect class="box" x="20" y="154" width="140" height="60" stroke="var(--g)"/>
  <text class="ttl" x="90" y="178" text-anchor="middle" fill="var(--g)">分片 0（保留）</text>
  <text class="sub" x="90" y="198" text-anchor="middle">h % 4 = 0：0, 4 …</text>
  <rect class="box" x="190" y="154" width="140" height="60" stroke="var(--b)"/>
  <text class="ttl" x="260" y="178" text-anchor="middle" fill="var(--b)">分片 2（新）</text>
  <text class="sub" x="260" y="198" text-anchor="middle">h % 4 = 2：2, 6 …</text>
  <rect class="box" x="360" y="154" width="140" height="60" stroke="var(--g)"/>
  <text class="ttl" x="430" y="178" text-anchor="middle" fill="var(--g)">分片 1（保留）</text>
  <text class="sub" x="430" y="198" text-anchor="middle">h % 4 = 1：1, 5 …</text>
  <rect class="box" x="530" y="154" width="140" height="60" stroke="var(--b)"/>
  <text class="ttl" x="600" y="178" text-anchor="middle" fill="var(--b)">分片 3（新）</text>
  <text class="sub" x="600" y="198" text-anchor="middle">h % 4 = 3：3, 7 …</text>
  <text class="sub" x="345" y="246" text-anchor="middle">虚线：新分片先作为旧分片的从库全量复制；切换路由后，两边各删掉不属于自己的一半</text>
</svg>
