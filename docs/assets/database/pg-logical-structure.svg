<svg viewBox="0 0 580 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .line { stroke-width:1.5; fill:none; }
  </style>

  <text x="290" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">PostgreSQL 逻辑结构</text>

  <!-- Instance -->
  <rect class="box" x="200" y="34" width="180" height="32" stroke="var(--b)"/>
  <text x="290" y="55" text-anchor="middle" fill="var(--b)" font-weight="700" font-size="13">PostgreSQL 实例</text>

  <line class="line" x1="290" y1="66" x2="290" y2="84" stroke="var(--border)"/>

  <!-- Database -->
  <rect class="box" x="190" y="84" width="200" height="30" stroke="var(--p)"/>
  <text x="290" y="104" text-anchor="middle" fill="var(--p)" font-weight="600">数据库（Database）</text>

  <line class="line" x1="290" y1="114" x2="290" y2="132" stroke="var(--border)"/>

  <!-- Schema -->
  <rect class="box" x="200" y="132" width="180" height="30" stroke="var(--g)"/>
  <text x="290" y="152" text-anchor="middle" fill="var(--g)" font-weight="600">模式（Schema）</text>

  <!-- Fan out to leaf nodes -->
  <line class="line" x1="290" y1="162" x2="290" y2="178" stroke="var(--border)"/>
  <line class="line" x1="80" y1="178" x2="500" y2="178" stroke="var(--border)"/>
  <line class="line" x1="80"  y1="178" x2="80"  y2="194" stroke="var(--border)"/>
  <line class="line" x1="200" y1="178" x2="200" y2="194" stroke="var(--border)"/>
  <line class="line" x1="290" y1="178" x2="290" y2="194" stroke="var(--border)"/>
  <line class="line" x1="395" y1="178" x2="395" y2="194" stroke="var(--border)"/>
  <line class="line" x1="500" y1="178" x2="500" y2="194" stroke="var(--border)"/>

  <!-- Table -->
  <rect class="box" x="30"  y="194" width="100" height="30" stroke="var(--y)"/>
  <text x="80"  y="214" text-anchor="middle" fill="var(--y)" font-weight="600">表（Table）</text>

  <!-- View -->
  <rect class="box" x="150" y="194" width="100" height="30" stroke="var(--muted)"/>
  <text x="200" y="214" text-anchor="middle" fill="var(--muted)" font-weight="600">视图（View）</text>

  <!-- Function -->
  <rect class="box" x="242" y="194" width="100" height="30" stroke="var(--muted)"/>
  <text x="292" y="214" text-anchor="middle" fill="var(--muted)" font-weight="600">函数（Function）</text>

  <!-- Sequence -->
  <rect class="box" x="348" y="194" width="96" height="30" stroke="var(--muted)"/>
  <text x="396" y="214" text-anchor="middle" fill="var(--muted)" font-weight="600">序列（Sequence）</text>

  <!-- Index -->
  <rect class="box" x="452" y="194" width="96" height="30" stroke="var(--muted)"/>
  <text x="500" y="214" text-anchor="middle" fill="var(--muted)" font-weight="600">索引（Index）</text>

  <!-- Annotations -->
  <rect x="30" y="236" width="520" height="18" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="290" y="249" text-anchor="middle" fill="var(--muted)" font-size="10">默认 Schema = public；多 Schema 实现多租户隔离 / 模块化管理 / 权限隔离</text>
</svg>
