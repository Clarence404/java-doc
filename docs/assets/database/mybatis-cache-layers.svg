<svg viewBox="0 0 700 390" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">MyBatis 查询的缓存查找顺序</text>

  <rect class="box" x="20" y="40" width="660" height="60" stroke="var(--p)"/>
  <text x="350" y="64" text-anchor="middle" fill="var(--p)" font-weight="700">CachingExecutor</text>
  <text x="350" y="82" text-anchor="middle" fill="var(--fg)" font-size="11">cacheEnabled 默认 true，newExecutor 总会用它包装 Simple / Reuse / Batch 执行器</text>
  <line class="arr" x1="350" y1="100" x2="350" y2="128"/>
  <text x="358" y="119" fill="var(--muted)" font-size="10">进入查询</text>

  <rect class="box" x="20" y="130" width="660" height="60" stroke="var(--y)"/>
  <text x="350" y="154" text-anchor="middle" fill="var(--y)" font-weight="700">二级缓存（namespace 级，跨 SqlSession）</text>
  <text x="350" y="172" text-anchor="middle" fill="var(--fg)" font-size="11">仅当 namespace 声明 &lt;cache/&gt; 且 useCache=true 时查询，命中直接返回</text>
  <line class="arr" x1="350" y1="190" x2="350" y2="218"/>
  <text x="358" y="209" fill="var(--muted)" font-size="10">未命中</text>

  <rect class="box" x="20" y="220" width="660" height="60" stroke="var(--b)"/>
  <text x="350" y="244" text-anchor="middle" fill="var(--b)" font-weight="700">一级缓存 localCache（BaseExecutor，SqlSession 级）</text>
  <text x="350" y="262" text-anchor="middle" fill="var(--fg)" font-size="11">默认 localCacheScope=SESSION；增删改、commit / rollback、flushCache=true 时清空</text>
  <line class="arr" x1="350" y1="280" x2="350" y2="308"/>
  <text x="358" y="299" fill="var(--muted)" font-size="10">未命中</text>

  <rect class="box" x="20" y="310" width="660" height="60" stroke="var(--g)"/>
  <text x="350" y="334" text-anchor="middle" fill="var(--g)" font-weight="700">queryFromDatabase（JDBC）</text>
  <text x="350" y="352" text-anchor="middle" fill="var(--fg)" font-size="11">结果先放入一级缓存；二级缓存的写入暂存在 TransactionalCache，事务提交时才生效</text>
</svg>
