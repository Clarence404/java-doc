<svg viewBox="0 0 700 452" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">TiDB 整体架构</text>

  <!-- HTAP tag -->
  <rect x="200" y="40" width="300" height="32" rx="5" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="350" y="59" text-anchor="middle" fill="var(--p)" font-size="11" font-weight="600">HTAP：同一份数据，同时支持 OLTP + OLAP</text>

  <!-- PD（调度中枢，顶层居中） -->
  <rect class="box" x="260" y="108" width="180" height="76" stroke="var(--y)"/>
  <text x="350" y="132" text-anchor="middle" fill="var(--y)" font-weight="700" font-size="11">PD（Placement Driver）</text>
  <text x="350" y="150" text-anchor="middle" fill="var(--fg)" font-size="10">Region 调度 / 负载均衡</text>
  <text x="350" y="166" text-anchor="middle" fill="var(--fg)" font-size="10">全局授时 TSO / 集群元数据</text>

  <!-- PD ↕ TiDB Server -->
  <line class="arr" x1="350" y1="184" x2="350" y2="220" stroke="var(--muted)"/>

  <!-- 中层：Client → TiDB Server -->
  <rect class="box" x="60" y="230" width="120" height="76" stroke="var(--muted)"/>
  <text x="120" y="262" text-anchor="middle" fill="var(--fg)" font-weight="600">Client</text>
  <text x="120" y="282" text-anchor="middle" fill="var(--muted)" font-size="10">MySQL 协议</text>

  <line class="arr" x1="180" y1="268" x2="248" y2="268" stroke="var(--muted)"/>

  <rect class="box" x="250" y="222" width="200" height="92" stroke="var(--b)"/>
  <text x="350" y="246" text-anchor="middle" fill="var(--b)" font-weight="700">TiDB Server</text>
  <text x="350" y="264" text-anchor="middle" fill="var(--fg)" font-size="10">无状态 SQL 解析层</text>
  <text x="350" y="280" text-anchor="middle" fill="var(--fg)" font-size="10">兼容 MySQL 8.0 协议</text>
  <text x="350" y="298" text-anchor="middle" fill="var(--fg)" font-size="10">查询优化 / 执行计划</text>

  <!-- TiDB → 存储层（对称斜箭头） -->
  <line class="arr" x1="307" y1="314" x2="237" y2="354" stroke="var(--muted)"/>
  <line class="arr" x1="393" y1="314" x2="463" y2="354" stroke="var(--muted)"/>

  <!-- 存储层：TiKV / TiFlash 左右对称 -->
  <rect class="box" x="60" y="356" width="270" height="76" stroke="var(--g)"/>
  <text x="195" y="378" text-anchor="middle" fill="var(--g)" font-weight="700">TiKV（行存 / OLTP）</text>
  <text x="195" y="396" text-anchor="middle" fill="var(--fg)" font-size="10">Raft 3 副本强一致，Region 256 MiB（8.4+）</text>
  <text x="195" y="412" text-anchor="middle" fill="var(--fg)" font-size="10">RocksDB 底层，Percolator 2PC 分布式事务</text>

  <rect class="box" x="370" y="356" width="270" height="76" stroke="var(--p)"/>
  <text x="505" y="378" text-anchor="middle" fill="var(--p)" font-weight="700">TiFlash（列存 / OLAP）</text>
  <text x="505" y="396" text-anchor="middle" fill="var(--fg)" font-size="10">异步 Raft Learner 从 TiKV 同步数据</text>
  <text x="505" y="412" text-anchor="middle" fill="var(--fg)" font-size="10">列式存储 + SIMD 向量化，聚合查询路由到此</text>
</svg>
