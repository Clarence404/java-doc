<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">TiDB 整体架构</text>

  <!-- Client -->
  <rect class="box" x="10" y="120" width="90" height="40" stroke="var(--muted)"/>
  <text x="55" y="136" text-anchor="middle" fill="var(--fg)" font-weight="600">Client</text>
  <text x="55" y="152" text-anchor="middle" fill="var(--muted)" font-size="10">MySQL 协议</text>

  <line class="arr" x1="100" y1="140" x2="135" y2="140" stroke="var(--muted)"/>

  <!-- TiDB Server -->
  <rect class="box" x="135" y="100" width="150" height="80" stroke="var(--b)"/>
  <text x="210" y="122" text-anchor="middle" fill="var(--b)" font-weight="700">TiDB Server</text>
  <text x="210" y="138" text-anchor="middle" fill="var(--fg)" font-size="10">无状态 SQL 解析层</text>
  <text x="210" y="152" text-anchor="middle" fill="var(--fg)" font-size="10">兼容 MySQL 5.7 协议</text>
  <text x="210" y="166" text-anchor="middle" fill="var(--fg)" font-size="10">查询优化 / 执行计划</text>

  <line class="arr" x1="285" y1="140" x2="325" y2="140" stroke="var(--muted)"/>

  <!-- PD -->
  <rect class="box" x="325" y="100" width="140" height="80" stroke="var(--y)"/>
  <text x="395" y="122" text-anchor="middle" fill="var(--y)" font-weight="700">PD（Placement Driver）</text>
  <text x="395" y="138" text-anchor="middle" fill="var(--fg)" font-size="10">Region 调度 / 负载均衡</text>
  <text x="395" y="152" text-anchor="middle" fill="var(--fg)" font-size="10">全局授时 TSO</text>
  <text x="395" y="166" text-anchor="middle" fill="var(--fg)" font-size="10">集群元数据管理</text>

  <!-- PD down to TiKV and TiFlash -->
  <line class="arr" x1="395" y1="180" x2="340" y2="218" stroke="var(--muted)"/>
  <line class="arr" x1="395" y1="180" x2="520" y2="218" stroke="var(--muted)"/>

  <!-- TiKV -->
  <rect class="box" x="220" y="220" width="230" height="66" stroke="var(--g)"/>
  <text x="335" y="240" text-anchor="middle" fill="var(--g)" font-weight="700">TiKV（行存 / OLTP）</text>
  <text x="335" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">Raft 协议，3 副本强一致</text>
  <text x="335" y="270" text-anchor="middle" fill="var(--fg)" font-size="10">Region 96MB，RocksDB 底层</text>
  <text x="335" y="284" text-anchor="middle" fill="var(--fg)" font-size="10">Percolator 2PC 分布式事务</text>

  <!-- TiFlash -->
  <rect class="box" x="470" y="220" width="220" height="66" stroke="var(--p)"/>
  <text x="580" y="240" text-anchor="middle" fill="var(--p)" font-weight="700">TiFlash（列存 / OLAP）</text>
  <text x="580" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">异步 Raft Learner 同步</text>
  <text x="580" y="270" text-anchor="middle" fill="var(--fg)" font-size="10">列式存储，SIMD 向量化执行</text>
  <text x="580" y="284" text-anchor="middle" fill="var(--fg)" font-size="10">聚合查询路由到此</text>

  <!-- HTAP tag -->
  <rect x="380" y="42" width="300" height="26" rx="5" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="530" y="60" text-anchor="middle" fill="var(--p)" font-size="11" font-weight="600">HTAP：同一份数据，同时支持 OLTP + OLAP</text>
</svg>
