<svg viewBox="0 0 720 464" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .ttl { font-weight:700; font-size:13px; }
    .box { rx:5; ry:5; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
    .lbl { font-size:10px; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="20" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Index Condition Pushdown (ICP)</text>
  <text x="360" y="36" text-anchor="middle" font-size="11" fill="var(--muted)">联合索引 idx_name_age(name, age)，查询：WHERE name LIKE 'A%' AND age = 18</text>

  <!-- ===== LEFT: 无 ICP ===== -->
  <text class="ttl" x="180" y="60" text-anchor="middle" fill="var(--r)">无 ICP（5.6 之前）</text>

  <rect class="box" x="30" y="72" width="300" height="78" stroke="var(--b)"/>
  <text x="180" y="94" text-anchor="middle" fill="var(--b)" font-weight="600" font-size="11">存储引擎（InnoDB）</text>
  <text x="180" y="120" text-anchor="middle" fill="var(--fg)" font-size="11">索引扫描：name LIKE 'A%' 命中 N 行</text>

  <line class="arr" x1="180" y1="150" x2="180" y2="190" stroke="var(--muted)"/>
  <text class="lbl" x="192" y="172" fill="var(--r)">全部回表</text>

  <rect class="box" x="30" y="192" width="300" height="64" stroke="var(--r)"/>
  <text x="180" y="216" text-anchor="middle" fill="var(--r)" font-weight="600" font-size="11">回表（聚簇索引）× N 次</text>
  <text x="180" y="238" text-anchor="middle" fill="var(--fg)" font-size="11">取出 N 条完整行，传给 Server 层</text>

  <line class="arr" x1="180" y1="256" x2="180" y2="296" stroke="var(--muted)"/>

  <rect class="box" x="30" y="298" width="300" height="64" stroke="var(--muted)"/>
  <text x="180" y="322" text-anchor="middle" fill="var(--muted)" font-weight="600" font-size="11">Server 层</text>
  <text x="180" y="344" text-anchor="middle" fill="var(--fg)" font-size="11">再过滤 age = 18，丢弃不符合行</text>

  <rect x="30" y="404" width="300" height="40" rx="4" fill="var(--card)" stroke="var(--r)" stroke-width="1"/>
  <text x="180" y="429" text-anchor="middle" fill="var(--r)" font-size="11">回表次数 = name 命中行数（较多）</text>

  <!-- Divider -->
  <line x1="360" y1="50" x2="360" y2="444" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ===== RIGHT: 有 ICP ===== -->
  <text class="ttl" x="540" y="60" text-anchor="middle" fill="var(--g)">有 ICP（MySQL 5.6+）</text>

  <rect class="box" x="390" y="72" width="300" height="78" stroke="var(--b)"/>
  <text x="540" y="94" text-anchor="middle" fill="var(--b)" font-weight="600" font-size="11">存储引擎（InnoDB）</text>
  <text x="540" y="114" text-anchor="middle" fill="var(--fg)" font-size="11">索引扫描时同时检查 age = 18</text>
  <text x="540" y="134" text-anchor="middle" fill="var(--g)" font-size="11">不满足 → 直接跳过，不回表</text>

  <line class="arr" x1="540" y1="150" x2="540" y2="190" stroke="var(--muted)"/>
  <text class="lbl" x="552" y="172" fill="var(--g)">仅满足条件</text>

  <rect class="box" x="390" y="192" width="300" height="64" stroke="var(--g)"/>
  <text x="540" y="216" text-anchor="middle" fill="var(--g)" font-weight="600" font-size="11">回表（聚簇索引）× M 次</text>
  <text x="540" y="238" text-anchor="middle" fill="var(--fg)" font-size="11">M ≪ N，只回表真正需要的行</text>

  <line class="arr" x1="540" y1="256" x2="540" y2="296" stroke="var(--muted)"/>

  <rect class="box" x="390" y="298" width="300" height="64" stroke="var(--muted)"/>
  <text x="540" y="334" text-anchor="middle" fill="var(--fg)" font-size="11">Server 层：结果已过滤，直接返回</text>

  <rect x="390" y="404" width="300" height="40" rx="4" fill="var(--card)" stroke="var(--g)" stroke-width="1"/>
  <text x="540" y="429" text-anchor="middle" fill="var(--g)" font-size="11">EXPLAIN Extra: Using index condition</text>
</svg>
