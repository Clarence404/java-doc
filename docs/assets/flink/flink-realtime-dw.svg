<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">实时数仓分层（Kafka / Paimon）</text>
  <rect x="20" y="44" width="680" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="360" y="68" text-anchor="middle" class="name">数据源</text>
  <text x="190" y="90" text-anchor="middle" class="desc">MySQL binlog（Flink CDC）</text>
  <text x="530" y="90" text-anchor="middle" class="desc">App 埋点日志（Kafka）</text>
  <line x1="360" y1="104" x2="360" y2="136" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="138" width="680" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="360" y="162" text-anchor="middle" class="name">ODS 原始层</text>
  <text x="190" y="184" text-anchor="middle" class="desc">Kafka 主题 / Paimon 追加表</text>
  <text x="530" y="184" text-anchor="middle" class="desc">保持原貌，可回放</text>
  <line x1="360" y1="198" x2="360" y2="230" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="232" width="680" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="360" y="256" text-anchor="middle" class="name">DWD 明细层</text>
  <text x="190" y="278" text-anchor="middle" class="desc">清洗、去重、关联维度打宽</text>
  <text x="530" y="278" text-anchor="middle" class="desc">Paimon 主键表，产出 changelog</text>
  <line x1="360" y1="292" x2="360" y2="324" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="326" width="680" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="360" y="350" text-anchor="middle" class="name">DWS 汇总层</text>
  <text x="190" y="372" text-anchor="middle" class="desc">按主题、粒度轻度聚合</text>
  <text x="530" y="372" text-anchor="middle" class="desc">Paimon 聚合表或 Doris</text>
  <line x1="360" y1="386" x2="360" y2="418" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="420" width="680" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="360" y="444" text-anchor="middle" class="name">ADS 应用层</text>
  <text x="190" y="466" text-anchor="middle" class="desc">Doris / StarRocks 对外查询</text>
  <text x="530" y="466" text-anchor="middle" class="desc">大屏、报表、接口</text>
</svg>
