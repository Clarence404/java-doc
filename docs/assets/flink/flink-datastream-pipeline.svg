<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">典型 DataStream 作业拓扑</text>

  <!-- 主链路 -->
  <rect x="20" y="44" width="110" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="75" y="68" text-anchor="middle" class="name">KafkaSource</text>
  <text x="75" y="88" text-anchor="middle" class="desc">反序列化 / 水位线</text>
  <rect x="162" y="44" width="110" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="217" y="68" text-anchor="middle" class="name">process</text>
  <text x="217" y="88" text-anchor="middle" class="desc">解析 / 清洗</text>
  <rect x="304" y="44" width="110" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="359" y="68" text-anchor="middle" class="name">Async I/O</text>
  <text x="359" y="88" text-anchor="middle" class="desc">查维表补字段</text>
  <rect x="446" y="44" width="110" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="501" y="68" text-anchor="middle" class="name">keyBy + 窗口</text>
  <text x="501" y="88" text-anchor="middle" class="desc">增量聚合</text>
  <rect x="588" y="44" width="110" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="643" y="68" text-anchor="middle" class="name">KafkaSink</text>
  <text x="643" y="88" text-anchor="middle" class="desc">事务写出</text>

  <line x1="130" y1="74" x2="160" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="272" y1="74" x2="302" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="414" y1="74" x2="444" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="556" y1="74" x2="586" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 旁路 -->
  <line x1="217" y1="104" x2="217" y2="148" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="131" class="lbl">侧输出</text>
  <line x1="359" y1="104" x2="359" y2="148" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="367" y="131" class="lbl">异步查询</text>
  <line x1="501" y1="104" x2="501" y2="148" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="509" y="131" class="lbl">迟到数据</text>

  <rect x="162" y="150" width="110" height="60" rx="4" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="217" y="174" text-anchor="middle" class="name">脏数据</text>
  <text x="217" y="194" text-anchor="middle" class="desc">写 DLQ topic</text>
  <rect x="304" y="150" width="110" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="359" y="174" text-anchor="middle" class="name">Redis / MySQL</text>
  <text x="359" y="194" text-anchor="middle" class="desc">异步客户端</text>
  <rect x="446" y="150" width="110" height="60" rx="4" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="501" y="174" text-anchor="middle" class="name">迟到流</text>
  <text x="501" y="194" text-anchor="middle" class="desc">补偿 / 对账</text>
</svg>
