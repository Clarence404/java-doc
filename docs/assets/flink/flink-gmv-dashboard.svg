<svg viewBox="0 0 720 172" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">实时 GMV 大屏</text>
  <rect x="20" y="44" width="112" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="76" y="70" text-anchor="middle" class="name">订单服务</text>
  <text x="76" y="90" text-anchor="middle" class="desc">支付成功写 Kafka</text>
  <rect x="162" y="44" width="112" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="218" y="70" text-anchor="middle" class="name">Kafka</text>
  <text x="218" y="90" text-anchor="middle" class="desc">order_paid 主题</text>
  <rect x="304" y="44" width="112" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="360" y="70" text-anchor="middle" class="name">Flink SQL</text>
  <text x="360" y="90" text-anchor="middle" class="desc">CUMULATE 窗口</text>
  <rect x="446" y="44" width="112" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="502" y="70" text-anchor="middle" class="name">Redis / Doris</text>
  <text x="502" y="90" text-anchor="middle" class="desc">upsert 结果表</text>
  <rect x="588" y="44" width="112" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="644" y="70" text-anchor="middle" class="name">大屏</text>
  <text x="644" y="90" text-anchor="middle" class="desc">按分钟拉取</text>
  <line x1="132" y1="74" x2="160" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="274" y1="74" x2="302" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="416" y1="74" x2="444" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="558" y1="74" x2="586" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="360" y="132" text-anchor="middle" class="lbl">事件时间 + 水位线保证分钟口径准确；迟到数据走侧输出或离线校准</text>
</svg>
