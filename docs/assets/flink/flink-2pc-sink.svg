<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">两阶段提交 Sink 与 Checkpoint 的配合</text>

  <rect x="20" y="44" width="140" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="90" y="68" text-anchor="middle" class="name">开启事务</text>
  <text x="90" y="88" text-anchor="middle" class="desc">数据写入当前事务</text>
  <rect x="200" y="44" width="140" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="270" y="68" text-anchor="middle" class="name">预提交</text>
  <text x="270" y="88" text-anchor="middle" class="desc">barrier 到达：flush</text>
  <rect x="380" y="44" width="140" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" class="name">Checkpoint 完成</text>
  <text x="450" y="88" text-anchor="middle" class="desc">所有算子 ack</text>
  <rect x="560" y="44" width="140" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="630" y="68" text-anchor="middle" class="name">提交事务</text>
  <text x="630" y="88" text-anchor="middle" class="desc">下游读到数据</text>

  <line x1="160" y1="74" x2="198" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="74" x2="378" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="74" x2="558" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="270" y1="104" x2="270" y2="148" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="278" y="131" class="lbl">任一步失败</text>

  <rect x="200" y="150" width="500" height="60" rx="4" fill="var(--r)" fill-opacity="0.08" stroke="var(--r)" stroke-width="1.5"/>
  <text x="450" y="172" text-anchor="middle" class="name">从上一个成功的 Checkpoint 恢复</text>
  <text x="325" y="194" text-anchor="middle" class="desc">未进入快照的事务：abort 丢弃</text>
  <text x="575" y="194" text-anchor="middle" class="desc">已在快照中的事务：重新 commit</text>
</svg>
