<svg viewBox="0 0 760 248" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .t { font-weight: 700; font-size: 14px; }
    .s { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 12px; fill: var(--muted); }
    .ttl { font-weight: 700; font-size: 14px; }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="760" height="248" fill="var(--bg)" rx="8"/>
  <rect x="20" y="20" width="160" height="64" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="100" y="48" text-anchor="middle" class="t" fill="var(--b)">无 key</text>
  <text x="100" y="66" text-anchor="middle" class="s">首次请求</text>
  <rect x="300" y="20" width="160" height="64" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="380" y="48" text-anchor="middle" class="t" fill="var(--y)">PROCESSING</text>
  <text x="380" y="66" text-anchor="middle" class="s">短 TTL</text>
  <rect x="580" y="20" width="160" height="64" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="660" y="48" text-anchor="middle" class="t" fill="var(--g)">DONE</text>
  <text x="660" y="66" text-anchor="middle" class="s">长 TTL，存首次结果</text>
  <line x1="180" y1="52.0" x2="298" y2="52.0" class="arrow"/>
  <text x="239" y="46" text-anchor="middle" class="lbl">SET NX EX</text>
  <line x1="460" y1="52.0" x2="578" y2="52.0" class="arrow"/>
  <text x="519" y="46" text-anchor="middle" class="lbl">成功：覆盖为 DONE</text>
  <path d="M380,84 L380,124 L100,124 L100,86" class="arrow"/>
  <text x="240" y="142" text-anchor="middle" class="lbl">失败：DEL 释放占位 / 崩溃后 TTL 过期</text>
  <rect x="20" y="164" width="340" height="64" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="190" y="192" text-anchor="middle" class="t" fill="var(--y)">重复请求遇到 PROCESSING</text>
  <text x="190" y="210" text-anchor="middle" class="s">返回「处理中」，MQ 不确认、等待重投</text>
  <rect x="400" y="164" width="340" height="64" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="570" y="192" text-anchor="middle" class="t" fill="var(--g)">重复请求遇到 DONE</text>
  <text x="570" y="210" text-anchor="middle" class="s">直接返回首次结果，MQ 确认消息</text>
</svg>
