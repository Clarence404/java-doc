<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .t { font-weight: 700; font-size: 14px; }
    .s { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 12px; fill: var(--muted); }
    .ttl { font-weight: 700; font-size: 14px; }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="720" height="230" fill="var(--bg)" rx="8"/>
  <rect x="20" y="20" width="180" height="70" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="110" y="51" text-anchor="middle" class="t" fill="var(--b)">业务应用</text>
  <text x="110" y="69" text-anchor="middle" class="s">只写热库，代码不变</text>
  <rect x="270" y="20" width="180" height="70" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="360" y="51" text-anchor="middle" class="t" fill="var(--g)">MySQL 热库</text>
  <text x="360" y="69" text-anchor="middle" class="s">近 3 个月数据</text>
  <rect x="520" y="20" width="180" height="70" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="610" y="51" text-anchor="middle" class="t" fill="var(--p)">CDC 采集</text>
  <text x="610" y="69" text-anchor="middle" class="s">Canal / Debezium</text>
  <rect x="20" y="140" width="180" height="70" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="110" y="171" text-anchor="middle" class="t" fill="var(--y)">冷存储</text>
  <text x="110" y="189" text-anchor="middle" class="s">ClickHouse / OSS 湖表</text>
  <rect x="270" y="140" width="180" height="70" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="360" y="171" text-anchor="middle" class="t" fill="var(--p)">归档消费者</text>
  <text x="360" y="189" text-anchor="middle" class="s">按主键幂等 upsert</text>
  <rect x="520" y="140" width="180" height="70" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="610" y="171" text-anchor="middle" class="t" fill="var(--b)">Kafka</text>
  <text x="610" y="189" text-anchor="middle" class="s">变更事件</text>
  <line x1="200" y1="55.0" x2="268" y2="55.0" class="arrow"/>
  <text x="234" y="49" text-anchor="middle" class="lbl">写入</text>
  <line x1="450" y1="55.0" x2="518" y2="55.0" class="arrow"/>
  <text x="484" y="49" text-anchor="middle" class="lbl">binlog</text>
  <line x1="610.0" y1="90" x2="610.0" y2="138" class="arrow"/>
  <text x="620" y="119" text-anchor="start" class="lbl">投递</text>
  <line x1="520" y1="175.0" x2="452" y2="175.0" class="arrow"/>
  <text x="486" y="169" text-anchor="middle" class="lbl">写入冷库</text>
  <line x1="270" y1="175.0" x2="202" y2="175.0" class="arrow"/>
  <text x="236" y="169" text-anchor="middle" class="lbl">消费</text>
</svg>
