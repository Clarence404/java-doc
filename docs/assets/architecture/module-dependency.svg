<svg viewBox="0 0 640 408" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .title { font-weight: 700; font-size: 14px; }
    .name { font-weight: 700; font-size: 13px; }
    .sub { font-size: 11px; fill: var(--muted); }
    .arrow { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="640" height="408" fill="var(--bg)" rx="8"/>

  <text x="320" y="26" class="title" text-anchor="middle">模块依赖方向（箭头指向被依赖的模块）</text>

  <!-- 第一行：启动模块 -->
  <rect x="230" y="44" width="180" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="320" y="68" class="name" text-anchor="middle" fill="var(--p)">order-start</text>
  <text x="320" y="88" class="sub" text-anchor="middle">启动类 · 配置 · 可执行 jar</text>

  <!-- 第二行 -->
  <rect x="20" y="144" width="170" height="60" rx="6" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="105" y="168" class="name" text-anchor="middle">其他服务</text>
  <text x="105" y="188" class="sub" text-anchor="middle">只引用 order-api</text>

  <rect x="235" y="144" width="170" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="320" y="168" class="name" text-anchor="middle" fill="var(--b)">order-server</text>
  <text x="320" y="188" class="sub" text-anchor="middle">Controller · 应用服务</text>

  <rect x="450" y="144" width="170" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="535" y="168" class="name" text-anchor="middle" fill="var(--y)">order-infrastructure</text>
  <text x="535" y="188" class="sub" text-anchor="middle">Mapper · MQ · 外部客户端</text>

  <!-- 第三行 -->
  <rect x="20" y="244" width="170" height="60" rx="6" fill="var(--b)" fill-opacity="0.06" stroke="var(--b)" stroke-width="1.5"/>
  <text x="105" y="268" class="name" text-anchor="middle" fill="var(--b)">order-api</text>
  <text x="105" y="288" class="sub" text-anchor="middle">DTO · 接口契约 · 错误码</text>

  <rect x="235" y="244" width="170" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="320" y="268" class="name" text-anchor="middle" fill="var(--g)">order-domain</text>
  <text x="320" y="288" class="sub" text-anchor="middle">实体 · 规则 · 仓储接口</text>

  <!-- 第四行：公共模块 -->
  <rect x="20" y="344" width="600" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="320" y="371" class="sub" text-anchor="middle">order-common：各模块都可依赖的工具与常量（箭头省略），保持越薄越好</text>

  <!-- 箭头 -->
  <line x1="320" y1="104" x2="320" y2="142" class="arrow"/>
  <line x1="400" y1="104" x2="486" y2="142" class="arrow"/>
  <line x1="105" y1="204" x2="105" y2="242" class="arrow"/>
  <line x1="270" y1="204" x2="152" y2="242" class="arrow"/>
  <line x1="320" y1="204" x2="320" y2="242" class="arrow"/>
  <line x1="490" y1="204" x2="392" y2="242" class="arrow"/>
</svg>
