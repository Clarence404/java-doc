<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .t { font-weight: 700; font-size: 14px; }
    .s { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 12px; fill: var(--muted); }
    .ttl { font-weight: 700; font-size: 14px; }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="720" height="240" fill="var(--bg)" rx="8"/>
  <rect x="20" y="20" width="160" height="200" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="100" y="116" text-anchor="middle" class="t" fill="var(--b)">客户端</text>
  <text x="100" y="134" text-anchor="middle" class="s">浏览器 / App</text>
  <rect x="440" y="20" width="260" height="80" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="570" y="47" text-anchor="middle" class="t" fill="var(--p)">业务服务</text>
  <text x="570" y="65" text-anchor="middle" class="s">鉴权、校验类型与大小</text>
  <text x="570" y="83" text-anchor="middle" class="s">生成 objectKey 并签发 URL</text>
  <rect x="440" y="140" width="260" height="80" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="570" y="167" text-anchor="middle" class="t" fill="var(--g)">对象存储</text>
  <text x="570" y="185" text-anchor="middle" class="s">私有 Bucket</text>
  <text x="570" y="203" text-anchor="middle" class="s">事件通知 / 生命周期规则</text>
  <line x1="180" y1="60" x2="438" y2="60" class="arrow"/>
  <text x="309" y="54" text-anchor="middle" class="lbl">① 申请上传（文件名 / 大小 / 类型）</text>
  <text x="309" y="80" text-anchor="middle" class="lbl">② 响应：预签名 URL + objectKey</text>
  <line x1="180" y1="180" x2="438" y2="180" class="arrow"/>
  <text x="309" y="174" text-anchor="middle" class="lbl">③ PUT 直传，流量不经业务服务</text>
  <line x1="570" y1="140" x2="570" y2="102" class="arrow"/>
  <text x="580" y="125" text-anchor="start" class="lbl">④ 完成通知 / 回调</text>
</svg>
