<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" class="title">访问者模式的双分派</text>
  <rect x="40" y="50" width="200" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="140" y="76" text-anchor="middle" class="name">Client</text>
  <text x="140" y="96" text-anchor="middle" class="desc">调用方</text>
  <line x1="140" y1="110" x2="140" y2="320" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="290" y="50" width="200" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="390" y="76" text-anchor="middle" class="name">TravelExpense</text>
  <text x="390" y="96" text-anchor="middle" class="desc">元素（Element）</text>
  <line x1="390" y1="110" x2="390" y2="320" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="540" y="50" width="200" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="640" y="76" text-anchor="middle" class="name">AuditReportVisitor</text>
  <text x="640" y="96" text-anchor="middle" class="desc">访问者（Visitor）</text>
  <line x1="640" y1="110" x2="640" y2="320" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="140" y1="170" x2="388" y2="170" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="264" y="162" text-anchor="middle" class="lbl">1. item.accept(visitor)</text>
  <line x1="390" y1="230" x2="638" y2="230" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="514" y="222" text-anchor="middle" class="lbl">2. visitor.visit(this)</text>
  <line x1="640" y1="290" x2="142" y2="290" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="391" y="282" text-anchor="middle" class="lbl">3. 返回，结果累积在访问者内部</text>
  <rect x="40" y="330" width="700" height="80" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="390" y="356" text-anchor="middle" class="name">两次分派</text>
  <text x="390" y="376" text-anchor="middle" class="desc">第一次：accept() 是虚方法，按元素的运行时类型选中 TravelExpense.accept</text>
  <text x="390" y="394" text-anchor="middle" class="desc">第二次：visit() 按访问者的运行时类型分派，重载版本由 this 的静态类型在编译期选定</text>
</svg>
