<svg viewBox="0 0 760 510" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
    .sec   { font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="tri" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="var(--card)" stroke="var(--fg)" stroke-width="0.8"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" class="title">适配器模式：对象适配器与类适配器</text>
  <text x="30" y="58" text-anchor="start" class="sec">对象适配器（组合，推荐）</text>
  <rect x="30" y="72" width="180" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="120" y="96" text-anchor="middle" class="name">Client</text>
  <text x="120" y="116" text-anchor="middle" class="desc">只依赖 Target</text>
  <rect x="290" y="72" width="200" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="390" y="96" text-anchor="middle" class="name">Target（目标接口）</text>
  <text x="390" y="116" text-anchor="middle" class="desc">send(to, content)</text>
  <rect x="290" y="182" width="200" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="390" y="206" text-anchor="middle" class="name">Adapter</text>
  <text x="390" y="226" text-anchor="middle" class="desc">实现 Target，持有 Adaptee</text>
  <rect x="550" y="182" width="180" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="640" y="206" text-anchor="middle" class="name">Adaptee（被适配者）</text>
  <text x="640" y="226" text-anchor="middle" class="desc">sendSms(...) 三方 SDK</text>
  <line x1="210" y1="102" x2="288" y2="102" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="249" y="94" text-anchor="middle" class="lbl">调用</text>
  <line x1="390" y1="182" x2="390" y2="134" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#tri)"/>
  <line x1="490" y1="212" x2="548" y2="212" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="519" y="204" text-anchor="middle" class="lbl">委托</text>
  <text x="30" y="288" text-anchor="start" class="sec">类适配器（继承，受单继承限制）</text>
  <rect x="150" y="302" width="200" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="250" y="326" text-anchor="middle" class="name">Target（目标接口）</text>
  <text x="250" y="346" text-anchor="middle" class="desc">send(to, content)</text>
  <rect x="430" y="302" width="200" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="530" y="326" text-anchor="middle" class="name">Adaptee（被适配者）</text>
  <text x="530" y="346" text-anchor="middle" class="desc">sendSms(...)</text>
  <rect x="290" y="402" width="200" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="390" y="426" text-anchor="middle" class="name">Adapter</text>
  <text x="390" y="446" text-anchor="middle" class="desc">extends Adaptee implements Target</text>
  <path d="M350,402 L350,382 L250,382 L250,364" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#tri)"/>
  <path d="M430,402 L430,382 L530,382 L530,364" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#tri)"/>
  <path d="M199.5,486 L239.5,486" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="249.5" y="490" text-anchor="start" class="lbl">继承</text>
  <path d="M301.5,486 L341.5,486" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#tri)"/>
  <text x="351.5" y="490" text-anchor="start" class="lbl">实现</text>
  <path d="M403.5,486 L443.5,486" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="453.5" y="490" text-anchor="start" class="lbl">调用 / 委托</text>
</svg>
