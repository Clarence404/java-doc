<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--p)"/>
    </marker>
    <marker id="arrm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="420" y="26" text-anchor="middle" class="title">命令模式的角色（订单操作）</text>
  <rect x="30" y="80" width="180" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="120" y="106" text-anchor="middle" class="name">Client</text>
  <text x="120" y="126" text-anchor="middle" class="desc">组装命令并注入 Receiver</text>
  <rect x="300" y="80" width="200" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="400" y="106" text-anchor="middle" class="name">CommandExecutor</text>
  <text x="400" y="126" text-anchor="middle" class="desc">Invoker：执行并记录历史</text>
  <rect x="590" y="80" width="220" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="700" y="106" text-anchor="middle" class="name">OrderCommand（接口）</text>
  <text x="700" y="126" text-anchor="middle" class="desc">Command：execute() / undo()</text>
  <rect x="430" y="210" width="170" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="515" y="236" text-anchor="middle" class="name">PlaceOrderCommand</text>
  <text x="515" y="256" text-anchor="middle" class="desc">记录 orderId 以便撤销</text>
  <rect x="640" y="210" width="170" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="725" y="236" text-anchor="middle" class="name">PayOrderCommand</text>
  <text x="725" y="256" text-anchor="middle" class="desc">记录 paymentId</text>
  <rect x="430" y="340" width="170" height="60" rx="6" fill="var(--muted)" fill-opacity="0.10" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="515" y="366" text-anchor="middle" class="name">OrderService</text>
  <text x="515" y="386" text-anchor="middle" class="desc">Receiver：真正干活</text>
  <rect x="640" y="340" width="170" height="60" rx="6" fill="var(--muted)" fill-opacity="0.10" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="725" y="366" text-anchor="middle" class="name">PaymentService</text>
  <text x="725" y="386" text-anchor="middle" class="desc">Receiver：真正干活</text>
  <line x1="210" y1="110" x2="298" y2="110" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="254" y="103" text-anchor="middle" class="lbl">提交命令</text>
  <line x1="500" y1="110" x2="588" y2="110" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="544" y="103" text-anchor="middle" class="lbl">execute()</text>
  <path d="M515,210 L515,175 L660,175 L660,142" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="725" y1="210" x2="725" y2="142" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="515" y1="270" x2="515" y2="338" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="524" y="308" text-anchor="start" class="lbl">调用</text>
  <line x1="725" y1="270" x2="725" y2="338" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="734" y="308" text-anchor="start" class="lbl">调用</text>
  <path d="M120,140 L120,240 L428,240" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrm)"/>
  <text x="274" y="233" text-anchor="middle" class="lbl">new 命令（注入 Receiver）</text>
  <line x1="30" y1="52" x2="60" y2="52" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="68" y="56" text-anchor="start" class="lbl">持有 / 调用</text>
  <line x1="190" y1="52" x2="220" y2="52" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="228" y="56" text-anchor="start" class="lbl">实现 / 继承</text>
  <line x1="350" y1="52" x2="380" y2="52" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrm)"/>
  <text x="388" y="56" text-anchor="start" class="lbl">创建 / 返回（依赖）</text>
</svg>
