<svg viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
    .sec   { font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="tri" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="var(--card)" stroke="var(--fg)" stroke-width="0.8"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" class="title">单例模式的角色</text>
  <rect x="40" y="85" width="180" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="130" y="109" text-anchor="middle" class="name">Client</text>
  <text x="130" y="129" text-anchor="middle" class="desc">任意调用方</text>
  <rect x="360" y="50" width="280" height="130" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="500" y="74" text-anchor="middle" class="name">Singleton</text>
  <line x1="360" y1="86" x2="640" y2="86" stroke="var(--b)" stroke-width="1"/>
  <text x="500" y="106" text-anchor="middle" class="desc">- static final INSTANCE : Singleton</text>
  <line x1="360" y1="118" x2="640" y2="118" stroke="var(--b)" stroke-width="1"/>
  <text x="500" y="140" text-anchor="middle" class="desc">- Singleton()  私有构造，外部不能 new</text>
  <text x="500" y="160" text-anchor="middle" class="desc">+ static getInstance() : Singleton</text>
  <line x1="220" y1="115" x2="358" y2="115" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="289" y="107" text-anchor="middle" class="lbl">getInstance()</text>
  <text x="340" y="210" text-anchor="middle" class="lbl">唯一性的范围是「一个 ClassLoader 内」；Spring 单例是「一个容器内、一个 bean 名一份」</text>
</svg>
