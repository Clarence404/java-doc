<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" class="title">(isAdmin OR isOwner) AND NOT isBanned 的语法树</text>
  <text x="20" y="70" text-anchor="start" class="lbl" style="fill:var(--p)">紫色：非终结符表达式</text>
  <text x="20" y="90" text-anchor="start" class="lbl" style="fill:var(--g)">绿色：终结符表达式</text>
  <rect x="290" y="50" width="200" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="390" y="76" text-anchor="middle" class="name">And</text>
  <text x="390" y="96" text-anchor="middle" class="desc">left &amp;&amp; right</text>
  <rect x="110" y="150" width="200" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="210" y="176" text-anchor="middle" class="name">Or</text>
  <text x="210" y="196" text-anchor="middle" class="desc">left || right</text>
  <rect x="470" y="150" width="200" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="570" y="176" text-anchor="middle" class="name">Not</text>
  <text x="570" y="196" text-anchor="middle" class="desc">!expr</text>
  <rect x="20" y="250" width="180" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="110" y="276" text-anchor="middle" class="name">Var("isAdmin")</text>
  <text x="110" y="296" text-anchor="middle" class="desc">从上下文取值</text>
  <rect x="220" y="250" width="180" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="310" y="276" text-anchor="middle" class="name">Var("isOwner")</text>
  <text x="310" y="296" text-anchor="middle" class="desc">从上下文取值</text>
  <rect x="480" y="250" width="180" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="570" y="276" text-anchor="middle" class="name">Var("isBanned")</text>
  <text x="570" y="296" text-anchor="middle" class="desc">从上下文取值</text>
  <path d="M390,110 L390,130 L210,130 L210,148" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M390,130 L570,130 L570,148" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M210,210 L210,230 L110,230 L110,248" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M210,230 L310,230 L310,248" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="210" x2="570" y2="248" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
