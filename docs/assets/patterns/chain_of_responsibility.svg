<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--p)"/>
    </marker>
    <marker id="arrm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" class="title">责任链模式的角色（报销审批）</text>
  <rect x="30" y="80" width="180" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="120" y="106" text-anchor="middle" class="name">Client</text>
  <text x="120" y="126" text-anchor="middle" class="desc">只把请求交给链头</text>
  <rect x="270" y="80" width="220" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="380" y="106" text-anchor="middle" class="name">Approver（抽象类）</text>
  <text x="380" y="126" text-anchor="middle" class="desc">Handler：持有 next</text>
  <rect x="40" y="210" width="200" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="140" y="236" text-anchor="middle" class="name">TeamLeaderApprover</text>
  <text x="140" y="256" text-anchor="middle" class="desc">组长：1,000 元以内</text>
  <rect x="280" y="210" width="200" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="380" y="236" text-anchor="middle" class="name">ManagerApprover</text>
  <text x="380" y="256" text-anchor="middle" class="desc">经理：5,000 元以内</text>
  <rect x="520" y="210" width="200" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="620" y="236" text-anchor="middle" class="name">DirectorApprover</text>
  <text x="620" y="256" text-anchor="middle" class="desc">总监：20,000 元以内</text>
  <line x1="210" y1="110" x2="268" y2="110" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="239" y="103" text-anchor="middle" class="lbl">approve()</text>
  <path d="M490,98 L540,98 L540,122 L492,122" fill="none" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="548" y="114" text-anchor="start" class="lbl">next</text>
  <path d="M140,210 L140,175 L340,175 L340,142" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="210" x2="380" y2="142" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M620,210 L620,175 L420,175 L420,142" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="30" y1="52" x2="60" y2="52" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="68" y="56" text-anchor="start" class="lbl">持有 / 调用</text>
  <line x1="190" y1="52" x2="220" y2="52" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="228" y="56" text-anchor="start" class="lbl">实现 / 继承</text>
</svg>
