<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--p)"/>
    </marker>
    <marker id="arrm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" class="title">享元模式的角色（字体样式）</text>
  <rect x="40" y="80" width="200" height="200" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="140" y="176" text-anchor="middle" class="name">Client</text>
  <text x="140" y="196" text-anchor="middle" class="desc">保存外部状态：坐标、文字</text>
  <rect x="400" y="80" width="320" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="560" y="106" text-anchor="middle" class="name">FontStyleFactory</text>
  <text x="560" y="126" text-anchor="middle" class="desc">FlyweightFactory：Map 缓存池</text>
  <rect x="400" y="220" width="320" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="560" y="246" text-anchor="middle" class="name">FontStyle（享元，不可变）</text>
  <text x="560" y="266" text-anchor="middle" class="desc">内部状态：字体名 / 字号 / 颜色</text>
  <line x1="240" y1="110" x2="398" y2="110" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="319" y="103" text-anchor="middle" class="lbl">getFont()</text>
  <line x1="240" y1="250" x2="398" y2="250" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="319" y="243" text-anchor="middle" class="lbl">render(x, y, text)</text>
  <line x1="560" y1="140" x2="560" y2="218" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrm)"/>
  <text x="569" y="183" text-anchor="start" class="lbl">缓存未命中才创建，命中直接复用</text>
  <line x1="30" y1="52" x2="60" y2="52" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="68" y="56" text-anchor="start" class="lbl">持有 / 调用</text>
  <line x1="190" y1="52" x2="220" y2="52" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrm)"/>
  <text x="228" y="56" text-anchor="start" class="lbl">创建 / 返回（依赖）</text>
</svg>
