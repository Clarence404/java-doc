<svg viewBox="0 0 860 304" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:12px; fill:var(--fg); }
  </style>
  <defs>
    <marker id="arrow-media-latency" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="430" y="24" text-anchor="middle">各协议典型端到端延迟（对数刻度，取决于 GOP、切片与播放器缓冲）</text>
  <line x1="200" y1="40" x2="200" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="200" y="262" text-anchor="middle">0.1 s</text>
  <line x1="266" y1="40" x2="266" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="266" y="262" text-anchor="middle">0.2 s</text>
  <line x1="352" y1="40" x2="352" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="352" y="262" text-anchor="middle">0.5 s</text>
  <line x1="418" y1="40" x2="418" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="418" y="262" text-anchor="middle">1 s</text>
  <line x1="484" y1="40" x2="484" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="484" y="262" text-anchor="middle">2 s</text>
  <line x1="570" y1="40" x2="570" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="570" y="262" text-anchor="middle">5 s</text>
  <line x1="636" y1="40" x2="636" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="636" y="262" text-anchor="middle">10 s</text>
  <line x1="740" y1="40" x2="740" y2="244" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="desc" x="740" y="262" text-anchor="middle">30 s</text>
  <line x1="200" y1="244" x2="740" y2="244" stroke="var(--muted)" stroke-width="1"/>
  <text class="label" x="190" y="62" text-anchor="end">WebRTC</text>
  <rect x="200" y="44" width="152" height="26" rx="5" fill="var(--g)" fill-opacity="0.25" stroke="var(--g)" stroke-width="1.5"/>
  <text class="desc" x="360" y="61">0.1–0.5 s</text>
  <text class="label" x="190" y="102" text-anchor="end">SRT</text>
  <rect x="304" y="84" width="114" height="26" rx="5" fill="var(--g)" fill-opacity="0.25" stroke="var(--g)" stroke-width="1.5"/>
  <text class="desc" x="426" y="101">0.3–1 s（可调）</text>
  <text class="label" x="190" y="142" text-anchor="end">RTMP / HTTP-FLV</text>
  <rect x="418" y="124" width="104" height="26" rx="5" fill="var(--b)" fill-opacity="0.25" stroke="var(--b)" stroke-width="1.5"/>
  <text class="desc" x="530" y="141">1–3 s</text>
  <text class="label" x="190" y="182" text-anchor="end">LL-HLS / LL-DASH</text>
  <rect x="484" y="164" width="86" height="26" rx="5" fill="var(--y)" fill-opacity="0.25" stroke="var(--y)" stroke-width="1.5"/>
  <text class="desc" x="578" y="181">2–5 s</text>
  <text class="label" x="190" y="222" text-anchor="end">HLS / DASH</text>
  <rect x="588" y="204" width="152" height="26" rx="5" fill="var(--r)" fill-opacity="0.25" stroke="var(--r)" stroke-width="1.5"/>
  <text class="desc" x="748" y="221">6–30 s</text>
  <text class="desc" x="470" y="286" text-anchor="middle">端到端延迟 = 采集编码 + 上行传输 + 服务器处理 + 分发 + 播放器缓冲</text>
</svg>
