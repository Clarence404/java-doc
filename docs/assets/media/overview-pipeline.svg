<svg viewBox="0 0 860 262" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:12px; fill:var(--fg); }
  </style>
  <defs>
    <marker id="arrow-media-pipeline" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="430" y="24" text-anchor="middle">音视频全链路：媒体面走流媒体服务器，控制面由 Java 后端负责</text>
  <rect x="12" y="44" width="116" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="70" y="70" text-anchor="middle">采集</text>
  <text class="desc" x="70" y="92" text-anchor="middle">摄像头、麦克风、屏幕</text>
  <rect x="156" y="44" width="116" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="214" y="70" text-anchor="middle">编码</text>
  <text class="desc" x="214" y="92" text-anchor="middle">H.264 / AAC / Opus</text>
  <rect x="300" y="44" width="116" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="358" y="70" text-anchor="middle">推流</text>
  <text class="desc" x="358" y="92" text-anchor="middle">RTMP / SRT / WHIP</text>
  <rect x="444" y="44" width="116" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="502" y="70" text-anchor="middle">流媒体服务器</text>
  <text class="desc" x="502" y="92" text-anchor="middle">转封装 / 转码 / 录制</text>
  <rect x="588" y="44" width="116" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="646" y="70" text-anchor="middle">分发</text>
  <text class="desc" x="646" y="92" text-anchor="middle">CDN / 边缘节点</text>
  <rect x="732" y="44" width="116" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="790" y="70" text-anchor="middle">播放</text>
  <text class="desc" x="790" y="92" text-anchor="middle">HLS、FLV、WebRTC</text>
  <line x1="128" y1="76" x2="154" y2="76" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-pipeline)"/>
  <line x1="272" y1="76" x2="298" y2="76" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-pipeline)"/>
  <line x1="416" y1="76" x2="442" y2="76" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-pipeline)"/>
  <line x1="560" y1="76" x2="586" y2="76" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-pipeline)"/>
  <line x1="704" y1="76" x2="730" y2="76" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-pipeline)"/>
  <rect x="12" y="150" width="836" height="92" rx="10" fill="var(--bg)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="430" y="174" text-anchor="middle">Java 业务后端（控制面：不碰音视频数据本身）</text>
  <text class="label" x="221" y="200" text-anchor="middle">推流 / 播放地址签发与鉴权</text>
  <text class="label" x="639" y="200" text-anchor="middle">Hook 回调：开播、断流、录制完成</text>
  <text class="label" x="221" y="224" text-anchor="middle">转码 / 截图 / 审核任务编排</text>
  <text class="label" x="639" y="224" text-anchor="middle">房间状态、计费与数据统计</text>
  <line x1="358" y1="150" x2="358" y2="110" stroke="var(--b)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-media-pipeline)"/>
  <text class="desc" x="364" y="132" text-anchor="start">签发地址</text>
  <line x1="502" y1="150" x2="502" y2="110" stroke="var(--b)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-media-pipeline)"/>
  <text class="desc" x="508" y="132" text-anchor="start">Hook 回调</text>
  <line x1="790" y1="150" x2="790" y2="110" stroke="var(--b)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-media-pipeline)"/>
  <text class="desc" x="784" y="132" text-anchor="end">播放鉴权</text>
</svg>
