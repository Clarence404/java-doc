<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12" role="img" aria-label="同步请求响应与事件驱动的依赖方向对比">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .pan { rx:8; ry:8; fill:var(--bg); stroke:var(--border); stroke-width:1.5; }
    .ttl { font-weight:700; font-size:13px; }
    .sub { font-size:11px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect class="pan" x="20" y="20" width="310" height="270"/>
  <text class="ttl" x="175" y="44" text-anchor="middle" fill="var(--b)">同步请求响应</text>
  <rect class="box" x="105" y="60" width="140" height="36" stroke="var(--b)"/>
  <text x="175" y="83" text-anchor="middle" fill="var(--fg)">订单服务</text>
  <line class="arr" x1="150" y1="96" x2="77" y2="124"/>
  <line class="arr" x1="175" y1="96" x2="175" y2="124"/>
  <line class="arr" x1="200" y1="96" x2="273" y2="124"/>
  <rect class="box" x="30" y="126" width="90" height="36" stroke="var(--muted)"/>
  <text x="75" y="149" text-anchor="middle" fill="var(--fg)">库存服务</text>
  <rect class="box" x="130" y="126" width="90" height="36" stroke="var(--muted)"/>
  <text x="175" y="149" text-anchor="middle" fill="var(--fg)">积分服务</text>
  <rect class="box" x="230" y="126" width="90" height="36" stroke="var(--muted)"/>
  <text x="275" y="149" text-anchor="middle" fill="var(--fg)">通知服务</text>
  <text class="sub" x="175" y="250" text-anchor="middle">订单服务直接调用并等待每个下游</text>
  <text class="sub" x="175" y="270" text-anchor="middle">任一下游变慢或不可用都会拖住下单</text>

  <rect class="pan" x="350" y="20" width="310" height="270"/>
  <text class="ttl" x="505" y="44" text-anchor="middle" fill="var(--g)">事件驱动</text>
  <rect class="box" x="435" y="60" width="140" height="36" stroke="var(--g)"/>
  <text x="505" y="83" text-anchor="middle" fill="var(--fg)">订单服务</text>
  <line class="arr" x1="505" y1="96" x2="505" y2="124"/>
  <rect class="box" x="415" y="126" width="180" height="36" stroke="var(--y)"/>
  <text x="505" y="149" text-anchor="middle" fill="var(--fg)">消息队列 · OrderPaid</text>
  <line class="arr" x1="480" y1="162" x2="407" y2="190"/>
  <line class="arr" x1="505" y1="162" x2="505" y2="190"/>
  <line class="arr" x1="530" y1="162" x2="603" y2="190"/>
  <rect class="box" x="360" y="192" width="90" height="36" stroke="var(--muted)"/>
  <text x="405" y="215" text-anchor="middle" fill="var(--fg)">库存服务</text>
  <rect class="box" x="460" y="192" width="90" height="36" stroke="var(--muted)"/>
  <text x="505" y="215" text-anchor="middle" fill="var(--fg)">积分服务</text>
  <rect class="box" x="560" y="192" width="90" height="36" stroke="var(--muted)"/>
  <text x="605" y="215" text-anchor="middle" fill="var(--fg)">通知服务</text>
  <text class="sub" x="505" y="250" text-anchor="middle">订单只发布已发生的事实，不认识订阅方</text>
  <text class="sub" x="505" y="270" text-anchor="middle">新增下游只需订阅，代价是最终一致</text>
</svg>
