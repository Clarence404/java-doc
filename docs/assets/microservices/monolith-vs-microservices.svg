<svg viewBox="0 0 660 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box  { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .mod  { rx:4; ry:4; fill:var(--card); stroke-width:1; }
    .ttl  { font-weight:700; font-size:13px; }
    .sub  { font-size:10px; fill:var(--muted); }
    .arr  { stroke-width:2; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- 单体 -->
  <rect class="box" x="10" y="20" width="240" height="163" stroke="var(--r)"/>
  <text class="ttl" x="130" y="44" text-anchor="middle" fill="var(--r)">单体应用</text>
  <rect class="mod" x="30" y="56"  width="200" height="26" stroke="var(--muted)"/>
  <text x="130" y="74" text-anchor="middle" fill="var(--fg)" font-size="12">用户模块</text>
  <rect class="mod" x="30" y="88"  width="200" height="26" stroke="var(--muted)"/>
  <text x="130" y="106" text-anchor="middle" fill="var(--fg)" font-size="12">商品模块</text>
  <rect class="mod" x="30" y="120" width="200" height="26" stroke="var(--muted)"/>
  <text x="130" y="138" text-anchor="middle" fill="var(--fg)" font-size="12">订单模块</text>
  <rect class="mod" x="30" y="152" width="200" height="24" stroke="var(--muted)"/>
  <text x="130" y="164" text-anchor="middle" fill="var(--muted)" font-size="10">一个进程，统一部署，统一扩展</text>

  <!-- 箭头 -->
  <line class="arr" x1="260" y1="97" x2="300" y2="97" stroke="var(--muted)"/>
  <text x="280" y="88" text-anchor="middle" fill="var(--muted)" font-size="10">拆分</text>

  <!-- 微服务 -->
  <text class="ttl" x="480" y="18" text-anchor="middle" fill="var(--g)">微服务架构</text>

  <rect class="box" x="310" y="28" width="160" height="40" stroke="var(--g)"/>
  <text x="390" y="44" text-anchor="middle" fill="var(--g)" font-size="12" font-weight="600">用户服务</text>
  <text class="sub" x="390" y="60" text-anchor="middle">独立部署 · 独立扩展</text>

  <rect class="box" x="490" y="28" width="160" height="40" stroke="var(--b)"/>
  <text x="570" y="44" text-anchor="middle" fill="var(--b)" font-size="12" font-weight="600">商品服务</text>
  <text class="sub" x="570" y="60" text-anchor="middle">独立部署 · 独立扩展</text>

  <rect class="box" x="310" y="80" width="160" height="40" stroke="var(--p)"/>
  <text x="390" y="96" text-anchor="middle" fill="var(--p)" font-size="12" font-weight="600">订单服务</text>
  <text class="sub" x="390" y="112" text-anchor="middle">独立部署 · 独立扩展</text>

  <rect class="box" x="490" y="80" width="160" height="40" stroke="var(--y)"/>
  <text x="570" y="96" text-anchor="middle" fill="var(--y)" font-size="12" font-weight="600">支付服务</text>
  <text class="sub" x="570" y="112" text-anchor="middle">独立部署 · 独立扩展</text>

  <!-- 通信线 -->
  <line x1="470" y1="48" x2="490" y2="48" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="390" y1="68" x2="390" y2="80" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="570" y1="68" x2="570" y2="80" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="470" y1="100" x2="490" y2="100" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="480" y="155" text-anchor="middle" fill="var(--muted)" font-size="10">REST / gRPC / MQ 互相通信</text>
</svg>
