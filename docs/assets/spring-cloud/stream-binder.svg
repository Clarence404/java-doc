<svg viewBox="0 0 680 154" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="154" rx="8" fill="var(--bg)"/>
  <text x="340" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Spring Cloud Stream Binder 抽象</text>
  <rect x="20" y="50" width="136" height="84" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="88" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">业务函数</text>
  <text x="88" y="100" text-anchor="middle" font-size="12" fill="var(--fg)">Supplier / Function</text>
  <text x="88" y="118" text-anchor="middle" font-size="12" fill="var(--fg)">Consumer Bean</text>
  <rect x="188" y="50" width="136" height="84" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="256" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Binding</text>
  <text x="256" y="100" text-anchor="middle" font-size="12" fill="var(--fg)">fn-in-0 / fn-out-0</text>
  <text x="256" y="118" text-anchor="middle" font-size="12" fill="var(--fg)">逻辑通道 + 配置</text>
  <rect x="356" y="50" width="136" height="84" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="424" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Binder</text>
  <text x="424" y="100" text-anchor="middle" font-size="12" fill="var(--fg)">Kafka / Rabbit</text>
  <text x="424" y="118" text-anchor="middle" font-size="12" fill="var(--fg)">RocketMQ 适配器</text>
  <rect x="524" y="50" width="136" height="84" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="592" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">消息中间件</text>
  <text x="592" y="100" text-anchor="middle" font-size="12" fill="var(--fg)">destination</text>
  <text x="592" y="118" text-anchor="middle" font-size="12" fill="var(--fg)">Topic / Exchange</text>
  <line x1="156" y1="92" x2="186" y2="92" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="324" y1="92" x2="354" y2="92" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="492" y1="92" x2="522" y2="92" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
