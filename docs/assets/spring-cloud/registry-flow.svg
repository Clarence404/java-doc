<svg viewBox="0 0 680 305" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="305" rx="8" fill="var(--bg)"/>
  <text x="340" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">服务注册与发现流程（Nacos 2.x+）</text>
  <rect x="20" y="50" width="160" height="70" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="100" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">服务提供者</text>
  <text x="100" y="100" text-anchor="middle" font-size="12" fill="var(--fg)">order-service</text>
  <rect x="260" y="50" width="160" height="70" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">Nacos Server</text>
  <text x="340" y="100" text-anchor="middle" font-size="12" fill="var(--fg)">服务注册表</text>
  <rect x="500" y="50" width="160" height="70" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="580" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">服务消费者</text>
  <text x="580" y="100" text-anchor="middle" font-size="12" fill="var(--fg)">payment-service</text>
  <line x1="180" y1="85" x2="258" y2="85" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="79" text-anchor="middle" font-size="11" fill="var(--muted)">① 注册</text>
  <line x1="422" y1="85" x2="498" y2="85" stroke="var(--muted)" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="460" y="79" text-anchor="middle" font-size="11" fill="var(--muted)">② 订阅</text>
  <text x="460" y="100" text-anchor="middle" font-size="11" fill="var(--muted)">③ 推送变更</text>
  <line x1="340" y1="120" x2="340" y2="168" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="230" y="170" width="220" height="80" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="340" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">④ 健康检查与剔除</text>
  <text x="340" y="213" text-anchor="middle" font-size="12" fill="var(--fg)">临时实例：gRPC 连接断开即摘除</text>
  <text x="340" y="234" text-anchor="middle" font-size="12" fill="var(--fg)">持久实例：服务端主动探测</text>
  <line x1="580" y1="120" x2="580" y2="168" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="470" y="170" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="565" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">⑤ LoadBalancer 选实例</text>
  <text x="565" y="213" text-anchor="middle" font-size="12" fill="var(--fg)">本地缓存实例列表</text>
  <text x="565" y="234" text-anchor="middle" font-size="12" fill="var(--fg)">区域 / Hint / 轮询</text>
  <path d="M565,250 L565,285 L100,285 L100,122" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="340" y="278" text-anchor="middle" font-size="11" fill="var(--muted)">⑥ 直连实例发起调用</text>
</svg>
