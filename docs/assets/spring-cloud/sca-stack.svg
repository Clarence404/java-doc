<svg viewBox="0 0 720 544" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .svc { font-size:12px; font-family:Consolas,'Courier New',monospace; fill:var(--fg); }
  </style>
  <defs>
    <marker id="arrow-sca" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="26" text-anchor="middle">Spring Cloud Alibaba 技术栈</text>

  <!-- 客户端 -->
  <rect x="260" y="44" width="200" height="48" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="74" text-anchor="middle">客户端</text>

  <line x1="360" y1="96" x2="360" y2="130" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>

  <!-- 网关 -->
  <rect x="110" y="136" width="500" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="160" text-anchor="middle">Spring Cloud Gateway</text>
  <text class="desc" x="360" y="182" text-anchor="middle">API 网关：路由 / 鉴权 / 限流 / 灰度</text>

  <line x1="360" y1="200" x2="360" y2="234" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>

  <!-- 服务调用层 -->
  <rect x="110" y="240" width="500" height="60" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="264" text-anchor="middle">OpenFeign + Spring Cloud LoadBalancer</text>
  <text class="desc" x="360" y="286" text-anchor="middle">声明式 HTTP 调用 / 客户端负载均衡</text>

  <line x1="188" y1="304" x2="188" y2="338" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>
  <line x1="360" y1="304" x2="360" y2="338" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>
  <line x1="532" y1="304" x2="532" y2="338" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>

  <!-- 业务服务 -->
  <rect x="110" y="344" width="156" height="52" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="svc" x="188" y="376" text-anchor="middle">order-service</text>
  <rect x="282" y="344" width="156" height="52" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="svc" x="360" y="376" text-anchor="middle">user-service</text>
  <rect x="454" y="344" width="156" height="52" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="svc" x="532" y="376" text-anchor="middle">pay-service</text>

  <line x1="188" y1="400" x2="188" y2="434" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>
  <line x1="360" y1="400" x2="360" y2="434" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>
  <line x1="532" y1="400" x2="532" y2="434" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sca)"/>

  <!-- 基础设施 -->
  <rect x="110" y="440" width="500" height="84" rx="8" fill="var(--bg)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="464" text-anchor="middle">基础设施组件</text>
  <text class="desc" x="193" y="488" text-anchor="middle">Nacos 注册 + 配置</text>
  <text class="desc" x="360" y="488" text-anchor="middle">Sentinel 流控熔断</text>
  <text class="desc" x="527" y="488" text-anchor="middle">Seata 分布式事务</text>
  <text class="desc" x="235" y="510" text-anchor="middle">RocketMQ 异步消息</text>
  <text class="desc" x="485" y="510" text-anchor="middle">SkyWalking 链路追踪</text>
</svg>
