<svg viewBox="0 0 720 316" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">伪共享：两个线程写不同字段，却在争同一个缓存行</text>
  <rect x="40" y="44" width="250" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="165" y="68" text-anchor="middle" class="name">Core 1（线程 T1）</text>
  <text x="165" y="88" text-anchor="middle" class="desc">循环写 counter.a</text>
  <rect x="430" y="44" width="250" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="555" y="68" text-anchor="middle" class="name">Core 2（线程 T2）</text>
  <text x="555" y="88" text-anchor="middle" class="desc">循环写 counter.b</text>
  <line x1="165" y1="104" x2="165" y2="138" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="555" y1="104" x2="555" y2="138" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="140" width="250" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="165" y="164" text-anchor="middle" class="name">L1 缓存行：a | b | …</text>
  <text x="165" y="184" text-anchor="middle" class="desc">写 a 前要先拿到整行独占（M）</text>
  <rect x="430" y="140" width="250" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="555" y="164" text-anchor="middle" class="name">L1 缓存行：a | b | …</text>
  <text x="555" y="184" text-anchor="middle" class="desc">写 b 前要先拿到整行独占（M）</text>
  <line x1="290" y1="160" x2="428" y2="160" stroke="var(--r)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="360" y="154" text-anchor="middle" class="lbl">写 a：使对方失效</text>
  <line x1="430" y1="182" x2="292" y2="182" stroke="var(--r)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="360" y="198" text-anchor="middle" class="lbl">写 b：使对方失效</text>
  <line x1="165" y1="200" x2="165" y2="234" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="555" y1="200" x2="555" y2="234" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="236" width="640" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="360" y="260" text-anchor="middle" class="name">L3 / 内存：同一个 64 字节缓存行</text>
  <text x="360" y="280" text-anchor="middle" class="desc">a、b 逻辑上无关却共用一行，行在两核之间来回迁移；填充后各占一行即可消除</text>
</svg>
