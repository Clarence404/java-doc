<svg viewBox="0 0 720 456" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .txt   { font-size: 12px; }
    .note  { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" class="title">一次 read 系统调用的路径</text>

  <text x="30" y="70" class="note">用户态（Ring 3）</text>
  <rect x="170" y="44" width="530" height="44" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="185" y="71" class="name">Java 代码</text>
  <text x="690" y="71" text-anchor="end" class="txt">in.read(buf) / channel.read(buffer)</text>
  <line x1="435" y1="88" x2="435" y2="116" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="118" width="530" height="44" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="185" y="145" class="name">JDK native 层</text>
  <text x="690" y="145" text-anchor="end" class="txt">libjava / libnio 中的 C 代码，准备缓冲区与参数</text>
  <line x1="435" y1="162" x2="435" y2="190" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="192" width="530" height="44" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="185" y="219" class="name">glibc 封装</text>
  <text x="690" y="219" text-anchor="end" class="txt">read()：参数放入寄存器，执行 syscall 指令</text>

  <line x1="20" y1="255" x2="700" y2="255" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="30" y="246" class="note">特权级切换</text>
  <line x1="435" y1="236" x2="435" y2="272" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="30" y="300" class="note">内核态（Ring 0）</text>
  <rect x="170" y="274" width="530" height="44" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="185" y="301" class="name">系统调用入口</text>
  <text x="690" y="301" text-anchor="end" class="txt">保存用户态寄存器，按调用号查系统调用表</text>
  <line x1="435" y1="318" x2="435" y2="346" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="348" width="530" height="64" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="185" y="385" class="name">sys_read</text>
  <text x="690" y="372" text-anchor="end" class="txt">经 VFS 找到文件或 Socket，从 Page Cache / 接收缓冲区拷贝</text>
  <text x="690" y="394" text-anchor="end" class="txt">数据未就绪时线程睡眠、让出 CPU（上下文切换）</text>

  <text x="360" y="438" text-anchor="middle" class="note">返回：结果写入寄存器，sysret 回到用户态，从 syscall 的下一条指令继续执行</text>
</svg>
