<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">请求入口分层架构</text>

  <!-- 1. DNS / GSLB -->
  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">DNS / GSLB</text>
  <text class="sub" x="40" y="88">解析与全局调度</text>
  <text class="desc" x="650" y="70" text-anchor="end">按地域、运营商返回就近入口 IP</text>
  <text class="desc" x="650" y="88" text-anchor="end">探测机房健康，故障时切换解析</text>

  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <!-- 2. CDN -->
  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">CDN</text>
  <text class="sub" x="40" y="178">边缘缓存</text>
  <text class="desc" x="650" y="160" text-anchor="end">静态资源、静态化页面在边缘节点命中</text>
  <text class="desc" x="650" y="178" text-anchor="end">只有未命中与动态请求回源</text>

  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <!-- 3. LVS / SLB -->
  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">LVS / 云 SLB</text>
  <text class="sub" x="40" y="268">四层负载均衡</text>
  <text class="desc" x="650" y="250" text-anchor="end">按 IP + 端口转发 TCP / UDP，不解析 HTTP</text>
  <text class="desc" x="650" y="268" text-anchor="end">Keepalived 主备 VIP 或云厂商托管</text>

  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <!-- 4. Nginx / 网关 -->
  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">Nginx / API 网关</text>
  <text class="sub" x="40" y="358">七层路由</text>
  <text class="desc" x="650" y="340" text-anchor="end">TLS 卸载、按域名 / 路径路由</text>
  <text class="desc" x="650" y="358" text-anchor="end">鉴权、限流、防刷、灰度</text>

  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>

  <!-- 5. 应用集群 -->
  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">应用集群</text>
  <text class="sub" x="40" y="448">无状态服务</text>
  <text class="desc" x="650" y="430" text-anchor="end">水平扩展、HPA 自动扩缩容</text>
  <text class="desc" x="650" y="448" text-anchor="end">服务间走注册中心 + 客户端负载均衡</text>
</svg>
