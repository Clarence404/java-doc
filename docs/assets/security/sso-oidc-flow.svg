<svg viewBox="0 0 720 592" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .label { font-size:11px; fill:var(--fg); }
    .note { font-size:11px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="arrow-oidc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="26" text-anchor="middle">OIDC 授权码流程（Authorization Code + PKCE）</text>

  <rect x="40" y="44" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text class="box-title" x="120" y="72" text-anchor="middle">浏览器</text>
  <rect x="280" y="44" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="72" text-anchor="middle">应用后端（Client）</text>
  <rect x="520" y="44" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="600" y="72" text-anchor="middle">认证中心（OP）</text>

  <line x1="120" y1="92" x2="120" y2="512" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="360" y1="92" x2="360" y2="512" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="600" y1="92" x2="600" y2="512" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>

  <text class="label" x="240" y="116" text-anchor="middle">① 访问，未登录</text>
  <line x1="126" y1="124" x2="354" y2="124" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <text class="label" x="480" y="168" text-anchor="middle">② 302 到 /authorize（scope=openid）</text>
  <line x1="366" y1="176" x2="594" y2="176" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <text class="label" x="360" y="220" text-anchor="middle">③ 用户登录（已有全局会话则跳过）</text>
  <line x1="126" y1="228" x2="594" y2="228" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <text class="label" x="360" y="272" text-anchor="middle">④ 302 回 redirect_uri，携带一次性授权码 code</text>
  <line x1="594" y1="280" x2="126" y2="280" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <text class="label" x="240" y="324" text-anchor="middle">⑤ 带 code 访问回调地址</text>
  <line x1="126" y1="332" x2="354" y2="332" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <text class="label" x="480" y="376" text-anchor="middle">⑥ code + client_secret 换令牌（后端直连）</text>
  <line x1="366" y1="384" x2="594" y2="384" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <text class="label" x="480" y="428" text-anchor="middle">⑦ ID Token（我是谁）+ Access Token</text>
  <line x1="594" y1="436" x2="366" y2="436" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <text class="label" x="240" y="480" text-anchor="middle">⑧ 校验 ID Token → 建会话，登录完成</text>
  <line x1="354" y1="488" x2="126" y2="488" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-oidc)"/>

  <rect x="40" y="524" width="640" height="48" rx="8" fill="var(--bg)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="note" x="360" y="554" text-anchor="middle">code 一次性且由后端兑换，令牌不暴露在浏览器；隐式/密码模式已废弃，OAuth 2.1 只推荐授权码 + PKCE</text>
</svg>
