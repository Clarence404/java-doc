<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171; }
    }
  </style>
  <defs>
    <marker id="ssrf-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5 z" fill="var(--fg)"/>
    </marker>
    <marker id="ssrf-arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5 z" fill="var(--r)"/>
    </marker>
    <marker id="ssrf-arr-g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5 z" fill="var(--g)"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="var(--bg)"/>

  <text x="340" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="var(--fg)">SSRF：服务端替攻击者访问内网</text>

  <!-- 攻击者 -->
  <rect x="10" y="134" width="130" height="62" rx="5" fill="var(--r)" fill-opacity="0.10" stroke="var(--r)" stroke-width="1.5"/>
  <text x="75" y="158" font-size="11" font-weight="600" text-anchor="middle" fill="var(--r)">攻击者</text>
  <text x="75" y="176" font-size="10" text-anchor="middle" fill="var(--muted)">提交内网 URL</text>

  <line x1="140" y1="165" x2="168" y2="165" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#ssrf-arr)"/>

  <!-- 应用服务 -->
  <rect x="170" y="134" width="130" height="62" rx="5" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="235" y="158" font-size="11" font-weight="600" text-anchor="middle" fill="var(--b)">应用服务</text>
  <text x="235" y="176" font-size="10" text-anchor="middle" fill="var(--muted)">图片抓取 / Webhook</text>

  <line x1="300" y1="165" x2="328" y2="165" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#ssrf-arr)"/>

  <!-- 出站校验 -->
  <rect x="330" y="50" width="140" height="230" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="2"/>
  <text x="400" y="118" font-size="12" font-weight="700" text-anchor="middle" fill="var(--p)">出站校验</text>
  <text x="400" y="146" font-size="10" text-anchor="middle" fill="var(--fg)">1 协议 + 域名白名单</text>
  <text x="400" y="168" font-size="10" text-anchor="middle" fill="var(--fg)">2 解析 IP，拒内网段</text>
  <text x="400" y="190" font-size="10" text-anchor="middle" fill="var(--fg)">3 不跟随重定向</text>
  <text x="400" y="212" font-size="10" text-anchor="middle" fill="var(--fg)">4 出口代理兜底</text>

  <!-- 目标 -->
  <rect x="520" y="50" width="150" height="62" rx="5" fill="var(--r)" fill-opacity="0.08" stroke="var(--r)" stroke-width="1.2"/>
  <text x="595" y="74" font-size="11" font-weight="600" text-anchor="middle" fill="var(--r)">云元数据服务</text>
  <text x="595" y="92" font-size="10" text-anchor="middle" fill="var(--muted)">169.254.169.254</text>

  <rect x="520" y="134" width="150" height="62" rx="5" fill="var(--r)" fill-opacity="0.08" stroke="var(--r)" stroke-width="1.2"/>
  <text x="595" y="158" font-size="11" font-weight="600" text-anchor="middle" fill="var(--r)">内网服务</text>
  <text x="595" y="176" font-size="10" text-anchor="middle" fill="var(--muted)">10.0.0.0/8 · Redis</text>

  <rect x="520" y="218" width="150" height="62" rx="5" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.2"/>
  <text x="595" y="242" font-size="11" font-weight="600" text-anchor="middle" fill="var(--g)">合作方 API</text>
  <text x="595" y="260" font-size="10" text-anchor="middle" fill="var(--muted)">api.partner.com</text>

  <line x1="470" y1="81" x2="518" y2="81" stroke="var(--r)" stroke-width="1.5" marker-end="url(#ssrf-arr-r)"/>
  <text x="494" y="76" font-size="10" text-anchor="middle" fill="var(--r)">拒绝</text>
  <line x1="470" y1="165" x2="518" y2="165" stroke="var(--r)" stroke-width="1.5" marker-end="url(#ssrf-arr-r)"/>
  <text x="494" y="160" font-size="10" text-anchor="middle" fill="var(--r)">拒绝</text>
  <line x1="470" y1="249" x2="518" y2="249" stroke="var(--g)" stroke-width="1.5" marker-end="url(#ssrf-arr-g)"/>
  <text x="494" y="244" font-size="10" text-anchor="middle" fill="var(--g)">放行</text>
</svg>
