<svg viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171; }
    }
  </style>
  <defs>
    <marker id="zt-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <rect width="680" height="390" fill="var(--bg)"/>

  <text x="340" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="var(--fg)">NIST SP 800-207 零信任逻辑组件</text>

  <!-- 左侧输入 -->
  <rect x="10" y="50" width="150" height="60" rx="5" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1"/>
  <text x="85" y="74" font-size="11" font-weight="600" text-anchor="middle" fill="var(--b)">身份管理</text>
  <text x="85" y="92" font-size="10" text-anchor="middle" fill="var(--muted)">IdP · MFA</text>

  <rect x="10" y="122" width="150" height="60" rx="5" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1"/>
  <text x="85" y="146" font-size="11" font-weight="600" text-anchor="middle" fill="var(--b)">设备状态</text>
  <text x="85" y="164" font-size="10" text-anchor="middle" fill="var(--muted)">MDM · EDR · 补丁</text>

  <rect x="10" y="194" width="150" height="60" rx="5" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1"/>
  <text x="85" y="218" font-size="11" font-weight="600" text-anchor="middle" fill="var(--b)">威胁情报</text>
  <text x="85" y="236" font-size="10" text-anchor="middle" fill="var(--muted)">风险信号 · CAEP</text>

  <!-- 右侧输入 -->
  <rect x="520" y="50" width="150" height="60" rx="5" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1"/>
  <text x="595" y="74" font-size="11" font-weight="600" text-anchor="middle" fill="var(--y)">访问策略</text>
  <text x="595" y="92" font-size="10" text-anchor="middle" fill="var(--muted)">按资源定义规则</text>

  <rect x="520" y="122" width="150" height="60" rx="5" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1"/>
  <text x="595" y="146" font-size="11" font-weight="600" text-anchor="middle" fill="var(--y)">活动日志</text>
  <text x="595" y="164" font-size="10" text-anchor="middle" fill="var(--muted)">SIEM · 行为基线</text>

  <rect x="520" y="194" width="150" height="60" rx="5" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1"/>
  <text x="595" y="218" font-size="11" font-weight="600" text-anchor="middle" fill="var(--y)">PKI</text>
  <text x="595" y="236" font-size="10" text-anchor="middle" fill="var(--muted)">用户与工作负载证书</text>

  <!-- PDP -->
  <rect x="200" y="50" width="280" height="204" rx="6" fill="var(--p)" fill-opacity="0.08" stroke="var(--p)" stroke-width="2"/>
  <text x="340" y="68" font-size="11" font-weight="700" text-anchor="middle" fill="var(--p)">策略决策点 PDP（控制平面）</text>

  <rect x="215" y="80" width="250" height="66" rx="5" fill="var(--p)" fill-opacity="0.14" stroke="var(--p)" stroke-width="1"/>
  <text x="340" y="106" font-size="11" font-weight="600" text-anchor="middle" fill="var(--p)">策略引擎 PE</text>
  <text x="340" y="124" font-size="10" text-anchor="middle" fill="var(--muted)">信任算法：授予 / 拒绝 / 撤销</text>

  <rect x="215" y="176" width="250" height="66" rx="5" fill="var(--p)" fill-opacity="0.14" stroke="var(--p)" stroke-width="1"/>
  <text x="340" y="202" font-size="11" font-weight="600" text-anchor="middle" fill="var(--p)">策略管理员 PA</text>
  <text x="340" y="220" font-size="10" text-anchor="middle" fill="var(--muted)">建立或切断会话，下发凭据</text>

  <line x1="340" y1="146" x2="340" y2="174" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#zt-arr)"/>

  <!-- 输入箭头 -->
  <line x1="160" y1="80" x2="198" y2="80" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#zt-arr)"/>
  <line x1="160" y1="152" x2="198" y2="152" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#zt-arr)"/>
  <line x1="160" y1="224" x2="198" y2="224" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#zt-arr)"/>
  <line x1="520" y1="80" x2="482" y2="80" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#zt-arr)"/>
  <line x1="520" y1="152" x2="482" y2="152" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#zt-arr)"/>
  <line x1="520" y1="224" x2="482" y2="224" stroke="var(--fg)" stroke-width="1.2" marker-end="url(#zt-arr)"/>

  <!-- PEP ↔ PDP -->
  <line x1="340" y1="310" x2="340" y2="256" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#zt-arr)"/>
  <text x="350" y="288" font-size="10" fill="var(--muted)">每次访问请求决策</text>

  <!-- 数据平面 -->
  <rect x="10" y="310" width="200" height="60" rx="5" fill="var(--r)" fill-opacity="0.08" stroke="var(--r)" stroke-width="1.2"/>
  <text x="110" y="334" font-size="11" font-weight="600" text-anchor="middle" fill="var(--r)">主体：用户 + 设备</text>
  <text x="110" y="352" font-size="10" text-anchor="middle" fill="var(--muted)">位于不可信区域</text>

  <rect x="250" y="310" width="180" height="60" rx="5" fill="var(--g)" fill-opacity="0.14" stroke="var(--g)" stroke-width="1.5"/>
  <text x="340" y="334" font-size="11" font-weight="600" text-anchor="middle" fill="var(--g)">策略执行点 PEP</text>
  <text x="340" y="352" font-size="10" text-anchor="middle" fill="var(--muted)">网关 / 代理 / Sidecar</text>

  <rect x="470" y="310" width="200" height="60" rx="5" fill="var(--y)" fill-opacity="0.08" stroke="var(--y)" stroke-width="1.2"/>
  <text x="570" y="334" font-size="11" font-weight="600" text-anchor="middle" fill="var(--y)">企业资源</text>
  <text x="570" y="352" font-size="10" text-anchor="middle" fill="var(--muted)">隐式信任区越小越好</text>

  <line x1="210" y1="340" x2="248" y2="340" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#zt-arr)"/>
  <line x1="430" y1="340" x2="468" y2="340" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#zt-arr)"/>
</svg>
