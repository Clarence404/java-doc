<svg viewBox="0 0 780 626" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171; }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5 z" fill="var(--fg)"/>
    </marker>
  </defs>
  <rect width="780" height="626" fill="var(--bg)"/>
  <text x="390" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="var(--fg)">OAuth 2 授权码 + PKCE 流程</text>
  <rect x="28" y="36" width="140" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="98.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="var(--p)">用户 / 浏览器</text>
  <text x="98.0" y="76" font-size="10" text-anchor="middle" fill="var(--p)">Resource Owner</text>
  <rect x="223" y="36" width="140" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="293.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="var(--b)">客户端</text>
  <text x="293.0" y="76" font-size="10" text-anchor="middle" fill="var(--b)">Client</text>
  <rect x="418" y="36" width="140" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="488.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="var(--g)">授权服务器</text>
  <text x="488.0" y="76" font-size="10" text-anchor="middle" fill="var(--g)">Authorization Server</text>
  <rect x="613" y="36" width="140" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="683.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="var(--y)">资源服务器</text>
  <text x="683.0" y="76" font-size="10" text-anchor="middle" fill="var(--y)">Resource Server</text>
  <line x1="98" y1="96" x2="98" y2="590" stroke="var(--p)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="293" y1="96" x2="293" y2="590" stroke="var(--b)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="488" y1="96" x2="488" y2="590" stroke="var(--g)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="683" y1="96" x2="683" y2="590" stroke="var(--y)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <text x="195.5" y="146" font-size="10" text-anchor="middle" fill="var(--muted)">① 点击登录</text>
  <line x1="98" y1="152" x2="293" y2="152" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390.5" y="193" font-size="10" text-anchor="middle" fill="var(--muted)">② 经浏览器重定向到 /authorize</text>
  <text x="390.5" y="206" font-size="10" text-anchor="middle" fill="var(--muted)">code_challenge、state</text>
  <line x1="293" y1="212" x2="488" y2="212" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="293.0" y="266" font-size="10" text-anchor="middle" fill="var(--muted)">③ 登录并同意授权 scope</text>
  <line x1="98" y1="272" x2="488" y2="272" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390.5" y="313" font-size="10" text-anchor="middle" fill="var(--muted)">④ 经浏览器回调 redirect_uri</text>
  <text x="390.5" y="326" font-size="10" text-anchor="middle" fill="var(--muted)">携带 code + state</text>
  <line x1="488" y1="332" x2="293" y2="332" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390.5" y="373" font-size="10" text-anchor="middle" fill="var(--muted)">⑤ POST /token（后端直连）</text>
  <text x="390.5" y="386" font-size="10" text-anchor="middle" fill="var(--muted)">code + code_verifier + 客户端认证</text>
  <line x1="293" y1="392" x2="488" y2="392" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390.5" y="446" font-size="10" text-anchor="middle" fill="var(--muted)">⑥ access_token + refresh_token</text>
  <line x1="488" y1="452" x2="293" y2="452" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="488.0" y="506" font-size="10" text-anchor="middle" fill="var(--muted)">⑦ Authorization: Bearer / DPoP 调用 API</text>
  <line x1="293" y1="512" x2="683" y2="512" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="488.0" y="566" font-size="10" text-anchor="middle" fill="var(--muted)">⑧ 校验令牌后返回资源</text>
  <line x1="683" y1="572" x2="293" y2="572" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="606" font-size="11" text-anchor="middle" fill="var(--muted)">②④ 走前端通道（浏览器可见），只传一次性 code；⑤⑥ 走后端通道，令牌不经过浏览器；code_verifier 证明换令牌的就是发起授权的客户端</text>
</svg>
