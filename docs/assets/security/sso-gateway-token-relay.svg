<svg viewBox="0 0 760 362" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-tr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="380" y="26" text-anchor="middle">BFF 网关：浏览器只持有会话 Cookie，令牌由网关中继给下游</text>

  <rect x="280" y="44" width="220" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="390" y="68" text-anchor="middle">IdP（Keycloak / Entra ID 等）</text>
  <text class="desc" x="390" y="90" text-anchor="middle">授权码 + PKCE，签发令牌</text>

  <line x1="390" y1="104" x2="390" y2="137" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-tr)"/>
  <text class="label" x="400" y="126">换令牌 / 刷新令牌</text>

  <rect x="20" y="159" width="150" height="60" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text class="box-title" x="95" y="183" text-anchor="middle">浏览器 / SPA</text>
  <text class="desc" x="95" y="205" text-anchor="middle">不接触任何令牌</text>

  <line x1="170" y1="189" x2="278" y2="189" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-tr)"/>
  <text class="label" x="224" y="182" text-anchor="middle">会话 Cookie</text>

  <rect x="280" y="139" width="220" height="100" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="390" y="171" text-anchor="middle">BFF 网关（OAuth2 Client）</text>
  <text class="desc" x="390" y="194" text-anchor="middle">会话里保存 Access / Refresh Token</text>
  <text class="desc" x="390" y="216" text-anchor="middle">oauth2Login + TokenRelay</text>

  <line x1="500" y1="159" x2="598" y2="159" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-tr)"/>
  <text class="label" x="549" y="152" text-anchor="middle">TokenRelay</text>
  <line x1="500" y1="229" x2="598" y2="229" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-tr)"/>
  <text class="label" x="549" y="222" text-anchor="middle">Bearer</text>

  <rect x="600" y="129" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="153" text-anchor="middle">订单服务</text>
  <text class="desc" x="670" y="175" text-anchor="middle">资源服务器校验 JWT</text>

  <rect x="600" y="199" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="223" text-anchor="middle">用户服务</text>
  <text class="desc" x="670" y="245" text-anchor="middle">资源服务器校验 JWT</text>

  <rect x="20" y="282" width="720" height="60" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="desc" x="380" y="306" text-anchor="middle">浏览器拿不到令牌，XSS 偷不走 Access Token；令牌过期由网关用 Refresh Token 续期</text>
  <text class="desc" x="380" y="328" text-anchor="middle">下游服务只认 Authorization: Bearer 头，按资源服务器方式验签并校验 aud / scope</text>
</svg>
