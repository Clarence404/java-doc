<svg viewBox="0 0 680 456" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171; }
    }
  </style>

  <rect width="680" height="456" fill="var(--bg)"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="var(--fg)">安全分层模型</text>

  <!-- Layer 1: 身份层 y=50 -->
  <rect x="20" y="50" width="640" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="40" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="var(--b)">身份层</text>
  <text x="52" y="93" font-family="sans-serif" font-size="11" fill="var(--muted)">谁在访问系统</text>
  <text x="650" y="75" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">OAuth2 / OIDC 认证 · MFA 多因素 · JWT 凭证管理</text>
  <text x="650" y="93" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">SSO 单点登录 · 账号密码安全 · 零信任身份验证</text>

  <!-- Layer 2: 授权层 y=130 -->
  <rect x="20" y="130" width="640" height="70" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="40" y="155" font-family="sans-serif" font-size="14" font-weight="700" fill="var(--p)">授权层</text>
  <text x="52" y="173" font-family="sans-serif" font-size="11" fill="var(--muted)">能访问什么资源</text>
  <text x="650" y="155" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">RBAC 角色控制 · ABAC 属性控制 · 最小权限原则</text>
  <text x="650" y="173" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">资源粒度管控 · API 权限声明 · 动态策略引擎</text>

  <!-- Layer 3: 接口层 y=210 -->
  <rect x="20" y="210" width="640" height="70" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="40" y="235" font-family="sans-serif" font-size="14" font-weight="700" fill="var(--g)">接口层</text>
  <text x="52" y="253" font-family="sans-serif" font-size="11" fill="var(--muted)">请求是否可信</text>
  <text x="650" y="235" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">签名验签 · 防重放（Nonce / 时间戳）· 限流熔断</text>
  <text x="650" y="253" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">参数校验 · HTTPS 强制 · CORS 策略配置</text>

  <!-- Layer 4: 数据层 y=290 -->
  <rect x="20" y="290" width="640" height="70" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="40" y="315" font-family="sans-serif" font-size="14" font-weight="700" fill="var(--y)">数据层</text>
  <text x="52" y="333" font-family="sans-serif" font-size="11" fill="var(--muted)">敏感数据如何保护</text>
  <text x="650" y="315" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">传输加密 TLS · 存储加密 AES-256 · 字段脱敏</text>
  <text x="650" y="333" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">密钥管理 KMS · 数据分类分级 · 最小暴露面</text>

  <!-- Layer 5: 运行层 y=370 -->
  <rect x="20" y="370" width="640" height="70" rx="6" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="40" y="395" font-family="sans-serif" font-size="14" font-weight="700" fill="var(--r)">运行层</text>
  <text x="52" y="413" font-family="sans-serif" font-size="11" fill="var(--muted)">风险如何发现与追踪</text>
  <text x="650" y="395" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">审计日志 · 异常行为检测 · 漏洞扫描</text>
  <text x="650" y="413" text-anchor="end" font-family="sans-serif" font-size="11" fill="var(--muted)">安全监控告警 · 渗透测试 · 合规审查</text>
</svg>
