<svg viewBox="0 0 770 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--r); }
  </style>
  <defs>
    <marker id="arrow-jwt-rt" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
    <marker id="arrow-jwt-rt-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--r)"/>
    </marker>
  </defs>

  <text class="title" x="385" y="26" text-anchor="middle">Refresh Token 轮换与重用检测</text>

  <rect x="20" y="50" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="74" text-anchor="middle">登录成功</text>
  <text class="desc" x="100" y="94" text-anchor="middle">签发 AT1 + RT1</text>
  <text class="desc" x="100" y="112" text-anchor="middle">RT1 属于家族 F</text>

  <rect x="210" y="50" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="290" y="74" text-anchor="middle">第 1 次刷新</text>
  <text class="desc" x="290" y="94" text-anchor="middle">提交 RT1，换回 AT2 + RT2</text>
  <text class="desc" x="290" y="112" text-anchor="middle">RT1 标记为已使用</text>

  <rect x="400" y="50" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="480" y="74" text-anchor="middle">第 2 次刷新</text>
  <text class="desc" x="480" y="94" text-anchor="middle">提交 RT2，换回 AT3 + RT3</text>
  <text class="desc" x="480" y="112" text-anchor="middle">RT2 标记为已使用</text>

  <rect x="590" y="50" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="74" text-anchor="middle">正常使用</text>
  <text class="desc" x="670" y="94" text-anchor="middle">家族 F 中只有 RT3 有效</text>
  <text class="desc" x="670" y="112" text-anchor="middle">每个 RT 只能用一次</text>

  <line x1="180" y1="90" x2="208" y2="90" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-jwt-rt)"/>
  <line x1="370" y1="90" x2="398" y2="90" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-jwt-rt)"/>
  <line x1="560" y1="90" x2="588" y2="90" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-jwt-rt)"/>

  <line x1="100" y1="130" x2="100" y2="178" stroke="var(--r)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-jwt-rt-red)"/>
  <text class="label" x="108" y="159">RT1 副本泄露</text>

  <rect x="20" y="180" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="204" text-anchor="middle">攻击者持有 RT1</text>
  <text class="desc" x="100" y="224" text-anchor="middle">XSS、日志或设备被窃取</text>
  <text class="desc" x="100" y="242" text-anchor="middle">在用户刷新之后重放</text>

  <rect x="210" y="180" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="290" y="204" text-anchor="middle">提交已用过的 RT1</text>
  <text class="desc" x="290" y="224" text-anchor="middle">服务端查到 RT1</text>
  <text class="desc" x="290" y="242" text-anchor="middle">状态为已使用</text>

  <rect x="400" y="180" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="480" y="204" text-anchor="middle">判定为重用</text>
  <text class="desc" x="480" y="224" text-anchor="middle">无法分辨谁是合法方</text>
  <text class="desc" x="480" y="242" text-anchor="middle">按家族整体处理</text>

  <rect x="590" y="180" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="204" text-anchor="middle">吊销家族 F</text>
  <text class="desc" x="670" y="224" text-anchor="middle">RT3 一并失效</text>
  <text class="desc" x="670" y="242" text-anchor="middle">用户重新登录并告警</text>

  <line x1="180" y1="220" x2="208" y2="220" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrow-jwt-rt-red)"/>
  <line x1="370" y1="220" x2="398" y2="220" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrow-jwt-rt-red)"/>
  <line x1="560" y1="220" x2="588" y2="220" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrow-jwt-rt-red)"/>
</svg>
