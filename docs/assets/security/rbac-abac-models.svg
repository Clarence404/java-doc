<svg viewBox="0 0 780 432" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-am" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="390" y="26" text-anchor="middle">三种授权模型：RBAC、ABAC 与 ReBAC</text>

  <rect x="20" y="42" width="240" height="370" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="140" y="66" text-anchor="middle">RBAC：按角色</text>
  <rect x="40" y="84" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="140" y="108" text-anchor="middle">用户</text>
  <text class="desc" x="140" y="130" text-anchor="middle">alice、bob</text>
  <line x1="140" y1="144" x2="140" y2="172" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-am)"/>
  <rect x="40" y="174" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="140" y="198" text-anchor="middle">角色</text>
  <text class="desc" x="140" y="220" text-anchor="middle">ADMIN、EDITOR（可继承）</text>
  <line x1="140" y1="234" x2="140" y2="262" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-am)"/>
  <rect x="40" y="264" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="140" y="288" text-anchor="middle">权限</text>
  <text class="desc" x="140" y="310" text-anchor="middle">order:delete、user:read</text>
  <rect x="40" y="354" width="200" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="label" x="140" y="381" text-anchor="middle">问：你是什么角色？</text>

  <rect x="270" y="42" width="240" height="370" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="390" y="66" text-anchor="middle">ABAC：按属性</text>
  <rect x="290" y="84" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="390" y="108" text-anchor="middle">属性</text>
  <text class="desc" x="390" y="130" text-anchor="middle">主体 / 资源 / 环境</text>
  <line x1="390" y1="144" x2="390" y2="172" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-am)"/>
  <rect x="290" y="174" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="390" y="198" text-anchor="middle">策略（PDP）</text>
  <text class="desc" x="390" y="220" text-anchor="middle">同部门 且 9:00–18:00</text>
  <line x1="390" y1="234" x2="390" y2="262" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-am)"/>
  <rect x="290" y="264" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="390" y="288" text-anchor="middle">决策</text>
  <text class="desc" x="390" y="310" text-anchor="middle">allow / deny</text>
  <rect x="290" y="354" width="200" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="label" x="390" y="381" text-anchor="middle">问：属性满足规则吗？</text>

  <rect x="520" y="42" width="240" height="370" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="640" y="66" text-anchor="middle">ReBAC：按关系</text>
  <rect x="540" y="84" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="640" y="108" text-anchor="middle">关系元组</text>
  <text class="desc" x="640" y="130" text-anchor="middle">doc:1#editor@user:alice</text>
  <line x1="640" y1="144" x2="640" y2="172" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-am)"/>
  <rect x="540" y="174" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="640" y="198" text-anchor="middle">关系图</text>
  <text class="desc" x="640" y="220" text-anchor="middle">文件夹 → 文档，权限沿关系继承</text>
  <line x1="640" y1="234" x2="640" y2="262" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-am)"/>
  <rect x="540" y="264" width="200" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="640" y="288" text-anchor="middle">检查</text>
  <text class="desc" x="640" y="310" text-anchor="middle">check(alice, editor, doc:1)</text>
  <rect x="540" y="354" width="200" height="44" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="label" x="640" y="381" text-anchor="middle">问：你和这个对象是什么关系？</text>
</svg>
