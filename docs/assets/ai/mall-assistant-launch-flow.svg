<svg viewBox="0 0 900 354" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="900" height="354" fill="var(--bg)"/>
  <text x="450" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">第 9 章：一轮对话经过的上线保护，和旁边的评测门禁</text>

  <!-- 第一行：请求 → 三关 → 意图识别 → RAG 检索 -->
  <rect x="30" y="44" width="180" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="120" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">对话请求</text>
  <text x="120" y="86" text-anchor="middle" font-size="11" fill="var(--fg)">阻塞与流式两个接口</text>
  <text x="120" y="102" text-anchor="middle" font-size="11" fill="var(--fg)">调用方：用户 ID 或 IP</text>

  <rect x="250" y="44" width="180" height="70" rx="6" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--r)">进门三关</text>
  <text x="340" y="86" text-anchor="middle" font-size="11" fill="var(--fg)">每日预算 → 次数 → 并发</text>
  <text x="340" y="102" text-anchor="middle" font-size="11" fill="var(--fg)">超了 429，忙了 503</text>

  <rect x="470" y="44" width="180" height="70" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="560" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">意图识别</text>
  <text x="560" y="86" text-anchor="middle" font-size="11" fill="var(--fg)">一次约 550 Token</text>
  <text x="560" y="102" text-anchor="middle" font-size="11" fill="var(--fg)">失败时先拿原话去检索</text>

  <rect x="690" y="44" width="180" height="70" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="780" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">RAG 检索</text>
  <text x="780" y="86" text-anchor="middle" font-size="11" fill="var(--fg)">向量 + 关键词混合检索</text>
  <text x="780" y="102" text-anchor="middle" font-size="11" fill="var(--fg)">不用对话模型</text>

  <line x1="210" y1="79" x2="248" y2="79" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="79" x2="468" y2="79" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="79" x2="688" y2="79" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="114" x2="780" y2="152" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第二行（从右往左）：注入过滤 → 模型调用 → 记账与指标 → 响应 -->
  <rect x="690" y="154" width="180" height="70" rx="6" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="780" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="var(--r)">注入过滤</text>
  <text x="780" y="196" text-anchor="middle" font-size="11" fill="var(--fg)">四类规则，命中整块挡下</text>
  <text x="780" y="212" text-anchor="middle" font-size="11" fill="var(--fg)">留下的从 1 重新编号</text>

  <rect x="470" y="154" width="180" height="70" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="560" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">模型调用</text>
  <text x="560" y="196" text-anchor="middle" font-size="11" fill="var(--fg)">连续失败 5 次熔断 30 秒</text>
  <text x="560" y="212" text-anchor="middle" font-size="11" fill="var(--fg)">规则类问题降级给原文</text>

  <rect x="250" y="154" width="180" height="70" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="340" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">记账与指标</text>
  <text x="340" y="196" text-anchor="middle" font-size="11" fill="var(--fg)">Token 按调用方 / 意图记</text>
  <text x="340" y="212" text-anchor="middle" font-size="11" fill="var(--fg)">Prometheus + traceId</text>

  <rect x="30" y="154" width="180" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="120" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">回答</text>
  <text x="120" y="196" text-anchor="middle" font-size="11" fill="var(--fg)">带 usage（流式在 done）</text>
  <text x="120" y="212" text-anchor="middle" font-size="11" fill="var(--fg)">响应头 X-Trace-Id</text>

  <line x1="690" y1="189" x2="652" y2="189" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="189" x2="432" y2="189" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="189" x2="212" y2="189" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第三行：评测门禁 -->
  <text x="450" y="249" text-anchor="middle" font-size="11" fill="var(--muted)">评测门禁：改代码、改提示词、换模型时跑，和请求链路互不影响</text>

  <rect x="30" y="264" width="180" height="70" rx="6" fill="var(--g)" fill-opacity="0.08" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="120" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">回归评测集</text>
  <text x="120" y="306" text-anchor="middle" font-size="11" fill="var(--fg)">58 条 JSONL，7 个类别</text>
  <text x="120" y="322" text-anchor="middle" font-size="11" fill="var(--fg)">版本号取内容哈希</text>

  <rect x="250" y="264" width="180" height="70" rx="6" fill="var(--g)" fill-opacity="0.08" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="340" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">真实模型录制</text>
  <text x="340" y="306" text-anchor="middle" font-size="11" fill="var(--fg)">EvalIT：1.5b + bge-m3</text>
  <text x="340" y="322" text-anchor="middle" font-size="11" fill="var(--fg)">录下模型输出与向量</text>

  <rect x="470" y="264" width="180" height="70" rx="6" fill="var(--g)" fill-opacity="0.08" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="560" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">回放并和基线比</text>
  <text x="560" y="306" text-anchor="middle" font-size="11" fill="var(--fg)">回放要求逐条一致</text>
  <text x="560" y="322" text-anchor="middle" font-size="11" fill="var(--fg)">真实模型：总 5 点、单类 20 点</text>

  <rect x="690" y="264" width="180" height="70" rx="6" fill="var(--g)" fill-opacity="0.08" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="780" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">CI 门禁</text>
  <text x="780" y="306" text-anchor="middle" font-size="11" fill="var(--fg)">EvalGateTest 不连模型</text>
  <text x="780" y="322" text-anchor="middle" font-size="11" fill="var(--fg)">退化了 verify 失败</text>

  <line x1="210" y1="299" x2="248" y2="299" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="299" x2="468" y2="299" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="299" x2="688" y2="299" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
