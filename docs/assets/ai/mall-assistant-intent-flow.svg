<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>

  <rect width="760" height="260" fill="var(--bg)"/>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">第 2 章：先识别意图，再决定拒答还是回答</text>

  <!-- 第一行 -->
  <rect x="20" y="40" width="160" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">用户消息</text>
  <text x="100" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">阻塞或流式接口</text>

  <rect x="230" y="40" width="240" height="70" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="350" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">意图识别（结构化输出）</text>
  <text x="350" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">解析失败重试一次，仍失败记 UNKNOWN</text>

  <rect x="520" y="40" width="220" height="70" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="630" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">是否拒答</text>
  <text x="630" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">OUT_OF_SCOPE 且把握 ≥ 0.6</text>

  <line x1="180" y1="75" x2="228" y2="75" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="75" x2="518" y2="75" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第二行 -->
  <rect x="20" y="170" width="240" height="70" rx="6" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="140" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="var(--r)">模型调不通</text>
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="var(--fg)">不重试：503 或 error 事件</text>

  <rect x="290" y="170" width="210" height="70" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="395" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">拒答话术</text>
  <text x="395" y="218" text-anchor="middle" font-size="11" fill="var(--fg)">模板渲染，不调回答模型</text>

  <rect x="530" y="170" width="210" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="635" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">回答模型</text>
  <text x="635" y="218" text-anchor="middle" font-size="11" fill="var(--fg)">带渲染后的系统提示词</text>

  <line x1="290" y1="110" x2="180" y2="168" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="212" y="139" text-anchor="end" font-size="11" fill="var(--r)">连接失败 / 超时</text>

  <line x1="560" y1="110" x2="450" y2="168" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="482" y="139" text-anchor="end" font-size="11" fill="var(--muted)">是</text>

  <line x1="635" y1="110" x2="635" y2="168" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="643" y="143" font-size="11" fill="var(--muted)">否</text>
</svg>
