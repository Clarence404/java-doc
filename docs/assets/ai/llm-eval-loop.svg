<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="var(--bg)"/>
  <text x="350" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">LLM 应用评估闭环</text>

  <!-- 上排：离线 -->
  <text x="40" y="52" font-size="12" font-weight="600" fill="var(--p)">离线：变更前</text>
  <rect x="40" y="62" width="180" height="64" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="130" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">线上日志采样</text>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="var(--fg)">脱敏后按场景分层抽样</text>

  <rect x="260" y="62" width="180" height="64" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="350" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">评估集</text>
  <text x="350" y="110" text-anchor="middle" font-size="11" fill="var(--fg)">黄金集 + 对抗样本，带版本</text>

  <rect x="480" y="62" width="180" height="64" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="570" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">离线评估</text>
  <text x="570" y="110" text-anchor="middle" font-size="11" fill="var(--fg)">规则 + Judge + 人工抽检</text>

  <line x1="220" y1="94" x2="258" y2="94" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="94" x2="478" y2="94" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右侧下行 -->
  <line x1="570" y1="126" x2="570" y2="184" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="160" font-size="11" fill="var(--muted)">对比基线</text>

  <!-- 下排：线上 -->
  <rect x="480" y="186" width="180" height="64" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="570" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">CI 门禁</text>
  <text x="570" y="234" text-anchor="middle" font-size="11" fill="var(--fg)">指标不低于基线才可合并</text>

  <rect x="260" y="186" width="180" height="64" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="350" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">灰度发布</text>
  <text x="350" y="234" text-anchor="middle" font-size="11" fill="var(--fg)">影子流量 / A/B / 按比例放量</text>

  <rect x="40" y="186" width="180" height="64" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="130" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">线上监控</text>
  <text x="130" y="234" text-anchor="middle" font-size="11" fill="var(--fg)">质量、延迟、Token、反馈</text>

  <line x1="480" y1="218" x2="442" y2="218" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="218" x2="222" y2="218" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 左侧回流 -->
  <line x1="130" y1="186" x2="130" y2="128" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="160" font-size="11" fill="var(--muted)">差评与失败样本回流</text>

  <text x="40" y="276" font-size="12" font-weight="600" fill="var(--g)">线上：变更后</text>
</svg>
