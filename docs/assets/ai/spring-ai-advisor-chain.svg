<svg viewBox="0 0 600 492" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="600" height="492" fill="var(--bg)"/>

  <text x="300" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Spring AI 2.0 ChatClient 请求链路</text>

  <!-- 1 ChatClient (y=44..88) -->
  <rect x="100" y="44" width="360" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="var(--fg)">chatClient.prompt()：system / user / options / tools</text>

  <line x1="280" y1="88" x2="280" y2="122" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 Memory (y=124..184) -->
  <rect x="100" y="124" width="360" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">MessageChatMemoryAdvisor</text>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="var(--fg)">按 CONVERSATION_ID 读取历史，响应后写回</text>

  <line x1="280" y1="184" x2="280" y2="218" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 RAG (y=220..280) -->
  <rect x="100" y="220" width="360" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="280" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">QuestionAnswerAdvisor / RAG Advisor</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="var(--fg)">向量检索相关文档，拼进上下文</text>

  <line x1="280" y1="280" x2="280" y2="314" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 ToolCallingAdvisor (y=316..376) -->
  <rect x="100" y="316" width="360" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="280" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">ToolCallingAdvisor（自动注册）</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="var(--fg)">驱动工具循环：执行 @Tool，把结果回传模型</text>

  <line x1="280" y1="376" x2="280" y2="410" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5 ChatModel (y=412..472) -->
  <rect x="100" y="412" width="360" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="280" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">ChatModel</text>
  <text x="280" y="458" text-anchor="middle" font-size="11" fill="var(--fg)">OpenAI / Anthropic / Ollama 等厂商 API</text>

  <!-- loop: ChatModel -> ToolCallingAdvisor -->
  <path d="M460 442 H500 V346 H462" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="390" font-size="11" fill="var(--muted)">tool_calls</text>
  <text x="508" y="406" font-size="11" fill="var(--muted)">循环</text>
</svg>
