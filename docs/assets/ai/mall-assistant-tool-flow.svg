<svg viewBox="0 0 760 354" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="760" height="354" fill="var(--bg)"/>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">第 3 章：能直接查就直接查，否则让模型自己调工具</text>

  <!-- 左侧：用户消息与意图识别 -->
  <rect x="20" y="154" width="140" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="90" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">用户消息</text>
  <text x="90" y="202" text-anchor="middle" font-size="11" fill="var(--fg)">+ 请求头里的令牌</text>

  <rect x="205" y="154" width="150" height="70" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="280" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">意图识别</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="var(--fg)">抽出订单号 / 商品号</text>

  <line x1="160" y1="189" x2="203" y2="189" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 中间：两条路径与商城网关 -->
  <rect x="410" y="44" width="190" height="70" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="505" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">直接查询</text>
  <text x="505" y="92" text-anchor="middle" font-size="11" fill="var(--fg)">查询结果进提示词，不注册工具</text>

  <rect x="410" y="154" width="190" height="70" rx="6" fill="var(--muted)" fill-opacity="0.10" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="505" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">mall-evolution 网关</text>
  <text x="505" y="202" text-anchor="middle" font-size="11" fill="var(--muted)">9000 端口，别人的订单返回 404</text>

  <rect x="410" y="264" width="190" height="70" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="505" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">模型 ⇄ 工具</text>
  <text x="505" y="312" text-anchor="middle" font-size="11" fill="var(--fg)">ToolContext 带令牌，模型看不到</text>

  <line x1="355" y1="175" x2="408" y2="87" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="124" text-anchor="end" font-size="11" fill="var(--muted)">有订单号 / 商品号</text>

  <line x1="355" y1="203" x2="408" y2="291" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="266" text-anchor="end" font-size="11" fill="var(--muted)">否则</text>

  <line x1="505" y1="114" x2="505" y2="152" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="505" y1="264" x2="505" y2="226" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 右侧：回答 -->
  <rect x="640" y="154" width="100" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="690" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">回答</text>
  <text x="690" y="202" text-anchor="middle" font-size="11" fill="var(--fg)">阻塞 / 流式</text>

  <line x1="600" y1="87" x2="638" y2="173" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="291" x2="638" y2="205" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
