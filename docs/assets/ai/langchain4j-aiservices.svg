<svg viewBox="0 0 560 476" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="560" height="476" fill="var(--bg)"/>

  <text x="280" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">LangChain4j AiServices 调用链路</text>

  <!-- 1 业务代码 (y=44..88) -->
  <rect x="20" y="44" width="518" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="279" y="71" text-anchor="middle" font-size="13" fill="var(--fg)">业务代码调用接口方法：assistant.chat(userId, question)</text>

  <line x1="279" y1="88" x2="279" y2="122" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 代理 (y=124..184) -->
  <rect x="20" y="124" width="518" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="279" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">AiServices 动态代理</text>
  <text x="279" y="170" text-anchor="middle" font-size="11" fill="var(--fg)">解析 @SystemMessage / @UserMessage / @V，组装请求</text>

  <!-- arrows to 4 components -->
  <line x1="81" y1="184" x2="81" y2="218" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="213" y1="184" x2="213" y2="218" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="184" x2="345" y2="218" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="477" y1="184" x2="477" y2="218" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 components (y=220..280) -->
  <rect x="20" y="220" width="122" height="60" rx="6" fill="var(--r)" fill-opacity="0.10" stroke="var(--r)" stroke-width="1.5"/>
  <text x="81" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="var(--r)">InputGuardrail</text>
  <text x="81" y="266" text-anchor="middle" font-size="11" fill="var(--fg)">输入校验</text>

  <rect x="152" y="220" width="122" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="213" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="var(--g)">ChatMemory</text>
  <text x="213" y="266" text-anchor="middle" font-size="11" fill="var(--fg)">按 memoryId 隔离</text>

  <rect x="284" y="220" width="122" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="345" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="var(--b)">ContentRetriever</text>
  <text x="345" y="266" text-anchor="middle" font-size="11" fill="var(--fg)">RAG 检索</text>

  <rect x="416" y="220" width="122" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="477" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="var(--y)">Tools / MCP</text>
  <text x="477" y="266" text-anchor="middle" font-size="11" fill="var(--fg)">工具调用循环</text>

  <!-- arrows to ChatModel -->
  <line x1="81" y1="280" x2="81" y2="314" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="213" y1="280" x2="213" y2="314" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="280" x2="345" y2="314" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="477" y1="280" x2="477" y2="314" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 ChatModel (y=316..376) -->
  <rect x="20" y="316" width="518" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="279" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">ChatModel / StreamingChatModel</text>
  <text x="279" y="362" text-anchor="middle" font-size="11" fill="var(--muted)">OpenAI / Anthropic / Ollama 等实现，返回后经 OutputGuardrail 校验</text>

  <line x1="279" y1="376" x2="279" y2="410" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5 result (y=412..456) -->
  <rect x="20" y="412" width="518" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="279" y="439" text-anchor="middle" font-size="13" fill="var(--fg)">按方法返回类型转换：String / record / Result&lt;T&gt; / TokenStream</text>
</svg>
