<svg viewBox="0 0 890 342" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="arrow-api-e2e-exec" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="445" y="26" text-anchor="middle">一个 E2E 用例的执行与产物</text>
  <rect x="20" y="46" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="115" y="70" text-anchor="middle">① 准备</text>
  <text class="desc" x="115" y="92" text-anchor="middle">接口造数，带运行前缀</text>
  <text class="desc" x="115" y="110" text-anchor="middle">加载登录态 storageState</text>
  <line x1="210" y1="86" x2="238" y2="86" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <line x1="115" y1="126" x2="115" y2="160" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="20" y="162" width="190" height="80" rx="8" fill="var(--bg)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="115" y="186" text-anchor="middle">数据记录</text>
  <text class="desc" x="115" y="208" text-anchor="middle">运行 ID 与订单号</text>
  <text class="desc" x="115" y="226" text-anchor="middle">写入日志便于检索</text>
  <line x1="115" y1="242" x2="115" y2="276" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="240" y="46" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="335" y="70" text-anchor="middle">② 操作</text>
  <text class="desc" x="335" y="92" text-anchor="middle">getByTestId 定位</text>
  <text class="desc" x="335" y="110" text-anchor="middle">自动等待后点击、输入</text>
  <line x1="430" y1="86" x2="458" y2="86" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <line x1="335" y1="126" x2="335" y2="160" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="240" y="162" width="190" height="80" rx="8" fill="var(--bg)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="335" y="186" text-anchor="middle">trace.zip</text>
  <text class="desc" x="335" y="208" text-anchor="middle">每步 DOM 快照、网络</text>
  <text class="desc" x="335" y="226" text-anchor="middle">show-trace 回放</text>
  <line x1="335" y1="242" x2="335" y2="276" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="460" y="46" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="555" y="70" text-anchor="middle">③ 断言</text>
  <text class="desc" x="555" y="92" text-anchor="middle">Web-First 断言重试</text>
  <text class="desc" x="555" y="110" text-anchor="middle">必要时接口回查状态</text>
  <line x1="650" y1="86" x2="678" y2="86" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <line x1="555" y1="126" x2="555" y2="160" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="460" y="162" width="190" height="80" rx="8" fill="var(--bg)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="555" y="186" text-anchor="middle">失败截图</text>
  <text class="desc" x="555" y="208" text-anchor="middle">失败时整页截图</text>
  <text class="desc" x="555" y="226" text-anchor="middle">附上后端 traceId</text>
  <line x1="555" y1="242" x2="555" y2="276" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="680" y="46" width="190" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="775" y="70" text-anchor="middle">④ 清理</text>
  <text class="desc" x="775" y="92" text-anchor="middle">接口删除本用例数据</text>
  <text class="desc" x="775" y="110" text-anchor="middle">关闭 BrowserContext</text>
  <line x1="775" y1="126" x2="775" y2="160" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="680" y="162" width="190" height="80" rx="8" fill="var(--bg)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="775" y="186" text-anchor="middle">测试报告</text>
  <text class="desc" x="775" y="208" text-anchor="middle">JUnit XML / HTML</text>
  <text class="desc" x="775" y="226" text-anchor="middle">Flake 单独标记</text>
  <line x1="775" y1="242" x2="775" y2="276" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-api-e2e-exec)"/>
  <rect x="20" y="278" width="850" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="445" y="305" text-anchor="middle">CI 上传为构建产物：失败用例附 trace 与截图，链接贴到 PR 或告警消息</text>
</svg>
