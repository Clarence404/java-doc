<svg viewBox="0 0 850 404" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>

  <defs>
    <marker id="arrow-perf-workload" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="425" y="26" text-anchor="middle">闭合模型与开放模型：系统变慢时，压力怎么变</text>
  <rect x="20" y="46" width="395" height="338" rx="10" fill="var(--bg)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="217.5" y="72" text-anchor="middle">闭合模型：固定并发（VU 数）</text>
  <text class="desc" x="217.5" y="92" text-anchor="middle">k6 constant-vus / ramping-vus，Gatling injectClosed</text>
  <rect x="60" y="108" width="335" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="227.5" y="134" text-anchor="middle">负载生成器：N 个 VU</text>
  <text class="desc" x="227.5" y="156" text-anchor="middle">每个 VU 收到响应后才发下一个请求</text>
  <line x1="227.5" y1="172" x2="227.5" y2="206" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-perf-workload)"/>
  <text class="label" x="240" y="194">请求</text>
  <rect x="60" y="208" width="335" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="227.5" y="234" text-anchor="middle">被测系统 order-service</text>
  <text class="desc" x="227.5" y="256" text-anchor="middle">响应时间 R 变长（GC、锁、慢 SQL）</text>
  <path d="M60,240 L40,240 L40,140 L58,140" fill="none" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-perf-workload)"/>
  <rect x="40" y="308" width="355" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="217.5" y="332" text-anchor="middle">吞吐 ≈ N ÷ (R + 思考时间)</text>
  <text class="desc" x="217.5" y="354" text-anchor="middle">R 变长 → 发送变慢 → 压力被动下降，长尾被低估</text>
  <rect x="435" y="46" width="395" height="338" rx="10" fill="var(--bg)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="632.5" y="72" text-anchor="middle">开放模型：固定到达率（λ 次/秒）</text>
  <text class="desc" x="632.5" y="92" text-anchor="middle">k6 *-arrival-rate 执行器，Gatling injectOpen</text>
  <rect x="475" y="108" width="335" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="642.5" y="134" text-anchor="middle">负载生成器：到达速率 λ</text>
  <text class="desc" x="642.5" y="156" text-anchor="middle">按时间表启动请求，不等上一个返回</text>
  <line x1="642.5" y1="172" x2="642.5" y2="206" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-perf-workload)"/>
  <text class="label" x="655" y="194">请求</text>
  <rect x="475" y="208" width="335" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="642.5" y="234" text-anchor="middle">被测系统 order-service</text>
  <text class="desc" x="642.5" y="256" text-anchor="middle">响应时间 R 变长（GC、锁、慢 SQL）</text>
  <rect x="455" y="308" width="355" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="632.5" y="332" text-anchor="middle">在途请求 ≈ λ × R（Little 定律）</text>
  <text class="desc" x="632.5" y="354" text-anchor="middle">R 变长 → 在途请求与 VU 增加 → 排队如实计入延迟</text>
</svg>
