<svg viewBox="0 0 760 510" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .yes { font-size:11px; font-weight:700; fill:var(--g); }
    .no { font-size:11px; font-weight:700; fill:var(--r); }
  </style>
  <defs>
    <marker id="arrow-mock-decision" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="380" y="24" text-anchor="middle">这个依赖要不要 Mock：从上往下逐条判断</text>

  <!-- Q1 -->
  <rect x="20" y="42" width="380" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="210" y="66" text-anchor="middle">值对象、纯计算或进程内的简单协作者？</text>
  <text class="desc" x="210" y="88" text-anchor="middle">如 OrderItem、Money、价格计算器</text>
  <line x1="400" y1="72" x2="468" y2="72" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="yes" x="434" y="66" text-anchor="middle">是</text>
  <rect x="470" y="42" width="270" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="605" y="66" text-anchor="middle">用真实对象</text>
  <text class="desc" x="605" y="88" text-anchor="middle">直接 new，不要替身</text>
  <line x1="210" y1="102" x2="210" y2="136" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="no" x="220" y="123">否</text>

  <!-- Q2 -->
  <rect x="20" y="138" width="380" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="210" y="162" text-anchor="middle">自己定义的仓储 / 存储接口？</text>
  <text class="desc" x="210" y="184" text-anchor="middle">如 OrderRepository</text>
  <line x1="400" y1="168" x2="468" y2="168" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="yes" x="434" y="162" text-anchor="middle">是</text>
  <rect x="470" y="138" width="270" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="605" y="162" text-anchor="middle">Fake：内存实现</text>
  <text class="desc" x="605" y="184" text-anchor="middle">真实实现交给集成测试</text>
  <line x1="210" y1="198" x2="210" y2="232" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="no" x="220" y="219">否</text>

  <!-- Q3 -->
  <rect x="20" y="234" width="380" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="210" y="258" text-anchor="middle">外部 HTTP 服务或第三方 SDK？</text>
  <text class="desc" x="210" y="280" text-anchor="middle">支付网关、短信、物流</text>
  <line x1="400" y1="264" x2="468" y2="264" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="yes" x="434" y="258" text-anchor="middle">是</text>
  <rect x="470" y="234" width="270" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="605" y="258" text-anchor="middle">包一层自己的接口</text>
  <text class="desc" x="605" y="280" text-anchor="middle">业务测 Mock 接口，适配器用 WireMock</text>
  <line x1="210" y1="294" x2="210" y2="328" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="no" x="220" y="315">否</text>

  <!-- Q4 -->
  <rect x="20" y="330" width="380" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="210" y="354" text-anchor="middle">要验证的就是「发出了这个调用」？</text>
  <text class="desc" x="210" y="376" text-anchor="middle">扣款、发事件、发通知等副作用</text>
  <line x1="400" y1="360" x2="468" y2="360" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="yes" x="434" y="354" text-anchor="middle">是</text>
  <rect x="470" y="330" width="270" height="60" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="605" y="354" text-anchor="middle">Mock + verify</text>
  <text class="desc" x="605" y="376" text-anchor="middle">配合 ArgumentCaptor 校验参数</text>
  <line x1="210" y1="390" x2="210" y2="424" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-mock-decision)"/>
  <text class="no" x="220" y="411">否</text>

  <!-- Result -->
  <rect x="20" y="426" width="380" height="60" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="210" y="450" text-anchor="middle">Stub：只返回预设值</text>
  <text class="desc" x="210" y="472" text-anchor="middle">断言被测对象的返回值与状态，不 verify 查询调用</text>
</svg>
