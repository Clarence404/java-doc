<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12" role="img" aria-label="Istio 控制面与数据面">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .pan { rx:8; ry:8; fill:var(--bg); stroke-width:1.5; }
    .ttl { font-weight:700; font-size:13px; }
    .sub { font-size:11px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect class="box" x="140" y="20" width="400" height="70" stroke="var(--p)"/>
  <text class="ttl" x="340" y="44" text-anchor="middle" fill="var(--p)">istiod（控制面，单一二进制）</text>
  <text x="207" y="72" text-anchor="middle" fill="var(--fg)" font-size="11">xDS 配置下发</text>
  <text x="340" y="72" text-anchor="middle" fill="var(--fg)" font-size="11">服务发现</text>
  <text x="473" y="72" text-anchor="middle" fill="var(--fg)" font-size="11">CA 证书签发</text>
  <line class="arr" x1="240" y1="90" x2="170" y2="134"/>
  <line class="arr" x1="440" y1="90" x2="510" y2="134"/>
  <text class="sub" x="340" y="118" text-anchor="middle">xDS 推送路由与策略 / 下发证书</text>
  <rect class="box" x="20" y="136" width="280" height="64" stroke="var(--g)"/>
  <text class="ttl" x="160" y="160" text-anchor="middle" fill="var(--g)">Pod A：order-service</text>
  <text class="sub" x="160" y="182" text-anchor="middle">Envoy Sidecar（数据面）</text>
  <line class="arr" x1="300" y1="168" x2="378" y2="168"/>
  <text class="sub" x="339" y="160" text-anchor="middle">mTLS</text>
  <rect class="box" x="380" y="136" width="280" height="64" stroke="var(--g)"/>
  <text class="ttl" x="520" y="160" text-anchor="middle" fill="var(--g)">Pod B：payment-service</text>
  <text class="sub" x="520" y="182" text-anchor="middle">Envoy Sidecar（数据面）</text>
</svg>
