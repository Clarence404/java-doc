  <rect class="card" x="115" y="344" width="60" height="60" rx="6"/>
  <text x="145" y="370" text-anchor="middle">a[1]</text>
  <text x="145" y="390" text-anchor="middle" class="muted" font-size="12">sum=3</text>
  <rect class="card" x="185" y="344" width="60" height="60" rx="6"/>
  <text x="215" y="370" text-anchor="middle">a[2]</text>
  <text x="215" y="390" text-anchor="middle" class="muted" font-size="12">sum=5</text>
  <rect class="card" x="255" y="344" width="60" height="60" rx="6"/>
  <text x="285" y="370" text-anchor="middle">a[3]</text>
  <text x="285" y="390" text-anchor="middle" class="muted" font-size="12">sum=7</text>
  <rect class="card" x="325" y="344" width="60" height="60" rx="6"/>
  <text x="355" y="370" text-anchor="middle">a[4]</text>
