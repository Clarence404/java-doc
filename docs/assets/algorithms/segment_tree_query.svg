  <line class="edge" x1="320" y1="104" x2="460" y2="144"/>
  <rect class="hb" x="200" y="44" width="240" height="60" rx="6"/>
  <text x="320" y="70" text-anchor="middle">[0, 7]</text>
  <text x="320" y="90" text-anchor="middle" class="muted" font-size="12">sum=64</text>
  <rect class="hb" x="80" y="144" width="200" height="60" rx="6"/>
  <text x="180" y="170" text-anchor="middle">[0, 3]</text>
  <text x="180" y="190" text-anchor="middle" class="muted" font-size="12">sum=16</text>
  <rect class="hb" x="360" y="144" width="200" height="60" rx="6"/>
