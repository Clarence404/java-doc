  <text x="565" y="370" text-anchor="middle">a[7]</text>
  <text x="565" y="390" text-anchor="middle" class="muted" font-size="12">sum=15</text>
  <rect class="hg" x="60" y="424" width="14" height="14" rx="3"/>
  <text x="82" y="436">完全落在 [2, 6] 内：直接取用，不再向下</text>
  <rect class="hb" x="360" y="424" width="14" height="14" rx="3"/>
  <text x="382" y="436">部分重叠：继续拆到左右孩子</text>
