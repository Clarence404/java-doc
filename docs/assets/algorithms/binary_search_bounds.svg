<svg viewBox="0 0 640 228" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .hb{fill:var(--card);stroke:var(--b);stroke-width:2;}
    .hg{fill:var(--card);stroke:var(--g);stroke-width:2;}
    .hr{fill:var(--card);stroke:var(--r);stroke-width:2;}
    .hp{fill:var(--card);stroke:var(--p);stroke-width:2;}
    .lb{fill:var(--b);font-weight:700;}
    .lg{fill:var(--g);font-weight:700;}
    .lr{fill:var(--r);font-weight:700;}
    .lp{fill:var(--p);font-weight:700;}
    .arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ah);}
    .dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:4 3;}
    .ring{stroke:var(--b);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .ring2{stroke:var(--g);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .bar-ok{fill:var(--g);fill-opacity:0.25;stroke:var(--g);stroke-width:1.5;}
    .bar-no{fill:var(--border);fill-opacity:0.5;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;}
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text font-weight="700" x="320" y="26" text-anchor="middle" font-size="14">target = 2 时 lowerBound 与 upperBound 的位置</text>
  <text x="120" y="138" text-anchor="end" class="muted">nums</text>
  <rect class="card" x="140" y="110" width="60" height="44" rx="6"/>
  <text x="170" y="138" text-anchor="middle">1</text>
  <text x="170" y="176" text-anchor="middle" class="muted" font-size="12">下标 0</text>
  <rect class="hb" x="210" y="110" width="60" height="44" rx="6"/>
  <text x="240" y="138" text-anchor="middle">2</text>
  <text x="240" y="176" text-anchor="middle" class="muted" font-size="12">下标 1</text>
  <rect class="hb" x="280" y="110" width="60" height="44" rx="6"/>
  <text x="310" y="138" text-anchor="middle">2</text>
  <text x="310" y="176" text-anchor="middle" class="muted" font-size="12">下标 2</text>
  <rect class="hb" x="350" y="110" width="60" height="44" rx="6"/>
  <text x="380" y="138" text-anchor="middle">2</text>
  <text x="380" y="176" text-anchor="middle" class="muted" font-size="12">下标 3</text>
  <rect class="card" x="420" y="110" width="60" height="44" rx="6"/>
  <text x="450" y="138" text-anchor="middle">3</text>
  <text x="450" y="176" text-anchor="middle" class="muted" font-size="12">下标 4</text>
  <rect class="card" x="490" y="110" width="60" height="44" rx="6"/>
  <text x="520" y="138" text-anchor="middle">5</text>
  <text x="520" y="176" text-anchor="middle" class="muted" font-size="12">下标 5</text>
  <text x="240" y="62" text-anchor="middle" class="lg">lowerBound = 1（第一个 ≥ 2）</text>
  <line class="arr" x1="240" y1="72" x2="240" y2="108"/>
  <text x="450" y="62" text-anchor="middle" class="lr">upperBound = 4（第一个 &gt; 2）</text>
  <line class="arr" x1="450" y1="72" x2="450" y2="108"/>
  <text x="320" y="208" text-anchor="middle" class="muted" font-size="12">最后一个 ≤ 2 的下标 = upperBound − 1 = 3，出现次数 = 4 − 1 = 3</text>
</svg>
