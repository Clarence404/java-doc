<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .hb{fill:var(--card);stroke:var(--b);stroke-width:2;}
    .hg{fill:var(--card);stroke:var(--g);stroke-width:2;}
    .hr{fill:var(--card);stroke:var(--r);stroke-width:2;}
    .hp{fill:var(--card);stroke:var(--p);stroke-width:2;}
    .lb{fill:var(--b);font-weight:700;}
    .lg{fill:var(--g);font-weight:700;}
    .lr{fill:var(--r);font-weight:700;}
    .lp{fill:var(--p);font-weight:700;}
    .arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ah);}
    .dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:4 3;}
    .ring{stroke:var(--b);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .ring2{stroke:var(--g);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .bar-ok{fill:var(--g);fill-opacity:0.25;stroke:var(--g);stroke-width:1.5;}
    .bar-no{fill:var(--border);fill-opacity:0.5;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;}
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text font-weight="700" x="380" y="26" text-anchor="middle" font-size="14">按结束时间排序后，开始时间 ≥ 上一个选中区间的结束时间就选</text>
  <text x="100" y="66" text-anchor="end">[1, 3]</text>
  <rect class="bar-ok" x="164" y="50" width="88" height="22" rx="4"/>
  <text x="580" y="66" text-anchor="start" class="lg" font-size="12">选中，end = 3</text>
  <text x="100" y="100" text-anchor="end">[2, 5]</text>
  <rect class="bar-no" x="208" y="84" width="132" height="22" rx="4"/>
  <text x="580" y="100" text-anchor="start" class="muted" font-size="12">跳过：2 &lt; 3</text>
  <text x="100" y="134" text-anchor="end">[4, 6]</text>
  <rect class="bar-ok" x="296" y="118" width="88" height="22" rx="4"/>
  <text x="580" y="134" text-anchor="start" class="lg" font-size="12">选中，end = 6</text>
  <text x="100" y="168" text-anchor="end">[6, 8]</text>
  <rect class="bar-ok" x="384" y="152" width="88" height="22" rx="4"/>
  <text x="580" y="168" text-anchor="start" class="lg" font-size="12">选中，end = 8</text>
  <text x="100" y="202" text-anchor="end">[5, 9]</text>
  <rect class="bar-no" x="340" y="186" width="176" height="22" rx="4"/>
  <text x="580" y="202" text-anchor="start" class="muted" font-size="12">跳过：5 &lt; 8</text>
  <text x="100" y="236" text-anchor="end">[8, 10]</text>
  <rect class="bar-ok" x="472" y="220" width="88" height="22" rx="4"/>
  <text x="580" y="236" text-anchor="start" class="lg" font-size="12">选中，end = 10</text>
  <line x1="120" y1="262" x2="560" y2="262" stroke="var(--muted)" stroke-width="1.2"/>
  <text x="120" y="280" text-anchor="middle" class="muted" font-size="12">0</text>
  <text x="164" y="280" text-anchor="middle" class="muted" font-size="12">1</text>
  <text x="208" y="280" text-anchor="middle" class="muted" font-size="12">2</text>
  <text x="252" y="280" text-anchor="middle" class="muted" font-size="12">3</text>
  <text x="296" y="280" text-anchor="middle" class="muted" font-size="12">4</text>
  <text x="340" y="280" text-anchor="middle" class="muted" font-size="12">5</text>
  <text x="384" y="280" text-anchor="middle" class="muted" font-size="12">6</text>
  <text x="428" y="280" text-anchor="middle" class="muted" font-size="12">7</text>
  <text x="472" y="280" text-anchor="middle" class="muted" font-size="12">8</text>
  <text x="516" y="280" text-anchor="middle" class="muted" font-size="12">9</text>
  <text x="560" y="280" text-anchor="middle" class="muted" font-size="12">10</text>
  <text x="380" y="310" text-anchor="middle" class="muted" font-size="12">共选出 4 个互不重叠的区间；LeetCode 435 的答案 = 6 − 4 = 2</text>
</svg>
