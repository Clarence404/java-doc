<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">JetCache 架构</text>

  <!-- 第一层：入口 -->
  <rect x="110" y="44" width="220" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="220" y="68" text-anchor="middle" class="name">方法注解</text>
  <text x="220" y="88" text-anchor="middle" class="desc">@Cached / @CacheInvalidate</text>
  <rect x="390" y="44" width="220" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="500" y="68" text-anchor="middle" class="name">编程式 API</text>
  <text x="500" y="88" text-anchor="middle" class="desc">CacheManager + QuickConfig</text>

  <!-- 第二层：统一 Cache API -->
  <rect x="110" y="134" width="500" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="360" y="158" text-anchor="middle" class="name">统一 Cache 接口（BOTH 时为 MultiLevelCache）</text>
  <text x="360" y="178" text-anchor="middle" class="desc">key 转换、序列化、空值缓存、加载合并、自动刷新、统计</text>

  <!-- 第三层：本地与远程 -->
  <rect x="110" y="224" width="220" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="220" y="248" text-anchor="middle" class="name">本地缓存 L1</text>
  <text x="220" y="268" text-anchor="middle" class="desc">Caffeine / LinkedHashMap</text>
  <rect x="390" y="224" width="220" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="500" y="248" text-anchor="middle" class="name">远程缓存 L2</text>
  <text x="500" y="268" text-anchor="middle" class="desc">Redis（Lettuce / Jedis）</text>

  <!-- 第四层：其他实例 -->
  <rect x="390" y="314" width="220" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="500" y="338" text-anchor="middle" class="name">其他实例的 L1</text>
  <text x="500" y="358" text-anchor="middle" class="desc">收到通知后删除本地条目</text>

  <!-- 箭头 -->
  <line x1="220" y1="104" x2="220" y2="132" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="104" x2="500" y2="132" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="194" x2="220" y2="222" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="194" x2="500" y2="222" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="284" x2="500" y2="312" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="492" y="303" text-anchor="end" class="desc">broadcastChannel 失效通知</text>

  <text x="360" y="400" text-anchor="middle" class="lbl">未配置 broadcastChannel 时，更新只影响本实例 L1 与远程 L2，其他实例 L1 等到过期</text>
</svg>
