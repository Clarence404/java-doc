<svg viewBox="0 0 720 376" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">Thread.State 六种状态与转换</text>
  <rect x="260" y="44" width="200" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="360" y="68" text-anchor="middle" class="name">BLOCKED</text>
  <text x="360" y="88" text-anchor="middle" class="desc">等待进入 synchronized</text>
  <rect x="30" y="170" width="130" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="95" y="194" text-anchor="middle" class="name">NEW</text>
  <text x="95" y="214" text-anchor="middle" class="desc">已创建、未 start</text>
  <rect x="260" y="170" width="200" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="360" y="194" text-anchor="middle" class="name">RUNNABLE</text>
  <text x="360" y="214" text-anchor="middle" class="desc">就绪或运行中（含阻塞 IO）</text>
  <rect x="560" y="170" width="130" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="625" y="194" text-anchor="middle" class="name">TERMINATED</text>
  <text x="625" y="214" text-anchor="middle" class="desc">run() 已结束</text>
  <rect x="150" y="296" width="180" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="240" y="320" text-anchor="middle" class="name">WAITING</text>
  <text x="240" y="340" text-anchor="middle" class="desc">wait() / join() / park()</text>
  <rect x="390" y="296" width="180" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="480" y="320" text-anchor="middle" class="name">TIMED_WAITING</text>
  <text x="480" y="340" text-anchor="middle" class="desc">sleep / wait(t) / parkNanos</text>
  <line x1="160" y1="200" x2="258" y2="200" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="209" y="192" text-anchor="middle" class="lbl">start()</text>
  <line x1="460" y1="200" x2="558" y2="200" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="509" y="192" text-anchor="middle" class="lbl">执行结束</text>
  <path d="M320,170 L320,106" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="312" y="142" text-anchor="end" class="lbl">抢 monitor 失败</text>
  <path d="M400,104 L400,168" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="408" y="142" text-anchor="start" class="lbl">获得 monitor</text>
  <path d="M275,230 L275,294" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="267" y="268" text-anchor="end" class="lbl">进入等待</text>
  <path d="M315,296 L315,232" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M405,296 L405,232" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="360" y="268" text-anchor="middle" class="lbl">唤醒 / 超时</text>
  <path d="M445,230 L445,294" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="453" y="268" text-anchor="start" class="lbl">进入限时等待</text>
</svg>
