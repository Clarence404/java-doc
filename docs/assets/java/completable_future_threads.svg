<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" class="title">CompletableFuture 回调由哪个线程执行</text>
  <rect x="20" y="50" width="260" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="150" y="76" text-anchor="middle" class="name">thenApply(fn)</text>
  <text x="150" y="96" text-anchor="middle" class="desc">同步变体</text>
  <rect x="340" y="50" width="400" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="540" y="76" text-anchor="middle" class="name">上游未完成：由完成上游的那个线程执行</text>
  <text x="540" y="96" text-anchor="middle" class="desc">上游已完成：由调用 thenApply 的线程立即执行</text>
  <line x1="280" y1="80" x2="338" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="140" width="260" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="150" y="166" text-anchor="middle" class="name">thenApplyAsync(fn)</text>
  <text x="150" y="186" text-anchor="middle" class="desc">Async，不传执行器</text>
  <rect x="340" y="140" width="400" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="540" y="166" text-anchor="middle" class="name">ForkJoinPool.commonPool()</text>
  <text x="540" y="186" text-anchor="middle" class="desc">commonPool 并行度 &lt; 2 时每个任务新建一个线程</text>
  <line x1="280" y1="170" x2="338" y2="170" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="230" width="260" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="150" y="256" text-anchor="middle" class="name">thenApplyAsync(fn, executor)</text>
  <text x="150" y="276" text-anchor="middle" class="desc">Async，传入执行器</text>
  <rect x="340" y="230" width="400" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="540" y="256" text-anchor="middle" class="name">提交到传入的 executor</text>
  <text x="540" y="276" text-anchor="middle" class="desc">生产代码推荐：线程池隔离、可命名、可监控</text>
  <line x1="280" y1="260" x2="338" y2="260" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
