<svg viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" class="title">CompletableFuture 异常沿链传播</text>
  <rect x="20" y="50" width="120" height="60" rx="6" fill="var(--r)" fill-opacity="0.10" stroke="var(--r)" stroke-width="1.5"/>
  <text x="80" y="76" text-anchor="middle" class="name">supplyAsync</text>
  <text x="80" y="96" text-anchor="middle" class="desc">抛出 IOException</text>
  <rect x="170" y="50" width="120" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="230" y="76" text-anchor="middle" class="name">thenApply</text>
  <text x="230" y="96" text-anchor="middle" class="desc">跳过，不执行</text>
  <rect x="320" y="50" width="120" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="380" y="76" text-anchor="middle" class="name">whenComplete</text>
  <text x="380" y="96" text-anchor="middle" class="desc">执行，结果不变</text>
  <rect x="470" y="50" width="120" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="530" y="76" text-anchor="middle" class="name">exceptionally</text>
  <text x="530" y="96" text-anchor="middle" class="desc">返回默认值</text>
  <rect x="620" y="50" width="120" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="680" y="76" text-anchor="middle" class="name">thenApply</text>
  <text x="680" y="96" text-anchor="middle" class="desc">正常执行</text>
  <line x1="140" y1="80" x2="168" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="80" x2="318" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="80" x2="468" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="80" x2="618" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="150" width="420" height="60" rx="6" fill="var(--r)" fill-opacity="0.06" stroke="var(--r)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="230" y="176" text-anchor="middle" class="name">异常沿链传播，中间的 thenApply 被跳过</text>
  <text x="230" y="196" text-anchor="middle" class="desc">下游拿到 CompletionException，getCause() 才是 IOException</text>
  <rect x="470" y="150" width="270" height="60" rx="6" fill="var(--g)" fill-opacity="0.06" stroke="var(--g)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="605" y="176" text-anchor="middle" class="name">exceptionally 返回默认值</text>
  <text x="605" y="196" text-anchor="middle" class="desc">之后的阶段按正常结果继续执行</text>
</svg>
