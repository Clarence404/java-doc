<svg viewBox="0 0 720 356" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">ThreadLocalMap：弱引用 key、强引用 value</text>
  <rect x="40" y="44" width="200" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="140" y="68" text-anchor="middle" class="name">ThreadLocal 实例</text>
  <text x="140" y="88" text-anchor="middle" class="desc">通常由 static final 字段持有</text>
  <rect x="480" y="44" width="200" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="580" y="68" text-anchor="middle" class="name">Thread（池化线程）</text>
  <text x="580" y="88" text-anchor="middle" class="desc">长期存活，不会被回收</text>
  <rect x="40" y="160" width="200" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="140" y="184" text-anchor="middle" class="name">Entry.key</text>
  <text x="140" y="204" text-anchor="middle" class="desc">WeakReference 指向 ThreadLocal</text>
  <rect x="480" y="160" width="200" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="580" y="184" text-anchor="middle" class="name">ThreadLocalMap</text>
  <text x="580" y="204" text-anchor="middle" class="desc">Entry[] 数组，开放寻址</text>
  <line x1="140" y1="160" x2="140" y2="106" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="148" y="138" text-anchor="start" class="lbl">弱引用</text>
  <line x1="580" y1="104" x2="580" y2="158" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="588" y="136" text-anchor="start" class="lbl">threadLocals 字段</text>
  <line x1="480" y1="190" x2="242" y2="190" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="361" y="182" text-anchor="middle" class="lbl">table[i] 中的 key</text>
  <line x1="580" y1="220" x2="580" y2="274" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="588" y="252" text-anchor="start" class="lbl">强引用</text>
  <rect x="40" y="276" width="420" height="60" rx="4" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="250" y="300" text-anchor="middle" class="desc">ThreadLocal 被回收后 key 变为 null，value 仍然可达</text>
  <text x="250" y="320" text-anchor="middle" class="desc">引用链 Thread → Map → Entry → value，直到 remove() 才断开</text>
  <rect x="480" y="276" width="200" height="60" rx="4" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="580" y="300" text-anchor="middle" class="name">Entry.value</text>
  <text x="580" y="320" text-anchor="middle" class="desc">任务数据，强引用</text>
</svg>
