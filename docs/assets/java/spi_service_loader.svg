<svg viewBox="0 0 862 228" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .txt   { font-size: 12px; }
    .note  { font-size: 11px; fill: var(--muted); }
    .mono  { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .stale { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="431" y="24" text-anchor="middle" class="title">ServiceLoader 加载流程</text>
  <rect x="20" y="44" width="180" height="80" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="110" y="68" text-anchor="middle" class="name">① ServiceLoader.load(S)</text>
  <text x="110" y="89" text-anchor="middle" class="txt">创建加载器</text>
  <text x="110" y="108" text-anchor="middle" class="note">此时不读文件</text>
  <line x1="200" y1="84" x2="232" y2="84" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="234" y="44" width="180" height="80" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="324" y="68" text-anchor="middle" class="name">② TCCL 查找资源</text>
  <text x="324" y="89" text-anchor="middle" class="txt">META-INF/services/</text>
  <text x="324" y="108" text-anchor="middle" class="note">接口全限定名</text>
  <line x1="414" y1="84" x2="446" y2="84" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="448" y="44" width="180" height="80" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="538" y="68" text-anchor="middle" class="name">③ 懒解析类名</text>
  <text x="538" y="89" text-anchor="middle" class="txt">iterator() 或 stream()</text>
  <text x="538" y="108" text-anchor="middle" class="note">前进一步解析一个</text>
  <line x1="628" y1="84" x2="660" y2="84" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="662" y="44" width="180" height="80" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="752" y="68" text-anchor="middle" class="name">④ 实例化</text>
  <text x="752" y="89" text-anchor="middle" class="txt">next() 或 Provider.get()</text>
  <text x="752" y="108" text-anchor="middle" class="note">调用无参构造器</text>
  <rect x="20" y="164" width="822" height="44" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="225" y="191" text-anchor="middle" class="txt">iterator()：解析一个、实例化一个，结果会缓存</text>
  <text x="637" y="191" text-anchor="middle" class="txt">stream()：Provider.type() 只加载类，get() 才实例化</text>
  <line x1="538" y1="124" x2="538" y2="162" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
