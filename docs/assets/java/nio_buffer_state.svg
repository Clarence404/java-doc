<svg viewBox="0 0 720 410" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .txt   { font-size: 12px; }
    .note  { font-size: 11px; fill: var(--muted); }
    .mono  { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .stale { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">ByteBuffer 指针变化（capacity = 8）</text>
  <rect x="20" y="44" width="160" height="64" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="100" y="70" text-anchor="middle" class="name">① put("HELLO")</text>
  <text x="100" y="90" text-anchor="middle" class="note">写模式</text>
  <rect x="210" y="48" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="234" y="72" text-anchor="middle" class="mono">H</text>
  <rect x="266" y="48" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="290" y="72" text-anchor="middle" class="mono">E</text>
  <rect x="322" y="48" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="346" y="72" text-anchor="middle" class="mono">L</text>
  <rect x="378" y="48" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="402" y="72" text-anchor="middle" class="mono">L</text>
  <rect x="434" y="48" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="458" y="72" text-anchor="middle" class="mono">O</text>
  <rect x="490" y="48" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <rect x="546" y="48" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <rect x="602" y="48" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="430" y="104" text-anchor="middle" class="note">position = 5，limit = 8：还能写 3 字节</text>
  <rect x="20" y="128" width="160" height="64" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="100" y="154" text-anchor="middle" class="name">② flip()</text>
  <text x="100" y="174" text-anchor="middle" class="note">切换为读模式</text>
  <rect x="210" y="132" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="234" y="156" text-anchor="middle" class="mono">H</text>
  <rect x="266" y="132" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="290" y="156" text-anchor="middle" class="mono">E</text>
  <rect x="322" y="132" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="346" y="156" text-anchor="middle" class="mono">L</text>
  <rect x="378" y="132" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="402" y="156" text-anchor="middle" class="mono">L</text>
  <rect x="434" y="132" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="458" y="156" text-anchor="middle" class="mono">O</text>
  <rect x="490" y="132" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <rect x="546" y="132" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <rect x="602" y="132" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="430" y="188" text-anchor="middle" class="note">position = 0，limit = 5：可读 5 字节</text>
  <rect x="20" y="212" width="160" height="64" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="100" y="238" text-anchor="middle" class="name">③ get() × 3</text>
  <text x="100" y="258" text-anchor="middle" class="note">读出 H、E、L</text>
  <rect x="210" y="216" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="234" y="240" text-anchor="middle" class="mono">H</text>
  <rect x="266" y="216" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="290" y="240" text-anchor="middle" class="mono">E</text>
  <rect x="322" y="216" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="346" y="240" text-anchor="middle" class="mono">L</text>
  <rect x="378" y="216" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="402" y="240" text-anchor="middle" class="mono">L</text>
  <rect x="434" y="216" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="458" y="240" text-anchor="middle" class="mono">O</text>
  <rect x="490" y="216" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <rect x="546" y="216" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <rect x="602" y="216" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="430" y="272" text-anchor="middle" class="note">position = 3，limit = 5：还剩 2 字节未读</text>
  <rect x="20" y="296" width="160" height="64" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="100" y="322" text-anchor="middle" class="name">④ compact()</text>
  <text x="100" y="342" text-anchor="middle" class="note">保留半包，继续写</text>
  <rect x="210" y="300" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="234" y="324" text-anchor="middle" class="mono">L</text>
  <rect x="266" y="300" width="48" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="290" y="324" text-anchor="middle" class="mono">O</text>
  <rect x="322" y="300" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="346" y="324" text-anchor="middle" class="stale">L</text>
  <rect x="378" y="300" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="402" y="324" text-anchor="middle" class="stale">L</text>
  <rect x="434" y="300" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="458" y="324" text-anchor="middle" class="stale">O</text>
  <rect x="490" y="300" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <rect x="546" y="300" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <rect x="602" y="300" width="48" height="36" rx="3" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="430" y="356" text-anchor="middle" class="note">position = 2，limit = 8：未读的 LO 移到开头，旧字节未擦除</text>
  <rect x="130" y="378" width="24" height="14" rx="2" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="162" y="389" class="note">position 到 limit 之间：当前可读或可写的区间</text>
  <text x="470" y="389" class="stale">L</text>
  <text x="484" y="389" class="note">灰字：已读过、未擦除的旧数据</text>
</svg>
