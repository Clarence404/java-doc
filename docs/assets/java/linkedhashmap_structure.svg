<svg viewBox="0 0 740 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .txt   { font-size: 12px; }
    .note  { font-size: 11px; fill: var(--muted); }
    .mono  { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .stale { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="370" y="24" text-anchor="middle" class="title">LinkedHashMap：哈希桶 + 双向链表</text>
  <rect x="20" y="44" width="330" height="252" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="185" y="68" text-anchor="middle" class="name">哈希桶：按 hash 定位</text>
  <rect x="49" y="84" width="56" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="77" y="107" text-anchor="middle" class="mono">[0]</text>
  <rect x="121" y="84" width="56" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="149" y="107" text-anchor="middle" class="mono">[1]</text>
  <rect x="193" y="84" width="56" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="221" y="107" text-anchor="middle" class="mono">[2]</text>
  <rect x="265" y="84" width="56" height="36" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="293" y="107" text-anchor="middle" class="mono">[3]</text>
  <rect x="49" y="160" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="77" y="183" text-anchor="middle" class="mono">A</text>
  <rect x="193" y="160" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="221" y="183" text-anchor="middle" class="mono">B</text>
  <rect x="265" y="160" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="293" y="183" text-anchor="middle" class="mono">C</text>
  <rect x="193" y="236" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="221" y="259" text-anchor="middle" class="mono">D</text>
  <line x1="77" y1="120" x2="77" y2="158" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="221" y1="120" x2="221" y2="158" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="293" y1="120" x2="293" y2="158" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="221" y1="196" x2="221" y2="234" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="370" y="44" width="350" height="252" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="545" y="68" text-anchor="middle" class="name">双向链表：before / after</text>
  <text x="545" y="106" text-anchor="middle" class="note">accessOrder = false：插入顺序</text>
  <text x="545" y="206" text-anchor="middle" class="note">accessOrder = true：get(B) 之后</text>
  <rect x="388" y="120" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="416" y="143" text-anchor="middle" class="mono">A</text>
  <line x1="446" y1="138" x2="472" y2="138" stroke="var(--fg)" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arrs)"/>
  <rect x="474" y="120" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="502" y="143" text-anchor="middle" class="mono">B</text>
  <line x1="532" y1="138" x2="558" y2="138" stroke="var(--fg)" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arrs)"/>
  <rect x="560" y="120" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="588" y="143" text-anchor="middle" class="mono">C</text>
  <line x1="618" y1="138" x2="644" y2="138" stroke="var(--fg)" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arrs)"/>
  <rect x="646" y="120" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="674" y="143" text-anchor="middle" class="mono">D</text>
  <text x="416" y="172" text-anchor="middle" class="note">head</text>
  <text x="674" y="172" text-anchor="middle" class="note">tail</text>
  <rect x="388" y="220" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="416" y="243" text-anchor="middle" class="mono">A</text>
  <line x1="446" y1="238" x2="472" y2="238" stroke="var(--fg)" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arrs)"/>
  <rect x="474" y="220" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="502" y="243" text-anchor="middle" class="mono">C</text>
  <line x1="532" y1="238" x2="558" y2="238" stroke="var(--fg)" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arrs)"/>
  <rect x="560" y="220" width="56" height="36" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="588" y="243" text-anchor="middle" class="mono">D</text>
  <line x1="618" y1="238" x2="644" y2="238" stroke="var(--fg)" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arrs)"/>
  <rect x="646" y="220" width="56" height="36" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="674" y="243" text-anchor="middle" class="mono">B</text>
  <text x="416" y="272" text-anchor="middle" class="note">head</text>
  <text x="674" y="272" text-anchor="middle" class="note">tail</text>
  <text x="370" y="320" text-anchor="middle" class="note">同一组 Entry 同时挂在哈希桶和双向链表上：查找走哈希桶，遍历与淘汰走链表（removeEldestEntry 删除 head）</text>
</svg>
