<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">历史查询：返回原始点还是聚合</text>

  <rect class="box" x="20" y="50" width="190" height="60" stroke="var(--b)"/>
  <text class="lbl" x="115" y="76" text-anchor="middle" fill="var(--b)">校验参数</text>
  <text class="sub" x="115" y="94" text-anchor="middle">1～8 个测点 · 跨度 1 分钟～30 天</text>
  <rect class="box" x="285" y="50" width="190" height="60" stroke="var(--p)"/>
  <text class="lbl" x="380" y="76" text-anchor="middle" fill="var(--p)">统计非空点数</text>
  <text class="sub" x="380" y="94" text-anchor="middle">一条 COUNT，每个测点一列</text>
  <rect class="box" x="550" y="50" width="190" height="60" stroke="var(--g)"/>
  <text class="lbl" x="645" y="76" text-anchor="middle" fill="var(--g)">原始模式 RAW</text>
  <text class="sub" x="645" y="94" text-anchor="middle">按时间升序返回 [ts, value]</text>
  <line class="arr" x1="210" y1="80" x2="283" y2="80"/>
  <line class="arr" x1="475" y1="80" x2="548" y2="80"/>
  <text class="sub" x="512" y="72" text-anchor="middle">都 ≤ 1000 点</text>

  <line class="arr" x1="380" y1="110" x2="380" y2="158"/>
  <text class="sub" x="390" y="139">任一测点 &gt; 1000 点</text>

  <rect class="box" x="20" y="160" width="190" height="60" stroke="var(--y)"/>
  <text class="lbl" x="115" y="186" text-anchor="middle" fill="var(--y)">桶宽档位</text>
  <text class="sub" x="115" y="204" text-anchor="middle">12 档里取桶数 ≤ 1000 的最小档</text>
  <rect class="box" x="285" y="160" width="190" height="60" stroke="var(--p)"/>
  <text class="lbl" x="380" y="186" text-anchor="middle" fill="var(--p)">聚合模式 AGG / LAST</text>
  <text class="sub" x="380" y="204" text-anchor="middle">date_bin 分桶 · 数值 avg/min/max</text>
  <rect class="box" x="550" y="160" width="190" height="60" stroke="var(--r)"/>
  <text class="lbl" x="645" y="186" text-anchor="middle" fill="var(--r)">补齐时间桶</text>
  <text class="sub" x="645" y="204" text-anchor="middle">空桶为 null，曲线在此断开</text>
  <line class="arr" x1="210" y1="190" x2="283" y2="190"/>
  <line class="arr" x1="475" y1="190" x2="548" y2="190"/>
</svg>
