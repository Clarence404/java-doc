<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .life { stroke:var(--border); stroke-width:1.5; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">多协议设备接入网关</text>
  <rect class="box" x="20" y="50" width="150" height="60" stroke="var(--y)"/>
  <text class="lbl" x="95" y="76" text-anchor="middle" fill="var(--y)">私有协议设备</text>
  <text class="sub" x="95" y="94" text-anchor="middle">TCP 二进制帧</text>
  <rect class="box" x="20" y="130" width="150" height="60" stroke="var(--y)"/>
  <text class="lbl" x="95" y="156" text-anchor="middle" fill="var(--y)">MQTT 设备</text>
  <text class="sub" x="95" y="174" text-anchor="middle">经 Broker 接入</text>
  <rect class="box" x="20" y="210" width="150" height="60" stroke="var(--y)"/>
  <text class="lbl" x="95" y="236" text-anchor="middle" fill="var(--y)">Modbus 设备</text>
  <text class="sub" x="95" y="254" text-anchor="middle">TCP / RTU 轮询</text>
  <rect class="box" x="220" y="50" width="170" height="60" stroke="var(--b)"/>
  <text class="lbl" x="305" y="76" text-anchor="middle" fill="var(--b)">Netty 协议适配器</text>
  <text class="sub" x="305" y="94" text-anchor="middle">拆帧 · CRC · 心跳</text>
  <rect class="box" x="220" y="130" width="170" height="60" stroke="var(--b)"/>
  <text class="lbl" x="305" y="156" text-anchor="middle" fill="var(--b)">MQTT 适配器</text>
  <text class="sub" x="305" y="174" text-anchor="middle">共享订阅</text>
  <rect class="box" x="220" y="210" width="170" height="60" stroke="var(--b)"/>
  <text class="lbl" x="305" y="236" text-anchor="middle" fill="var(--b)">Modbus 适配器</text>
  <text class="sub" x="305" y="254" text-anchor="middle">点表轮询</text>
  <rect class="box" x="440" y="50" width="130" height="220" stroke="var(--p)"/>
  <text class="lbl" x="505" y="148" text-anchor="middle" fill="var(--p)">统一消息</text>
  <text class="sub" x="505" y="166" text-anchor="middle">TelemetryMessage</text>
  <text class="sub" x="505" y="182" text-anchor="middle">ID · 时间 · 指标</text>
  <rect class="box" x="620" y="130" width="120" height="60" stroke="var(--g)"/>
  <text class="lbl" x="680" y="156" text-anchor="middle" fill="var(--g)">Kafka</text>
  <text class="sub" x="680" y="174" text-anchor="middle">下游消费</text>
  <line class="arr" x1="170" y1="80" x2="218" y2="80"/>
  <line class="arr" x1="390" y1="80" x2="438" y2="80"/>
  <line class="arr" x1="170" y1="160" x2="218" y2="160"/>
  <line class="arr" x1="390" y1="160" x2="438" y2="160"/>
  <line class="arr" x1="170" y1="240" x2="218" y2="240"/>
  <line class="arr" x1="390" y1="240" x2="438" y2="240"/>
  <line class="arr" x1="570" y1="160" x2="618" y2="160"/>
</svg>
