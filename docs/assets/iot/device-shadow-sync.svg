<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .life { stroke:var(--border); stroke-width:1.5; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">设备影子同步时序</text>
  <rect class="box" x="20" y="50" width="140" height="60" stroke="var(--b)"/>
  <text class="lbl" x="90" y="76" text-anchor="middle" fill="var(--b)">业务应用</text>
  <text class="sub" x="90" y="94" text-anchor="middle">控制台 · API</text>
  <rect class="box" x="310" y="50" width="140" height="60" stroke="var(--p)"/>
  <text class="lbl" x="380" y="76" text-anchor="middle" fill="var(--p)">影子服务</text>
  <text class="sub" x="380" y="94" text-anchor="middle">desired · reported</text>
  <rect class="box" x="600" y="50" width="140" height="60" stroke="var(--g)"/>
  <text class="lbl" x="670" y="76" text-anchor="middle" fill="var(--g)">设备</text>
  <text class="sub" x="670" y="94" text-anchor="middle">MQTT 长连接</text>
  <line class="life" x1="90" y1="110" x2="90" y2="420"/>
  <line class="life" x1="380" y1="110" x2="380" y2="420"/>
  <line class="life" x1="670" y1="110" x2="670" y2="420"/>
  <line class="arr" x1="90" y1="150" x2="378" y2="150"/>
  <text class="sub" x="234" y="142" text-anchor="middle">① 修改 desired（带 version）</text>
  <line class="arr" x1="380" y1="200" x2="668" y2="200"/>
  <text class="sub" x="524" y="192" text-anchor="middle">② 推送 delta</text>
  <line class="arr" x1="670" y1="250" x2="382" y2="250"/>
  <text class="sub" x="526" y="242" text-anchor="middle">③ 执行后上报 reported</text>
  <line class="arr" x1="380" y1="300" x2="92" y2="300"/>
  <text class="sub" x="236" y="292" text-anchor="middle">④ delta 清空，通知结果</text>
  <line class="arr" x1="670" y1="350" x2="382" y2="350"/>
  <text class="sub" x="526" y="342" text-anchor="middle">⑤ 重连后 GET 全量影子</text>
  <line class="arr" x1="380" y1="400" x2="668" y2="400"/>
  <text class="sub" x="524" y="392" text-anchor="middle">⑥ 返回 desired 与 version</text>
</svg>
