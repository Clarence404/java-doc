<svg viewBox="0 0 800 346" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .tag { rx:8; ry:8; fill:var(--bg); stroke:var(--border); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="400" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">三类规则模型的共性：数据源 → 条件 → 动作</text>

  <!-- 行 0：共性抽象 -->
  <rect class="tag" x="20" y="40" width="130" height="60"/>
  <text class="lbl" x="85" y="75" text-anchor="middle">共性抽象</text>
  <rect class="box" x="170" y="40" width="180" height="60" stroke="var(--b)"/>
  <text class="lbl" x="260" y="66" text-anchor="middle" fill="var(--b)">数据源</text>
  <text class="sub" x="260" y="84" text-anchor="middle">消息 · 事件 · 定时</text>
  <rect class="box" x="390" y="40" width="180" height="60" stroke="var(--p)"/>
  <text class="lbl" x="480" y="66" text-anchor="middle" fill="var(--p)">条件</text>
  <text class="sub" x="480" y="84" text-anchor="middle">过滤 · 阈值 · 持续或次数</text>
  <rect class="box" x="610" y="40" width="170" height="60" stroke="var(--g)"/>
  <text class="lbl" x="695" y="66" text-anchor="middle" fill="var(--g)">动作</text>
  <text class="sub" x="695" y="84" text-anchor="middle">转发 · 指令 · 告警 · 通知</text>
  <line class="arr" x1="350" y1="70" x2="388" y2="70"/>
  <line class="arr" x1="570" y1="70" x2="608" y2="70"/>

  <!-- 行 1：SQL 式数据流转 -->
  <rect class="tag" x="20" y="116" width="130" height="60"/>
  <text class="lbl" x="85" y="142" text-anchor="middle">SQL 式数据流转</text>
  <text class="sub" x="85" y="160" text-anchor="middle">AWS · EMQX · Azure</text>
  <rect class="box" x="170" y="116" width="180" height="60" stroke="var(--border)"/>
  <text class="sub" x="260" y="150" text-anchor="middle">FROM 主题或事件</text>
  <rect class="box" x="390" y="116" width="180" height="60" stroke="var(--border)"/>
  <text class="sub" x="480" y="150" text-anchor="middle">SELECT 与 WHERE 表达式</text>
  <rect class="box" x="610" y="116" width="170" height="60" stroke="var(--border)"/>
  <text class="sub" x="695" y="150" text-anchor="middle">Sink · 重新发布 · 端点</text>
  <line class="arr" x1="350" y1="146" x2="388" y2="146"/>
  <line class="arr" x1="570" y1="146" x2="608" y2="146"/>

  <!-- 行 2：流程与脚本式 -->
  <rect class="tag" x="20" y="192" width="130" height="60"/>
  <text class="lbl" x="85" y="218" text-anchor="middle">流程与脚本式</text>
  <text class="sub" x="85" y="236" text-anchor="middle">ThingsBoard · 阿里云</text>
  <rect class="box" x="170" y="192" width="180" height="60" stroke="var(--border)"/>
  <text class="sub" x="260" y="226" text-anchor="middle">输入节点 · 数据源 Topic</text>
  <rect class="box" x="390" y="192" width="180" height="60" stroke="var(--border)"/>
  <text class="sub" x="480" y="226" text-anchor="middle">过滤节点 · 解析器脚本</text>
  <rect class="box" x="610" y="192" width="170" height="60" stroke="var(--border)"/>
  <text class="sub" x="695" y="226" text-anchor="middle">动作节点 · 数据目的</text>
  <line class="arr" x1="350" y1="222" x2="388" y2="222"/>
  <line class="arr" x1="570" y1="222" x2="608" y2="222"/>

  <!-- 行 3：触发-条件-动作 -->
  <rect class="tag" x="20" y="268" width="130" height="60"/>
  <text class="lbl" x="85" y="294" text-anchor="middle">触发-条件-动作</text>
  <text class="sub" x="85" y="312" text-anchor="middle">阿里云 · 华为云 · 本篇</text>
  <rect class="box" x="170" y="268" width="180" height="60" stroke="var(--border)"/>
  <text class="sub" x="260" y="302" text-anchor="middle">触发器之间为或</text>
  <rect class="box" x="390" y="268" width="180" height="60" stroke="var(--border)"/>
  <text class="sub" x="480" y="302" text-anchor="middle">执行条件之间为与</text>
  <rect class="box" x="610" y="268" width="170" height="60" stroke="var(--border)"/>
  <text class="sub" x="695" y="302" text-anchor="middle">下发指令 · 上报或恢复告警</text>
  <line class="arr" x1="350" y1="298" x2="388" y2="298"/>
  <line class="arr" x1="570" y1="298" x2="608" y2="298"/>
</svg>
