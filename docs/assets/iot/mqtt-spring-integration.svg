<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .life { stroke:var(--border); stroke-width:1.5; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Spring Integration MQTT 消息流</text>
  <rect class="box" x="20" y="50" width="110" height="240" stroke="var(--g)"/>
  <text class="lbl" x="75" y="166" text-anchor="middle" fill="var(--g)">EMQX</text>
  <text class="sub" x="75" y="184" text-anchor="middle">MQTT Broker</text>
  <rect class="box" x="180" y="90" width="150" height="60" stroke="var(--b)"/>
  <text class="lbl" x="255" y="116" text-anchor="middle" fill="var(--b)">Mqttv5 入站适配器</text>
  <text class="sub" x="255" y="134" text-anchor="middle">共享订阅 · QoS 1</text>
  <rect class="box" x="380" y="50" width="140" height="140" stroke="var(--p)"/>
  <text class="lbl" x="450" y="116" text-anchor="middle" fill="var(--p)">Router</text>
  <text class="sub" x="450" y="134" text-anchor="middle">按 RECEIVED_TOPIC</text>
  <rect class="box" x="570" y="50" width="170" height="60" stroke="var(--y)"/>
  <text class="lbl" x="655" y="76" text-anchor="middle" fill="var(--y)">遥测处理</text>
  <text class="sub" x="655" y="94" text-anchor="middle">devices/+/data</text>
  <rect class="box" x="570" y="130" width="170" height="60" stroke="var(--y)"/>
  <text class="lbl" x="655" y="156" text-anchor="middle" fill="var(--y)">OTA 状态处理</text>
  <text class="sub" x="655" y="174" text-anchor="middle">devices/+/ota/status</text>
  <rect class="box" x="180" y="230" width="150" height="60" stroke="var(--b)"/>
  <text class="lbl" x="255" y="256" text-anchor="middle" fill="var(--b)">Mqttv5 出站 Handler</text>
  <text class="sub" x="255" y="274" text-anchor="middle">异步发布</text>
  <rect class="box" x="380" y="230" width="140" height="60" stroke="var(--p)"/>
  <text class="lbl" x="450" y="256" text-anchor="middle" fill="var(--p)">出站通道</text>
  <text class="sub" x="450" y="274" text-anchor="middle">mqttOutboundChannel</text>
  <rect class="box" x="570" y="230" width="170" height="60" stroke="var(--y)"/>
  <text class="lbl" x="655" y="256" text-anchor="middle" fill="var(--y)">MqttGateway</text>
  <text class="sub" x="655" y="274" text-anchor="middle">业务代码调用</text>
  <line class="arr" x1="130" y1="120" x2="178" y2="120"/>
  <text class="sub" x="154" y="112" text-anchor="middle">订阅</text>
  <line class="arr" x1="330" y1="120" x2="378" y2="120"/>
  <line class="arr" x1="520" y1="80" x2="568" y2="80"/>
  <line class="arr" x1="520" y1="160" x2="568" y2="160"/>
  <line class="arr" x1="570" y1="260" x2="522" y2="260"/>
  <line class="arr" x1="380" y1="260" x2="332" y2="260"/>
  <line class="arr" x1="180" y1="260" x2="132" y2="260"/>
  <text class="sub" x="156" y="252" text-anchor="middle">发布</text>
</svg>
