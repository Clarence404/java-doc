<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke-width:1.8; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- 传感器 -->
  <rect class="box" x="10" y="56" width="90" height="48" stroke="var(--y)"/>
  <text class="lbl" x="55" y="77" text-anchor="middle" fill="var(--y)">传感器</text>
  <text class="sub" x="55" y="94" text-anchor="middle">设备端</text>

  <line class="arr" x1="100" y1="80" x2="128" y2="80" stroke="var(--muted)"/>
  <text class="sub" x="114" y="73" text-anchor="middle">MQTT</text>

  <!-- EMQX -->
  <rect class="box" x="128" y="56" width="90" height="48" stroke="var(--g)"/>
  <text class="lbl" x="173" y="77" text-anchor="middle" fill="var(--g)">EMQX</text>
  <text class="sub" x="173" y="94" text-anchor="middle">Broker</text>

  <line class="arr" x1="218" y1="80" x2="246" y2="80" stroke="var(--muted)"/>

  <!-- Kafka -->
  <rect class="box" x="246" y="56" width="90" height="48" stroke="var(--b)"/>
  <text class="lbl" x="291" y="77" text-anchor="middle" fill="var(--b)">Kafka</text>
  <text class="sub" x="291" y="94" text-anchor="middle">缓冲削峰</text>

  <line class="arr" x1="336" y1="80" x2="364" y2="80" stroke="var(--muted)"/>

  <!-- Flink -->
  <rect class="box" x="364" y="56" width="90" height="48" stroke="var(--p)"/>
  <text class="lbl" x="409" y="77" text-anchor="middle" fill="var(--p)">Flink</text>
  <text class="sub" x="409" y="94" text-anchor="middle">流处理</text>

  <!-- Flink → TSDB -->
  <line class="arr" x1="454" y1="72" x2="512" y2="44" stroke="var(--muted)"/>
  <!-- Flink → 告警 -->
  <line class="arr" x1="454" y1="92" x2="512" y2="120" stroke="var(--muted)"/>

  <!-- TDengine / InfluxDB -->
  <rect class="box" x="512" y="20" width="120" height="48" stroke="var(--b)"/>
  <text class="lbl" x="572" y="41" text-anchor="middle" fill="var(--b)">TDengine</text>
  <text class="sub" x="572" y="58" text-anchor="middle">/ InfluxDB 时序存储</text>

  <!-- 告警服务 -->
  <rect class="box" x="512" y="100" width="120" height="48" stroke="var(--r)"/>
  <text class="lbl" x="572" y="121" text-anchor="middle" fill="var(--r)">告警服务</text>
  <text class="sub" x="572" y="138" text-anchor="middle">钉钉 / 短信 / 邮件</text>

  <!-- TSDB → Grafana -->
  <line class="arr" x1="632" y1="44" x2="668" y2="68" stroke="var(--muted)"/>

  <!-- Grafana -->
  <rect class="box" x="660" y="56" width="90" height="48" stroke="var(--g)"/>
  <text class="lbl" x="705" y="77" text-anchor="middle" fill="var(--g)">Grafana</text>
  <text class="sub" x="705" y="94" text-anchor="middle">可视化看板</text>
</svg>
