<svg viewBox="0 0 760 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">IoT 数据链路</text>

  <!-- 设备 -->
  <rect class="box" x="10" y="48" width="90" height="72" stroke="var(--y)"/>
  <text class="lbl" x="55" y="78" text-anchor="middle" fill="var(--y)">设备 / 网关</text>
  <text class="sub" x="55" y="96" text-anchor="middle">MQTT / TLS</text>

  <line class="arr" x1="100" y1="84" x2="138" y2="84"/>

  <!-- EMQX -->
  <rect class="box" x="140" y="48" width="110" height="72" stroke="var(--g)"/>
  <text class="lbl" x="195" y="78" text-anchor="middle" fill="var(--g)">EMQX</text>
  <text class="sub" x="195" y="96" text-anchor="middle">规则引擎 → Kafka</text>

  <line class="arr" x1="250" y1="84" x2="288" y2="84"/>

  <!-- Kafka -->
  <rect class="box" x="290" y="48" width="100" height="72" stroke="var(--b)"/>
  <text class="lbl" x="340" y="78" text-anchor="middle" fill="var(--b)">Kafka</text>
  <text class="sub" x="340" y="96" text-anchor="middle">缓冲削峰 / 重放</text>

  <line class="arr" x1="390" y1="84" x2="428" y2="84"/>

  <!-- Flink -->
  <rect class="box" x="430" y="48" width="110" height="72" stroke="var(--p)"/>
  <text class="lbl" x="485" y="78" text-anchor="middle" fill="var(--p)">Flink 2.x</text>
  <text class="sub" x="485" y="96" text-anchor="middle">窗口 / 定时器</text>

  <line class="arr" x1="540" y1="84" x2="578" y2="84"/>

  <!-- TDengine -->
  <rect class="box" x="580" y="48" width="170" height="72" stroke="var(--b)"/>
  <text class="lbl" x="665" y="78" text-anchor="middle" fill="var(--b)">TDengine 超表</text>
  <text class="sub" x="665" y="96" text-anchor="middle">原始数据 + 降采样</text>

  <!-- Flink → 告警服务 -->
  <line class="arr" x1="485" y1="120" x2="485" y2="158"/>
  <text class="sub" x="493" y="144">告警事件</text>

  <!-- TDengine → Grafana -->
  <line class="arr" x1="665" y1="120" x2="665" y2="158"/>
  <text class="sub" x="673" y="144">查询</text>

  <!-- 告警服务 -->
  <rect class="box" x="430" y="160" width="110" height="72" stroke="var(--r)"/>
  <text class="lbl" x="485" y="190" text-anchor="middle" fill="var(--r)">告警服务</text>
  <text class="sub" x="485" y="208" text-anchor="middle">钉钉 / 短信 / 工单</text>

  <!-- Grafana → 告警服务 -->
  <line class="arr" x1="580" y1="196" x2="542" y2="196"/>
  <text class="sub" x="561" y="190" text-anchor="middle">告警</text>

  <!-- Grafana -->
  <rect class="box" x="580" y="160" width="170" height="72" stroke="var(--g)"/>
  <text class="lbl" x="665" y="190" text-anchor="middle" fill="var(--g)">Grafana</text>
  <text class="sub" x="665" y="208" text-anchor="middle">看板 + 统一告警</text>
</svg>
