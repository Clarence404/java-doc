<svg viewBox="0 0 760 148" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">设备证书签发与接入</text>

  <rect class="box" x="10" y="44" width="124" height="84" stroke="var(--y)"/>
  <text class="lbl" x="72" y="72" text-anchor="middle" fill="var(--y)">设备安全芯片</text>
  <text class="sub" x="72" y="92" text-anchor="middle">生成 EC 密钥对</text>
  <text class="sub" x="72" y="108" text-anchor="middle">私钥不出芯片</text>

  <line class="arr" x1="134" y1="86" x2="162" y2="86"/>

  <rect class="box" x="164" y="44" width="124" height="84" stroke="var(--p)"/>
  <text class="lbl" x="226" y="72" text-anchor="middle" fill="var(--p)">产线注册工具</text>
  <text class="sub" x="226" y="92" text-anchor="middle">提交 CSR</text>
  <text class="sub" x="226" y="108" text-anchor="middle">绑定设备序列号</text>

  <line class="arr" x1="288" y1="86" x2="316" y2="86"/>

  <rect class="box" x="318" y="44" width="124" height="84" stroke="var(--r)"/>
  <text class="lbl" x="380" y="72" text-anchor="middle" fill="var(--r)">设备 CA</text>
  <text class="sub" x="380" y="92" text-anchor="middle">签发设备证书</text>
  <text class="sub" x="380" y="108" text-anchor="middle">私钥在 HSM / KMS</text>

  <line class="arr" x1="442" y1="86" x2="470" y2="86"/>

  <rect class="box" x="472" y="44" width="124" height="84" stroke="var(--b)"/>
  <text class="lbl" x="534" y="72" text-anchor="middle" fill="var(--b)">写回设备</text>
  <text class="sub" x="534" y="92" text-anchor="middle">设备证书 + CA 链</text>
  <text class="sub" x="534" y="108" text-anchor="middle">登记证书序列号</text>

  <line class="arr" x1="596" y1="86" x2="624" y2="86"/>

  <rect class="box" x="626" y="44" width="124" height="84" stroke="var(--g)"/>
  <text class="lbl" x="688" y="72" text-anchor="middle" fill="var(--g)">EMQX 监听器</text>
  <text class="sub" x="688" y="92" text-anchor="middle">mTLS 校验证书链</text>
  <text class="sub" x="688" y="108" text-anchor="middle">CN → clientid</text>
</svg>
