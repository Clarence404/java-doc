<svg viewBox="0 0 900 412" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="900" height="412" fill="var(--bg)"/>
  <text x="450" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Compose 部署包：服务组成与两种部署方式</text>
  <rect x="30" y="44" width="250" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="155" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">设备与演示模拟器</text>
  <text x="155" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">MQTT 接入，默认端口 1883</text>
  <rect x="325" y="44" width="250" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">Mailpit（演示收件箱）</text>
  <text x="450" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">server 经 SMTP 发出的邀请邮件</text>
  <rect x="620" y="44" width="250" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="745" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">conduit-web（Nginx）</text>
  <text x="745" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">浏览器入口，转发 API 请求</text>
  <rect x="30" y="140" width="250" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="155" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">EMQX 5.10</text>
  <text x="155" y="184" text-anchor="middle" font-size="11" fill="var(--fg)">内存持久会话，连接鉴权回调 server</text>
  <rect x="325" y="140" width="250" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="450" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">transport × 2（一主一备）</text>
  <text x="450" y="184" text-anchor="middle" font-size="11" fill="var(--fg)">stop_grace_period 20 秒</text>
  <rect x="620" y="140" width="250" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="745" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">conduit-server</text>
  <text x="745" y="184" text-anchor="middle" font-size="11" fill="var(--fg)">Flyway 迁移，readiness 探针</text>
  <rect x="30" y="236" width="250" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="155" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">观测栈（profile metrics）</text>
  <text x="155" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">Prometheus · Grafana · exporter</text>
  <rect x="325" y="236" width="250" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="450" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">Redis 7（AOF always）</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">上行总线 · 最新值 · 在线状态 · 选主</text>
  <rect x="620" y="236" width="120" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="680" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">PostgreSQL</text>
  <text x="680" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">租户与设备</text>
  <rect x="750" y="236" width="120" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="810" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">InfluxDB 3</text>
  <text x="810" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">时序数据</text>
  <rect x="30" y="332" width="405" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="232.5" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">合并部署 deploy/standalone</text>
  <text x="232.5" y="376" text-anchor="middle" font-size="11" fill="var(--fg)">以上全部在一台主机，鉴权回调走容器网络</text>
  <rect x="465" y="332" width="405" height="60" rx="6" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="667.5" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="var(--r)">拆分部署 deploy/split</text>
  <text x="667.5" y="376" text-anchor="middle" font-size="11" fill="var(--fg)">EMQX 单独一台，同步回调应用主机的鉴权端口</text>
  <line x1="155" y1="104" x2="155" y2="138" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="745" y1="104" x2="745" y2="138" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="170" x2="323" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="200" x2="450" y2="234" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="715" y1="200" x2="681" y2="234" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="775" y1="200" x2="809" y2="234" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
