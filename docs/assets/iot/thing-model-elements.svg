<svg viewBox="0 0 760 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .ln { stroke:var(--muted); stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">物模型三要素与数据通道</text>

  <!-- 左列：产品 → 物模型 → 设备 -->
  <rect class="box" x="20" y="50" width="140" height="60" stroke="var(--g)"/>
  <text class="lbl" x="90" y="76" text-anchor="middle" fill="var(--g)">产品（型号）</text>
  <text class="sub" x="90" y="94" text-anchor="middle">th-sensor</text>
  <rect class="box" x="20" y="170" width="140" height="60" stroke="var(--g)"/>
  <text class="lbl" x="90" y="196" text-anchor="middle" fill="var(--g)">物模型 v2</text>
  <text class="sub" x="90" y="214" text-anchor="middle">属性 · 事件 · 服务</text>
  <rect class="box" x="20" y="290" width="140" height="60" stroke="var(--g)"/>
  <text class="lbl" x="90" y="316" text-anchor="middle" fill="var(--g)">设备</text>
  <text class="sub" x="90" y="334" text-anchor="middle">dev001、dev002 …</text>
  <line class="arr" x1="90" y1="110" x2="90" y2="168"/>
  <text class="sub" x="98" y="143">定义一份</text>
  <line class="arr" x1="90" y1="230" x2="90" y2="288"/>
  <text class="sub" x="98" y="263">同型号共用</text>

  <!-- 物模型展开为四行 -->
  <path class="arr" d="M160 200 H190 V80 H218"/>
  <path class="arr" d="M160 200 H190 V160 H218"/>
  <path class="arr" d="M160 200 H190 V240 H218"/>
  <path class="arr" d="M160 200 H190 V320 H218"/>

  <!-- 中列：三要素 -->
  <rect class="box" x="220" y="50" width="190" height="60" stroke="var(--b)"/>
  <text class="lbl" x="315" y="76" text-anchor="middle" fill="var(--b)">属性 · 只读</text>
  <text class="sub" x="315" y="94" text-anchor="middle">测点：temperature、humidity</text>
  <rect class="box" x="220" y="130" width="190" height="60" stroke="var(--b)"/>
  <text class="lbl" x="315" y="156" text-anchor="middle" fill="var(--b)">属性 · 读写</text>
  <text class="sub" x="315" y="174" text-anchor="middle">配置：reportInterval</text>
  <rect class="box" x="220" y="210" width="190" height="60" stroke="var(--y)"/>
  <text class="lbl" x="315" y="236" text-anchor="middle" fill="var(--y)">事件</text>
  <text class="sub" x="315" y="254" text-anchor="middle">highTemperature（告警）</text>
  <rect class="box" x="220" y="290" width="190" height="60" stroke="var(--p)"/>
  <text class="lbl" x="315" y="316" text-anchor="middle" fill="var(--p)">服务</text>
  <text class="sub" x="315" y="334" text-anchor="middle">reboot（入参 delaySeconds）</text>

  <!-- 中列 → 右列 -->
  <line class="arr" x1="410" y1="80" x2="488" y2="80"/>
  <text class="sub" x="449" y="72" text-anchor="middle">设备 → 平台</text>
  <line class="arr" x1="410" y1="160" x2="488" y2="160"/>
  <text class="sub" x="449" y="152" text-anchor="middle">双向</text>
  <line class="arr" x1="410" y1="240" x2="488" y2="240"/>
  <text class="sub" x="449" y="232" text-anchor="middle">设备 → 平台</text>
  <line class="arr" x1="410" y1="320" x2="488" y2="320"/>
  <text class="sub" x="449" y="312" text-anchor="middle">请求与应答</text>

  <!-- 右列：数据通道与 Topic -->
  <rect class="box" x="490" y="50" width="250" height="60" stroke="var(--b)"/>
  <text class="lbl" x="615" y="76" text-anchor="middle" fill="var(--b)">遥测上报</text>
  <text class="sub" x="615" y="94" text-anchor="middle">devices/{deviceId}/telemetry</text>
  <rect class="box" x="490" y="130" width="250" height="60" stroke="var(--b)"/>
  <text class="lbl" x="615" y="156" text-anchor="middle" fill="var(--b)">设备影子 desired / reported</text>
  <text class="sub" x="615" y="174" text-anchor="middle">devices/{deviceId}/shadow/update · …/delta</text>
  <rect class="box" x="490" y="210" width="250" height="60" stroke="var(--y)"/>
  <text class="lbl" x="615" y="236" text-anchor="middle" fill="var(--y)">事件上报</text>
  <text class="sub" x="615" y="254" text-anchor="middle">devices/{deviceId}/event</text>
  <rect class="box" x="490" y="290" width="250" height="60" stroke="var(--p)"/>
  <text class="lbl" x="615" y="316" text-anchor="middle" fill="var(--p)">指令下发</text>
  <text class="sub" x="615" y="334" text-anchor="middle">devices/{deviceId}/cmd · …/response</text>
</svg>
