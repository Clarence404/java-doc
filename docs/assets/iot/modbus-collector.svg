<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .life { stroke:var(--border); stroke-width:1.5; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Modbus 采集链路</text>
  <rect class="box" x="20" y="50" width="170" height="60" stroke="var(--y)"/>
  <text class="lbl" x="105" y="76" text-anchor="middle" fill="var(--y)">Modbus TCP 从站</text>
  <text class="sub" x="105" y="94" text-anchor="middle">PLC · 电表 · 端口 502</text>
  <rect class="box" x="20" y="130" width="170" height="60" stroke="var(--y)"/>
  <text class="lbl" x="105" y="156" text-anchor="middle" fill="var(--y)">Modbus RTU 从站</text>
  <text class="sub" x="105" y="174" text-anchor="middle">RS-485 串口总线</text>
  <rect class="box" x="240" y="50" width="150" height="140" stroke="var(--b)"/>
  <text class="lbl" x="315" y="108" text-anchor="middle" fill="var(--b)">采集服务</text>
  <text class="sub" x="315" y="126" text-anchor="middle">点表驱动轮询</text>
  <text class="sub" x="315" y="142" text-anchor="middle">长连接 · 超时重试</text>
  <rect class="box" x="440" y="90" width="130" height="60" stroke="var(--p)"/>
  <text class="lbl" x="505" y="116" text-anchor="middle" fill="var(--p)">数据解码</text>
  <text class="sub" x="505" y="134" text-anchor="middle">字节序 · 缩放</text>
  <rect class="box" x="620" y="90" width="120" height="60" stroke="var(--g)"/>
  <text class="lbl" x="680" y="116" text-anchor="middle" fill="var(--g)">MQTT Broker</text>
  <text class="sub" x="680" y="134" text-anchor="middle">上报遥测</text>
  <line class="arr" x1="190" y1="80" x2="238" y2="80"/>
  <line class="arr" x1="190" y1="160" x2="238" y2="160"/>
  <line class="arr" x1="390" y1="120" x2="438" y2="120"/>
  <line class="arr" x1="570" y1="120" x2="618" y2="120"/>
</svg>
