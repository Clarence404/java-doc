<svg viewBox="0 0 680 224" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .tag { font-weight:700; font-size:13px; }
    .item { font-size:11px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- 超表 -->
  <rect class="box" x="10" y="20" width="660" height="72" stroke="var(--p)"/>
  <text class="tag" x="340" y="44" text-anchor="middle" fill="var(--p)">超表 sensors（模板，不直接存数据）</text>
  <text class="item" x="175" y="70" text-anchor="middle">采集列：ts / temperature / humidity</text>
  <text class="item" x="505" y="70" text-anchor="middle">TAGS：device_id / product / location</text>

  <line class="arr" x1="110" y1="92" x2="110" y2="130"/>
  <line class="arr" x1="340" y1="92" x2="340" y2="130"/>
  <line class="arr" x1="570" y1="92" x2="570" y2="130"/>

  <!-- 子表 -->
  <rect class="box" x="10" y="132" width="200" height="72" stroke="var(--b)"/>
  <text class="tag" x="110" y="158" text-anchor="middle" fill="var(--b)">子表 d_dev001</text>
  <text class="item" x="110" y="182" text-anchor="middle">location = Shanghai-A1</text>

  <rect class="box" x="240" y="132" width="200" height="72" stroke="var(--b)"/>
  <text class="tag" x="340" y="158" text-anchor="middle" fill="var(--b)">子表 d_dev002</text>
  <text class="item" x="340" y="182" text-anchor="middle">location = Beijing-B2</text>

  <rect class="box" x="470" y="132" width="200" height="72" stroke="var(--b)"/>
  <text class="tag" x="570" y="158" text-anchor="middle" fill="var(--b)">子表 d_dev003</text>
  <text class="item" x="570" y="182" text-anchor="middle">location = Shenzhen-C3</text>
</svg>
