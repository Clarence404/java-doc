<svg viewBox="0 0 680 352" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:2; }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .tag { font-size:13px; font-weight:700; }
    .item { font-size:11px; fill:var(--muted); }
    .lbl { font-size:11px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:2; marker-end:url(#a); fill:none; }
    .life { stroke:var(--border); stroke-width:1.5; stroke-dasharray:4 4; }
    .note { font-size:10px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

      <text class="title" x="340" y="26" text-anchor="middle">MQTT 5.0 请求 / 响应</text>
  <rect class="box" x="40" y="40" width="140" height="34" stroke="var(--b)"/>
  <text class="tag" x="110" y="62" text-anchor="middle" fill="var(--b)">平台（请求方）</text>
  <line class="life" x1="110" y1="74" x2="110" y2="306"/>
  <rect class="box" x="270" y="40" width="140" height="34" stroke="var(--p)"/>
  <text class="tag" x="340" y="62" text-anchor="middle" fill="var(--p)">Broker</text>
  <line class="life" x1="340" y1="74" x2="340" y2="306"/>
  <rect class="box" x="500" y="40" width="140" height="34" stroke="var(--g)"/>
  <text class="tag" x="570" y="62" text-anchor="middle" fill="var(--g)">设备（响应方）</text>
  <line class="life" x1="570" y1="74" x2="570" y2="306"/>
  <line class="arr" x1="110" y1="110" x2="338" y2="110"/>
  <text class="lbl" x="225" y="104" text-anchor="middle">SUBSCRIBE devices/001/response</text>
  <line class="arr" x1="110" y1="160" x2="338" y2="160"/>
  <text class="lbl" x="225" y="154" text-anchor="middle">Response Topic + Correlation Data</text>
  <text class="lbl" x="225" y="141" text-anchor="middle">PUBLISH devices/001/command</text>
  <line class="arr" x1="340" y1="200" x2="568" y2="200"/>
  <text class="lbl" x="455" y="194" text-anchor="middle">原样转发两个属性</text>
  <line class="arr" x1="570" y1="250" x2="342" y2="250"/>
  <text class="lbl" x="455" y="244" text-anchor="middle">Correlation Data 原样带回</text>
  <text class="lbl" x="455" y="231" text-anchor="middle">PUBLISH devices/001/response</text>
  <line class="arr" x1="340" y1="290" x2="112" y2="290"/>
  <text class="lbl" x="225" y="284" text-anchor="middle">转发响应</text>
  <text class="note" x="340" y="332" text-anchor="middle">平台用 Correlation Data 找回对应的请求，完成一次请求 / 响应</text>
</svg>
