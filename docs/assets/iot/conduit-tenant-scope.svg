<svg viewBox="0 0 900 412" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="900" height="412" fill="var(--bg)"/>
  <text x="450" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">租户内组织模型与角色绑定的三级范围</text>
  <rect x="155" y="44" width="300" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="305" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">租户（安全与资源边界）</text>
  <text x="305" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">产品是租户级共享模板，所有项目共用</text>
  <rect x="30" y="140" width="260" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="160" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">项目 A</text>
  <text x="160" y="184" text-anchor="middle" font-size="11" fill="var(--fg)">用户甲：PROJECT_ADMIN（可写）</text>
  <rect x="320" y="140" width="260" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="450" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">项目 B</text>
  <text x="450" y="184" text-anchor="middle" font-size="11" fill="var(--fg)">用户甲：VIEWER（只读）</text>
  <rect x="30" y="236" width="124" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="92" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">站点 A1</text>
  <text x="92" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">必属一个项目</text>
  <rect x="166" y="236" width="124" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="228" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">站点 A2</text>
  <text x="228" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">用户乙：OPERATOR</text>
  <rect x="320" y="236" width="260" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="450" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">站点 B1</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">时区、启停状态挂在站点上</text>
  <rect x="30" y="332" width="260" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="160" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">资产与设备</text>
  <text x="160" y="376" text-anchor="middle" font-size="11" fill="var(--fg)">设备必属一个站点，可选关联同站点资产</text>
  <rect x="320" y="332" width="260" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="450" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">资产与设备</text>
  <text x="450" y="376" text-anchor="middle" font-size="11" fill="var(--fg)">资产最多 8 层嵌套，不能跨站点</text>
  <line x1="255" y1="104" x2="162" y2="138" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="355" y1="104" x2="448" y2="138" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="200" x2="93" y2="234" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="200" x2="227" y2="234" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="200" x2="450" y2="234" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="92" y1="296" x2="92" y2="330" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="228" y1="296" x2="228" y2="330" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="296" x2="450" y2="330" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="620" y="44" width="250" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="745" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">租户级绑定</text>
  <text x="745" y="88" text-anchor="middle" font-size="11" fill="var(--fg)">OWNER · ADMIN · VIEWER：整个租户</text>
  <rect x="620" y="140" width="250" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="745" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">项目级绑定</text>
  <text x="745" y="184" text-anchor="middle" font-size="11" fill="var(--fg)">PROJECT_ADMIN · OPERATOR · VIEWER</text>
  <rect x="620" y="236" width="250" height="60" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="745" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="var(--y)">站点级绑定</text>
  <text x="745" y="280" text-anchor="middle" font-size="11" fill="var(--fg)">OPERATOR · VIEWER：只这一个站点</text>
  <rect x="620" y="332" width="250" height="60" rx="6" fill="var(--r)" fill-opacity="0.12" stroke="var(--r)" stroke-width="1.5"/>
  <text x="745" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="var(--r)">多个绑定取并集</text>
  <text x="745" y="376" text-anchor="middle" font-size="11" fill="var(--fg)">范围写进 SQL，越权的资源返回 404</text>
  <line x1="620" y1="74" x2="457" y2="74" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="170" x2="582" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="266" x2="582" y2="266" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
