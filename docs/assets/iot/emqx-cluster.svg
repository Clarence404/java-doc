<svg viewBox="0 0 680 356" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:2; }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .tag { font-size:13px; font-weight:700; }
    .item { font-size:11px; fill:var(--muted); }
    .lbl { font-size:11px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:2; marker-end:url(#a); fill:none; }
    .life { stroke:var(--border); stroke-width:1.5; stroke-dasharray:4 4; }
    .note { font-size:10px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

      <text class="title" x="340" y="26" text-anchor="middle">EMQX 三节点集群与四层负载均衡</text>
  <rect class="box" x="255" y="50" width="170" height="60" stroke="var(--b)"/>
  <text class="tag" x="340" y="76" text-anchor="middle" fill="var(--b)">设备 / 网关</text>
  <text class="item" x="340" y="96" text-anchor="middle">MQTT 1883 / 8883</text>
  <rect class="box" x="180" y="150" width="320" height="60" stroke="var(--p)"/>
  <text class="tag" x="340" y="176" text-anchor="middle" fill="var(--p)">Nginx stream（四层负载均衡）</text>
  <text class="item" x="340" y="196" text-anchor="middle">least_conn + PROXY protocol</text>
  <rect class="box" x="10" y="250" width="170" height="60" stroke="var(--g)"/>
  <text class="tag" x="95" y="276" text-anchor="middle" fill="var(--g)">emqx1</text>
  <text class="item" x="95" y="296" text-anchor="middle">MQTT 监听 1883</text>
  <rect class="box" x="255" y="250" width="170" height="60" stroke="var(--g)"/>
  <text class="tag" x="340" y="276" text-anchor="middle" fill="var(--g)">emqx2</text>
  <text class="item" x="340" y="296" text-anchor="middle">MQTT 监听 1883</text>
  <rect class="box" x="500" y="250" width="170" height="60" stroke="var(--g)"/>
  <text class="tag" x="585" y="276" text-anchor="middle" fill="var(--g)">emqx3</text>
  <text class="item" x="585" y="296" text-anchor="middle">MQTT 监听 1883</text>
  <line class="arr" x1="340" y1="110" x2="340" y2="148"/>
  <line class="arr" x1="230" y1="210" x2="111" y2="248"/>
  <line class="arr" x1="340" y1="210" x2="340" y2="248"/>
  <line class="arr" x1="450" y1="210" x2="569" y2="248"/>
  <line class="life" x1="180" y1="280" x2="255" y2="280"/>
  <line class="life" x1="425" y1="280" x2="500" y2="280"/>
  <text class="item" x="340" y="338" text-anchor="middle">节点之间通过 Erlang 分布式协议同步路由与会话；多节点集群在 5.9 及以后版本需要 License</text>
</svg>
