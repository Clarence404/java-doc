<svg viewBox="0 0 780 236" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="390" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">连接风暴沿途的保护点</text>

  <rect class="box" x="10" y="44" width="126" height="100" stroke="var(--y)"/>
  <text class="lbl" x="73" y="70" text-anchor="middle" fill="var(--y)">设备</text>
  <text class="sub" x="73" y="92" text-anchor="middle">指数退避 + 随机抖动</text>
  <text class="sub" x="73" y="108" text-anchor="middle">上电先随机等待</text>
  <text class="sub" x="73" y="124" text-anchor="middle">退避设上限</text>

  <line class="arr" x1="136" y1="94" x2="166" y2="94"/>

  <rect class="box" x="168" y="44" width="126" height="100" stroke="var(--b)"/>
  <text class="lbl" x="231" y="70" text-anchor="middle" fill="var(--b)">负载均衡</text>
  <text class="sub" x="231" y="92" text-anchor="middle">四层转发</text>
  <text class="sub" x="231" y="108" text-anchor="middle">PROXY 协议取真实 IP</text>
  <text class="sub" x="231" y="124" text-anchor="middle">空闲超时大于保活</text>

  <line class="arr" x1="294" y1="94" x2="324" y2="94"/>

  <rect class="box" x="326" y="44" width="126" height="100" stroke="var(--g)"/>
  <text class="lbl" x="389" y="70" text-anchor="middle" fill="var(--g)">EMQX 监听器</text>
  <text class="sub" x="389" y="92" text-anchor="middle">max_conn_rate 限建连</text>
  <text class="sub" x="389" y="108" text-anchor="middle">抖动检测、黑名单</text>
  <text class="sub" x="389" y="124" text-anchor="middle">句柄与内核参数</text>

  <line class="arr" x1="452" y1="94" x2="482" y2="94"/>

  <rect class="box" x="484" y="44" width="126" height="100" stroke="var(--p)"/>
  <text class="lbl" x="547" y="70" text-anchor="middle" fill="var(--p)">认证服务</text>
  <text class="sub" x="547" y="92" text-anchor="middle">连接池与超时</text>
  <text class="sub" x="547" y="108" text-anchor="middle">身份缓存</text>
  <text class="sub" x="547" y="124" text-anchor="middle">快哈希、不查库</text>

  <line class="arr" x1="610" y1="94" x2="640" y2="94"/>

  <rect class="box" x="642" y="44" width="126" height="100" stroke="var(--r)"/>
  <text class="lbl" x="705" y="70" text-anchor="middle" fill="var(--r)">会话恢复</text>
  <text class="sub" x="705" y="92" text-anchor="middle">持久会话数量</text>
  <text class="sub" x="705" y="108" text-anchor="middle">离线队列上限</text>
  <text class="sub" x="705" y="124" text-anchor="middle">订阅随会话恢复</text>

  <rect class="box" x="10" y="176" width="758" height="40" stroke="var(--muted)"/>
  <text x="389" y="201" text-anchor="middle" font-size="11" fill="var(--fg)">观测：在线连接数 · 建连速率 · CONNACK 错误 · 认证失败与延迟 · 过载拒绝 · 调度队列</text>
</svg>
