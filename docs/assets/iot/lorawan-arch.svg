<svg viewBox="0 0 680 122" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .label { fill:var(--fg); font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:10px; }
    .arr { stroke-width:1.8; fill:none; marker-end:url(#a); }
    .proto { fill:var(--muted); font-size:10px; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="22" text-anchor="middle" font-weight="700" font-size="13" fill="var(--fg)">LoRaWAN 网络架构</text>

  <!-- 终端设备 -->
  <rect class="box" x="10" y="32" width="130" height="80" stroke="var(--y)"/>
  <text class="label" x="75" y="60" text-anchor="middle" fill="var(--y)">终端设备</text>
  <text class="sub" x="75" y="76" text-anchor="middle">传感器 / 智能水表</text>

  <!-- Arrow 1 -->
  <line class="arr" x1="140" y1="72" x2="179" y2="72" stroke="var(--muted)"/>
  <text class="proto" x="162" y="87" text-anchor="middle">LoRa 无线</text>

  <!-- 网关 -->
  <rect class="box" x="185" y="32" width="130" height="80" stroke="var(--g)"/>
  <text class="label" x="250" y="57" text-anchor="middle" fill="var(--g)">网关（Gateway）</text>
  <text class="sub" x="250" y="73" text-anchor="middle">LoRa → TCP/IP 转换</text>

  <!-- Arrow 2 -->
  <line class="arr" x1="315" y1="72" x2="354" y2="72" stroke="var(--muted)"/>
  <text class="proto" x="337" y="87" text-anchor="middle">4G / 以太网</text>

  <!-- 网络服务器 -->
  <rect class="box" x="360" y="32" width="130" height="80" stroke="var(--b)"/>
  <text class="label" x="425" y="57" text-anchor="middle" fill="var(--b)">网络服务器</text>
  <text class="sub" x="425" y="73" text-anchor="middle">Network Server</text>

  <!-- Arrow 3 -->
  <line class="arr" x1="490" y1="72" x2="529" y2="72" stroke="var(--muted)"/>
  <text class="proto" x="512" y="87" text-anchor="middle">MQTT / HTTP</text>

  <!-- 应用服务器 -->
  <rect class="box" x="535" y="32" width="130" height="80" stroke="var(--p)"/>
  <text class="label" x="600" y="57" text-anchor="middle" fill="var(--p)">应用服务器</text>
  <text class="sub" x="600" y="73" text-anchor="middle">Application Server</text>
</svg>
