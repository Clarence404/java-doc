<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    .box { rx:8; ry:8; fill:var(--card); stroke-width:1.5; }
    .lbl { font-weight:600; font-size:12px; fill:var(--fg); }
    .sub { font-size:10px; fill:var(--muted); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .life { stroke:var(--border); stroke-width:1.5; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">规则引擎执行链路</text>
  <rect class="box" x="20" y="130" width="130" height="60" stroke="var(--g)"/>
  <text class="lbl" x="85" y="156" text-anchor="middle" fill="var(--g)">设备消息</text>
  <text class="sub" x="85" y="174" text-anchor="middle">Kafka topic</text>
  <rect class="box" x="200" y="120" width="150" height="80" stroke="var(--b)"/>
  <text class="lbl" x="275" y="148" text-anchor="middle" fill="var(--b)">规则匹配</text>
  <text class="sub" x="275" y="166" text-anchor="middle">条件预编译</text>
  <text class="sub" x="275" y="182" text-anchor="middle">本地规则缓存</text>
  <rect class="box" x="400" y="50" width="150" height="220" stroke="var(--p)"/>
  <text class="lbl" x="475" y="148" text-anchor="middle" fill="var(--p)">动作执行</text>
  <text class="sub" x="475" y="166" text-anchor="middle">幂等去重</text>
  <text class="sub" x="475" y="182" text-anchor="middle">超时与重试</text>
  <rect class="box" x="600" y="50" width="140" height="60" stroke="var(--y)"/>
  <text class="lbl" x="670" y="76" text-anchor="middle" fill="var(--y)">告警通知</text>
  <text class="sub" x="670" y="94" text-anchor="middle">静默与收敛</text>
  <rect class="box" x="600" y="130" width="140" height="60" stroke="var(--y)"/>
  <text class="lbl" x="670" y="156" text-anchor="middle" fill="var(--y)">下发指令</text>
  <text class="sub" x="670" y="174" text-anchor="middle">MQTT 下行</text>
  <rect class="box" x="600" y="210" width="140" height="60" stroke="var(--y)"/>
  <text class="lbl" x="670" y="236" text-anchor="middle" fill="var(--y)">Webhook</text>
  <text class="sub" x="670" y="254" text-anchor="middle">RestClient 超时</text>
  <line class="arr" x1="150" y1="160" x2="198" y2="160"/>
  <line class="arr" x1="350" y1="160" x2="398" y2="160"/>
  <line class="arr" x1="550" y1="80" x2="598" y2="80"/>
  <line class="arr" x1="550" y1="160" x2="598" y2="160"/>
  <line class="arr" x1="550" y1="240" x2="598" y2="240"/>
</svg>
