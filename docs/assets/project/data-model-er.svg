<svg viewBox="0 0 720 402" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .card { fill:var(--card); stroke-width:1.5; }
    .tn { font-weight:700; font-size:13px; }
    .mod { fill:var(--muted); font-size:11px; }
    .f { fill:var(--fg); font-size:11px; font-family:ui-monospace,Consolas,monospace; }
    .k { fill:var(--y); font-size:11px; font-family:ui-monospace,Consolas,monospace; }
    .sep { stroke:var(--border); stroke-width:1; }
    .rel { stroke:var(--muted); stroke-width:1.6; fill:none; stroke-dasharray:5 3; marker-end:url(#a); }
    .lbl { fill:var(--muted); font-size:11px; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">阶段一数据模型：5 张表，按模块归属，不建外键</text>

  <!-- t_order_item -->
  <rect class="card" x="20" y="50" width="200" height="150" rx="8" stroke="var(--p)"/>
  <text class="tn" x="32" y="70" fill="var(--p)">t_order_item</text>
  <text class="mod" x="210" y="70" text-anchor="end">mall-order</text>
  <line class="sep" x1="20" y1="78" x2="220" y2="78"/>
  <text class="k" x="32" y="96">id  PK</text>
  <text class="f" x="32" y="114">order_id</text>
  <text class="f" x="32" y="132">sku_id</text>
  <text class="f" x="32" y="150">product_name  快照</text>
  <text class="f" x="32" y="168">unit_price  快照</text>
  <text class="f" x="32" y="186">quantity</text>

  <!-- t_order -->
  <rect class="card" x="260" y="50" width="200" height="168" rx="8" stroke="var(--p)"/>
  <text class="tn" x="272" y="70" fill="var(--p)">t_order</text>
  <text class="mod" x="450" y="70" text-anchor="end">mall-order</text>
  <line class="sep" x1="260" y1="78" x2="460" y2="78"/>
  <text class="k" x="272" y="96">id  PK</text>
  <text class="k" x="272" y="114">order_no  UK</text>
  <text class="k" x="272" y="132">user_id + biz_no  UK</text>
  <text class="f" x="272" y="150">status</text>
  <text class="f" x="272" y="168">total_amount / pay_amount</text>
  <text class="f" x="272" y="186">version</text>
  <text class="f" x="272" y="204">created_at / updated_at</text>

  <!-- t_payment -->
  <rect class="card" x="500" y="50" width="200" height="132" rx="8" stroke="var(--p)"/>
  <text class="tn" x="512" y="70" fill="var(--p)">t_payment</text>
  <text class="mod" x="690" y="70" text-anchor="end">mall-order</text>
  <line class="sep" x1="500" y1="78" x2="700" y2="78"/>
  <text class="k" x="512" y="96">id  PK</text>
  <text class="k" x="512" y="114">pay_no  UK</text>
  <text class="f" x="512" y="132">order_no</text>
  <text class="f" x="512" y="150">amount</text>
  <text class="f" x="512" y="168">status</text>

  <!-- t_product -->
  <rect class="card" x="20" y="268" width="200" height="114" rx="8" stroke="var(--b)"/>
  <text class="tn" x="32" y="288" fill="var(--b)">t_product</text>
  <text class="mod" x="210" y="288" text-anchor="end">mall-product</text>
  <line class="sep" x1="20" y1="296" x2="220" y2="296"/>
  <text class="k" x="32" y="314">id  PK（即 sku_id）</text>
  <text class="f" x="32" y="332">name</text>
  <text class="f" x="32" y="350">price</text>
  <text class="f" x="32" y="368">status</text>

  <!-- t_inventory -->
  <rect class="card" x="260" y="268" width="200" height="96" rx="8" stroke="var(--g)"/>
  <text class="tn" x="272" y="288" fill="var(--g)">t_inventory</text>
  <text class="mod" x="450" y="288" text-anchor="end">mall-inventory</text>
  <line class="sep" x1="260" y1="296" x2="460" y2="296"/>
  <text class="k" x="272" y="314">sku_id  PK</text>
  <text class="f" x="272" y="332">stock</text>
  <text class="f" x="272" y="350">updated_at</text>

  <!-- legend -->
  <rect class="card" x="500" y="268" width="200" height="114" rx="8" stroke="var(--border)"/>
  <text class="tn" x="600" y="288" text-anchor="middle" fill="var(--fg)">图例</text>
  <line class="sep" x1="500" y1="296" x2="700" y2="296"/>
  <text x="512" y="314" font-size="11" fill="var(--p)">紫框：mall-order 模块</text>
  <text x="512" y="332" font-size="11" fill="var(--b)">蓝框：mall-product 模块</text>
  <text x="512" y="350" font-size="11" fill="var(--g)">绿框：mall-inventory 模块</text>
  <text x="512" y="368" font-size="11" fill="var(--muted)">虚线：逻辑引用，无外键</text>

  <!-- relations -->
  <line class="rel" x1="220" y1="120" x2="258" y2="120"/>
  <text class="lbl" x="240" y="114" text-anchor="middle">N:1</text>
  <line class="rel" x1="500" y1="120" x2="462" y2="120"/>
  <text class="lbl" x="480" y="114" text-anchor="middle">N:1</text>
  <line class="rel" x1="120" y1="200" x2="120" y2="266"/>
  <text class="lbl" x="128" y="238">N:1（sku_id）</text>
  <line class="rel" x1="260" y1="316" x2="222" y2="316"/>
  <text class="lbl" x="240" y="310" text-anchor="middle">1:1</text>
</svg>
