<svg viewBox="0 0 760 408" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; fill:var(--r); }
  </style>
  <defs>
    <marker id="arrow-qy-cache-b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
    <marker id="arrow-qy-cache-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--r)"/>
    </marker>
  </defs>
  <text class="title" x="380" y="26" text-anchor="middle">商品详情两级缓存：读路径（左）与失效路径（右）</text>

  <!-- 读路径 -->
  <rect x="40" y="44" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="190" y="68" text-anchor="middle">GET /api/products/{skuId}</text>
  <text class="desc" x="190" y="88" text-anchor="middle">平时约 2000 QPS，峰值 4000+</text>

  <line x1="190" y1="104" x2="190" y2="132" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-qy-cache-b)"/>

  <rect x="40" y="134" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="190" y="158" text-anchor="middle">L1 Caffeine（每个应用实例）</text>
  <text class="desc" x="190" y="178" text-anchor="middle">命中约 80%，写入后 30 秒过期，最多 1 万条</text>

  <line x1="190" y1="194" x2="190" y2="222" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-qy-cache-b)"/>

  <rect x="40" y="224" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="190" y="248" text-anchor="middle">L2 Redis 8 主从 + Sentinel</text>
  <text class="desc" x="190" y="268" text-anchor="middle">命中约 19%，30 分钟 + 0–5 分钟随机 TTL</text>

  <line x1="190" y1="284" x2="190" y2="312" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-qy-cache-b)"/>

  <rect x="40" y="314" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="190" y="338" text-anchor="middle">MySQL t_product</text>
  <text class="desc" x="190" y="358" text-anchor="middle">回源不到 1%，约 20 QPS；查不到写空值 60 秒</text>

  <!-- 失效路径 -->
  <rect x="420" y="44" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="570" y="68" text-anchor="middle">运营后台修改商品</text>
  <text class="desc" x="570" y="88" text-anchor="middle">ProductService 更新 t_product</text>

  <line x1="570" y1="104" x2="570" y2="132" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrow-qy-cache-r)"/>

  <rect x="420" y="134" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="570" y="158" text-anchor="middle">事务提交后（AFTER_COMMIT）</text>
  <text class="desc" x="570" y="178" text-anchor="middle">处理 ProductChangedEvent</text>

  <line x1="570" y1="194" x2="570" y2="222" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrow-qy-cache-r)"/>

  <rect x="420" y="224" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="570" y="248" text-anchor="middle">DEL product:detail:{skuId}</text>
  <text class="desc" x="570" y="268" text-anchor="middle">1 秒后再删一次（延迟双删）</text>

  <line x1="570" y1="284" x2="570" y2="312" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrow-qy-cache-r)"/>

  <rect x="420" y="314" width="300" height="60" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="570" y="338" text-anchor="middle">PUBLISH cache:invalidate:product</text>
  <text class="desc" x="570" y="358" text-anchor="middle">各实例收到后删除本地 L1</text>

  <!-- 跨列失效箭头 -->
  <line x1="420" y1="254" x2="342" y2="254" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrow-qy-cache-r)"/>
  <text class="label" x="381" y="248" text-anchor="middle">删 L2</text>
  <path d="M570,374 V388 H20 V164 H38" fill="none" stroke="var(--r)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-qy-cache-r)"/>
</svg>
