<svg viewBox="0 0 760 530" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .t { font-weight: 700; }
    .d { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="760" height="530" fill="var(--bg)" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-weight="700" font-size="14">订单超时关单：定时消息 + 扫描兜底</text>

  <!-- A 下单事务 -->
  <rect x="20" y="50" width="720" height="60" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="380" y="76" text-anchor="middle" class="t">PlaceOrderTxService 下单事务</text>
  <text x="380" y="96" text-anchor="middle" class="d">扣库存、写 t_order / t_order_item，INSERT t_outbox（order-timeout，deliver_at = 创建时间 + 15 分钟）</text>

  <!-- B 中继 -->
  <rect x="20" y="150" width="720" height="60" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="380" y="176" text-anchor="middle" class="t">OutboxRelay 中继投递</text>
  <text x="380" y="196" text-anchor="middle" class="d">deliver_at 不为空时设置投递时间戳，发送定时消息</text>
  <line x1="380" y1="110" x2="380" y2="148" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- C Topic -->
  <rect x="20" y="250" width="720" height="60" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="380" y="276" text-anchor="middle" class="t">RocketMQ 5 · Topic order-timeout（DELAY 类型）</text>
  <text x="380" y="296" text-anchor="middle" class="d">到达投递时间后才对消费者可见</text>
  <line x1="380" y1="210" x2="380" y2="248" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D 两条触发路径 -->
  <rect x="20" y="350" width="354" height="60" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="197" y="376" text-anchor="middle" class="t">order-timeout-consumer</text>
  <text x="197" y="396" text-anchor="middle" class="d">调用 OrderCloseService.closeIfUnpaid</text>
  <rect x="386" y="350" width="354" height="60" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="563" y="376" text-anchor="middle" class="t">兜底扫描（每 10 分钟）</text>
  <text x="563" y="396" text-anchor="middle" class="d">status = 10 且创建超过 20 分钟，逐单 closeIfUnpaid</text>
  <line x1="197" y1="310" x2="197" y2="348" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- E 条件更新 -->
  <rect x="20" y="450" width="720" height="60" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="380" y="476" text-anchor="middle" class="t">UPDATE t_order SET status = 50 WHERE order_no = ? AND status = 10</text>
  <text x="380" y="496" text-anchor="middle" class="d">影响 1 行：同一事务回补库存；影响 0 行：已支付或已取消，直接确认消费</text>
  <line x1="197" y1="410" x2="197" y2="448" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="563" y1="410" x2="563" y2="448" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
