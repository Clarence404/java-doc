<svg viewBox="0 0 770 180" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="arrow-qy-dbsplit" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="385" y="26" text-anchor="middle">库存数据从 qingyou_mall 迁到 qingyou_inventory 的四步</text>

  <rect x="20" y="44" width="160" height="86" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="68" text-anchor="middle">① 先拆部署</text>
  <text class="desc" x="100" y="92" text-anchor="middle">库存服务独立上线</text>
  <text class="desc" x="100" y="112" text-anchor="middle">仍读写旧库的库存表</text>

  <line x1="180" y1="87" x2="208" y2="87" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-qy-dbsplit)"/>

  <rect x="210" y="44" width="160" height="86" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="290" y="68" text-anchor="middle">② 建新库并同步</text>
  <text class="desc" x="290" y="92" text-anchor="middle">建 qingyou_inventory</text>
  <text class="desc" x="290" y="112" text-anchor="middle">binlog 同步存量与增量</text>

  <line x1="370" y1="87" x2="398" y2="87" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-qy-dbsplit)"/>

  <rect x="400" y="44" width="160" height="86" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="480" y="68" text-anchor="middle">③ 对账与演练</text>
  <text class="desc" x="480" y="92" text-anchor="middle">行数 + 分段 checksum</text>
  <text class="desc" x="480" y="112" text-anchor="middle">预演切换与回切</text>

  <line x1="560" y1="87" x2="588" y2="87" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-qy-dbsplit)"/>

  <rect x="590" y="44" width="160" height="86" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="68" text-anchor="middle">④ 停写切换</text>
  <text class="desc" x="670" y="92" text-anchor="middle">停写数秒，追平后切库</text>
  <text class="desc" x="670" y="112" text-anchor="middle">回收旧表的写权限</text>

  <text class="desc" x="385" y="158" text-anchor="middle">①–③ 都以旧库为准，任一步出问题直接回退；④ 之后以新库为准，保留反向同步一周</text>
</svg>
