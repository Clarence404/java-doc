<svg viewBox="0 0 760 326" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .t { font-weight: 700; }
    .d { font-size: 11px; fill: var(--muted); }
    .lb { font-size: 11px; }
    .lr { font-size: 11px; fill: var(--r); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="var(--r)"/>
    </marker>
  </defs>
  <rect width="760" height="326" fill="var(--bg)" rx="8"/>
  <text x="380" y="28" text-anchor="middle" font-weight="700" font-size="14">活动 SKU 的分桶预占</text>
  <rect x="24" y="46" width="180" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="114" y="72" text-anchor="middle" class="t">reserve 请求</text>
  <text x="114" y="92" text-anchor="middle" class="d">order_no，sku 1001，n = 1</text>
  <rect x="244" y="46" width="200" height="60" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="344" y="72" text-anchor="middle" class="t">读 t_inventory</text>
  <text x="344" y="92" text-anchor="middle" class="d">bucket_count = 10，走分桶</text>
  <rect x="500" y="46" width="232" height="60" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="616" y="72" text-anchor="middle" class="t">选起始桶</text>
  <text x="616" y="92" text-anchor="middle" class="d">hash(order_no) % 10 = 3</text>
  <line x1="204" y1="76" x2="242" y2="76" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="444" y1="76" x2="498" y2="76" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M616,106 L616,126 L265,126 L265,144" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="121" text-anchor="middle" class="lb">先试桶 3</text>
  <rect x="24" y="146" width="150" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="99" y="172" text-anchor="middle" class="t">桶 0 … 桶 2</text>
  <text x="99" y="192" text-anchor="middle" class="d">stock 各约 80</text>
  <rect x="190" y="146" width="150" height="60" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="265" y="172" text-anchor="middle" class="t">桶 3</text>
  <text x="265" y="192" text-anchor="middle" class="d">stock = 0，更新 0 行</text>
  <rect x="416" y="146" width="150" height="60" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="491" y="172" text-anchor="middle" class="t">桶 4</text>
  <text x="491" y="192" text-anchor="middle" class="d">stock 97 → 96</text>
  <rect x="582" y="146" width="150" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="657" y="172" text-anchor="middle" class="t">桶 5 … 桶 9</text>
  <text x="657" y="192" text-anchor="middle" class="d">stock 各约 80</text>
  <line x1="340" y1="176" x2="414" y2="176" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="377" y="170" text-anchor="middle" class="lr">换下一桶</text>
  <line x1="491" y1="206" x2="491" y2="244" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="24" y="246" width="260" height="60" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="154" y="272" text-anchor="middle" class="t">BucketRebalanceJob</text>
  <text x="154" y="292" text-anchor="middle" class="d">每 5 秒把余量最多的桶匀给空桶</text>
  <rect x="300" y="246" width="432" height="60" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="516" y="272" text-anchor="middle" class="t">写入 t_inventory_reservation</text>
  <text x="516" y="292" text-anchor="middle" class="d">bucket_no = 4；confirm / release 回到同一个桶</text>
</svg>
