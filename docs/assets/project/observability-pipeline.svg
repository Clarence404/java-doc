<svg viewBox="0 0 920 390" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    }
    text { fill: var(--fg); }
    .t { font-weight: 700; }
    .d { font-size: 11px; fill: var(--muted); }
    .lb { font-size: 11px; }
    .lr { font-size: 11px; fill: var(--r); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="var(--muted)"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="var(--r)"/>
    </marker>
  </defs>
  <rect width="920" height="390" fill="var(--bg)" rx="8"/>
  <text x="460" y="30" text-anchor="middle" font-weight="700" font-size="14">青柚商城的可观测数据流</text>
  <rect x="20" y="50" width="180" height="250" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="110" y="76" text-anchor="middle" class="t">应用 Pod（4 个服务）</text>
  <text x="110" y="104" text-anchor="middle" class="d">mall-gateway</text>
  <text x="110" y="126" text-anchor="middle" class="d">mall-app</text>
  <text x="110" y="148" text-anchor="middle" class="d">inventory-service</text>
  <text x="110" y="170" text-anchor="middle" class="d">payment-service</text>
  <text x="110" y="210" text-anchor="middle" class="lb">OTel Java Agent 2.x</text>
  <text x="110" y="234" text-anchor="middle" class="lb">JSON 日志 → stdout</text>
  <text x="110" y="258" text-anchor="middle" class="lb">Micrometer 指标端点</text>
  <rect x="290" y="50" width="200" height="70" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="390" y="78" text-anchor="middle" class="t">OTel Collector（节点）</text>
  <text x="390" y="100" text-anchor="middle" class="d">OTLP 接收 · filelog 读日志</text>
  <rect x="290" y="170" width="200" height="70" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="390" y="198" text-anchor="middle" class="t">OTel Collector（网关）</text>
  <text x="390" y="220" text-anchor="middle" class="d">按 traceId 尾部采样</text>
  <rect x="560" y="50" width="150" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="635" y="76" text-anchor="middle" class="t">Loki</text>
  <text x="635" y="96" text-anchor="middle" class="d">日志，只建 3 个标签</text>
  <rect x="560" y="130" width="150" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="635" y="156" text-anchor="middle" class="t">Tempo</text>
  <text x="635" y="176" text-anchor="middle" class="d">链路，存对象存储</text>
  <rect x="560" y="210" width="150" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="635" y="236" text-anchor="middle" class="t">Prometheus</text>
  <text x="635" y="256" text-anchor="middle" class="d">指标 · 告警规则</text>
  <rect x="760" y="50" width="140" height="150" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="830" y="96" text-anchor="middle" class="t">Grafana</text>
  <text x="830" y="124" text-anchor="middle" class="d">Trace ↔ 日志 ↔ 指标</text>
  <text x="830" y="148" text-anchor="middle" class="d">SLO 大盘 · 业务大盘</text>
  <rect x="760" y="230" width="140" height="60" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="830" y="256" text-anchor="middle" class="t">Alertmanager</text>
  <text x="830" y="276" text-anchor="middle" class="d">分组 · 抑制 · 路由</text>
  <rect x="760" y="330" width="140" height="40" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="830" y="355" text-anchor="middle" class="t">值班 IM</text>
  <line x1="200" y1="85" x2="288" y2="85" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="244" y="79" text-anchor="middle" class="lb">Trace（OTLP）</text>
  <text x="244" y="101" text-anchor="middle" class="lb">stdout 日志</text>
  <line x1="390" y1="120" x2="390" y2="168" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="149" text-anchor="start" class="lb">Span</text>
  <line x1="490" y1="80" x2="558" y2="80" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="205" x2="558" y2="166" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="290" x2="558" y2="250" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="292" text-anchor="middle" class="lb">Prometheus 抓取</text>
  <line x1="710" y1="80" x2="758" y2="80" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="160" x2="758" y2="160" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="222" x2="758" y2="190" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="260" x2="758" y2="260" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="830" y1="290" x2="830" y2="328" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="838" y="314" text-anchor="start" class="lr">page / ticket</text>
</svg>
