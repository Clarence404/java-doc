<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .st { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .enum { fill:var(--muted); font-size:11px; }
    .lbl { fill:var(--fg); font-size:11px; }
    .note { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
    <marker id="s" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="7 0,0 3.5,7 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">库存数量在四个桶之间流转</text>

  <rect class="st" x="20" y="70" width="160" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="100" y="96" text-anchor="middle" fill="var(--g)">可售</text>
  <text class="enum" x="100" y="114" text-anchor="middle">available</text>

  <rect class="st" x="260" y="70" width="160" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="340" y="96" text-anchor="middle" fill="var(--y)">预占</text>
  <text class="enum" x="340" y="114" text-anchor="middle">reserved（带 TTL）</text>

  <rect class="st" x="500" y="70" width="160" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="580" y="96" text-anchor="middle" fill="var(--b)">已售</text>
  <text class="enum" x="580" y="114" text-anchor="middle">sold（待出库）</text>

  <rect class="st" x="20" y="220" width="160" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="100" y="246" text-anchor="middle" fill="var(--r)">锁定</text>
  <text class="enum" x="100" y="264" text-anchor="middle">locked（冻结）</text>

  <rect class="st" x="260" y="220" width="160" height="60" rx="8" stroke="var(--muted)"/>
  <text class="name" x="340" y="246" text-anchor="middle" fill="var(--muted)">入库</text>
  <text class="enum" x="340" y="264" text-anchor="middle">采购 / 退货质检</text>

  <rect class="st" x="500" y="220" width="160" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="580" y="246" text-anchor="middle" fill="var(--p)">出库</text>
  <text class="enum" x="580" y="264" text-anchor="middle">离开库存</text>

  <path class="arr" d="M180 90 H258"/>
  <text class="lbl" x="220" y="84" text-anchor="middle">下单预占</text>
  <path class="arr" d="M260 112 H182"/>
  <text class="lbl" x="220" y="127" text-anchor="middle">关单释放</text>

  <line class="arr" x1="420" y1="100" x2="498" y2="100"/>
  <text class="lbl" x="460" y="94" text-anchor="middle">支付确认</text>

  <path class="arr" d="M580 70 V46 H100 V68"/>
  <text class="lbl" x="340" y="41" text-anchor="middle">未发货退款 / 退票回流</text>

  <line class="arr" x1="100" y1="132" x2="100" y2="218" marker-start="url(#s)"/>
  <text class="lbl" x="92" y="178" text-anchor="end">冻结 / 解冻</text>

  <path class="arr" d="M340 220 V175 H160 V132"/>
  <text class="lbl" x="250" y="169" text-anchor="middle">质检合格上架</text>

  <line class="arr" x1="580" y1="130" x2="580" y2="218"/>
  <text class="lbl" x="588" y="178">发货</text>

  <text class="note" x="340" y="310" text-anchor="middle">实物库存 = 可售 + 预占 + 锁定 + 已售待出库；每次流转在同一事务里写一条库存流水</text>
</svg>
