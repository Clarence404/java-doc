<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .layer-bg{fill:var(--bg);stroke:var(--border);stroke-width:1;}
    .label-p{fill:var(--p);font-weight:700;}
    .label-b{fill:var(--b);font-weight:700;}
    .label-g{fill:var(--g);font-weight:700;}
    .label-y{fill:var(--y);font-weight:700;}
    .arrow{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ah);}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="700">Spring Batch 核心架构</text>

  <!-- JobLauncher -->
  <rect class="card" x="20" y="40" width="140" height="50" rx="6"/>
  <text x="90" y="60" text-anchor="middle" class="label-p">JobLauncher</text>
  <text x="90" y="78" text-anchor="middle" class="muted" font-size="11">触发 Job 执行</text>

  <!-- JobRepository -->
  <rect class="card" x="540" y="40" width="140" height="50" rx="6"/>
  <text x="610" y="60" text-anchor="middle" class="label-y">JobRepository</text>
  <text x="610" y="78" text-anchor="middle" class="muted" font-size="11">持久化执行状态</text>

  <!-- Job box -->
  <rect class="layer-bg" x="20" y="120" width="660" height="72" rx="8"/>
  <text x="90" y="143" text-anchor="middle" class="label-p" font-size="12">Job</text>
  <!-- Steps inside Job -->
  <rect class="card" x="36" y="150" width="100" height="30" rx="4"/>
  <text x="86" y="170" text-anchor="middle" font-size="11">Step 1</text>
  <line x1="136" y1="165" x2="150" y2="165" class="arrow"/>
  <rect class="card" x="150" y="150" width="100" height="30" rx="4"/>
  <text x="200" y="170" text-anchor="middle" font-size="11">Step 2</text>
  <line x1="250" y1="165" x2="264" y2="165" class="arrow"/>
  <rect class="card" x="264" y="150" width="100" height="30" rx="4"/>
  <text x="314" y="170" text-anchor="middle" font-size="11">Step N</text>
  <text x="400" y="168" text-anchor="middle" class="muted" font-size="11">可串联 / 条件分支 / 并行</text>

  <!-- Step detail box -->
  <rect class="layer-bg" x="20" y="228" width="660" height="100" rx="8"/>
  <text x="350" y="248" text-anchor="middle" class="label-b" font-size="12">Step（Chunk 模式）</text>

  <!-- Reader -->
  <rect class="card" x="40" y="258" width="140" height="52" rx="6"/>
  <text x="110" y="278" text-anchor="middle" class="label-g">ItemReader</text>
  <text x="110" y="296" text-anchor="middle" class="muted" font-size="11">DB / CSV / JSON / MQ</text>

  <!-- arrow Reader → Processor -->
  <line x1="180" y1="284" x2="218" y2="284" class="arrow"/>
  <text x="199" y="278" text-anchor="middle" class="muted" font-size="10">chunk</text>

  <!-- Processor -->
  <rect class="card" x="218" y="258" width="140" height="52" rx="6"/>
  <text x="288" y="278" text-anchor="middle" class="label-y">ItemProcessor</text>
  <text x="288" y="296" text-anchor="middle" class="muted" font-size="11">过滤 / 转换（可选）</text>

  <!-- arrow Processor → Writer -->
  <line x1="358" y1="284" x2="396" y2="284" class="arrow"/>
  <text x="377" y="278" text-anchor="middle" class="muted" font-size="10">list</text>

  <!-- Writer -->
  <rect class="card" x="396" y="258" width="140" height="52" rx="6"/>
  <text x="466" y="278" text-anchor="middle" class="label-b">ItemWriter</text>
  <text x="466" y="296" text-anchor="middle" class="muted" font-size="11">DB / 文件 / 外部系统</text>

  <!-- Tasklet note -->
  <rect class="card" x="560" y="258" width="110" height="52" rx="6"/>
  <text x="615" y="278" text-anchor="middle" font-size="11">Tasklet</text>
  <text x="615" y="294" text-anchor="middle" class="muted" font-size="10">简单任务</text>
  <text x="615" y="307" text-anchor="middle" class="muted" font-size="10">（无 R/P/W）</text>

  <!-- chunkSize annotation -->
  <rect fill="none" stroke="var(--g)" stroke-width="1" stroke-dasharray="4,3" x="35" y="252" width="468" height="66" rx="4"/>
  <text x="269" y="330" text-anchor="middle" class="muted" font-size="10">每批读取 chunkSize 条 → 处理 → 批量写入（按 chunk 提交事务）</text>

  <!-- JobRepository connections -->
  <!-- JobLauncher → Job -->
  <line x1="90" y1="90" x2="90" y2="114" class="arrow"/>
  <!-- JobRepository → Job -->
  <line x1="610" y1="90" x2="610" y2="114" class="arrow" marker-end="none" stroke-dasharray="5,3"/>
  <line x1="610" y1="114" x2="610" y2="120" class="arrow" stroke-dasharray="5,3"/>

  <!-- DB / storage layer -->
  <rect class="layer-bg" x="20" y="360" width="660" height="46" rx="8"/>
  <text x="350" y="382" text-anchor="middle" class="label-y" font-size="12">JobRepository 元数据表</text>
  <text x="350" y="398" text-anchor="middle" class="muted" font-size="11">BATCH_JOB_INSTANCE · BATCH_JOB_EXECUTION · BATCH_STEP_EXECUTION</text>

  <!-- Step → DB arrow -->
  <line x1="350" y1="328" x2="350" y2="354" class="arrow"/>

  <!-- JobLauncher → JobRepository dashed -->
  <path d="M160,65 L540,65" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
</svg>
