<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .sec { font-size:12px; font-weight:700; fill:var(--p); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
    .desc { font-size:11px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="arrow-bd-sc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="440" y="26" text-anchor="middle">存算一体 vs 存算分离</text>
  <rect x="20" y="44" width="410" height="256" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="sec" x="225" y="70" text-anchor="middle">存算一体：传统 Hadoop 集群</text>
  <rect x="40" y="100" width="110" height="110" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="95" y="124" text-anchor="middle">节点 1</text>
  <text class="desc" x="95" y="150" text-anchor="middle">计算 YARN</text>
  <text class="desc" x="95" y="172" text-anchor="middle">存储 HDFS</text>
  <text class="desc" x="95" y="194" text-anchor="middle">本地磁盘</text>
  <rect x="170" y="100" width="110" height="110" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="225" y="124" text-anchor="middle">节点 2</text>
  <text class="desc" x="225" y="150" text-anchor="middle">计算 YARN</text>
  <text class="desc" x="225" y="172" text-anchor="middle">存储 HDFS</text>
  <text class="desc" x="225" y="194" text-anchor="middle">本地磁盘</text>
  <rect x="300" y="100" width="110" height="110" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="355" y="124" text-anchor="middle">节点 N</text>
  <text class="desc" x="355" y="150" text-anchor="middle">计算 YARN</text>
  <text class="desc" x="355" y="172" text-anchor="middle">存储 HDFS</text>
  <text class="desc" x="355" y="194" text-anchor="middle">本地磁盘</text>
  <text class="desc" x="225" y="248" text-anchor="middle">数据本地性：把计算调度到数据所在节点</text>
  <text class="desc" x="225" y="274" text-anchor="middle">扩容时计算与存储只能一起加</text>
  <rect x="450" y="44" width="410" height="256" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="sec" x="655" y="70" text-anchor="middle">存算分离：云原生湖仓</text>
  <rect x="470" y="100" width="370" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="655" y="124" text-anchor="middle">计算集群（Kubernetes，按负载弹性伸缩）</text>
  <text class="desc" x="655" y="146" text-anchor="middle">Spark · Flink · Trino · Doris 计算节点</text>
  <line x1="655" y1="160" x2="655" y2="198" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-bd-sc)"/>
  <text class="label" x="667" y="184">网络读写 + 本地缓存</text>
  <rect x="470" y="200" width="370" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="655" y="224" text-anchor="middle">对象存储 S3 / OSS / MinIO</text>
  <text class="desc" x="655" y="246" text-anchor="middle">Iceberg / Paimon 表 · 多引擎共享同一份数据</text>
  <text class="desc" x="655" y="286" text-anchor="middle">计算与存储各自扩缩，代价是网络开销</text>
</svg>
