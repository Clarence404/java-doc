<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .item { font-size:12px; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="arrow-spark-salt" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="380" y="24" text-anchor="middle">加盐两阶段聚合：把热点 key 打散到多个 Task</text>
  <rect x="20" y="44" width="220" height="200" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="130" y="66" text-anchor="middle">① 原始 key 分布</text>
  <rect x="34" y="82" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="item" x="130" y="108" text-anchor="middle">shop_A：1000 万行（热点）</text>
  <rect x="34" y="134" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="item" x="130" y="160" text-anchor="middle">shop_B：2 万行</text>
  <rect x="34" y="186" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="item" x="130" y="212" text-anchor="middle">shop_C：1 万行</text>
  <rect x="270" y="44" width="220" height="200" rx="10" fill="var(--bg)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="380" y="66" text-anchor="middle">② 加随机前缀 0–15，局部聚合</text>
  <rect x="284" y="82" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="item" x="380" y="108" text-anchor="middle">A 拆成 16 份，各约 62 万行</text>
  <rect x="284" y="134" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="item" x="380" y="160" text-anchor="middle">B 拆成 16 份，各约 1250 行</text>
  <rect x="284" y="186" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="item" x="380" y="212" text-anchor="middle">C 拆成 16 份，各约 625 行</text>
  <rect x="520" y="44" width="220" height="200" rx="10" fill="var(--bg)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="630" y="66" text-anchor="middle">③ 去掉前缀，全局聚合</text>
  <rect x="534" y="82" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="item" x="630" y="108" text-anchor="middle">shop_A：合并 16 个局部和</text>
  <rect x="534" y="134" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="item" x="630" y="160" text-anchor="middle">shop_B：合并 16 个局部和</text>
  <rect x="534" y="186" width="192" height="44" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="item" x="630" y="212" text-anchor="middle">shop_C：合并 16 个局部和</text>
  <line x1="240" y1="144" x2="268" y2="144" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-spark-salt)"/>
  <line x1="490" y1="144" x2="518" y2="144" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-spark-salt)"/>
  <text class="desc" x="380" y="270" text-anchor="middle">第一次按 (shop_id, salt) 分区，热点由 16 个 Task 分担；第二次每个 key 只剩 16 行，几乎没有开销</text>
</svg>
