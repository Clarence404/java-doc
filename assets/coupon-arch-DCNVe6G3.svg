<svg viewBox="0 0 680 574" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">优惠券系统整体架构</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">客户端 / 运营后台</text>
  <text class="sub" x="40" y="88">领券、下单、发券任务</text>
  <text class="desc" x="650" y="70" text-anchor="end">领券中心、商品页、结算页选券</text>
  <text class="desc" x="650" y="88" text-anchor="end">运营圈选人群，创建批量发券任务</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">网关与风控</text>
  <text class="sub" x="40" y="178">前置拦截</text>
  <text class="desc" x="650" y="160" text-anchor="end">登录态校验，按用户、IP、设备限流</text>
  <text class="desc" x="650" y="178" text-anchor="end">风控评分过高的领券请求直接拒绝</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">券服务</text>
  <text class="sub" x="40" y="268">无状态集群</text>
  <text class="desc" x="650" y="250" text-anchor="end">领券：Lua 原子扣库存与限领，异步落库</text>
  <text class="desc" x="650" y="268" text-anchor="end">用券：锁券、核销、回退；计价与分摊</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="340" fill="var(--r)">Redis Cluster</text>
  <text class="sub" x="40" y="358">按模板分桶</text>
  <text class="desc" x="650" y="340" text-anchor="end">库存、每人已领数、待落库记录</text>
  <text class="desc" x="650" y="358" text-anchor="end">模板规则缓存，大促前预热</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>

  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="430" fill="var(--y)">MQ</text>
  <text class="sub" x="40" y="448">RocketMQ</text>
  <text class="desc" x="650" y="430" text-anchor="end">领券消息；订单支付、关单、退款事件</text>
  <text class="desc" x="650" y="448" text-anchor="end">消费端按券 ID、订单号幂等</text>
  <line class="arr" x1="340" y1="464" x2="340" y2="492"/>

  <rect class="layer" x="20" y="494" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="520" fill="var(--p)">MySQL</text>
  <text class="sub" x="40" y="538">券实例按 user_id 分库分表</text>
  <text class="desc" x="650" y="520" text-anchor="end">券模板、券实例、发券任务</text>
  <text class="desc" x="650" y="538" text-anchor="end">唯一约束兜底，定时与 Redis 对账</text>
</svg>
