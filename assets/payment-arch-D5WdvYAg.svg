<svg viewBox="0 0 750 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .box { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; }
    .sub { fill:var(--muted); }
    .lbl { fill:var(--fg); }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
    .bus { stroke:var(--muted); stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="375" y="28" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">支付系统整体架构</text>
  <rect class="box" x="20" y="50" width="210" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="125" y="76" text-anchor="middle" font-size="13" fill="var(--y)">补偿任务</text>
  <text class="sub" x="125" y="95" text-anchor="middle" font-size="11">查单 · 关单 · 退款重试</text>
  <rect class="box" x="270" y="50" width="210" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="375" y="76" text-anchor="middle" font-size="13" fill="var(--b)">订单服务 / 收银台</text>
  <text class="sub" x="375" y="95" text-anchor="middle" font-size="11">发起支付，金额由服务端带入</text>
  <rect class="box" x="520" y="50" width="210" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="625" y="76" text-anchor="middle" font-size="13" fill="var(--p)">MQ</text>
  <text class="sub" x="625" y="95" text-anchor="middle" font-size="11">支付 / 退款结果事件</text>
  <rect class="box" x="20" y="150" width="210" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="125" y="176" text-anchor="middle" font-size="13" fill="var(--r)">回调网关</text>
  <text class="sub" x="125" y="195" text-anchor="middle" font-size="11">验签 · 解密 · 校验金额</text>
  <rect class="box" x="270" y="150" width="210" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="375" y="176" text-anchor="middle" font-size="13" fill="var(--g)">支付核心</text>
  <text class="sub" x="375" y="195" text-anchor="middle" font-size="11">支付单 · 交易单 · 退款单 · 流水</text>
  <rect class="box" x="520" y="150" width="210" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="625" y="176" text-anchor="middle" font-size="13" fill="var(--p)">Outbox 中继</text>
  <text class="sub" x="625" y="195" text-anchor="middle" font-size="11">事务提交后投递，至少一次</text>
  <rect class="box" x="270" y="250" width="210" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="375" y="276" text-anchor="middle" font-size="13" fill="var(--b)">渠道适配层</text>
  <text class="sub" x="375" y="295" text-anchor="middle" font-size="11">下单 / 查询 / 关单 / 退款 / 账单</text>
  <rect class="box" x="520" y="250" width="210" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="625" y="276" text-anchor="middle" font-size="13" fill="var(--y)">对账服务</text>
  <text class="sub" x="625" y="295" text-anchor="middle" font-size="11">日终账单 · 逐笔比对</text>
  <rect class="box" x="270" y="350" width="100" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="320" y="376" text-anchor="middle" font-size="13" fill="var(--g)">微信支付</text>
  <text class="sub" x="320" y="395" text-anchor="middle" font-size="11">APIv3</text>
  <rect class="box" x="380" y="350" width="100" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="430" y="376" text-anchor="middle" font-size="13" fill="var(--b)">支付宝</text>
  <text class="sub" x="430" y="395" text-anchor="middle" font-size="11">开放平台</text>
  <rect class="box" x="520" y="350" width="210" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="625" y="376" text-anchor="middle" font-size="13" fill="var(--r)">差错池</text>
  <text class="sub" x="625" y="395" text-anchor="middle" font-size="11">自动处理 · 人工调账</text>
  <line class="arr" x1="375" y1="110" x2="375" y2="148"/>
  <text class="lbl" x="383" y="134" text-anchor="start" font-size="11">发起支付</text>
  <line class="arr" x1="230" y1="180" x2="268" y2="180"/>
  <line class="arr" x1="480" y1="180" x2="518" y2="180"/>
  <line class="arr" x1="625" y1="150" x2="625" y2="112"/>
  <text class="lbl" x="633" y="134" text-anchor="start" font-size="11">投递</text>
  <line class="arr" x1="375" y1="210" x2="375" y2="248"/>
  <text class="lbl" x="383" y="234" text-anchor="start" font-size="11">调用渠道</text>
  <line class="arr" x1="480" y1="280" x2="518" y2="280"/>
  <line class="arr" x1="320" y1="310" x2="320" y2="348"/>
  <line class="arr" x1="430" y1="310" x2="430" y2="348"/>
  <line class="arr" x1="625" y1="310" x2="625" y2="348"/>
  <text class="lbl" x="633" y="334" text-anchor="start" font-size="11">不一致</text>
  <line class="arr" x1="230" y1="100" x2="284" y2="148"/>
  <path class="arr" d="M270,380 H125 V212"/>
  <text class="lbl" x="197" y="372" text-anchor="middle" font-size="11">异步通知（微信 / 支付宝）</text>
</svg>
