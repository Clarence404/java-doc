<svg viewBox="0 0 680 512" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .desc { fill:var(--fg); font-size:11px; }
    .lbl { fill:var(--fg); font-size:11px; }
    .life { stroke:var(--border); stroke-width:1.2; stroke-dasharray:4 4; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">单聊消息收发时序</text>

  <rect class="layer" x="24" y="44" width="104" height="36" rx="8" stroke="var(--p)"/>
  <text x="76" y="67" text-anchor="middle" font-weight="600" fill="var(--p)">发送方 A</text>
  <rect class="layer" x="156" y="44" width="104" height="36" rx="8" stroke="var(--b)"/>
  <text x="208" y="67" text-anchor="middle" font-weight="600" fill="var(--b)">A 所在网关</text>
  <rect class="layer" x="288" y="44" width="104" height="36" rx="8" stroke="var(--g)"/>
  <text x="340" y="67" text-anchor="middle" font-weight="600" fill="var(--g)">消息服务</text>
  <rect class="layer" x="420" y="44" width="104" height="36" rx="8" stroke="var(--y)"/>
  <text x="472" y="67" text-anchor="middle" font-weight="600" fill="var(--y)">消息库</text>
  <rect class="layer" x="552" y="44" width="104" height="36" rx="8" stroke="var(--r)"/>
  <text x="604" y="67" text-anchor="middle" font-weight="600" fill="var(--r)">接收方 B</text>

  <line class="life" x1="76" y1="80" x2="76" y2="420" stroke-dasharray="4 4"/>
  <line class="life" x1="208" y1="80" x2="208" y2="420" stroke-dasharray="4 4"/>
  <line class="life" x1="340" y1="80" x2="340" y2="420" stroke-dasharray="4 4"/>
  <line class="life" x1="472" y1="80" x2="472" y2="420" stroke-dasharray="4 4"/>
  <line class="life" x1="604" y1="80" x2="604" y2="420" stroke-dasharray="4 4"/>

  <text class="lbl" x="142" y="114" text-anchor="middle">1 发送 clientMsgId</text>
  <line class="arr" x1="76" y1="120" x2="206" y2="120"/>
  <text class="lbl" x="274" y="154" text-anchor="middle">2 转发</text>
  <line class="arr" x1="208" y1="160" x2="338" y2="160"/>
  <text class="lbl" x="406" y="194" text-anchor="middle">3 分配 seq 后落库</text>
  <line class="arr" x1="340" y1="200" x2="470" y2="200"/>
  <text class="lbl" x="406" y="234" text-anchor="middle">4 事务提交</text>
  <line class="arr" x1="472" y1="240" x2="342" y2="240"/>
  <text class="lbl" x="208" y="274" text-anchor="middle">5 ACK（seq）</text>
  <line class="arr" x1="340" y1="280" x2="78" y2="280"/>
  <text class="lbl" x="472" y="314" text-anchor="middle">6 查路由，经 B 所在网关推送</text>
  <line class="arr" x1="340" y1="320" x2="602" y2="320"/>
  <text class="lbl" x="472" y="354" text-anchor="middle">7 接收 ACK（seq）</text>
  <line class="arr" x1="604" y1="360" x2="342" y2="360"/>
  <text class="lbl" x="406" y="394" text-anchor="middle">8 更新同步位点</text>
  <line class="arr" x1="340" y1="400" x2="470" y2="400"/>

  <rect class="layer" x="20" y="432" width="640" height="60" rx="8" stroke="var(--border)"/>
  <text class="desc" x="340" y="456" text-anchor="middle">A 超时未收到 5：用同一个 clientMsgId 重发，服务端按唯一约束去重后返回原 seq</text>
  <text class="desc" x="340" y="476" text-anchor="middle">B 超时未回 7：网关重推 2–3 次，仍失败就不再推，等 B 重连后按同步位点拉取</text>
</svg>
