<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-ov" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="410" y="26" text-anchor="middle">工程效率链路：从编码到线上</text>

  <rect x="40" y="50" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="150" y="74" text-anchor="middle">编码</text>
  <text class="desc" x="150" y="92" text-anchor="middle">IDE / HTTP Client / 效率插件</text>
  <text class="desc" x="150" y="108" text-anchor="middle">开发工具</text>
  <rect x="300" y="50" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="410" y="74" text-anchor="middle">构建</text>
  <text class="desc" x="410" y="92" text-anchor="middle">Maven / Gradle / Wrapper</text>
  <text class="desc" x="410" y="108" text-anchor="middle">构建工具</text>
  <rect x="560" y="50" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="74" text-anchor="middle">质量门禁</text>
  <text class="desc" x="670" y="92" text-anchor="middle">Sonar / JaCoCo / 格式化</text>
  <text class="desc" x="670" y="108" text-anchor="middle">代码质量</text>
  <rect x="560" y="176" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="200" text-anchor="middle">依赖治理</text>
  <text class="desc" x="670" y="218" text-anchor="middle">BOM / 扫描 / 升级 / SBOM</text>
  <text class="desc" x="670" y="234" text-anchor="middle">依赖治理</text>
  <rect x="300" y="176" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text class="box-title" x="410" y="200" text-anchor="middle">制品与发布</text>
  <text class="desc" x="410" y="218" text-anchor="middle">Nexus / 镜像 / 签名</text>
  <text class="desc" x="410" y="234" text-anchor="middle">DevOps 模块</text>
  <rect x="40" y="176" width="220" height="76" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="150" y="200" text-anchor="middle">线上诊断</text>
  <text class="desc" x="150" y="218" text-anchor="middle">Arthas / JFR / async-profiler</text>
  <text class="desc" x="150" y="234" text-anchor="middle">线上诊断</text>

  <line x1="260" y1="88" x2="298" y2="88" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ov)"/>
  <line x1="520" y1="88" x2="558" y2="88" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ov)"/>
  <line x1="670" y1="126" x2="670" y2="174" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ov)"/>
  <line x1="560" y1="214" x2="522" y2="214" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ov)"/>
  <line x1="300" y1="214" x2="262" y2="214" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-ov)"/>

  <text class="desc" x="410" y="280" text-anchor="middle">API 设计规范与 API 文档贯穿编码与评审；流水线编排、分支与发布策略见 DevOps 模块</text>
</svg>
