<svg viewBox="0 0 700 422" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
  </style>

  <text x="350" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">TiKV：Region 分片与 Raft 副本</text>

  <rect class="box" x="20" y="50" width="213" height="60" stroke="var(--b)"/>
  <text x="126" y="74" text-anchor="middle" fill="var(--b)" font-weight="700">Region 1</text>
  <text x="126" y="92" text-anchor="middle" fill="var(--fg)" font-size="11">Key 范围 [ -∞, b )</text>
  <rect class="box" x="243" y="50" width="214" height="60" stroke="var(--g)"/>
  <text x="350" y="74" text-anchor="middle" fill="var(--g)" font-weight="700">Region 2</text>
  <text x="350" y="92" text-anchor="middle" fill="var(--fg)" font-size="11">Key 范围 [ b, m )</text>
  <rect class="box" x="467" y="50" width="213" height="60" stroke="var(--p)"/>
  <text x="573" y="74" text-anchor="middle" fill="var(--p)" font-weight="700">Region 3</text>
  <text x="573" y="92" text-anchor="middle" fill="var(--fg)" font-size="11">Key 范围 [ m, +∞ )</text>

  <text x="350" y="134" text-anchor="middle" fill="var(--muted)" font-size="11">每个 Region 的 3 个副本组成一个 Raft Group，分散在不同 TiKV（粗框为 Leader）</text>

  <rect class="box" x="20" y="150" width="213" height="152" stroke="var(--border)"/>
  <text x="126" y="172" text-anchor="middle" fill="var(--fg)" font-weight="700">TiKV 1</text>
  <rect x="40" y="184" width="173" height="30" rx="4" fill="var(--card)" stroke="var(--b)" stroke-width="2.5"/>
  <text x="126" y="202" text-anchor="middle" fill="var(--b)" font-weight="700" font-size="11">Region 1 · Leader</text>
  <rect x="40" y="222" width="173" height="30" rx="4" fill="var(--card)" stroke="var(--g)" stroke-width="1"/>
  <text x="126" y="240" text-anchor="middle" fill="var(--g)" font-size="11">Region 2 · Follower</text>
  <rect x="40" y="260" width="173" height="30" rx="4" fill="var(--card)" stroke="var(--p)" stroke-width="1"/>
  <text x="126" y="278" text-anchor="middle" fill="var(--p)" font-size="11">Region 3 · Follower</text>

  <rect class="box" x="243" y="150" width="214" height="152" stroke="var(--border)"/>
  <text x="350" y="172" text-anchor="middle" fill="var(--fg)" font-weight="700">TiKV 2</text>
  <rect x="263" y="184" width="174" height="30" rx="4" fill="var(--card)" stroke="var(--b)" stroke-width="1"/>
  <text x="350" y="202" text-anchor="middle" fill="var(--b)" font-size="11">Region 1 · Follower</text>
  <rect x="263" y="222" width="174" height="30" rx="4" fill="var(--card)" stroke="var(--g)" stroke-width="2.5"/>
  <text x="350" y="240" text-anchor="middle" fill="var(--g)" font-weight="700" font-size="11">Region 2 · Leader</text>
  <rect x="263" y="260" width="174" height="30" rx="4" fill="var(--card)" stroke="var(--p)" stroke-width="1"/>
  <text x="350" y="278" text-anchor="middle" fill="var(--p)" font-size="11">Region 3 · Follower</text>

  <rect class="box" x="467" y="150" width="213" height="152" stroke="var(--border)"/>
  <text x="573" y="172" text-anchor="middle" fill="var(--fg)" font-weight="700">TiKV 3</text>
  <rect x="487" y="184" width="173" height="30" rx="4" fill="var(--card)" stroke="var(--b)" stroke-width="1"/>
  <text x="573" y="202" text-anchor="middle" fill="var(--b)" font-size="11">Region 1 · Follower</text>
  <rect x="487" y="222" width="173" height="30" rx="4" fill="var(--card)" stroke="var(--g)" stroke-width="1"/>
  <text x="573" y="240" text-anchor="middle" fill="var(--g)" font-size="11">Region 2 · Follower</text>
  <rect x="487" y="260" width="173" height="30" rx="4" fill="var(--card)" stroke="var(--p)" stroke-width="2.5"/>
  <text x="573" y="278" text-anchor="middle" fill="var(--p)" font-weight="700" font-size="11">Region 3 · Leader</text>

  <rect x="20" y="342" width="660" height="60" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="350" y="366" text-anchor="middle" fill="var(--fg)" font-size="11">PD 负责调度：Region 超过阈值自动分裂（8.4 起默认 256 MiB，之前 96 MiB），并做合并与 Leader 均衡</text>
  <text x="350" y="384" text-anchor="middle" fill="var(--muted)" font-size="11">读写先到 Leader；Raft 日志被多数派（2/3）持久化即提交，每个 TiKV 底层用 RocksDB 存储</text>
</svg>
