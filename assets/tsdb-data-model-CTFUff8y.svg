<svg viewBox="0 0 720 364" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .mono  { font-size:13px; font-family:Consolas,'Courier New',monospace; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .warn-title { font-size:12px; font-weight:700; fill:var(--r); }
  </style>
  <defs>
    <marker id="arrow-tsdb" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="26" text-anchor="middle">时序数据模型（InfluxDB 行协议为例）</text>

  <!-- Line Protocol 示例 -->
  <rect x="20" y="44" width="680" height="48" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>
  <text class="mono" x="360" y="74" text-anchor="middle">cpu,host=serverA,region=cn value=0.64 1700000000</text>

  <!-- 四条向下箭头 -->
  <line x1="102" y1="96" x2="102" y2="134" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow-tsdb)"/>
  <line x1="274" y1="96" x2="274" y2="134" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow-tsdb)"/>
  <line x1="446" y1="96" x2="446" y2="134" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow-tsdb)"/>
  <line x1="618" y1="96" x2="618" y2="134" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow-tsdb)"/>

  <!-- measurement -->
  <rect x="20" y="140" width="164" height="96" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="102" y="164" text-anchor="middle">measurement</text>
  <text class="desc" x="102" y="188" text-anchor="middle">≈ 表名</text>
  <text class="desc" x="102" y="212" text-anchor="middle">cpu</text>

  <!-- tag set -->
  <rect x="192" y="140" width="164" height="96" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="274" y="164" text-anchor="middle">tag set</text>
  <text class="desc" x="274" y="188" text-anchor="middle">维度标签，字符串，有索引</text>
  <text class="desc" x="274" y="212" text-anchor="middle">host=serverA,region=cn</text>

  <!-- field set -->
  <rect x="364" y="140" width="164" height="96" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="446" y="164" text-anchor="middle">field set</text>
  <text class="desc" x="446" y="188" text-anchor="middle">指标值，无索引</text>
  <text class="desc" x="446" y="212" text-anchor="middle">value=0.64</text>

  <!-- timestamp -->
  <rect x="536" y="140" width="164" height="96" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="618" y="164" text-anchor="middle">timestamp</text>
  <text class="desc" x="618" y="188" text-anchor="middle">时间戳，天然排序键</text>
  <text class="desc" x="618" y="212" text-anchor="middle">1700000000</text>

  <!-- 高基数警告 -->
  <rect x="20" y="284" width="680" height="60" rx="8" fill="var(--bg)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="warn-title" x="360" y="308" text-anchor="middle">高基数（High Cardinality）风险</text>
  <text class="desc" x="360" y="330" text-anchor="middle">序列总数 = tag 值的组合数；唯一值多的字段（user_id / 订单号）应放 field，不要放 tag</text>
</svg>
