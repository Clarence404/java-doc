<svg viewBox="0 0 680 394" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">计数系统整体架构</text>

  <rect class="layer" x="20" y="44" width="145" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="92.5" y="70" text-anchor="middle" fill="var(--p)">关系服务</text>
  <text class="sub" x="92.5" y="88" text-anchor="middle">点赞 / 关注 / 评论</text>
  <line class="arr" x1="165" y1="74" x2="183" y2="74"/>

  <rect class="layer" x="185" y="44" width="145" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="257.5" y="70" text-anchor="middle" fill="var(--b)">关系表</text>
  <text class="sub" x="257.5" y="88" text-anchor="middle">唯一约束去重</text>
  <line class="arr" x1="330" y1="74" x2="348" y2="74"/>

  <rect class="layer" x="350" y="44" width="145" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="422.5" y="70" text-anchor="middle" fill="var(--b)">CDC</text>
  <text class="sub" x="422.5" y="88" text-anchor="middle">binlog 转计数事件</text>
  <line class="arr" x1="495" y1="74" x2="513" y2="74"/>

  <rect class="layer" x="515" y="44" width="145" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="587.5" y="70" text-anchor="middle" fill="var(--g)">Kafka</text>
  <text class="sub" x="587.5" y="88" text-anchor="middle">按对象 ID 分区</text>
  <line class="arr" x1="587.5" y1="104" x2="587.5" y2="132"/>

  <rect class="layer" x="20" y="134" width="145" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="92.5" y="160" text-anchor="middle" fill="var(--p)">阅读计数</text>
  <text class="sub" x="92.5" y="178" text-anchor="middle">Redis 先计</text>
  <line class="arr" x1="92.5" y1="194" x2="92.5" y2="222"/>

  <rect class="layer" x="185" y="134" width="145" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="257.5" y="160" text-anchor="middle" fill="var(--p)">计数读取</text>
  <text class="sub" x="257.5" y="178" text-anchor="middle">本地缓存 + 降级</text>
  <line class="arr" x1="257.5" y1="194" x2="257.5" y2="222"/>

  <rect class="layer" x="515" y="134" width="145" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="587.5" y="160" text-anchor="middle" fill="var(--y)">计数消费者</text>
  <text class="sub" x="587.5" y="178" text-anchor="middle">批量合并增量</text>
  <path class="arr" d="M515 164 L422.5 164 L422.5 222"/>
  <line class="arr" x1="587.5" y1="194" x2="587.5" y2="222"/>

  <rect class="layer" x="20" y="224" width="475" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="257.5" y="250" text-anchor="middle" fill="var(--r)">Redis Cluster 计数</text>
  <text class="sub" x="257.5" y="268" text-anchor="middle">一个对象一个 Hash，热点对象分桶</text>

  <rect class="layer" x="515" y="224" width="145" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="587.5" y="250" text-anchor="middle" fill="var(--g)">MySQL 计数表</text>
  <text class="sub" x="587.5" y="268" text-anchor="middle">持久化与回源</text>
  <line class="arr" x1="422.5" y1="284" x2="422.5" y2="312"/>

  <rect class="layer" x="350" y="314" width="145" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="422.5" y="340" text-anchor="middle" fill="var(--y)">刷盘任务</text>
  <text class="sub" x="422.5" y="358" text-anchor="middle">阅读数定时落库</text>
  <path class="arr" d="M495 344 L587.5 344 L587.5 286"/>

</svg>
