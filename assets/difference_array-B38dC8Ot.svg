<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .hb{fill:var(--card);stroke:var(--b);stroke-width:2;}
    .hg{fill:var(--card);stroke:var(--g);stroke-width:2;}
    .hr{fill:var(--card);stroke:var(--r);stroke-width:2;}
    .hp{fill:var(--card);stroke:var(--p);stroke-width:2;}
    .lb{fill:var(--b);font-weight:700;}
    .lg{fill:var(--g);font-weight:700;}
    .lr{fill:var(--r);font-weight:700;}
    .lp{fill:var(--p);font-weight:700;}
    .arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ah);}
    .dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:4 3;}
    .ring{stroke:var(--b);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .ring2{stroke:var(--g);stroke-width:1.5;fill:none;stroke-dasharray:5 4;}
    .bar-ok{fill:var(--g);fill-opacity:0.25;stroke:var(--g);stroke-width:1.5;}
    .bar-no{fill:var(--border);fill-opacity:0.5;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;}
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text font-weight="700" x="320" y="26" text-anchor="middle" font-size="14">原数组全为 0，给区间 [1, 3] 加 2：d[1] += 2，d[4] −= 2</text>
  <text x="112" y="86" text-anchor="end" class="muted">差分 d</text>
  <text x="112" y="196" text-anchor="end" class="muted">还原 a</text>
  <rect class="card" x="130" y="50" width="56" height="60" rx="6"/>
  <text x="158" y="76" text-anchor="middle">0</text>
  <text x="158" y="96" text-anchor="middle" class="muted" font-size="11">d[0]</text>
  <rect class="hg" x="196" y="50" width="56" height="60" rx="6"/>
  <text x="224" y="76" text-anchor="middle">+2</text>
  <text x="224" y="96" text-anchor="middle" class="muted" font-size="11">d[1]</text>
  <rect class="card" x="262" y="50" width="56" height="60" rx="6"/>
  <text x="290" y="76" text-anchor="middle">0</text>
  <text x="290" y="96" text-anchor="middle" class="muted" font-size="11">d[2]</text>
  <rect class="card" x="328" y="50" width="56" height="60" rx="6"/>
  <text x="356" y="76" text-anchor="middle">0</text>
  <text x="356" y="96" text-anchor="middle" class="muted" font-size="11">d[3]</text>
  <rect class="hr" x="394" y="50" width="56" height="60" rx="6"/>
  <text x="422" y="76" text-anchor="middle">−2</text>
  <text x="422" y="96" text-anchor="middle" class="muted" font-size="11">d[4]</text>
  <rect class="card" x="460" y="50" width="56" height="60" rx="6"/>
  <text x="488" y="76" text-anchor="middle">0</text>
  <text x="488" y="96" text-anchor="middle" class="muted" font-size="11">d[5]</text>
  <rect class="card" x="526" y="50" width="56" height="60" rx="6"/>
  <text x="554" y="76" text-anchor="middle">0</text>
  <text x="554" y="96" text-anchor="middle" class="muted" font-size="11">d[6]</text>
  <rect class="card" x="130" y="160" width="56" height="60" rx="6"/>
  <text x="158" y="186" text-anchor="middle">0</text>
  <text x="158" y="206" text-anchor="middle" class="muted" font-size="11">a[0]</text>
  <rect class="hb" x="196" y="160" width="56" height="60" rx="6"/>
  <text x="224" y="186" text-anchor="middle">2</text>
  <text x="224" y="206" text-anchor="middle" class="muted" font-size="11">a[1]</text>
  <rect class="hb" x="262" y="160" width="56" height="60" rx="6"/>
  <text x="290" y="186" text-anchor="middle">2</text>
  <text x="290" y="206" text-anchor="middle" class="muted" font-size="11">a[2]</text>
  <rect class="hb" x="328" y="160" width="56" height="60" rx="6"/>
  <text x="356" y="186" text-anchor="middle">2</text>
  <text x="356" y="206" text-anchor="middle" class="muted" font-size="11">a[3]</text>
  <rect class="card" x="394" y="160" width="56" height="60" rx="6"/>
  <text x="422" y="186" text-anchor="middle">0</text>
  <text x="422" y="206" text-anchor="middle" class="muted" font-size="11">a[4]</text>
  <rect class="card" x="460" y="160" width="56" height="60" rx="6"/>
  <text x="488" y="186" text-anchor="middle">0</text>
  <text x="488" y="206" text-anchor="middle" class="muted" font-size="11">a[5]</text>
  <text x="340" y="140" text-anchor="middle" class="lb" font-size="12">对 d 求前缀和：a[i] = a[i − 1] + d[i]</text>
  <text x="340" y="250" text-anchor="middle" class="muted" font-size="12">d 比原数组多一格，r + 1 = n 时也不会越界</text>
</svg>
