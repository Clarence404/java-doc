<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .head { font-size: 13px; font-weight: 600; }
    .lbl { font-size: 12px; }
    .sub { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--r)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">RocketMQ 事务消息流程</text>

  <rect x="20" y="40" width="140" height="36" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="90" y="63" text-anchor="middle" class="head">本地 DB</text>
  <rect x="200" y="40" width="140" height="36" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="270" y="63" text-anchor="middle" class="head">Producer</text>
  <rect x="380" y="40" width="140" height="36" rx="6" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text x="450" y="63" text-anchor="middle" class="head">Broker</text>
  <rect x="560" y="40" width="140" height="36" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="630" y="63" text-anchor="middle" class="head">Consumer</text>

  <line x1="90" y1="76" x2="90" y2="460" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="270" y1="76" x2="270" y2="460" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="450" y1="76" x2="450" y2="460" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="630" y1="76" x2="630" y2="460" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="360" y="106" text-anchor="middle" class="lbl">① 发送半消息（Half）</text>
  <line x1="270" y1="112" x2="448" y2="112" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="360" y="144" text-anchor="middle" class="lbl">② 写入成功，消费者不可见</text>
  <line x1="450" y1="150" x2="272" y2="150" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="180" y="182" text-anchor="middle" class="lbl">③ 本地事务 + 记 txId</text>
  <line x1="270" y1="188" x2="92" y2="188" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="360" y="220" text-anchor="middle" class="lbl">④ COMMIT / ROLLBACK</text>
  <line x1="270" y1="226" x2="448" y2="226" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="540" y="258" text-anchor="middle" class="lbl">⑤ COMMIT 后投递</text>
  <line x1="450" y1="264" x2="628" y2="264" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="160" y="284" width="400" height="36" rx="6" fill="var(--r)" fill-opacity="0.10" stroke="var(--r)" stroke-width="1.5"/>
  <text x="360" y="307" text-anchor="middle" class="lbl">异常分支：④ 未送达或返回 UNKNOWN，Broker 定时回查</text>

  <text x="360" y="350" text-anchor="middle" class="lbl">⑥ 回查 checkLocalTransaction</text>
  <line x1="450" y1="356" x2="272" y2="356" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrr)"/>
  <text x="180" y="388" text-anchor="middle" class="lbl">⑦ 按 txId 查记录</text>
  <line x1="270" y1="394" x2="92" y2="394" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrr)"/>
  <text x="360" y="426" text-anchor="middle" class="lbl">⑧ COMMIT / ROLLBACK / UNKNOWN</text>
  <line x1="270" y1="432" x2="448" y2="432" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arrr)"/>
</svg>
