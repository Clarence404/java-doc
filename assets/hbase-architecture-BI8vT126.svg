<svg viewBox="0 0 700 286" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">HBase 架构</text>

  <!-- Client -->
  <rect class="box" x="10" y="110" width="100" height="40" stroke="var(--b)"/>
  <text x="60" y="126" text-anchor="middle" fill="var(--b)" font-weight="700">Client</text>
  <text x="60" y="142" text-anchor="middle" fill="var(--muted)" font-size="10">Java API / REST</text>

  <line class="arr" x1="110" y1="130" x2="139" y2="130" stroke="var(--muted)"/>

  <!-- ZooKeeper -->
  <rect class="box" x="145" y="96" width="120" height="68" stroke="var(--y)"/>
  <text x="205" y="118" text-anchor="middle" fill="var(--y)" font-weight="700">ZooKeeper</text>
  <text x="205" y="134" text-anchor="middle" fill="var(--fg)" font-size="10">集群协调</text>
  <text x="205" y="148" text-anchor="middle" fill="var(--fg)" font-size="10">HMaster 选举</text>
  <text x="205" y="162" text-anchor="middle" fill="var(--fg)" font-size="10">RegionServer 心跳</text>

  <line class="arr" x1="265" y1="118" x2="299" y2="80" stroke="var(--muted)"/>
  <line class="arr" x1="265" y1="148" x2="299" y2="168" stroke="var(--muted)"/>

  <!-- HMaster -->
  <rect class="box" x="305" y="50" width="140" height="56" stroke="var(--p)"/>
  <text x="375" y="70" text-anchor="middle" fill="var(--p)" font-weight="700">HMaster</text>
  <text x="375" y="86" text-anchor="middle" fill="var(--fg)" font-size="10">Region 分配 / 负载均衡</text>
  <text x="375" y="100" text-anchor="middle" fill="var(--fg)" font-size="10">DDL 操作 / RegionServer 监控</text>

  <!-- RegionServer -->
  <rect class="box" x="305" y="140" width="140" height="56" stroke="var(--g)"/>
  <text x="375" y="160" text-anchor="middle" fill="var(--g)" font-weight="700">RegionServer × N</text>
  <text x="375" y="176" text-anchor="middle" fill="var(--fg)" font-size="10">Region: MemStore + HFile</text>
  <text x="375" y="190" text-anchor="middle" fill="var(--fg)" font-size="10">WAL（HLog）顺序写</text>

  <line class="arr" x1="445" y1="168" x2="484" y2="168" stroke="var(--muted)"/>

  <!-- HDFS -->
  <rect class="box" x="490" y="140" width="190" height="56" stroke="var(--b)"/>
  <text x="585" y="160" text-anchor="middle" fill="var(--b)" font-weight="700">HDFS</text>
  <text x="585" y="176" text-anchor="middle" fill="var(--fg)" font-size="10">HFile 持久化存储</text>
  <text x="585" y="190" text-anchor="middle" fill="var(--fg)" font-size="10">3 副本，容错</text>

  <!-- HMaster → RegionServer management arrow -->
  <line class="arr" x1="375" y1="106" x2="375" y2="138" stroke="var(--p)"/>

  <!-- Bottom note -->
  <rect x="10" y="220" width="680" height="60" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="350" y="238" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="11">读写流程（LSM 树）</text>
  <text x="350" y="254" text-anchor="middle" fill="var(--fg)" font-size="10">写：Client → WAL（顺序写）→ MemStore（内存）→ Flush → HFile → Compaction（合并）</text>
  <text x="350" y="267" text-anchor="middle" fill="var(--fg)" font-size="10">读：BlockCache（命中直返）→ MemStore → HFile（合并多版本）</text>
</svg>
