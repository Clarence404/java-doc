<svg viewBox="0 0 680 332" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>


  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Feed 流的三种扇出模式</text>

  <text x="114" y="58" text-anchor="middle" font-weight="700" font-size="13" fill="var(--p)">推模式（写扩散）</text>
  <rect class="layer" x="20" y="72" width="188" height="60" rx="8" stroke="var(--p)"/>
  <text x="114" y="98" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">作者发布</text>
  <text class="sub" x="114" y="116" text-anchor="middle">内容表与本地消息同一事务</text>
  <line class="arr" x1="114" y1="132" x2="114" y2="160"/>
  <rect class="layer" x="20" y="162" width="188" height="60" rx="8" stroke="var(--p)"/>
  <text x="114" y="188" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">MQ 扇出消费者</text>
  <text class="sub" x="114" y="206" text-anchor="middle">分批读粉丝，管道写入</text>
  <line class="arr" x1="114" y1="222" x2="114" y2="250"/>
  <rect class="layer" x="20" y="252" width="188" height="60" rx="8" stroke="var(--p)"/>
  <text x="114" y="278" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">粉丝收件箱 ZSet</text>
  <text class="sub" x="114" y="296" text-anchor="middle">浏览时直接读收件箱</text>

  <text x="340" y="58" text-anchor="middle" font-weight="700" font-size="13" fill="var(--b)">拉模式（读扩散）</text>
  <rect class="layer" x="246" y="72" width="188" height="60" rx="8" stroke="var(--b)"/>
  <text x="340" y="98" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">作者发布</text>
  <text class="sub" x="340" y="116" text-anchor="middle">只写自己的发件箱</text>
  <line class="arr" x1="340" y1="132" x2="340" y2="160"/>
  <rect class="layer" x="246" y="162" width="188" height="60" rx="8" stroke="var(--b)"/>
  <text x="340" y="188" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">读者打开 Feed</text>
  <text class="sub" x="340" y="206" text-anchor="middle">先取关注列表</text>
  <line class="arr" x1="340" y1="222" x2="340" y2="250"/>
  <rect class="layer" x="246" y="252" width="188" height="60" rx="8" stroke="var(--b)"/>
  <text x="340" y="278" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">拉取各发件箱</text>
  <text class="sub" x="340" y="296" text-anchor="middle">多路归并取前 N 条</text>

  <text x="566" y="58" text-anchor="middle" font-weight="700" font-size="13" fill="var(--g)">推拉结合</text>
  <rect class="layer" x="472" y="72" width="188" height="60" rx="8" stroke="var(--g)"/>
  <text x="566" y="98" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">普通作者推</text>
  <text class="sub" x="566" y="116" text-anchor="middle">大 V 只写发件箱</text>
  <line class="arr" x1="566" y1="132" x2="566" y2="160"/>
  <rect class="layer" x="472" y="162" width="188" height="60" rx="8" stroke="var(--g)"/>
  <text x="566" y="188" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">读者请求</text>
  <text class="sub" x="566" y="206" text-anchor="middle">收件箱 + 大 V 发件箱</text>
  <line class="arr" x1="566" y1="222" x2="566" y2="250"/>
  <rect class="layer" x="472" y="252" width="188" height="60" rx="8" stroke="var(--g)"/>
  <text x="566" y="278" text-anchor="middle" font-weight="600" font-size="12" fill="var(--fg)">按 score 归并</text>
  <text class="sub" x="566" y="296" text-anchor="middle">去重后游标分页返回</text>

</svg>
