<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
    .sec   { font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="tri" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="var(--card)" stroke="var(--fg)" stroke-width="0.8"/>
    </marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" class="title">浅拷贝与深拷贝的对象图</text>
  <text x="190" y="56" text-anchor="middle" class="sec">浅拷贝：引用字段共享同一对象</text>
  <text x="570" y="56" text-anchor="middle" class="sec">深拷贝：引用字段各有一份</text>
  <rect x="40" y="80" width="140" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="110" y="104" text-anchor="middle" class="name">original</text>
  <text x="110" y="124" text-anchor="middle" class="desc">permissions →</text>
  <rect x="200" y="80" width="140" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="270" y="104" text-anchor="middle" class="name">copy</text>
  <text x="270" y="124" text-anchor="middle" class="desc">permissions →</text>
  <rect x="40" y="190" width="300" height="60" rx="6" fill="var(--r)" fill-opacity="0.10" stroke="var(--r)" stroke-width="1.5"/>
  <text x="190" y="214" text-anchor="middle" class="name">List [read, write]</text>
  <text x="190" y="234" text-anchor="middle" class="desc">两边共享：copy 加元素，original 也看到</text>
  <line x1="110" y1="140" x2="110" y2="188" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="140" x2="270" y2="188" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="420" y="80" width="140" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="490" y="104" text-anchor="middle" class="name">original</text>
  <text x="490" y="124" text-anchor="middle" class="desc">permissions →</text>
  <rect x="580" y="80" width="140" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="650" y="104" text-anchor="middle" class="name">copy</text>
  <text x="650" y="124" text-anchor="middle" class="desc">permissions →</text>
  <rect x="420" y="190" width="140" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="490" y="214" text-anchor="middle" class="name">List A</text>
  <text x="490" y="234" text-anchor="middle" class="desc">原对象独有</text>
  <rect x="580" y="190" width="140" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="650" y="214" text-anchor="middle" class="name">List B</text>
  <text x="650" y="234" text-anchor="middle" class="desc">副本独有</text>
  <line x1="490" y1="140" x2="490" y2="188" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="140" x2="650" y2="188" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
