<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-sl" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="26" text-anchor="middle">两层会话：IdP 全局会话与应用本地会话</text>

  <rect x="20" y="40" width="680" height="60" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="64" text-anchor="middle">IdP 全局会话（SSO Session）</text>
  <text class="desc" x="360" y="86" text-anchor="middle">Cookie 写在 IdP 域名下，时长由 SSO Session Idle / Max 控制，被重定向到 IdP 时浏览器自动带上</text>

  <line x1="360" y1="100" x2="360" y2="138" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sl)"/>
  <text class="label" x="370" y="124">登录成功后签发令牌</text>

  <rect x="20" y="140" width="216" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="128" y="164" text-anchor="middle">ID Token</text>
  <text class="desc" x="128" y="186" text-anchor="middle">证明用户登录过，只给客户端看</text>

  <rect x="252" y="140" width="216" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="164" text-anchor="middle">Access Token</text>
  <text class="desc" x="360" y="186" text-anchor="middle">调用 API 用，分钟级有效期</text>

  <rect x="484" y="140" width="216" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="592" y="164" text-anchor="middle">Refresh Token</text>
  <text class="desc" x="592" y="186" text-anchor="middle">续期用，寿命受全局会话约束</text>

  <line x1="360" y1="200" x2="360" y2="238" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-sl)"/>
  <text class="label" x="370" y="224">应用据此建立本地会话</text>

  <rect x="20" y="240" width="216" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="128" y="264" text-anchor="middle">应用 A 本地会话</text>
  <text class="desc" x="128" y="286" text-anchor="middle">应用域 Cookie，可放 Redis 共享</text>

  <rect x="252" y="240" width="216" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="264" text-anchor="middle">应用 B 本地会话</text>
  <text class="desc" x="360" y="286" text-anchor="middle">独立过期，独立登出</text>

  <rect x="484" y="240" width="216" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="592" y="264" text-anchor="middle">BFF / 网关会话</text>
  <text class="desc" x="592" y="286" text-anchor="middle">服务端保存令牌，浏览器只拿 Cookie</text>

  <text class="desc" x="360" y="326" text-anchor="middle">全局会话结束不会自动结束本地会话：要么靠单点登出通知，要么把本地会话设得足够短</text>
</svg>
