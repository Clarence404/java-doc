<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <style>
    :root{--fg:#1a1a2e;--muted:#6b7280;--bg:#f8f9fc;--card:#ffffff;--border:#e2e8f0;--p:#6366f1;--b:#0284c7;--g:#059669;--y:#d97706;--r:#dc2626;}
    :root[data-theme="dark"]{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}
    @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--muted:#9ca3af;--bg:#1a1a2e;--card:#252540;--border:#3a3a5c;--p:#818cf8;--b:#38bdf8;--g:#34d399;--y:#fbbf24;--r:#f87171;}}
    text{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
    .label-p{fill:var(--p);font-weight:700;}
    .label-b{fill:var(--b);font-weight:700;}
    .label-g{fill:var(--g);font-weight:700;}
    .t-up{fill:var(--y);}
    .t-down{fill:var(--g);}
    .up{stroke:var(--y);stroke-width:1.5;fill:none;marker-end:url(#ah-up);}
    .down{stroke:var(--g);stroke-width:1.5;fill:none;marker-end:url(#ah-down);}
  </style>
  <defs>
    <marker id="ah-up" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--y)"/>
    </marker>
    <marker id="ah-down" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--g)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="700">Reactive Streams 信号流：请求逆流而上，数据顺流而下</text>

  <!-- 三个参与者 -->
  <rect class="card" x="20" y="50" width="140" height="270" rx="6"/>
  <text x="90" y="180" text-anchor="middle" class="label-p">Publisher</text>
  <text x="90" y="200" text-anchor="middle" class="muted" font-size="12">源头，如 Flux.range</text>

  <rect class="card" x="310" y="50" width="140" height="270" rx="6"/>
  <text x="380" y="180" text-anchor="middle" class="label-b">Operator</text>
  <text x="380" y="200" text-anchor="middle" class="muted" font-size="12">map / publishOn …</text>

  <rect class="card" x="600" y="50" width="140" height="270" rx="6"/>
  <text x="670" y="180" text-anchor="middle" class="label-g">Subscriber</text>
  <text x="670" y="200" text-anchor="middle" class="muted" font-size="12">如 HTTP 响应写出</text>

  <!-- 1 subscribe（向上） -->
  <text x="235" y="84" text-anchor="middle" class="t-up" font-size="11">1 subscribe</text>
  <line x1="310" y1="90" x2="162" y2="90" class="up"/>
  <text x="525" y="84" text-anchor="middle" class="t-up" font-size="11">1 subscribe</text>
  <line x1="600" y1="90" x2="452" y2="90" class="up"/>

  <!-- 2 onSubscribe（向下） -->
  <text x="235" y="124" text-anchor="middle" class="t-down" font-size="11">2 onSubscribe</text>
  <line x1="160" y1="130" x2="308" y2="130" class="down"/>
  <text x="525" y="124" text-anchor="middle" class="t-down" font-size="11">2 onSubscribe</text>
  <line x1="450" y1="130" x2="598" y2="130" class="down"/>

  <!-- 3 request(n)（向上） -->
  <text x="235" y="164" text-anchor="middle" class="t-up" font-size="11">3 request(n)</text>
  <line x1="310" y1="170" x2="162" y2="170" class="up"/>
  <text x="525" y="164" text-anchor="middle" class="t-up" font-size="11">3 request(n)</text>
  <line x1="600" y1="170" x2="452" y2="170" class="up"/>

  <!-- 4 onNext（向下） -->
  <text x="235" y="204" text-anchor="middle" class="t-down" font-size="11">4 onNext × 至多 n 次</text>
  <line x1="160" y1="210" x2="308" y2="210" class="down"/>
  <text x="525" y="204" text-anchor="middle" class="t-down" font-size="11">4 onNext × 至多 n 次</text>
  <line x1="450" y1="210" x2="598" y2="210" class="down"/>

  <!-- 5 onComplete / onError（向下） -->
  <text x="235" y="244" text-anchor="middle" class="t-down" font-size="11">5 onComplete / onError</text>
  <line x1="160" y1="250" x2="308" y2="250" class="down"/>
  <text x="525" y="244" text-anchor="middle" class="t-down" font-size="11">5 onComplete / onError</text>
  <line x1="450" y1="250" x2="598" y2="250" class="down"/>

  <!-- cancel（向上） -->
  <text x="235" y="284" text-anchor="middle" class="t-up" font-size="11">或 cancel（如客户端断开）</text>
  <line x1="310" y1="290" x2="162" y2="290" class="up"/>
  <text x="525" y="284" text-anchor="middle" class="t-up" font-size="11">或 cancel（如客户端断开）</text>
  <line x1="600" y1="290" x2="452" y2="290" class="up"/>

  <text x="380" y="352" text-anchor="middle" class="muted" font-size="12">下游 request 多少，上游最多发多少 —— 这就是背压；subscribe 之前什么都不会发生</text>
</svg>
