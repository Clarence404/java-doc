<svg viewBox="0 0 720 226" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .kind  { font-size: 11px; fill: var(--muted); }
    .label { font-size: 12px; }
    .note  { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--b)"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--g)"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="360" y="24" text-anchor="middle" class="title">ChannelPipeline 事件传播方向</text>

  <!-- 入站方向：Head → Tail -->
  <text x="360" y="50" text-anchor="middle" class="label" fill="var(--b)">入站事件（channelRead 等）：Head → Tail</text>
  <line x1="60" y1="62" x2="660" y2="62" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- 双向链表节点：y=80, h=60 -->
  <rect x="20" y="80" width="100" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="70" y="104" text-anchor="middle" class="name" fill="var(--p)">HeadContext</text>
  <text x="70" y="124" text-anchor="middle" class="kind">入站 + 出站</text>

  <rect x="136" y="80" width="100" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="186" y="104" text-anchor="middle" class="name" fill="var(--b)">InboundA</text>
  <text x="186" y="124" text-anchor="middle" class="kind">入站 Handler</text>

  <rect x="252" y="80" width="100" height="60" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="302" y="104" text-anchor="middle" class="name" fill="var(--b)">InboundB</text>
  <text x="302" y="124" text-anchor="middle" class="kind">入站 Handler</text>

  <rect x="368" y="80" width="100" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="418" y="104" text-anchor="middle" class="name" fill="var(--g)">OutboundC</text>
  <text x="418" y="124" text-anchor="middle" class="kind">出站 Handler</text>

  <rect x="484" y="80" width="100" height="60" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="534" y="104" text-anchor="middle" class="name" fill="var(--g)">OutboundD</text>
  <text x="534" y="124" text-anchor="middle" class="kind">出站 Handler</text>

  <rect x="600" y="80" width="100" height="60" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="650" y="104" text-anchor="middle" class="name" fill="var(--p)">TailContext</text>
  <text x="650" y="124" text-anchor="middle" class="kind">入站兜底</text>

  <!-- 链表指针（prev / next） -->
  <line x1="120" y1="110" x2="136" y2="110" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="236" y1="110" x2="252" y2="110" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="352" y1="110" x2="368" y2="110" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="468" y1="110" x2="484" y2="110" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="584" y1="110" x2="600" y2="110" stroke="var(--muted)" stroke-width="1.5"/>

  <!-- 出站方向：Tail → Head -->
  <line x1="660" y1="158" x2="60" y2="158" stroke="var(--g)" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="360" y="180" text-anchor="middle" class="label" fill="var(--g)">出站事件（write / flush 等）：Tail → Head</text>

  <!-- 结论 -->
  <text x="360" y="206" text-anchor="middle" class="note">addLast(A, B, C, D)：入站依次经过 A → B，出站依次经过 D → C</text>
</svg>
