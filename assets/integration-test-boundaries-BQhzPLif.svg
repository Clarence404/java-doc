<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .tag { font-size: 13px; font-weight: 700; }
    .muted { fill: var(--muted); }
    .box-n { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .box-p { fill: var(--p); fill-opacity: 0.10; stroke: var(--p); stroke-width: 1.5; }
    .box-b { fill: var(--b); fill-opacity: 0.10; stroke: var(--b); stroke-width: 1.5; }
    .box-g { fill: var(--g); fill-opacity: 0.10; stroke: var(--g); stroke-width: 1.5; }
    .box-r { fill: var(--r); fill-opacity: 0.10; stroke: var(--r); stroke-width: 1.5; }
    .box-y { fill: var(--y); fill-opacity: 0.10; stroke: var(--y); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .box-m { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .t-p { fill: var(--p); } .t-b { fill: var(--b); } .t-g { fill: var(--g); } .t-r { fill: var(--r); } .t-y { fill: var(--y); }
    .arrow { stroke: var(--fg); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>
  <text class="title" x="380" y="26" text-anchor="middle">集成测试的边界：自己的服务 + 真实依赖，第三方用替身</text>

  <rect class="box-p" x="20" y="50" width="200" height="70" rx="8"/>
  <text class="tag t-p" x="120" y="78" text-anchor="middle">测试代码（*IT）</text>
  <text x="120" y="102" text-anchor="middle">JUnit + Awaitility 断言</text>

  <rect class="box-b" x="280" y="50" width="220" height="70" rx="8"/>
  <text class="tag t-b" x="390" y="78" text-anchor="middle">order-service</text>
  <text x="390" y="102" text-anchor="middle">完整 Spring 上下文</text>

  <rect class="box-m" x="560" y="50" width="180" height="70" rx="8"/>
  <text class="tag muted" x="650" y="78" text-anchor="middle">不在本层范围</text>
  <text class="muted" x="650" y="102" text-anchor="middle">其他服务 / 前端 / E2E</text>

  <line class="arrow" x1="220" y1="85" x2="278" y2="85"/>
  <text class="muted" x="249" y="78" text-anchor="middle">调用</text>

  <rect class="box-g" x="20" y="170" width="165" height="80" rx="8"/>
  <text class="tag t-g" x="102" y="200" text-anchor="middle">PostgreSQL 容器</text>
  <text x="102" y="226" text-anchor="middle">Flyway 建表、真实 SQL</text>

  <rect class="box-g" x="205" y="170" width="165" height="80" rx="8"/>
  <text class="tag t-g" x="287" y="200" text-anchor="middle">Redis 容器</text>
  <text x="287" y="226" text-anchor="middle">序列化、TTL、Lua</text>

  <rect class="box-g" x="390" y="170" width="165" height="80" rx="8"/>
  <text class="tag t-g" x="472" y="200" text-anchor="middle">Kafka 容器</text>
  <text x="472" y="226" text-anchor="middle">真实收发、重试、DLT</text>

  <rect class="box-y" x="575" y="170" width="165" height="80" rx="8"/>
  <text class="tag t-y" x="657" y="200" text-anchor="middle">支付网关（WireMock）</text>
  <text x="657" y="226" text-anchor="middle">第三方 HTTP 打桩</text>

  <line class="arrow" x1="300" y1="120" x2="104" y2="168"/>
  <line class="arrow" x1="360" y1="120" x2="289" y2="168"/>
  <line class="arrow" x1="420" y1="120" x2="470" y2="168"/>
  <line class="arrow" x1="480" y1="120" x2="653" y2="168"/>

  <text class="muted" x="380" y="280" text-anchor="middle">实线框：Testcontainers 启动的真实依赖；虚线框：无法在本地运行的外部系统，用替身模拟</text>
</svg>
