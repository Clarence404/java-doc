<svg viewBox="0 0 770 290" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .row { font-size:12px; font-weight:700; fill:var(--p); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="arrow-webauthn" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="385" y="26" text-anchor="middle">WebAuthn 注册与认证仪式</text>
  <text class="row" x="20" y="56">注册仪式：添加 Passkey（用户已登录）</text>
  <rect x="20" y="66" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="90" text-anchor="middle">① 服务端出题</text>
  <text class="desc" x="100" y="110" text-anchor="middle">生成随机 challenge</text>
  <text class="desc" x="100" y="128" text-anchor="middle">附带 rpId 与 user handle</text>
  <rect x="210" y="66" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="290" y="90" text-anchor="middle">② 浏览器转交</text>
  <text class="desc" x="290" y="110" text-anchor="middle">credentials.create()</text>
  <text class="desc" x="290" y="128" text-anchor="middle">校验 rpId 与当前域名</text>
  <rect x="400" y="66" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="480" y="90" text-anchor="middle">③ 认证器生成密钥</text>
  <text class="desc" x="480" y="110" text-anchor="middle">指纹 / PIN 验证用户</text>
  <text class="desc" x="480" y="128" text-anchor="middle">私钥留在设备内</text>
  <rect x="590" y="66" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="90" text-anchor="middle">④ 服务端登记</text>
  <text class="desc" x="670" y="110" text-anchor="middle">校验 challenge 与 origin</text>
  <text class="desc" x="670" y="128" text-anchor="middle">保存公钥与凭证 ID</text>
  <line x1="180" y1="106" x2="208" y2="106" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-webauthn)"/>
  <line x1="370" y1="106" x2="398" y2="106" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-webauthn)"/>
  <line x1="560" y1="106" x2="588" y2="106" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-webauthn)"/>

  <text class="row" x="20" y="180">认证仪式：用 Passkey 登录</text>
  <rect x="20" y="190" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="214" text-anchor="middle">① 服务端出题</text>
  <text class="desc" x="100" y="234" text-anchor="middle">生成新的 challenge</text>
  <text class="desc" x="100" y="252" text-anchor="middle">可不指定用户名</text>
  <rect x="210" y="190" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="290" y="214" text-anchor="middle">② 浏览器转交</text>
  <text class="desc" x="290" y="234" text-anchor="middle">credentials.get()</text>
  <text class="desc" x="290" y="252" text-anchor="middle">只列出本域名的凭据</text>
  <rect x="400" y="190" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="480" y="214" text-anchor="middle">③ 认证器签名</text>
  <text class="desc" x="480" y="234" text-anchor="middle">验证用户后用私钥</text>
  <text class="desc" x="480" y="252" text-anchor="middle">签名 challenge 与域名</text>
  <rect x="590" y="190" width="160" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="214" text-anchor="middle">④ 服务端验签</text>
  <text class="desc" x="670" y="234" text-anchor="middle">用登记的公钥验签</text>
  <text class="desc" x="670" y="252" text-anchor="middle">通过后建立登录会话</text>
  <line x1="180" y1="230" x2="208" y2="230" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-webauthn)"/>
  <line x1="370" y1="230" x2="398" y2="230" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-webauthn)"/>
  <line x1="560" y1="230" x2="588" y2="230" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-webauthn)"/>

</svg>
