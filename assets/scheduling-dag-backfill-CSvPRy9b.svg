<svg viewBox="0 0 780 428" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .sub   { font-size: 13px; font-weight: 700; }
    .name  { font-size: 12px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="390" y="24" text-anchor="middle" class="title">订单日报工作流 order_daily：DAG 依赖（上）与补数实例（下）</text>

  <!-- DAG -->
  <rect x="20" y="94" width="130" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="85" y="120" text-anchor="middle" class="name">ODS 订单同步</text>
  <text x="85" y="140" text-anchor="middle" class="desc">增量抽取 T-1</text>

  <rect x="180" y="94" width="130" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="245" y="120" text-anchor="middle" class="name">DWD 订单明细</text>
  <text x="245" y="140" text-anchor="middle" class="desc">清洗 + 维度关联</text>

  <rect x="340" y="44" width="130" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="405" y="70" text-anchor="middle" class="name">DWS 用户日汇总</text>
  <text x="405" y="90" text-anchor="middle" class="desc">用户粒度汇总</text>

  <rect x="340" y="144" width="130" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="405" y="170" text-anchor="middle" class="name">DWS 商品日汇总</text>
  <text x="405" y="190" text-anchor="middle" class="desc">商品粒度汇总</text>

  <rect x="500" y="94" width="130" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="565" y="120" text-anchor="middle" class="name">ADS GMV 日报</text>
  <text x="565" y="140" text-anchor="middle" class="desc">报表结果表</text>

  <rect x="660" y="94" width="100" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="710" y="120" text-anchor="middle" class="name">就绪标记</text>
  <text x="710" y="140" text-anchor="middle" class="desc">通知下游</text>

  <line x1="150" y1="124" x2="178" y2="124" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="310" y1="110" x2="338" y2="82" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="310" y1="138" x2="338" y2="166" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="470" y1="82" x2="498" y2="110" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="470" y1="166" x2="498" y2="138" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="630" y1="124" x2="658" y2="124" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 补数 -->
  <text x="390" y="238" text-anchor="middle" class="sub">补数 10-01 ~ 10-05，并行模式，并发度 2（每列为同一时段内并行的实例）</text>

  <rect x="20" y="252" width="230" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="135" y="278" text-anchor="middle" class="name">实例 1：调度日期 10-01</text>
  <text x="135" y="298" text-anchor="middle" class="desc">system.biz.date = 20260930</text>

  <rect x="20" y="320" width="230" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="135" y="346" text-anchor="middle" class="name">实例 2：调度日期 10-02</text>
  <text x="135" y="366" text-anchor="middle" class="desc">system.biz.date = 20261001</text>

  <rect x="275" y="252" width="230" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="390" y="278" text-anchor="middle" class="name">实例 3：调度日期 10-03</text>
  <text x="390" y="298" text-anchor="middle" class="desc">system.biz.date = 20261002</text>

  <rect x="275" y="320" width="230" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="390" y="346" text-anchor="middle" class="name">实例 4：调度日期 10-04</text>
  <text x="390" y="366" text-anchor="middle" class="desc">system.biz.date = 20261003</text>

  <rect x="530" y="252" width="230" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="645" y="278" text-anchor="middle" class="name">实例 5：调度日期 10-05</text>
  <text x="645" y="298" text-anchor="middle" class="desc">system.biz.date = 20261004</text>

  <text x="390" y="406" text-anchor="middle" class="desc">每个实例都完整执行上方 DAG；所选日期是调度时间，业务日期取其前一天，补 10-01 的数据要从 10-02 选起</text>
</svg>
