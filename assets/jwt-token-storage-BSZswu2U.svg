<svg viewBox="0 0 770 284" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
    .lane { font-size:12px; font-weight:700; fill:var(--p); }
  </style>
  <defs>
    <marker id="arrow-jwt-store" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="385" y="26" text-anchor="middle">Token 放在哪：浏览器走 BFF，非浏览器走 Authorization 头</text>

  <text class="lane" x="20" y="54">浏览器</text>
  <rect x="20" y="64" width="202" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="121" y="88" text-anchor="middle">浏览器 SPA</text>
  <text class="desc" x="121" y="108" text-anchor="middle">只拿到会话 Cookie</text>
  <text class="desc" x="121" y="126" text-anchor="middle">JS 读不到任何 Token</text>

  <rect x="284" y="64" width="202" height="80" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="385" y="88" text-anchor="middle">BFF（机密客户端）</text>
  <text class="desc" x="385" y="108" text-anchor="middle">服务端会话保存 AT / RT</text>
  <text class="desc" x="385" y="126" text-anchor="middle">校验 CSRF Token 后转发</text>

  <rect x="548" y="64" width="202" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="649" y="88" text-anchor="middle">资源服务</text>
  <text class="desc" x="649" y="108" text-anchor="middle">oauth2ResourceServer</text>
  <text class="desc" x="649" y="126" text-anchor="middle">校验签名、iss、aud、exp</text>

  <line x1="222" y1="104" x2="282" y2="104" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-jwt-store)"/>
  <text class="label" x="252" y="98" text-anchor="middle">Cookie</text>
  <line x1="486" y1="104" x2="546" y2="104" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-jwt-store)"/>
  <text class="label" x="516" y="98" text-anchor="middle">Bearer</text>

  <text class="lane" x="20" y="174">非浏览器</text>
  <rect x="20" y="184" width="202" height="80" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="121" y="208" text-anchor="middle">移动 App / CLI / 服务</text>
  <text class="desc" x="121" y="228" text-anchor="middle">Token 存系统安全存储</text>
  <text class="desc" x="121" y="246" text-anchor="middle">不依赖 Cookie</text>

  <rect x="284" y="184" width="202" height="80" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="385" y="208" text-anchor="middle">网关（可选）</text>
  <text class="desc" x="385" y="228" text-anchor="middle">统一验签、限流</text>
  <text class="desc" x="385" y="246" text-anchor="middle">透传 Authorization 头</text>

  <rect x="548" y="184" width="202" height="80" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="649" y="208" text-anchor="middle">资源服务</text>
  <text class="desc" x="649" y="228" text-anchor="middle">同一套 JwtDecoder</text>
  <text class="desc" x="649" y="246" text-anchor="middle">浏览器不自动带头，无 CSRF</text>

  <line x1="222" y1="224" x2="282" y2="224" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-jwt-store)"/>
  <text class="label" x="252" y="218" text-anchor="middle">Bearer</text>
  <line x1="486" y1="224" x2="546" y2="224" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-jwt-store)"/>
  <text class="label" x="516" y="218" text-anchor="middle">Bearer</text>
</svg>
