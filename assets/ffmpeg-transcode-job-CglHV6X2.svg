<svg viewBox="0 0 760 254" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
  </style>
  <defs>
    <marker id="a-ffjob" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="380" y="22" text-anchor="middle">转码异步任务：建任务、入队、Worker 执行、回写进度与结果</text>
  <rect x="20" y="60" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="80" y="86" text-anchor="middle">上传完成</text>
  <text class="desc" x="80" y="106" text-anchor="middle">对象存储事件</text>
  <rect x="170" y="60" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="230" y="86" text-anchor="middle">媒体服务</text>
  <text class="desc" x="230" y="106" text-anchor="middle">建任务 PENDING</text>
  <rect x="320" y="60" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="380" y="86" text-anchor="middle">消息队列</text>
  <text class="desc" x="380" y="106" text-anchor="middle">transcode.job</text>
  <rect x="470" y="60" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="530" y="86" text-anchor="middle">转码 Worker</text>
  <text class="desc" x="530" y="106" text-anchor="middle">ffmpeg 子进程</text>
  <rect x="620" y="60" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="680" y="86" text-anchor="middle">对象存储</text>
  <text class="desc" x="680" y="106" text-anchor="middle">HLS 切片与封面</text>
  <line x1="140" y1="92" x2="168" y2="92" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <line x1="290" y1="92" x2="318" y2="92" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <line x1="440" y1="92" x2="468" y2="92" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <line x1="590" y1="92" x2="618" y2="92" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <path d="M530,60 L530,46 L380,46 L380,58" fill="none" stroke="var(--r)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-ffjob)"/>
  <text class="desc" x="455" y="41" text-anchor="middle">失败重试，超过次数进死信</text>
  <line x1="230" y1="124" x2="230" y2="168" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <line x1="530" y1="124" x2="530" y2="168" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <rect x="20" y="170" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="80" y="196" text-anchor="middle">业务方</text>
  <text class="desc" x="80" y="216" text-anchor="middle">回调或 WebSocket</text>
  <rect x="170" y="170" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="230" y="196" text-anchor="middle">任务表</text>
  <text class="desc" x="230" y="216" text-anchor="middle">状态、进度、产物</text>
  <rect x="470" y="170" width="120" height="64" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="530" y="196" text-anchor="middle">进度上报</text>
  <text class="desc" x="530" y="216" text-anchor="middle">-progress pipe:1</text>
  <line x1="470" y1="202" x2="292" y2="202" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <line x1="170" y1="202" x2="142" y2="202" stroke="var(--b)" stroke-width="1.5" marker-end="url(#a-ffjob)"/>
  <text class="desc" x="380" y="196" text-anchor="middle">进度 / 完成 / 失败</text>
</svg>
