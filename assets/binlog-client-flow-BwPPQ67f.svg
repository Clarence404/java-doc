<svg viewBox="0 0 680 494" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .arr { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">BinaryLogClient 连接、事件循环与保活重连</text>

  <!-- 主流程 -->
  <rect x="20" y="44" width="360" height="44" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="200" y="71" text-anchor="middle" fill="var(--fg)">建立连接、握手与认证（可升级 TLS）</text>
  <line class="arr" x1="200" y1="88" x2="200" y2="116"/>

  <rect x="20" y="118" width="360" height="44" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="200" y="145" text-anchor="middle" fill="var(--fg)">setupConnection：checksum、心跳周期</text>
  <line class="arr" x1="200" y1="162" x2="200" y2="190"/>

  <rect x="20" y="192" width="360" height="44" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="200" y="219" text-anchor="middle" fill="var(--fg)">requestBinaryLogStream：DUMP / DUMP_GTID</text>
  <line class="arr" x1="200" y1="236" x2="200" y2="264"/>

  <rect x="20" y="266" width="360" height="44" rx="6" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="200" y="293" text-anchor="middle" fill="var(--fg)">标记已连接，触发 onConnect</text>
  <line class="arr" x1="200" y1="310" x2="200" y2="338"/>

  <rect x="20" y="340" width="360" height="60" rx="6" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text x="200" y="364" text-anchor="middle" fill="var(--p)" font-weight="700">listenForEventPackets 循环</text>
  <text x="200" y="384" text-anchor="middle" fill="var(--muted)" font-size="11">读包 → 反序列化 → 推进 GTID → 通知监听器 → 推进文件位点</text>
  <line class="arr" x1="200" y1="400" x2="200" y2="428"/>

  <rect x="20" y="430" width="360" height="44" rx="6" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text x="200" y="457" text-anchor="middle" fill="var(--r)">非阻塞模式收到 EOF，或通信异常：断开</text>

  <!-- 保活线程 -->
  <rect x="400" y="44" width="260" height="60" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="530" y="68" text-anchor="middle" fill="var(--y)" font-weight="700">keepalive 线程</text>
  <text x="530" y="88" text-anchor="middle" fill="var(--muted)" font-size="11">每 keepAliveInterval（默认 1 分钟）检查</text>
  <line class="arr" x1="530" y1="104" x2="530" y2="132"/>

  <rect x="400" y="134" width="260" height="60" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="530" y="158" text-anchor="middle" fill="var(--fg)">判定连接丢失</text>
  <text x="530" y="178" text-anchor="middle" fill="var(--muted)" font-size="11">开心跳：超时无事件；未开：PING 失败</text>
  <line class="arr" x1="530" y1="194" x2="530" y2="222"/>

  <rect x="400" y="224" width="260" height="60" rx="6" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text x="530" y="248" text-anchor="middle" fill="var(--fg)">terminateConnect + connect(timeout)</text>
  <text x="530" y="268" text-anchor="middle" fill="var(--muted)" font-size="11">从内存中的 GTID / 文件位点重新订阅</text>
</svg>
