<svg viewBox="0 0 930 343" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
    .lane { font-size:12px; font-weight:700; fill:var(--p); }
    .mono { font-size:12px; font-family:Consolas,Menlo,monospace; fill:var(--fg); }
    .span { font-size:12px; fill:var(--fg); }
  </style>
  <defs>
    <marker id="arrow-otel-pipe" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="465" y="26" text-anchor="middle">Collector 管道：接收 → 处理 → 导出，每种信号一条 pipeline</text>
  <text class="lane" x="80" y="58" text-anchor="middle">应用</text>
  <text class="lane" x="245" y="58" text-anchor="middle">receivers</text>
  <text class="lane" x="470" y="58" text-anchor="middle">processors</text>
  <text class="lane" x="695" y="58" text-anchor="middle">exporters</text>
  <text class="lane" x="855" y="58" text-anchor="middle">后端</text>

  <rect x="20" y="70" width="120" height="220" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="80" y="166" text-anchor="middle">order-service</text>
  <text class="desc" x="80" y="188" text-anchor="middle">Java agent</text>
  <text class="desc" x="80" y="206" text-anchor="middle">三类信号</text>

  <rect x="180" y="70" width="130" height="220" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="245" y="166" text-anchor="middle">otlp</text>
  <text class="desc" x="245" y="188" text-anchor="middle">gRPC :4317</text>
  <text class="desc" x="245" y="206" text-anchor="middle">HTTP :4318</text>

  <rect x="350" y="70" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="470" y="94" text-anchor="middle">traces</text>
  <text class="desc" x="470" y="114" text-anchor="middle">memory_limiter · tail_sampling · batch</text>
  <rect x="350" y="150" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="470" y="174" text-anchor="middle">metrics</text>
  <text class="desc" x="470" y="194" text-anchor="middle">memory_limiter · batch</text>
  <rect x="350" y="230" width="240" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="470" y="254" text-anchor="middle">logs</text>
  <text class="desc" x="470" y="274" text-anchor="middle">memory_limiter · batch</text>

  <rect x="630" y="70" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="695" y="94" text-anchor="middle">otlp/tempo</text>
  <text class="desc" x="695" y="114" text-anchor="middle">gRPC</text>
  <rect x="630" y="150" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="695" y="174" text-anchor="middle">otlphttp/prom</text>
  <text class="desc" x="695" y="194" text-anchor="middle">/api/v1/otlp</text>
  <rect x="630" y="230" width="130" height="60" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="695" y="254" text-anchor="middle">otlphttp/loki</text>
  <text class="desc" x="695" y="274" text-anchor="middle">/otlp</text>

  <rect x="800" y="70" width="110" height="60" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="855" y="94" text-anchor="middle">Tempo</text>
  <text class="desc" x="855" y="114" text-anchor="middle">或 Jaeger v2</text>
  <rect x="800" y="150" width="110" height="60" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="855" y="174" text-anchor="middle">Prometheus</text>
  <text class="desc" x="855" y="194" text-anchor="middle">3.x</text>
  <rect x="800" y="230" width="110" height="60" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="855" y="254" text-anchor="middle">Loki</text>
  <text class="desc" x="855" y="274" text-anchor="middle">3.x</text>

  <line x1="140" y1="180" x2="178" y2="180" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <text class="label" x="160" y="174" text-anchor="middle">OTLP</text>
  <line x1="310" y1="100" x2="348" y2="100" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="310" y1="180" x2="348" y2="180" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="310" y1="260" x2="348" y2="260" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="590" y1="100" x2="628" y2="100" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="590" y1="180" x2="628" y2="180" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="590" y1="260" x2="628" y2="260" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="760" y1="100" x2="798" y2="100" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="760" y1="180" x2="798" y2="180" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>
  <line x1="760" y1="260" x2="798" y2="260" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-otel-pipe)"/>

  <text class="desc" x="465" y="320" text-anchor="middle">一个 receiver 可被多条 pipeline 共用；processors 按声明顺序执行，memory_limiter 放第一位；一条 pipeline 可挂多个 exporter</text>
</svg>
