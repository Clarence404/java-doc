<svg viewBox="0 0 720 272" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">HBase LSM 写入 &amp; 读取流程</text>

  <!-- ===== WRITE PATH ===== -->
  <text x="170" y="46" text-anchor="middle" font-weight="700" fill="var(--b)" font-size="12">写路径</text>

  <rect class="box" x="10" y="54" width="90" height="34" stroke="var(--muted)"/>
  <text x="55" y="76" text-anchor="middle" fill="var(--fg)" font-weight="600">Client 写</text>

  <line class="arr" x1="100" y1="71" x2="114" y2="71" stroke="var(--muted)"/>

  <rect class="box" x="120" y="54" width="90" height="34" stroke="var(--r)"/>
  <text x="165" y="70" text-anchor="middle" fill="var(--r)" font-weight="600">WAL</text>
  <text x="165" y="83" text-anchor="middle" fill="var(--muted)" font-size="9">HLog 顺序写</text>

  <line class="arr" x1="210" y1="71" x2="224" y2="71" stroke="var(--muted)"/>

  <rect class="box" x="230" y="54" width="100" height="34" stroke="var(--y)"/>
  <text x="280" y="70" text-anchor="middle" fill="var(--y)" font-weight="600">MemStore</text>
  <text x="280" y="83" text-anchor="middle" fill="var(--muted)" font-size="9">内存，跳表有序</text>

  <!-- Flush -->
  <text x="336" y="68" text-anchor="middle" fill="var(--muted)" font-size="9">Flush</text>
  <line class="arr" x1="330" y1="71" x2="350" y2="71" stroke="var(--g)"/>

  <rect class="box" x="356" y="54" width="80" height="34" stroke="var(--g)"/>
  <text x="396" y="70" text-anchor="middle" fill="var(--g)" font-weight="600">HFile</text>
  <text x="396" y="83" text-anchor="middle" fill="var(--muted)" font-size="9">HDFS 持久化</text>

  <!-- Compaction -->
  <text x="460" y="62" text-anchor="middle" fill="var(--muted)" font-size="9">Minor/Major</text>
  <text x="460" y="73" text-anchor="middle" fill="var(--muted)" font-size="9">Compaction</text>
  <line class="arr" x1="436" y1="71" x2="474" y2="71" stroke="var(--p)"/>

  <rect class="box" x="480" y="54" width="100" height="34" stroke="var(--p)"/>
  <text x="530" y="70" text-anchor="middle" fill="var(--p)" font-weight="600">合并后 HFile</text>
  <text x="530" y="83" text-anchor="middle" fill="var(--muted)" font-size="9">删除过期 / 合并版本</text>

  <!-- Flush threshold note -->
  <rect x="230" y="96" width="206" height="24" rx="3" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="333" y="109" text-anchor="middle" fill="var(--muted)" font-size="9">MemStore ≥ 128MB（默认）触发 Flush</text>

  <!-- ===== READ PATH ===== -->
  <text x="170" y="140" text-anchor="middle" font-weight="700" fill="var(--b)" font-size="12">读路径</text>

  <rect class="box" x="10" y="148" width="90" height="34" stroke="var(--muted)"/>
  <text x="55" y="170" text-anchor="middle" fill="var(--fg)" font-weight="600">Client 读</text>

  <line class="arr" x1="100" y1="165" x2="114" y2="165" stroke="var(--muted)"/>

  <rect class="box" x="120" y="148" width="110" height="34" stroke="var(--b)"/>
  <text x="175" y="164" text-anchor="middle" fill="var(--b)" font-weight="600">BlockCache</text>
  <text x="175" y="177" text-anchor="middle" fill="var(--muted)" font-size="9">LRU 块缓存</text>

  <!-- Hit -->
  <text x="212" y="145" text-anchor="middle" fill="var(--g)" font-size="9">命中</text>
  <line x1="230" y1="155" x2="230" y2="132" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="226,132 230,124 234,132" fill="var(--g)"/>
  <text x="270" y="130" fill="var(--g)" font-size="10" font-weight="600">直接返回</text>

  <!-- Miss -->
  <line class="arr" x1="230" y1="165" x2="248" y2="165" stroke="var(--muted)"/>
  <text x="242" y="160" text-anchor="middle" fill="var(--r)" font-size="9">未命中</text>

  <rect class="box" x="254" y="148" width="100" height="34" stroke="var(--y)"/>
  <text x="304" y="164" text-anchor="middle" fill="var(--y)" font-weight="600">MemStore</text>
  <text x="304" y="177" text-anchor="middle" fill="var(--muted)" font-size="9">内存中最新版本</text>

  <line class="arr" x1="354" y1="165" x2="368" y2="165" stroke="var(--muted)"/>

  <rect class="box" x="374" y="148" width="110" height="34" stroke="var(--g)"/>
  <text x="429" y="164" text-anchor="middle" fill="var(--g)" font-weight="600">HFile × N</text>
  <text x="429" y="177" text-anchor="middle" fill="var(--muted)" font-size="9">BloomFilter + 索引</text>

  <line class="arr" x1="484" y1="165" x2="498" y2="165" stroke="var(--muted)"/>

  <rect class="box" x="504" y="148" width="120" height="34" stroke="var(--p)"/>
  <text x="564" y="164" text-anchor="middle" fill="var(--p)" font-weight="600">合并多版本结果</text>
  <text x="564" y="177" text-anchor="middle" fill="var(--muted)" font-size="9">返回最新一致值</text>

  <!-- Bottom summary -->
  <rect x="10" y="200" width="700" height="60" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="360" y="218" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="11">关键特性</text>
  <text x="360" y="234" text-anchor="middle" fill="var(--fg)" font-size="10">写优先：WAL + MemStore 保障顺序写性能；读放大：需合并 MemStore + 多个 HFile 版本</text>
  <text x="360" y="248" text-anchor="middle" fill="var(--muted)" font-size="10">BloomFilter 快速过滤不存在的 Key；Compaction 控制文件数量，降低读放大</text>
</svg>
