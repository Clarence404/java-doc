<svg viewBox="0 0 890 284" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="445" y="24" text-anchor="middle" class="title">Kafka Connect 数据管道：一份 CDC 数据，多处消费</text>

  <rect x="20" y="114" width="110" height="80" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="75" y="146" text-anchor="middle" class="name">MySQL</text>
  <text x="75" y="168" text-anchor="middle" class="desc">binlog（ROW）</text>

  <rect x="170" y="114" width="150" height="80" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="245" y="146" text-anchor="middle" class="name">Debezium</text>
  <text x="245" y="168" text-anchor="middle" class="desc">Source Connector</text>

  <rect x="360" y="114" width="170" height="80" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="445" y="146" text-anchor="middle" class="name">Kafka Topic</text>
  <text x="445" y="168" text-anchor="middle" class="desc">prefix.db.table</text>

  <line x1="130" y1="154" x2="168" y2="154" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="154" x2="358" y2="154" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sink / 计算 -->
  <rect x="570" y="44" width="130" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="635" y="68" text-anchor="middle" class="name">ES Sink</text>
  <text x="635" y="88" text-anchor="middle" class="desc">Sink Connector</text>
  <rect x="570" y="124" width="130" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="635" y="148" text-anchor="middle" class="name">JDBC Sink</text>
  <text x="635" y="168" text-anchor="middle" class="desc">Sink Connector</text>
  <rect x="570" y="204" width="130" height="60" rx="4" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="635" y="228" text-anchor="middle" class="name">Flink / Streams</text>
  <text x="635" y="248" text-anchor="middle" class="desc">流式计算</text>

  <line x1="530" y1="134" x2="568" y2="80" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="154" x2="568" y2="154" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="174" x2="568" y2="228" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 目标系统 -->
  <rect x="740" y="44" width="130" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="805" y="68" text-anchor="middle" class="name">Elasticsearch</text>
  <text x="805" y="88" text-anchor="middle" class="desc">全文检索</text>
  <rect x="740" y="124" width="130" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="805" y="148" text-anchor="middle" class="name">数据仓库</text>
  <text x="805" y="168" text-anchor="middle" class="desc">离线分析</text>
  <rect x="740" y="204" width="130" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="805" y="228" text-anchor="middle" class="name">ClickHouse</text>
  <text x="805" y="248" text-anchor="middle" class="desc">实时分析</text>

  <line x1="700" y1="74" x2="738" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="154" x2="738" y2="154" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="234" x2="738" y2="234" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
