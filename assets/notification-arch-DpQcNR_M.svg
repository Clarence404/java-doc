<svg viewBox="0 0 680 574" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">消息通知中心整体架构</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">业务系统</text>
  <text class="sub" x="40" y="88">订单 / 支付 / 账号 / 营销</text>
  <text class="desc" x="650" y="70" text-anchor="end">调用发送接口，或经 Outbox 投递业务事件</text>
  <text class="desc" x="650" y="88" text-anchor="end">带幂等键、模板编码、接收人与变量</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">通知服务</text>
  <text class="sub" x="40" y="178">接入与编排</text>
  <text class="desc" x="650" y="160" text-anchor="end">去重落任务 → 订阅偏好 → 频控与免打扰</text>
  <text class="desc" x="650" y="178" text-anchor="end">模板渲染、多语言、渠道选择</text>
  <line class="arr" x1="94" y1="194" x2="94" y2="222"/>
  <line class="arr" x1="258" y1="194" x2="258" y2="222"/>
  <line class="arr" x1="422" y1="194" x2="422" y2="222"/>
  <line class="arr" x1="586" y1="194" x2="586" y2="222"/>

  <rect class="layer" x="20" y="224" width="148" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="94" y="250" text-anchor="middle" fill="var(--r)">P0 验证码 / 安全</text>
  <text class="sub" x="94" y="268" text-anchor="middle">独立 Topic 与消费组</text>
  <rect class="layer" x="184" y="224" width="148" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="258" y="250" text-anchor="middle" fill="var(--y)">P1 交易通知</text>
  <text class="sub" x="258" y="268" text-anchor="middle">订单 / 支付 / 物流</text>
  <rect class="layer" x="348" y="224" width="148" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="422" y="250" text-anchor="middle" fill="var(--g)">P2 系统 / 互动</text>
  <text class="sub" x="422" y="268" text-anchor="middle">评论 / 关注 / 公告</text>
  <rect class="layer" x="512" y="224" width="148" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="586" y="250" text-anchor="middle" fill="var(--p)">P3 营销批量</text>
  <text class="sub" x="586" y="268" text-anchor="middle">令牌桶匀速放量</text>
  <line class="arr" x1="94" y1="284" x2="94" y2="312"/>
  <line class="arr" x1="258" y1="284" x2="258" y2="312"/>
  <line class="arr" x1="422" y1="284" x2="422" y2="312"/>
  <line class="arr" x1="586" y1="284" x2="586" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">发送执行器</text>
  <text class="sub" x="40" y="358">按优先级分池消费</text>
  <text class="desc" x="650" y="340" text-anchor="end">供应商限速、错误分类、退避重试</text>
  <text class="desc" x="650" y="358" text-anchor="end">熔断与多供应商切换、渠道降级</text>
  <line class="arr" x1="80" y1="374" x2="80" y2="402"/>
  <line class="arr" x1="210" y1="374" x2="210" y2="402"/>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>
  <line class="arr" x1="470" y1="374" x2="470" y2="402"/>
  <line class="arr" x1="600" y1="374" x2="600" y2="402"/>

  <rect class="layer" x="20" y="404" width="120" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="80" y="430" text-anchor="middle" fill="var(--g)">站内信</text>
  <text class="sub" x="80" y="448" text-anchor="middle">收件箱 + 长连接</text>
  <rect class="layer" x="150" y="404" width="120" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="210" y="430" text-anchor="middle" fill="var(--g)">短信</text>
  <text class="sub" x="210" y="448" text-anchor="middle">多供应商路由</text>
  <rect class="layer" x="280" y="404" width="120" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="340" y="430" text-anchor="middle" fill="var(--g)">邮件</text>
  <text class="sub" x="340" y="448" text-anchor="middle">SMTP 或 API</text>
  <rect class="layer" x="410" y="404" width="120" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="470" y="430" text-anchor="middle" fill="var(--g)">App 推送</text>
  <text class="sub" x="470" y="448" text-anchor="middle">APNs / FCM / 厂商</text>
  <rect class="layer" x="540" y="404" width="120" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="600" y="430" text-anchor="middle" fill="var(--g)">IM Webhook</text>
  <text class="sub" x="600" y="448" text-anchor="middle">飞书 / 钉钉 / 企微</text>
  <line class="arr" x1="340" y1="464" x2="340" y2="492"/>

  <rect class="layer" x="20" y="494" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="520" fill="var(--b)">外部通道与回执</text>
  <text class="sub" x="40" y="538">运营商 / 邮件服务商 / 推送平台</text>
  <text class="desc" x="650" y="520" text-anchor="end">状态报告、退信、无效 token 回调</text>
  <text class="desc" x="650" y="538" text-anchor="end">回执更新状态机，汇总送达率与延迟</text>
</svg>
