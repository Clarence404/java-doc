<svg viewBox="0 0 760 770" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
              --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171; }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5 z" fill="var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="770" fill="var(--bg)"/>
  <text x="380" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="var(--fg)">客户端凭证、刷新令牌与设备码</text>
  <rect x="20" y="40" width="720" height="216" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2"/>
  <text x="380" y="62" font-size="13" font-weight="700" text-anchor="middle" fill="var(--fg)">客户端凭证（服务间调用，没有用户参与）</text>
  <rect x="70" y="74" width="140" height="44" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="140.0" y="100.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--g)">授权服务器</text>
  <rect x="310" y="74" width="140" height="44" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="380.0" y="100.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--b)">服务 A（机密客户端）</text>
  <rect x="550" y="74" width="140" height="44" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="620.0" y="100.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--y)">服务 B（资源服务器）</text>
  <line x1="140" y1="118" x2="140" y2="248" stroke="var(--g)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="380" y1="118" x2="380" y2="248" stroke="var(--b)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="620" y1="118" x2="620" y2="248" stroke="var(--y)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <text x="260.0" y="142" font-size="10" text-anchor="middle" fill="var(--muted)">① 客户端认证，申请令牌</text>
  <line x1="380" y1="148" x2="140" y2="148" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260.0" y="172" font-size="10" text-anchor="middle" fill="var(--muted)">② access_token</text>
  <line x1="140" y1="178" x2="380" y2="178" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500.0" y="202" font-size="10" text-anchor="middle" fill="var(--muted)">③ Bearer 调用 API</text>
  <line x1="380" y1="208" x2="620" y2="208" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500.0" y="232" font-size="10" text-anchor="middle" fill="var(--muted)">④ 返回结果</text>
  <line x1="620" y1="238" x2="380" y2="238" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="272" width="720" height="216" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2"/>
  <text x="380" y="294" font-size="13" font-weight="700" text-anchor="middle" fill="var(--fg)">刷新令牌（access_token 过期后静默续期）</text>
  <rect x="70" y="306" width="140" height="44" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="140.0" y="332.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--g)">授权服务器</text>
  <rect x="310" y="306" width="140" height="44" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="380.0" y="332.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--b)">客户端</text>
  <rect x="550" y="306" width="140" height="44" rx="6" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="620.0" y="332.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--y)">资源服务器</text>
  <line x1="140" y1="350" x2="140" y2="480" stroke="var(--g)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="380" y1="350" x2="380" y2="480" stroke="var(--b)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="620" y1="350" x2="620" y2="480" stroke="var(--y)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <text x="500.0" y="374" font-size="10" text-anchor="middle" fill="var(--muted)">① 用旧 access_token 调用</text>
  <line x1="380" y1="380" x2="620" y2="380" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500.0" y="404" font-size="10" text-anchor="middle" fill="var(--muted)">② 401：令牌已过期</text>
  <line x1="620" y1="410" x2="380" y2="410" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260.0" y="434" font-size="10" text-anchor="middle" fill="var(--muted)">③ refresh_token 换新令牌</text>
  <line x1="380" y1="440" x2="140" y2="440" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260.0" y="464" font-size="10" text-anchor="middle" fill="var(--muted)">④ 新 access_token + 新 refresh_token</text>
  <line x1="140" y1="470" x2="380" y2="470" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="504" width="720" height="246" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2"/>
  <text x="380" y="526" font-size="13" font-weight="700" text-anchor="middle" fill="var(--fg)">设备码（电视、CLI 等不便输入的设备）</text>
  <rect x="70" y="538" width="140" height="44" rx="6" fill="var(--p)" fill-opacity="0.12" stroke="var(--p)" stroke-width="1.5"/>
  <text x="140.0" y="564.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--p)">用户手机浏览器</text>
  <rect x="310" y="538" width="140" height="44" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="380.0" y="564.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--g)">授权服务器</text>
  <rect x="550" y="538" width="140" height="44" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="620.0" y="564.0" font-size="12" font-weight="700" text-anchor="middle" fill="var(--b)">受限设备</text>
  <line x1="140" y1="582" x2="140" y2="742" stroke="var(--p)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="380" y1="582" x2="380" y2="742" stroke="var(--g)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <line x1="620" y1="582" x2="620" y2="742" stroke="var(--b)" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
  <text x="500.0" y="606" font-size="10" text-anchor="middle" fill="var(--muted)">① 申请设备码</text>
  <line x1="620" y1="612" x2="380" y2="612" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500.0" y="636" font-size="10" text-anchor="middle" fill="var(--muted)">② device_code、user_code、verification_uri</text>
  <line x1="380" y1="642" x2="620" y2="642" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260.0" y="666" font-size="10" text-anchor="middle" fill="var(--muted)">③ 打开 verification_uri，输入 user_code 并授权</text>
  <line x1="140" y1="672" x2="380" y2="672" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500.0" y="696" font-size="10" text-anchor="middle" fill="var(--muted)">④ 按 interval 轮询 /token</text>
  <line x1="620" y1="702" x2="380" y2="702" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500.0" y="726" font-size="10" text-anchor="middle" fill="var(--muted)">⑤ 用户授权后返回令牌</text>
  <line x1="380" y1="732" x2="620" y2="732" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
