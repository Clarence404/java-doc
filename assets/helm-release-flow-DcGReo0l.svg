<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-helm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="360" y="24" text-anchor="middle">Helm：Chart 渲染与 Release 版本历史</text>

  <rect x="20" y="44" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="120" y="68" text-anchor="middle">Chart</text>
  <text class="desc" x="120" y="88" text-anchor="middle">templates/ + values.yaml</text>
  <text class="desc" x="120" y="106" text-anchor="middle">叠加 -f / --set 覆盖值</text>

  <line x1="220" y1="82" x2="258" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-helm)"/>

  <rect x="260" y="44" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="68" text-anchor="middle">模板渲染</text>
  <text class="desc" x="360" y="88" text-anchor="middle">Go template + Sprig 函数</text>
  <text class="desc" x="360" y="106" text-anchor="middle">helm template 可本地预览</text>

  <line x1="460" y1="82" x2="498" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-helm)"/>

  <rect x="500" y="44" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="600" y="68" text-anchor="middle">Kubernetes 集群</text>
  <text class="desc" x="600" y="88" text-anchor="middle">Server-Side Apply 提交</text>
  <text class="desc" x="600" y="106" text-anchor="middle">--wait 按 kstatus 等就绪</text>

  <line x1="600" y1="120" x2="600" y2="152" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-helm)"/>
  <text class="label" x="590" y="141" text-anchor="end">每次变更记一个 revision</text>

  <rect x="20" y="154" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="120" y="178" text-anchor="middle">revision 1 · install</text>
  <text class="desc" x="120" y="198" text-anchor="middle">values A</text>
  <text class="desc" x="120" y="216" text-anchor="middle">状态 superseded</text>

  <line x1="220" y1="192" x2="258" y2="192" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-helm)"/>

  <rect x="260" y="154" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="360" y="178" text-anchor="middle">revision 2 · upgrade</text>
  <text class="desc" x="360" y="198" text-anchor="middle">values B（上线后发现问题）</text>
  <text class="desc" x="360" y="216" text-anchor="middle">状态 superseded</text>

  <line x1="460" y1="192" x2="498" y2="192" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-helm)"/>

  <rect x="500" y="154" width="200" height="76" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="600" y="178" text-anchor="middle">revision 3 · rollback</text>
  <text class="desc" x="600" y="198" text-anchor="middle">复制 revision 1 的清单与值</text>
  <text class="desc" x="600" y="216" text-anchor="middle">状态 deployed</text>
</svg>
