<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">三种时间窗口（横轴为事件时间）</text>

  <!-- 滚动 -->
  <rect x="20" y="44" width="110" height="68" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="75" y="72" text-anchor="middle" class="name">滚动窗口</text>
  <text x="75" y="92" text-anchor="middle" class="desc">大小 10s</text>
  <rect x="150" y="44" width="117" height="68" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="208" y="82" text-anchor="middle" class="desc">[0, 10)</text>
  <rect x="275" y="44" width="117" height="68" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="333" y="82" text-anchor="middle" class="desc">[10, 20)</text>
  <rect x="400" y="44" width="117" height="68" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="458" y="82" text-anchor="middle" class="desc">[20, 30)</text>
  <rect x="525" y="44" width="117" height="68" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="583" y="82" text-anchor="middle" class="desc">[30, 40)</text>

  <!-- 滑动 -->
  <rect x="20" y="128" width="110" height="68" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="75" y="156" text-anchor="middle" class="name">滑动窗口</text>
  <text x="75" y="176" text-anchor="middle" class="desc">10s / 步长 5s</text>
  <rect x="150" y="128" width="117" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="208" y="146" text-anchor="middle" class="desc">[0, 10)</text>
  <rect x="275" y="128" width="117" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="333" y="146" text-anchor="middle" class="desc">[10, 20)</text>
  <rect x="400" y="128" width="117" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="458" y="146" text-anchor="middle" class="desc">[20, 30)</text>
  <rect x="525" y="128" width="117" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="583" y="146" text-anchor="middle" class="desc">[30, 40)</text>
  <rect x="212" y="166" width="117" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="270" y="184" text-anchor="middle" class="desc">[5, 15)</text>
  <rect x="337" y="166" width="117" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="395" y="184" text-anchor="middle" class="desc">[15, 25)</text>
  <rect x="462" y="166" width="117" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="520" y="184" text-anchor="middle" class="desc">[25, 35)</text>
  <rect x="587" y="166" width="113" height="30" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="643" y="184" text-anchor="middle" class="desc">[35, 45)</text>

  <!-- 会话 -->
  <rect x="20" y="212" width="110" height="68" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="75" y="240" text-anchor="middle" class="name">会话窗口</text>
  <text x="75" y="260" text-anchor="middle" class="desc">间隔 gap 5s</text>
  <rect x="150" y="212" width="160" height="68" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="230" y="240" text-anchor="middle" class="name">会话 A</text>
  <text x="230" y="260" text-anchor="middle" class="desc">长度随数据变化</text>
  <text x="340" y="250" text-anchor="middle" class="desc">空闲 &gt; gap</text>
  <rect x="370" y="212" width="100" height="68" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="420" y="240" text-anchor="middle" class="name">会话 B</text>
  <text x="420" y="260" text-anchor="middle" class="desc">短会话</text>
  <text x="500" y="250" text-anchor="middle" class="desc">空闲 &gt; gap</text>
  <rect x="530" y="212" width="170" height="68" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="615" y="240" text-anchor="middle" class="name">会话 C</text>
  <text x="615" y="260" text-anchor="middle" class="desc">窗口会合并</text>
</svg>
