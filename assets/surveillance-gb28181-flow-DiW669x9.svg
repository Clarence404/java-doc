<svg viewBox="0 0 900 654" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>
  <text x="450" y="24" text-anchor="middle" class="title">GB/T 28181 接入时序：注册 → 心跳 → 目录查询 → 按需点播 → 无人观看停流</text>
  <rect x="30" y="44" width="160" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="110" y="68" text-anchor="middle" class="name">摄像机 / NVR</text>
  <text x="110" y="88" text-anchor="middle" class="desc">GB28181 设备</text>
  <line x1="110" y1="104" x2="110" y2="634" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="260" y="44" width="160" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" class="name">信令服务</text>
  <text x="340" y="88" text-anchor="middle" class="desc">WVP-PRO / Java</text>
  <line x1="340" y1="104" x2="340" y2="474" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="340" y1="492" x2="340" y2="634" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="490" y="44" width="160" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="570" y="68" text-anchor="middle" class="name">流媒体服务</text>
  <text x="570" y="88" text-anchor="middle" class="desc">ZLMediaKit</text>
  <line x1="570" y1="104" x2="570" y2="324" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="570" y1="342" x2="570" y2="504" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="570" y1="522" x2="570" y2="634" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="710" y="44" width="160" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="790" y="68" text-anchor="middle" class="name">浏览器</text>
  <text x="790" y="88" text-anchor="middle" class="desc">Web 播放器</text>
  <line x1="790" y1="104" x2="790" y2="634" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="134" x2="338" y2="134" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="128" text-anchor="middle" class="lbl">REGISTER</text>
  <line x1="340" y1="164" x2="112" y2="164" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="158" text-anchor="middle" class="lbl">401 Unauthorized（Digest 挑战）</text>
  <line x1="110" y1="194" x2="338" y2="194" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="188" text-anchor="middle" class="lbl">REGISTER（带 Authorization）</text>
  <line x1="340" y1="224" x2="112" y2="224" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="218" text-anchor="middle" class="lbl">200 OK（注册成功）</text>
  <line x1="110" y1="254" x2="338" y2="254" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="248" text-anchor="middle" class="lbl">MESSAGE Keepalive（周期心跳）</text>
  <line x1="340" y1="284" x2="112" y2="284" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="278" text-anchor="middle" class="lbl">MESSAGE Query Catalog</text>
  <line x1="110" y1="314" x2="338" y2="314" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="308" text-anchor="middle" class="lbl">MESSAGE Response Catalog</text>
  <line x1="790" y1="344" x2="342" y2="344" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="566" y="338" text-anchor="middle" class="lbl">请求播放某通道</text>
  <line x1="340" y1="374" x2="568" y2="374" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="455" y="368" text-anchor="middle" class="lbl">openRtpServer（分配端口）</text>
  <line x1="340" y1="404" x2="112" y2="404" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="398" text-anchor="middle" class="lbl">INVITE（SDP：ZLM 地址 + SSRC）</text>
  <line x1="110" y1="434" x2="338" y2="434" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="428" text-anchor="middle" class="lbl">200 OK（设备 SDP）</text>
  <line x1="340" y1="464" x2="112" y2="464" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="458" text-anchor="middle" class="lbl">ACK</text>
  <line x1="110" y1="494" x2="568" y2="494" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="340" y="488" text-anchor="middle" class="lbl">RTP 推流（PS 封装）</text>
  <line x1="340" y1="524" x2="788" y2="524" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="564" y="518" text-anchor="middle" class="lbl">返回播放地址</text>
  <line x1="790" y1="554" x2="572" y2="554" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="680" y="548" text-anchor="middle" class="lbl">HTTP-FLV / WebRTC 拉流</text>
  <line x1="570" y1="584" x2="342" y2="584" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="455" y="578" text-anchor="middle" class="lbl">on_stream_none_reader</text>
  <line x1="340" y1="614" x2="112" y2="614" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="608" text-anchor="middle" class="lbl">BYE（停止推流）</text>
</svg>
