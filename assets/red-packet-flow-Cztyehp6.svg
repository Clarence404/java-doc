<svg viewBox="0 0 680 574" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">红包资金链路</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">发红包</text>
  <text class="sub" x="40" y="88">本地事务</text>
  <text class="desc" x="650" y="70" text-anchor="end">条件更新扣减发送者余额</text>
  <text class="desc" x="650" y="88" text-anchor="end">写红包、N 个份额行与资金流水</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">装载 Redis</text>
  <text class="sub" x="40" y="178">提交后执行 + 补偿任务</text>
  <text class="desc" x="650" y="160" text-anchor="end">Lua：不存在才写入份额列表并设置过期</text>
  <text class="desc" x="650" y="178" text-anchor="end">装载失败由任务按 CREATED 状态重试</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">抢红包</text>
  <text class="sub" x="40" y="268">Lua 原子执行</text>
  <text class="desc" x="650" y="250" text-anchor="end">判关闭、判重，弹出份额，记录领取</text>
  <text class="desc" x="650" y="268" text-anchor="end">三个 key 使用同一个哈希标签</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">事务消息</text>
  <text class="sub" x="40" y="358">RocketMQ 半消息</text>
  <text class="desc" x="650" y="340" text-anchor="end">本地事务即执行 Lua，回查读领取记录</text>
  <text class="desc" x="650" y="358" text-anchor="end">结果不确定且仍在窗口内返回 UNKNOWN</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>

  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">入账</text>
  <text class="sub" x="40" y="448">消费者本地事务</text>
  <text class="desc" x="650" y="430" text-anchor="end">领取记录唯一键去重，份额置已领，加余额</text>
  <text class="desc" x="650" y="448" text-anchor="end">重复消费捕获唯一键冲突后直接确认</text>
  <line class="arr" x1="340" y1="464" x2="340" y2="492"/>

  <rect class="layer" x="20" y="494" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="520" fill="var(--p)">过期退款</text>
  <text class="sub" x="40" y="538">分布式调度</text>
  <text class="desc" x="650" y="520" text-anchor="end">Lua 关闭红包，等待 DB 与 Redis 领取数对齐</text>
  <text class="desc" x="650" y="538" text-anchor="end">状态条件更新为 REFUNDED，退未领份额</text>

</svg>
