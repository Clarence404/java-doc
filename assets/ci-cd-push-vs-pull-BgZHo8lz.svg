<svg viewBox="0 0 770 332" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
    .lane { font-size:12px; font-weight:700; fill:var(--p); }
  </style>
  <defs>
    <marker id="arrow-cicd-pp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="385" y="26" text-anchor="middle">推送式部署 vs 拉取式 GitOps：集群凭证放在哪里</text>

  <text class="lane" x="20" y="54">推送式（Push）：CI 直接改集群</text>
  <rect x="20" y="64" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="90" text-anchor="middle">CI 流水线</text>
  <text class="desc" x="100" y="112" text-anchor="middle">持有集群写凭证</text>
  <rect x="590" y="64" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="90" text-anchor="middle">Kubernetes 集群</text>
  <text class="desc" x="670" y="112" text-anchor="middle">需向 CI 开放 API</text>
  <line x1="180" y1="96" x2="588" y2="96" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-cicd-pp)"/>
  <text class="label" x="384" y="88" text-anchor="middle">kubectl / helm upgrade（OIDC 换短期凭证）</text>

  <text class="lane" x="20" y="166">拉取式（GitOps）：CI 只改配置仓库，集群内控制器自己同步</text>
  <rect x="20" y="178" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="100" y="204" text-anchor="middle">CI 流水线</text>
  <text class="desc" x="100" y="226" text-anchor="middle">只有配置仓库写权限</text>
  <rect x="210" y="178" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="290" y="204" text-anchor="middle">配置仓库</text>
  <text class="desc" x="290" y="226" text-anchor="middle">提交新 digest（PR）</text>
  <rect x="400" y="178" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="480" y="204" text-anchor="middle">Argo CD</text>
  <text class="desc" x="480" y="226" text-anchor="middle">集群内拉取并比对</text>
  <rect x="590" y="178" width="160" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="670" y="204" text-anchor="middle">Kubernetes 集群</text>
  <text class="desc" x="670" y="226" text-anchor="middle">API 不对外暴露</text>
  <line x1="180" y1="210" x2="208" y2="210" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-cicd-pp)"/>
  <line x1="370" y1="210" x2="398" y2="210" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-cicd-pp)"/>
  <line x1="560" y1="210" x2="588" y2="210" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-cicd-pp)"/>

  <rect x="20" y="272" width="730" height="40" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="desc" x="385" y="297" text-anchor="middle">推送式简单直接，适合单集群起步；拉取式有声明式审计与漂移自愈，适合多集群和严格的权限隔离</text>
</svg>
