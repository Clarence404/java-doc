<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" class="title">importData() 模板方法的固定流程</text>
  <rect x="18" y="50" width="784" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="410" y="76" text-anchor="middle" class="name">DataImporter&lt;T&gt;（抽象类）</text>
  <text x="410" y="96" text-anchor="middle" class="desc">importData() 声明为 final，按固定顺序调用下面 6 个步骤</text>
  <rect x="18" y="150" width="104" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="70" y="176" text-anchor="middle" class="name">readLines</text>
  <text x="70" y="196" text-anchor="middle" class="desc">默认实现</text>
  <line x1="122" y1="180" x2="152" y2="180" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="154" y="150" width="104" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="206" y="176" text-anchor="middle" class="name">parse</text>
  <text x="206" y="196" text-anchor="middle" class="desc">抽象步骤</text>
  <line x1="258" y1="180" x2="288" y2="180" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="290" y="150" width="104" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="342" y="176" text-anchor="middle" class="name">validate</text>
  <text x="342" y="196" text-anchor="middle" class="desc">默认实现</text>
  <line x1="394" y1="180" x2="424" y2="180" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="426" y="150" width="104" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="478" y="176" text-anchor="middle" class="name">beforePersist</text>
  <text x="478" y="196" text-anchor="middle" class="desc">钩子</text>
  <line x1="530" y1="180" x2="560" y2="180" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="562" y="150" width="104" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="614" y="176" text-anchor="middle" class="name">persist</text>
  <text x="614" y="196" text-anchor="middle" class="desc">抽象步骤</text>
  <line x1="666" y1="180" x2="696" y2="180" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="698" y="150" width="104" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="750" y="176" text-anchor="middle" class="name">afterImport</text>
  <text x="750" y="196" text-anchor="middle" class="desc">钩子</text>
  <line x1="70" y1="110" x2="70" y2="148" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="78" y="133" text-anchor="start" class="lbl">依次调用</text>
  <rect x="18" y="250" width="384" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="210" y="276" text-anchor="middle" class="name">CsvUserImporter</text>
  <text x="210" y="296" text-anchor="middle" class="desc">实现 parse / persist，覆盖 validate</text>
  <rect x="418" y="250" width="384" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="610" y="276" text-anchor="middle" class="name">JsonUserImporter</text>
  <text x="610" y="296" text-anchor="middle" class="desc">只实现 parse / persist</text>
  <line x1="206" y1="250" x2="206" y2="212" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="214" y="235" text-anchor="start" class="lbl">子类实现</text>
  <line x1="614" y1="250" x2="614" y2="212" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="622" y="235" text-anchor="start" class="lbl">子类实现</text>
</svg>
