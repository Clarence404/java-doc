<svg viewBox="0 0 840 394" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
    .sec   { font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>
  <text x="420" y="24" text-anchor="middle" class="title">AQS 独占模式：acquire / release 流程</text>
  <rect x="20" y="44" width="160" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="100" y="68" text-anchor="middle" class="name">lock()</text>
  <text x="100" y="88" text-anchor="middle" class="desc">调用 acquire(1)</text>
  <rect x="230" y="44" width="180" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" class="name">tryAcquire(1)</text>
  <text x="320" y="88" text-anchor="middle" class="desc">CAS state 0→1，或重入 +1</text>
  <rect x="560" y="44" width="180" height="60" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="650" y="68" text-anchor="middle" class="name">获得锁</text>
  <text x="650" y="88" text-anchor="middle" class="desc">记录 owner，进入临界区</text>
  <line x1="180" y1="74" x2="228" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="74" x2="558" y2="74" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="484" y="66" text-anchor="middle" class="lbl">成功</text>
  <rect x="230" y="164" width="180" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="320" y="188" text-anchor="middle" class="name">入队</text>
  <text x="320" y="208" text-anchor="middle" class="desc">ExclusiveNode，CAS 设为 tail</text>
  <line x1="320" y1="104" x2="320" y2="162" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="138" text-anchor="start" class="lbl">失败</text>
  <rect x="560" y="164" width="180" height="60" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="650" y="188" text-anchor="middle" class="name">队首再试 tryAcquire</text>
  <text x="650" y="208" text-anchor="middle" class="desc">前驱是 head 才有资格抢</text>
  <line x1="410" y1="194" x2="558" y2="194" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="164" x2="650" y2="106" stroke="var(--g)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="660" y="140" text-anchor="start" class="lbl">成功：成为新 head</text>
  <rect x="560" y="284" width="180" height="60" rx="4" fill="var(--y)" fill-opacity="0.12" stroke="var(--y)" stroke-width="1.5"/>
  <text x="650" y="308" text-anchor="middle" class="name">park 挂起</text>
  <text x="650" y="328" text-anchor="middle" class="desc">短暂自旋，置 WAITING 后 park</text>
  <line x1="650" y1="224" x2="650" y2="282" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="642" y="258" text-anchor="end" class="lbl">失败</text>
  <path d="M740,314 H770 V194 H742" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="778" y="258" text-anchor="start" class="lbl">醒来重试</text>
  <rect x="20" y="284" width="160" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="100" y="308" text-anchor="middle" class="name">unlock()</text>
  <text x="100" y="328" text-anchor="middle" class="desc">调用 release(1)</text>
  <rect x="230" y="284" width="180" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="320" y="308" text-anchor="middle" class="name">tryRelease(1)</text>
  <text x="320" y="328" text-anchor="middle" class="desc">state 减到 0 才算释放</text>
  <line x1="180" y1="314" x2="228" y2="314" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="314" x2="558" y2="314" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="484" y="306" text-anchor="middle" class="lbl">unpark 后继</text>
  <text x="420" y="374" text-anchor="middle" class="desc">非公平：lock() 先直接 CAS 抢一次；公平：state 为 0 时还要求队列里没有排在前面的线程</text>
</svg>
