<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
    .sec   { font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="tri" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0.5,0.5 L8.5,4.5 L0.5,8.5 z" fill="var(--card)" stroke="var(--fg)" stroke-width="0.8"/>
    </marker>
  </defs>
  <text x="390" y="26" text-anchor="middle" class="title">GoF 23 种模式的三大分类</text>
  <rect x="20" y="46" width="240" height="334" rx="8" fill="var(--g)" fill-opacity="0.08" stroke="var(--g)" stroke-width="1.5"/>
  <text x="140" y="72" text-anchor="middle" class="name">创建型 Creational</text>
  <text x="140" y="92" text-anchor="middle" class="desc">怎么创建对象（5 种）</text>
  <line x1="36" y1="104" x2="244" y2="104" stroke="var(--g)" stroke-width="1" stroke-opacity="0.5"/>
  <text x="140" y="128" text-anchor="middle" class="desc">单例 Singleton</text>
  <text x="140" y="150" text-anchor="middle" class="desc">工厂方法 Factory Method</text>
  <text x="140" y="172" text-anchor="middle" class="desc">抽象工厂 Abstract Factory</text>
  <text x="140" y="194" text-anchor="middle" class="desc">建造者 Builder</text>
  <text x="140" y="216" text-anchor="middle" class="desc">原型 Prototype</text>
  <rect x="270" y="46" width="240" height="334" rx="8" fill="var(--b)" fill-opacity="0.08" stroke="var(--b)" stroke-width="1.5"/>
  <text x="390" y="72" text-anchor="middle" class="name">结构型 Structural</text>
  <text x="390" y="92" text-anchor="middle" class="desc">怎么组合类与对象（7 种）</text>
  <line x1="286" y1="104" x2="494" y2="104" stroke="var(--b)" stroke-width="1" stroke-opacity="0.5"/>
  <text x="390" y="128" text-anchor="middle" class="desc">适配器 Adapter</text>
  <text x="390" y="150" text-anchor="middle" class="desc">桥接 Bridge</text>
  <text x="390" y="172" text-anchor="middle" class="desc">组合 Composite</text>
  <text x="390" y="194" text-anchor="middle" class="desc">装饰器 Decorator</text>
  <text x="390" y="216" text-anchor="middle" class="desc">外观 Facade</text>
  <text x="390" y="238" text-anchor="middle" class="desc">享元 Flyweight</text>
  <text x="390" y="260" text-anchor="middle" class="desc">代理 Proxy</text>
  <rect x="520" y="46" width="240" height="334" rx="8" fill="var(--p)" fill-opacity="0.08" stroke="var(--p)" stroke-width="1.5"/>
  <text x="640" y="72" text-anchor="middle" class="name">行为型 Behavioral</text>
  <text x="640" y="92" text-anchor="middle" class="desc">对象间怎么协作与分工（11 种）</text>
  <line x1="536" y1="104" x2="744" y2="104" stroke="var(--p)" stroke-width="1" stroke-opacity="0.5"/>
  <text x="640" y="128" text-anchor="middle" class="desc">责任链 Chain of Responsibility</text>
  <text x="640" y="150" text-anchor="middle" class="desc">命令 Command</text>
  <text x="640" y="172" text-anchor="middle" class="desc">迭代器 Iterator</text>
  <text x="640" y="194" text-anchor="middle" class="desc">中介者 Mediator</text>
  <text x="640" y="216" text-anchor="middle" class="desc">备忘录 Memento</text>
  <text x="640" y="238" text-anchor="middle" class="desc">观察者 Observer</text>
  <text x="640" y="260" text-anchor="middle" class="desc">状态 State</text>
  <text x="640" y="282" text-anchor="middle" class="desc">策略 Strategy</text>
  <text x="640" y="304" text-anchor="middle" class="desc">模板方法 Template Method</text>
  <text x="640" y="326" text-anchor="middle" class="desc">访问者 Visitor</text>
  <text x="640" y="348" text-anchor="middle" class="desc">解释器 Interpreter</text>
</svg>
