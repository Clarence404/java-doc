<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .zone { rx:8; ry:8; fill:var(--card); stroke-width:2; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
    .sync { stroke-width:1.5; stroke-dasharray:5,3; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">OceanBase 架构 与 Paxos 高可用</text>

  <!-- OBProxy -->
  <rect class="box" x="260" y="38" width="180" height="44" stroke="var(--b)"/>
  <text x="350" y="56" text-anchor="middle" fill="var(--b)" font-weight="700">OBProxy（连接代理）</text>
  <text x="350" y="72" text-anchor="middle" fill="var(--muted)" font-size="10">SQL 路由 / 负载均衡 / 连接管理</text>

  <!-- Arrow down -->
  <line class="arr" x1="350" y1="82" x2="350" y2="98" stroke="var(--muted)"/>

  <!-- Three zones -->
  <!-- Zone 1 - Leader -->
  <rect class="zone" x="20" y="104" width="190" height="96" stroke="var(--g)"/>
  <text x="115" y="124" text-anchor="middle" fill="var(--g)" font-weight="700">Zone 1（Leader）</text>
  <rect class="box" x="35" y="132" width="160" height="56" stroke="var(--g)"/>
  <text x="115" y="150" text-anchor="middle" fill="var(--fg)" font-size="11">OBServer（计算 + 存储）</text>
  <text x="115" y="165" text-anchor="middle" fill="var(--fg)" font-size="10">处理读写请求</text>
  <text x="115" y="179" text-anchor="middle" fill="var(--fg)" font-size="10">MemTable → SSTable</text>

  <!-- Zone 2 -->
  <rect class="zone" x="255" y="104" width="190" height="96" stroke="var(--y)"/>
  <text x="350" y="124" text-anchor="middle" fill="var(--y)" font-weight="700">Zone 2（Follower）</text>
  <rect class="box" x="270" y="132" width="160" height="56" stroke="var(--y)"/>
  <text x="350" y="150" text-anchor="middle" fill="var(--fg)" font-size="11">OBServer（计算 + 存储）</text>
  <text x="350" y="165" text-anchor="middle" fill="var(--fg)" font-size="10">Paxos 多数派投票</text>
  <text x="350" y="179" text-anchor="middle" fill="var(--fg)" font-size="10">同步 Redo Log</text>

  <!-- Zone 3 -->
  <rect class="zone" x="490" y="104" width="190" height="96" stroke="var(--muted)"/>
  <text x="585" y="124" text-anchor="middle" fill="var(--muted)" font-weight="700">Zone 3（Follower）</text>
  <rect class="box" x="505" y="132" width="160" height="56" stroke="var(--muted)"/>
  <text x="585" y="150" text-anchor="middle" fill="var(--fg)" font-size="11">OBServer（计算 + 存储）</text>
  <text x="585" y="165" text-anchor="middle" fill="var(--fg)" font-size="10">Paxos 多数派投票</text>
  <text x="585" y="179" text-anchor="middle" fill="var(--fg)" font-size="10">同步 Redo Log</text>

  <!-- Zone connections -->
  <line x1="210" y1="152" x2="255" y2="152" stroke="var(--g)" stroke-width="2"/>
  <line x1="445" y1="152" x2="490" y2="152" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="233" y="146" text-anchor="middle" fill="var(--g)" font-size="9">同步</text>
  <text x="468" y="146" text-anchor="middle" fill="var(--muted)" font-size="9">同步</text>

  <!-- Fan-in arrows from OBProxy -->
  <line class="arr" x1="300" y1="98" x2="200" y2="98" stroke="var(--muted)"/>
  <line class="arr" x1="400" y1="98" x2="500" y2="98" stroke="var(--muted)"/>

  <!-- Paxos flow -->
  <rect x="20" y="218" width="660" height="76" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="350" y="236" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="11">Paxos 高可用流程</text>
  <text x="350" y="252" text-anchor="middle" fill="var(--g)" font-size="11">正常：Zone1 Leader 写入 → 同步到 Zone2/Zone3 多数派确认 → Commit（RPO = 0）</text>
  <text x="350" y="268" text-anchor="middle" fill="var(--r)" font-size="11">故障：Zone1 宕机 → Zone2/Zone3 自动选主 → 恢复时间 &lt; 30s（RTO &lt; 30s）</text>
  <text x="350" y="282" text-anchor="middle" fill="var(--muted)" font-size="10">3 个 Zone 跨机房部署（容忍单机房故障）；RootService 负责集群元数据管理</text>
</svg>
