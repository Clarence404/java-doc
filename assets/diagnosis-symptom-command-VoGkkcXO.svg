<svg viewBox="0 0 760 546" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .cmd { font-size:12px; font-weight:700; fill:var(--g); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-diag-map" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>

  <text class="title" x="380" y="26" text-anchor="middle">按症状选 Arthas 命令</text>
  <rect x="20" y="50" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="77" text-anchor="middle">接口慢，不知道慢在哪</text>
  <line x1="270" y1="72" x2="308" y2="72" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="50" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="77" text-anchor="middle">trace 拆分耗时 → monitor 看 RT 与失败率</text>
  <rect x="20" y="104" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="131" text-anchor="middle">CPU 高</text>
  <line x1="270" y1="126" x2="308" y2="126" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="104" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="131" text-anchor="middle">thread -n 3 → profiler start 出火焰图</text>
  <rect x="20" y="158" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="185" text-anchor="middle">返回结果不对 / 偶发异常</text>
  <line x1="270" y1="180" x2="308" y2="180" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="158" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="185" text-anchor="middle">watch 看入参返回值 → tt 记录现场</text>
  <rect x="20" y="212" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="239" text-anchor="middle">不知道谁调用了这个方法</text>
  <line x1="270" y1="234" x2="308" y2="234" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="212" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="239" text-anchor="middle">stack 打印调用路径</text>
  <rect x="20" y="266" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="293" text-anchor="middle">怀疑新代码没生效 / 类冲突</text>
  <line x1="270" y1="288" x2="308" y2="288" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="266" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="293" text-anchor="middle">sc -d 看来源 jar → jad 看实际代码</text>
  <rect x="20" y="320" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="347" text-anchor="middle">线程卡住 / 疑似死锁</text>
  <line x1="270" y1="342" x2="308" y2="342" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="320" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="347" text-anchor="middle">thread -b（仅 synchronized）→ jstack</text>
  <rect x="20" y="374" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="401" text-anchor="middle">要临时打开 DEBUG 日志</text>
  <line x1="270" y1="396" x2="308" y2="396" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="374" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="401" text-anchor="middle">logger --name xxx --level debug</text>
  <rect x="20" y="428" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="455" text-anchor="middle">想看 Bean 状态或配置值</text>
  <line x1="270" y1="450" x2="308" y2="450" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="428" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="455" text-anchor="middle">vmtool 取 ApplicationContext → getBean</text>
  <rect x="20" y="482" width="250" height="44" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="145" y="509" text-anchor="middle">内存持续上涨</text>
  <line x1="270" y1="504" x2="308" y2="504" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-diag-map)"/>
  <rect x="310" y="482" width="430" height="44" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="cmd" x="525" y="509" text-anchor="middle">memory → heapdump --live → MAT</text>
</svg>
