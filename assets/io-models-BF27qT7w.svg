<svg viewBox="0 0 660 275" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
<style>
:root {
  --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
  --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
}
:root[data-theme="dark"] {
  --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
  --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
    --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
  }
}
</style>
<defs>
  <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--r)"/>
  </marker>
  <marker id="arr-b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
  </marker>
  <marker id="arr-g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--g)"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--muted)"/>
  </marker>
  <marker id="arr-p" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--p)"/>
  </marker>
</defs>

<rect width="660" height="275" fill="var(--bg)"/>

<text x="330" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">IO 模型对比</text>

<!-- ===== Column 1: BIO ===== -->
<text x="110" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="var(--r)">BIO（同步阻塞）</text>
<rect x="10" y="55" width="200" height="40" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="110" y="79" text-anchor="middle" font-size="12" fill="var(--fg)">Application（应用）</text>
<rect x="10" y="215" width="200" height="40" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="110" y="239" text-anchor="middle" font-size="12" fill="var(--fg)">Kernel（内核）</text>
<line x1="88" y1="99" x2="88" y2="209" stroke="var(--r)" stroke-width="1.5" marker-end="url(#arr-r)"/>
<text x="76" y="155" text-anchor="end" font-size="10" fill="var(--r)">①阻塞等待</text>
<line x1="132" y1="209" x2="132" y2="101" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="144" y="155" text-anchor="start" font-size="10" fill="var(--b)">②返回数据</text>

<!-- ===== Column 2: NIO ===== -->
<text x="330" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">NIO（IO 多路复用）</text>
<rect x="230" y="55" width="200" height="40" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="79" text-anchor="middle" font-size="12" fill="var(--fg)">Application（应用）</text>
<rect x="230" y="215" width="200" height="40" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="330" y="239" text-anchor="middle" font-size="12" fill="var(--fg)">Kernel（内核）</text>
<line x1="305" y1="99" x2="305" y2="209" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-muted)"/>
<text x="293" y="135" text-anchor="end" font-size="10" fill="var(--muted)">①poll</text>
<line x1="317" y1="209" x2="317" y2="101" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-muted)"/>
<text x="293" y="175" text-anchor="end" font-size="10" fill="var(--muted)">②未就绪</text>
<line x1="347" y1="99" x2="347" y2="209" stroke="var(--g)" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="363" y="135" text-anchor="start" font-size="10" fill="var(--g)">③read</text>
<line x1="359" y1="209" x2="359" y2="101" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="367" y="175" text-anchor="start" font-size="10" fill="var(--b)">④数据</text>

<!-- ===== Column 3: AIO ===== -->
<text x="550" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">AIO（异步非阻塞）</text>
<rect x="450" y="55" width="200" height="40" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="550" y="79" text-anchor="middle" font-size="12" fill="var(--fg)">Application（应用）</text>
<rect x="450" y="215" width="200" height="40" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="550" y="239" text-anchor="middle" font-size="12" fill="var(--fg)">Kernel（内核）</text>
<line x1="528" y1="99" x2="528" y2="209" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arr-p)"/>
<text x="516" y="155" text-anchor="end" font-size="10" fill="var(--p)">①注册回调</text>
<line x1="572" y1="209" x2="572" y2="101" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="584" y="155" text-anchor="start" font-size="10" fill="var(--b)">②内核通知</text>

</svg>
