<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrs" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" class="title">观察者 vs 发布订阅</text>
  <text x="190" y="56" text-anchor="middle" class="lbl">观察者：主题直接回调（虚线为实现接口）</text>
  <text x="570" y="56" text-anchor="middle" class="lbl">发布订阅：经由事件通道</text>
  <rect x="20" y="70" width="340" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="190" y="96" text-anchor="middle" class="name">Subject（主题）</text>
  <text x="190" y="116" text-anchor="middle" class="desc">持有 List&lt;Observer&gt;，状态变化时逐个回调</text>
  <rect x="20" y="170" width="340" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="190" y="196" text-anchor="middle" class="name">Observer 接口</text>
  <text x="190" y="216" text-anchor="middle" class="desc">update(event)</text>
  <rect x="20" y="270" width="160" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="100" y="296" text-anchor="middle" class="name">邮件观察者</text>
  <text x="100" y="316" text-anchor="middle" class="desc">发送欢迎邮件</text>
  <rect x="200" y="270" width="160" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="280" y="296" text-anchor="middle" class="name">积分观察者</text>
  <text x="280" y="316" text-anchor="middle" class="desc">初始化积分</text>
  <line x1="190" y1="130" x2="190" y2="168" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="198" y="153" text-anchor="start" class="lbl">notify() 直接调用</text>
  <line x1="100" y1="270" x2="100" y2="232" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <line x1="280" y1="270" x2="280" y2="232" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <rect x="400" y="70" width="340" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="570" y="96" text-anchor="middle" class="name">Publisher（发布者）</text>
  <text x="570" y="116" text-anchor="middle" class="desc">publish(event)，不知道谁在订阅</text>
  <rect x="400" y="170" width="340" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="570" y="196" text-anchor="middle" class="name">事件通道 / Broker</text>
  <text x="570" y="216" text-anchor="middle" class="desc">Spring 事件广播器、Kafka、RocketMQ</text>
  <rect x="400" y="270" width="160" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="480" y="296" text-anchor="middle" class="name">订阅者 A</text>
  <text x="480" y="316" text-anchor="middle" class="desc">按事件类型订阅</text>
  <rect x="580" y="270" width="160" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="660" y="296" text-anchor="middle" class="name">订阅者 B</text>
  <text x="660" y="316" text-anchor="middle" class="desc">可异步、可跨进程</text>
  <line x1="570" y1="130" x2="570" y2="168" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="578" y="153" text-anchor="start" class="lbl">发布到通道</text>
  <line x1="480" y1="230" x2="480" y2="268" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="230" x2="660" y2="268" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
