<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
  </style>

  <text x="350" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">Snowflake ID 64位结构</text>

  <!-- Bit field bar -->
  <!-- Sign bit: 1 bit -->
  <rect x="10" y="50" width="10" height="50" rx="2" fill="var(--muted)" opacity="0.4" stroke="var(--muted)" stroke-width="1"/>
  <text x="15" y="46" text-anchor="middle" fill="var(--muted)" font-size="9">1bit</text>

  <!-- Timestamp: 41 bits -->
  <rect x="22" y="50" width="288" height="50" rx="2" fill="var(--b)" opacity="0.25" stroke="var(--b)" stroke-width="1.5"/>
  <text x="166" y="46" text-anchor="middle" fill="var(--b)" font-size="10" font-weight="600">41 bits</text>

  <!-- Datacenter: 5 bits -->
  <rect x="312" y="50" width="62" height="50" rx="2" fill="var(--y)" opacity="0.3" stroke="var(--y)" stroke-width="1.5"/>
  <text x="343" y="46" text-anchor="middle" fill="var(--y)" font-size="10" font-weight="600">5 bits</text>

  <!-- Machine: 5 bits -->
  <rect x="376" y="50" width="62" height="50" rx="2" fill="var(--g)" opacity="0.3" stroke="var(--g)" stroke-width="1.5"/>
  <text x="407" y="46" text-anchor="middle" fill="var(--g)" font-size="10" font-weight="600">5 bits</text>

  <!-- Sequence: 12 bits -->
  <rect x="440" y="50" width="250" height="50" rx="2" fill="var(--p)" opacity="0.25" stroke="var(--p)" stroke-width="1.5"/>
  <text x="565" y="46" text-anchor="middle" fill="var(--p)" font-size="10" font-weight="600">12 bits</text>

  <!-- Inner labels -->
  <text x="15"  y="79" text-anchor="middle" fill="var(--muted)" font-size="8">符号</text>
  <text x="166" y="73" text-anchor="middle" fill="var(--b)" font-weight="700" font-size="13">时间戳</text>
  <text x="166" y="90" text-anchor="middle" fill="var(--b)" font-size="10">毫秒级，相对自定义纪元</text>
  <text x="343" y="73" text-anchor="middle" fill="var(--y)" font-weight="700">数据</text>
  <text x="343" y="87" text-anchor="middle" fill="var(--y)">中心</text>
  <text x="407" y="73" text-anchor="middle" fill="var(--g)" font-weight="700">机器</text>
  <text x="407" y="87" text-anchor="middle" fill="var(--g)">节点</text>
  <text x="565" y="73" text-anchor="middle" fill="var(--p)" font-weight="700" font-size="13">序列号</text>
  <text x="565" y="90" text-anchor="middle" fill="var(--p)" font-size="10">同毫秒内自增</text>

  <!-- Bit position markers -->
  <text x="10"  y="116" text-anchor="middle" fill="var(--muted)" font-size="9">63</text>
  <text x="22"  y="116" text-anchor="middle" fill="var(--muted)" font-size="9">62</text>
  <text x="310" y="116" text-anchor="middle" fill="var(--muted)" font-size="9">22</text>
  <text x="374" y="116" text-anchor="middle" fill="var(--muted)" font-size="9">17</text>
  <text x="438" y="116" text-anchor="middle" fill="var(--muted)" font-size="9">12</text>
  <text x="690" y="116" text-anchor="middle" fill="var(--muted)" font-size="9">0</text>

  <!-- Capacity table -->
  <rect x="10" y="130" width="680" height="78" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="350" y="148" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="11">容量计算</text>

  <text x="30"  y="166" fill="var(--b)" font-weight="600">时间戳（41bit）：</text>
  <text x="175" y="166" fill="var(--fg)">2^41 ms ≈ 69 年有效期</text>

  <text x="30"  y="182" fill="var(--y)" font-weight="600">数据中心（5bit）：</text>
  <text x="175" y="182" fill="var(--fg)">最多 32 个数据中心</text>

  <text x="380" y="166" fill="var(--g)" font-weight="600">机器节点（5bit）：</text>
  <text x="520" y="166" fill="var(--fg)">每数据中心最多 32 台机器</text>

  <text x="380" y="182" fill="var(--p)" font-weight="600">序列号（12bit）：</text>
  <text x="520" y="182" fill="var(--fg)">每毫秒最多 4096 个 ID</text>

  <text x="350" y="200" text-anchor="middle" fill="var(--muted)" font-size="10">理论峰值吞吐：32 × 32 × 4096 ≈ 4.2 × 10⁶ ID/ms；趋势递增，适合数据库索引</text>
</svg>
