<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--p)"/>
    </marker>
    <marker id="arrm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="400" y="26" text-anchor="middle" class="title">装饰器模式的角色（Java I/O）</text>
  <rect x="290" y="80" width="220" height="60" rx="6" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="400" y="106" text-anchor="middle" class="name">InputStream</text>
  <text x="400" y="126" text-anchor="middle" class="desc">Component：抽象组件</text>
  <rect x="60" y="210" width="220" height="60" rx="6" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="170" y="236" text-anchor="middle" class="name">FileInputStream</text>
  <text x="170" y="256" text-anchor="middle" class="desc">ConcreteComponent：数据来源</text>
  <rect x="470" y="210" width="240" height="60" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="590" y="236" text-anchor="middle" class="name">FilterInputStream</text>
  <text x="590" y="256" text-anchor="middle" class="desc">Decorator：持有 InputStream in</text>
  <rect x="370" y="340" width="200" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="470" y="366" text-anchor="middle" class="name">BufferedInputStream</text>
  <text x="470" y="386" text-anchor="middle" class="desc">具体装饰器：加缓冲</text>
  <rect x="590" y="340" width="200" height="60" rx="6" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="690" y="366" text-anchor="middle" class="name">DataInputStream</text>
  <text x="690" y="386" text-anchor="middle" class="desc">具体装饰器：按类型读取</text>
  <path d="M170,210 L170,175 L360,175 L360,142" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M590,210 L590,175 L440,175 L440,142" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M470,340 L470,305 L560,305 L560,272" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M690,340 L690,305 L620,305 L620,272" fill="none" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M710,240 L760,240 L760,110 L512,110" fill="none" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="636" y="103" text-anchor="middle" class="lbl">持有 in：被包装的 InputStream</text>
  <line x1="30" y1="52" x2="60" y2="52" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="68" y="56" text-anchor="start" class="lbl">实现 / 继承</text>
  <line x1="190" y1="52" x2="220" y2="52" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="228" y="56" text-anchor="start" class="lbl">持有 / 调用</text>
</svg>
