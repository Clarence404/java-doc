<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
  </style>

  <rect width="760" height="300" fill="var(--bg)"/>
  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">一次请求的上下文窗口构成</text>

  <rect x="20" y="40" width="720" height="150" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="380" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">上下文窗口：输入 Token + 输出 Token ≤ 模型上限</text>

  <rect x="40" y="80" width="128" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="104" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">系统提示</text>
  <text x="104" y="128" text-anchor="middle" font-size="11" fill="var(--fg)">规则与工具定义</text>

  <rect x="178" y="80" width="128" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="242" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">对话历史</text>
  <text x="242" y="128" text-anchor="middle" font-size="11" fill="var(--fg)">随轮数持续增长</text>

  <rect x="316" y="80" width="128" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="380" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">检索文档</text>
  <text x="380" y="128" text-anchor="middle" font-size="11" fill="var(--fg)">RAG 召回片段</text>

  <rect x="454" y="80" width="128" height="70" rx="6" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.5"/>
  <text x="518" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="var(--b)">用户输入</text>
  <text x="518" y="128" text-anchor="middle" font-size="11" fill="var(--fg)">本轮问题</text>

  <rect x="592" y="80" width="128" height="70" rx="6" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.5"/>
  <text x="656" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="var(--g)">模型输出</text>
  <text x="656" y="128" text-anchor="middle" font-size="11" fill="var(--fg)">含推理 Token</text>

  <text x="311" y="174" text-anchor="middle" font-size="11" fill="var(--b)">输入：每轮整体重发，按输入单价计费</text>
  <text x="656" y="174" text-anchor="middle" font-size="11" fill="var(--g)">输出：按输出单价计费</text>

  <rect x="20" y="210" width="230" height="70" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="135" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">历史：窗口 + 摘要</text>
  <text x="135" y="258" text-anchor="middle" font-size="11" fill="var(--fg)">保留最近 N 轮，早期轮次压缩</text>

  <rect x="265" y="210" width="230" height="70" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="380" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">检索：只放相关片段</text>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="var(--fg)">Top-K + 重排，控制总长度</text>

  <rect x="510" y="210" width="230" height="70" rx="6" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="625" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="var(--p)">输出：预留空间</text>
  <text x="625" y="258" text-anchor="middle" font-size="11" fill="var(--fg)">最大输出长度也占窗口</text>
</svg>
