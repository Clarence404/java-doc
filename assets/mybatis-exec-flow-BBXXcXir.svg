<svg viewBox="0 0 736 302" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    .box { rx:6; ry:6; fill:var(--card); stroke-width:1.5; }
    .arr { stroke-width:1.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="368" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">MyBatis 执行流程（一次查询）</text>

  <!-- Row 1: mapper → sqlSession -->
  <rect class="box" x="10" y="50" width="110" height="60" stroke="var(--muted)"/>
  <text x="65" y="68" text-anchor="middle" fill="var(--fg)" font-weight="600">Mapper 接口</text>
  <text x="65" y="84" text-anchor="middle" fill="var(--muted)" font-size="10">userMapper.findById(1)</text>
  <line class="arr" x1="120" y1="80" x2="144" y2="80" stroke="var(--muted)"/>

  <rect class="box" x="146" y="50" width="120" height="60" stroke="var(--b)"/>
  <text x="206" y="68" text-anchor="middle" fill="var(--b)" font-weight="700">MapperProxy</text>
  <text x="206" y="84" text-anchor="middle" fill="var(--fg)" font-size="10">JDK 动态代理</text>
  <line class="arr" x1="266" y1="80" x2="290" y2="80" stroke="var(--muted)"/>

  <rect class="box" x="292" y="50" width="120" height="60" stroke="var(--b)"/>
  <text x="352" y="68" text-anchor="middle" fill="var(--b)" font-weight="700">SqlSession</text>
  <text x="352" y="84" text-anchor="middle" fill="var(--fg)" font-size="10">selectOne / selectList</text>
  <line class="arr" x1="412" y1="80" x2="436" y2="80" stroke="var(--muted)"/>

  <!-- Plugin interceptor chain -->
  <rect class="box" x="438" y="50" width="120" height="60" stroke="var(--r)"/>
  <text x="498" y="68" text-anchor="middle" fill="var(--r)" font-weight="700">Interceptor 链</text>
  <text x="498" y="84" text-anchor="middle" fill="var(--fg)" font-size="10">Plugin（责任链）</text>
  <line class="arr" x1="558" y1="80" x2="582" y2="80" stroke="var(--muted)"/>

  <!-- Executor -->
  <rect class="box" x="584" y="50" width="140" height="60" stroke="var(--p)"/>
  <text x="654" y="68" text-anchor="middle" fill="var(--p)" font-weight="700">Executor</text>
  <text x="654" y="84" text-anchor="middle" fill="var(--fg)" font-size="10">Simple / Reuse / Batch</text>

  <!-- Cache check -->
  <line class="arr" x1="654" y1="110" x2="654" y2="134" stroke="var(--muted)"/>

  <!-- Row 2: cache + statementHandler -->
  <rect class="box" x="584" y="136" width="140" height="60" stroke="var(--y)"/>
  <text x="654" y="154" text-anchor="middle" fill="var(--y)" font-weight="700">Cache</text>
  <text x="654" y="170" text-anchor="middle" fill="var(--fg)" font-size="10">一级 / 二级缓存命中？</text>

  <!-- Miss arrow -->
  <text x="544" y="158" fill="var(--r)" font-size="9" text-anchor="middle">未命中</text>
  <line class="arr" x1="584" y1="166" x2="504" y2="166" stroke="var(--r)"/>

  <rect class="box" x="378" y="136" width="124" height="60" stroke="var(--p)"/>
  <text x="442" y="154" text-anchor="middle" fill="var(--p)" font-weight="700">StatementHandler</text>
  <text x="442" y="170" text-anchor="middle" fill="var(--fg)" font-size="10">Prepared / Simple</text>
  <line class="arr" x1="378" y1="166" x2="308" y2="166" stroke="var(--muted)"/>

  <rect class="box" x="182" y="136" width="124" height="60" stroke="var(--g)"/>
  <text x="242" y="154" text-anchor="middle" fill="var(--g)" font-weight="700">ParameterHandler</text>
  <text x="242" y="170" text-anchor="middle" fill="var(--fg)" font-size="10">#{} 参数绑定</text>
  <line class="arr" x1="182" y1="166" x2="122" y2="166" stroke="var(--muted)"/>

  <!-- JDBC -->
  <rect class="box" x="10" y="136" width="110" height="60" stroke="var(--b)"/>
  <text x="65" y="154" text-anchor="middle" fill="var(--b)" font-weight="700">JDBC</text>
  <text x="65" y="170" text-anchor="middle" fill="var(--fg)" font-size="10">PreparedStatement</text>

  <!-- Result -->
  <line class="arr" x1="65" y1="196" x2="65" y2="220" stroke="var(--muted)"/>

  <rect class="box" x="10" y="222" width="144" height="60" stroke="var(--g)"/>
  <text x="80" y="240" text-anchor="middle" fill="var(--g)" font-weight="700">ResultSetHandler</text>
  <text x="80" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">ResultSet → Java 对象</text>
  <line class="arr" x1="154" y1="252" x2="187" y2="252" stroke="var(--muted)"/>

  <!-- TypeHandler -->
  <rect class="box" x="189" y="222" width="124" height="60" stroke="var(--y)"/>
  <text x="249" y="240" text-anchor="middle" fill="var(--y)" font-weight="700">TypeHandler</text>
  <text x="249" y="256" text-anchor="middle" fill="var(--fg)" font-size="10">JDBC 类型 ↔ Java 类型</text>
  <line class="arr" x1="313" y1="252" x2="366" y2="252" stroke="var(--muted)"/>

  <!-- Result object -->
  <rect class="box" x="368" y="222" width="114" height="60" stroke="var(--fg)"/>
  <text x="427" y="240" text-anchor="middle" fill="var(--fg)" font-weight="600">Java 对象</text>
  <text x="427" y="256" text-anchor="middle" fill="var(--muted)" font-size="9">User / List&lt;User&gt;</text>

  <!-- Annotations -->
  <rect x="502" y="222" width="224" height="60" rx="5" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="616" y="240" text-anchor="middle" fill="var(--fg)" font-weight="700" font-size="10">一级缓存（SqlSession 级）</text>
  <text x="616" y="254" text-anchor="middle" fill="var(--muted)" font-size="9">默认开启；同一 Session 重复查询命中</text>
  <text x="616" y="264" text-anchor="middle" fill="var(--muted)" font-size="9">二级缓存需 &lt;cache/&gt; 或 @CacheNamespace</text>
</svg>
