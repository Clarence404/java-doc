<svg viewBox="0 0 720 496" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 600; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .lbl   { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">阿里云上的典型 Java 微服务部署</text>

  <!-- 主链路 -->
  <rect x="20" y="40" width="500" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="270" y="64" text-anchor="middle" class="name">云解析 DNS</text>
  <text x="270" y="84" text-anchor="middle" class="desc">按运营商 / 地域智能解析</text>

  <rect x="20" y="134" width="500" height="60" rx="4" fill="var(--r)" fill-opacity="0.10" stroke="var(--r)" stroke-width="1.5"/>
  <text x="270" y="158" text-anchor="middle" class="name">CDN + WAF</text>
  <text x="270" y="178" text-anchor="middle" class="desc">静态资源走 CDN，动态请求经 WAF 过滤后转发</text>

  <rect x="20" y="228" width="500" height="60" rx="4" fill="var(--b)" fill-opacity="0.10" stroke="var(--b)" stroke-width="1.5"/>
  <text x="270" y="252" text-anchor="middle" class="name">ALB 应用型负载均衡</text>
  <text x="270" y="272" text-anchor="middle" class="desc">七层转发、HTTPS 卸载，可作 ACK 的 Ingress</text>

  <rect x="20" y="322" width="500" height="60" rx="4" fill="var(--p)" fill-opacity="0.10" stroke="var(--p)" stroke-width="1.5"/>
  <text x="270" y="346" text-anchor="middle" class="name">ACK 容器集群</text>
  <text x="270" y="366" text-anchor="middle" class="desc">Spring Boot / Spring Cloud 服务</text>

  <rect x="20" y="416" width="500" height="60" rx="4" fill="var(--g)" fill-opacity="0.10" stroke="var(--g)" stroke-width="1.5"/>
  <text x="270" y="440" text-anchor="middle" class="name">数据层</text>
  <text x="103" y="460" text-anchor="middle" class="desc">PolarDB / RDS MySQL</text>
  <text x="270" y="460" text-anchor="middle" class="desc">Tair（兼容 Redis）</text>
  <text x="437" y="460" text-anchor="middle" class="desc">云消息队列 RocketMQ 版</text>

  <line x1="270" y1="100" x2="270" y2="132" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="194" x2="270" y2="226" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="288" x2="270" y2="320" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="382" x2="270" y2="414" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 旁路组件 -->
  <rect x="560" y="134" width="140" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="630" y="158" text-anchor="middle" class="name">OSS</text>
  <text x="630" y="178" text-anchor="middle" class="desc">文件存储 / CDN 回源</text>

  <rect x="560" y="322" width="140" height="60" rx="4" fill="var(--y)" fill-opacity="0.10" stroke="var(--y)" stroke-width="1.5"/>
  <text x="630" y="346" text-anchor="middle" class="name">MSE</text>
  <text x="630" y="366" text-anchor="middle" class="desc">Nacos 注册 / 配置</text>

  <rect x="560" y="416" width="140" height="60" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="630" y="440" text-anchor="middle" class="name">SLS + ARMS</text>
  <text x="630" y="460" text-anchor="middle" class="desc">日志 / 指标 / 链路</text>

  <line x1="520" y1="164" x2="558" y2="164" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="352" x2="558" y2="352" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
