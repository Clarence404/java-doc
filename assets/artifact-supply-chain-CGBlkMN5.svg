<svg viewBox="0 0 880 230" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-artifact-supply" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="440" y="26" text-anchor="middle">供应链安全：构建时产出证据，部署时校验证据</text>
  <rect x="20" y="50" width="115" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="77" y="76" text-anchor="middle">源码</text>
  <text class="desc" x="77" y="98" text-anchor="middle">受保护的 main</text>
  <line x1="135" y1="82" x2="163" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-supply)"/>
  <rect x="165" y="50" width="115" height="64" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="222" y="76" text-anchor="middle">CI 构建</text>
  <text class="desc" x="222" y="98" text-anchor="middle">临时 Runner</text>
  <line x1="280" y1="82" x2="308" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-supply)"/>
  <rect x="310" y="50" width="115" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="367" y="76" text-anchor="middle">产出证据</text>
  <text class="desc" x="367" y="98" text-anchor="middle">SBOM / 签名 / 溯源</text>
  <line x1="425" y1="82" x2="453" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-supply)"/>
  <rect x="455" y="50" width="115" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="512" y="76" text-anchor="middle">镜像仓库</text>
  <text class="desc" x="512" y="98" text-anchor="middle">tag 不可变</text>
  <line x1="570" y1="82" x2="598" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-supply)"/>
  <rect x="600" y="50" width="115" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="657" y="76" text-anchor="middle">准入校验</text>
  <text class="desc" x="657" y="98" text-anchor="middle">验签名与身份</text>
  <line x1="715" y1="82" x2="743" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-artifact-supply)"/>
  <rect x="745" y="50" width="115" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="802" y="76" text-anchor="middle">部署</text>
  <text class="desc" x="802" y="98" text-anchor="middle">按 digest 拉取</text>
  <rect x="20" y="146" width="405" height="64" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="222" y="172" text-anchor="middle">CI 侧（GitHub Actions）</text>
  <text class="desc" x="222" y="194" text-anchor="middle">build-push → attest 溯源 → cosign keyless 签名</text>
  <rect x="455" y="146" width="405" height="64" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="box-title" x="657" y="172" text-anchor="middle">集群侧（Kubernetes）</text>
  <text class="desc" x="657" y="194" text-anchor="middle">Kyverno 校验签名身份，不合格的 Pod 拒绝创建</text>
</svg>
