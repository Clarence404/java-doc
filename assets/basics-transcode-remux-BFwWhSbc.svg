<svg viewBox="0 0 860 252" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:12px; fill:var(--fg); }
  </style>
  <defs>
    <marker id="arrow-media-transcode" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="430" y="24" text-anchor="middle">转封装只换"包装盒"，转码要解开重压</text>
  <text class="label" x="8" y="50">转封装（Transmux）：不解码，CPU 开销极低，画质无损</text>
  <rect x="8" y="62" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="58" y="88" text-anchor="middle">输入流</text>
  <text class="desc" x="58" y="110" text-anchor="middle">FLV(H.264+AAC)</text>
  <rect x="132" y="62" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="182" y="88" text-anchor="middle">解封装</text>
  <text class="desc" x="182" y="110" text-anchor="middle">取出音视频包</text>
  <rect x="628" y="62" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="678" y="88" text-anchor="middle">封装</text>
  <text class="desc" x="678" y="110" text-anchor="middle">TS 或 fMP4</text>
  <rect x="752" y="62" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="802" y="88" text-anchor="middle">输出</text>
  <text class="desc" x="802" y="110" text-anchor="middle">HLS（同码率）</text>
  <line x1="108" y1="94" x2="130" y2="94" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <line x1="232" y1="94" x2="626" y2="94" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <line x1="728" y1="94" x2="750" y2="94" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <text class="desc" x="430" y="88" text-anchor="middle">压缩数据原样拷贝（ffmpeg -c copy）</text>
  <text class="label" x="8" y="156">转码（Transcode）：解码再编码，CPU / GPU 密集，可改编码、分辨率与码率</text>
  <rect x="8" y="168" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="58" y="194" text-anchor="middle">输入流</text>
  <text class="desc" x="58" y="216" text-anchor="middle">FLV(H.264+AAC)</text>
  <rect x="132" y="168" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="182" y="194" text-anchor="middle">解封装</text>
  <text class="desc" x="182" y="216" text-anchor="middle">取出音视频包</text>
  <rect x="256" y="168" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="306" y="194" text-anchor="middle">解码</text>
  <text class="desc" x="306" y="216" text-anchor="middle">还原 YUV / PCM</text>
  <rect x="380" y="168" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="430" y="194" text-anchor="middle">处理</text>
  <text class="desc" x="430" y="216" text-anchor="middle">缩放 / 水印</text>
  <rect x="504" y="168" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--r)" stroke-width="1.5"/>
  <text class="box-title" x="554" y="194" text-anchor="middle">编码</text>
  <text class="desc" x="554" y="216" text-anchor="middle">H.264 多码率</text>
  <rect x="628" y="168" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="box-title" x="678" y="194" text-anchor="middle">封装</text>
  <text class="desc" x="678" y="216" text-anchor="middle">TS 或 fMP4</text>
  <rect x="752" y="168" width="100" height="64" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="802" y="194" text-anchor="middle">输出</text>
  <text class="desc" x="802" y="216" text-anchor="middle">HLS 多码率</text>
  <line x1="108" y1="200" x2="130" y2="200" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <line x1="232" y1="200" x2="254" y2="200" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <line x1="356" y1="200" x2="378" y2="200" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <line x1="480" y1="200" x2="502" y2="200" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <line x1="604" y1="200" x2="626" y2="200" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
  <line x1="728" y1="200" x2="750" y2="200" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-media-transcode)"/>
</svg>
