<svg viewBox="0 0 680 536" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .lbl { fill:var(--fg); font-size:12px; }
    .arrb { stroke:var(--b); stroke-width:1.6; fill:none; }
    .arrg { stroke:var(--g); stroke-width:1.6; fill:none; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--b)"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--g)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">MySQL 连接阶段与命令阶段</text>
  <rect class="layer" x="40" y="44" width="200" height="40" rx="8" stroke="var(--b)"/>
  <text class="name" x="140" y="68" text-anchor="middle" fill="var(--b)">客户端（Connector/J）</text>
  <rect class="layer" x="440" y="44" width="200" height="40" rx="8" stroke="var(--g)"/>
  <text class="name" x="540" y="68" text-anchor="middle" fill="var(--g)">MySQL 服务端</text>
  <line x1="140" y1="84" x2="140" y2="516" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="540" y1="84" x2="540" y2="516" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="lbl" x="340" y="108" text-anchor="middle">Initial Handshake（v10）</text>
  <text class="sub" x="340" y="122" text-anchor="middle">服务端版本、连接 ID、capabilities、20 字节随机 salt、默认认证插件</text>
  <line class="arrg" x1="540" y1="130" x2="142" y2="130" marker-end="url(#ag)"/>
  <text class="lbl" x="340" y="160" text-anchor="middle">SSLRequest</text>
  <text class="sub" x="340" y="174" text-anchor="middle">只含 capabilities（带 CLIENT_SSL），表示要升级为 TLS</text>
  <line class="arrb" x1="140" y1="182" x2="538" y2="182" marker-end="url(#ab)"/>
  <rect x="160" y="208" width="360" height="36" rx="6" fill="var(--bg)" stroke="var(--y)" stroke-width="1.2"/>
  <text class="lbl" x="340" y="231" text-anchor="middle">TLS 握手：此后所有包都在 TLS 通道内</text>
  <text class="lbl" x="340" y="264" text-anchor="middle">HandshakeResponse41</text>
  <text class="sub" x="340" y="278" text-anchor="middle">用户名、认证插件名、scramble 结果、默认库、连接属性</text>
  <line class="arrb" x1="140" y1="286" x2="538" y2="286" marker-end="url(#ab)"/>
  <text class="lbl" x="340" y="316" text-anchor="middle">AuthMoreData / AuthSwitchRequest（按需）</text>
  <text class="sub" x="340" y="330" text-anchor="middle">caching_sha2_password：缓存命中走快速认证，否则走完整认证</text>
  <line class="arrg" x1="540" y1="338" x2="142" y2="338" marker-end="url(#ag)"/>
  <text class="lbl" x="340" y="368" text-anchor="middle">OK 包：认证成功，进入命令阶段</text>
  <line class="arrg" x1="540" y1="390" x2="142" y2="390" marker-end="url(#ag)"/>
  <text class="lbl" x="340" y="420" text-anchor="middle">COM_QUERY "SELECT ..."</text>
  <text class="sub" x="340" y="434" text-anchor="middle">服务端预处理时改用 COM_STMT_PREPARE / COM_STMT_EXECUTE</text>
  <line class="arrb" x1="140" y1="442" x2="538" y2="442" marker-end="url(#ab)"/>
  <text class="lbl" x="340" y="472" text-anchor="middle">ResultSet：列数 → 列定义 × N → 行 × M → 结束包</text>
  <text class="sub" x="340" y="486" text-anchor="middle">结束包：CLIENT_DEPRECATE_EOF 协商后为 OK 包，否则为 EOF 包</text>
  <line class="arrg" x1="540" y1="494" x2="142" y2="494" marker-end="url(#ag)"/>
</svg>
