<svg viewBox="0 0 780 434" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .head  { font-size: 13px; font-weight: 700; }
    .peer  { font-size: 12px; font-weight: 600; }
    .msg   { font-size: 11px; }
    .enc   { font-size: 11px; fill: var(--p); }
    .app   { font-size: 11px; fill: var(--g); font-weight: 600; }
    .note  { font-size: 11px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fg)"/>
    </marker>
    <marker id="arrp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--p)"/>
    </marker>
    <marker id="arrg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--g)"/>
    </marker>
  </defs>

  <text x="390" y="24" text-anchor="middle" class="title">TLS 1.2（ECDHE）与 TLS 1.3 完整握手对比</text>

  <!-- ===== TLS 1.2 ===== -->
  <rect x="10" y="44" width="375" height="370" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="197" y="68" text-anchor="middle" class="head" fill="var(--y)">TLS 1.2：2-RTT 后才能发应用数据</text>

  <rect x="25" y="80" width="70" height="32" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.2"/>
  <text x="60" y="100" text-anchor="middle" class="peer">Client</text>
  <rect x="300" y="80" width="70" height="32" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.2"/>
  <text x="335" y="100" text-anchor="middle" class="peer">Server</text>
  <line x1="60" y1="112" x2="60" y2="384" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="335" y1="112" x2="335" y2="384" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="197" y="144" text-anchor="middle" class="msg">ClientHello（随机数、套件列表）</text>
  <line x1="60" y1="150" x2="333" y2="150" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="197" y="181" text-anchor="middle" class="msg">ServerHello、Certificate、</text>
  <text x="197" y="194" text-anchor="middle" class="msg">ServerKeyExchange、ServerHelloDone</text>
  <line x1="335" y1="200" x2="62" y2="200" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="197" y="231" text-anchor="middle" class="msg">ClientKeyExchange、</text>
  <text x="197" y="244" text-anchor="middle" class="msg">ChangeCipherSpec、Finished</text>
  <line x1="60" y1="250" x2="333" y2="250" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="197" y="294" text-anchor="middle" class="msg">ChangeCipherSpec、Finished</text>
  <line x1="335" y1="300" x2="62" y2="300" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="197" y="344" text-anchor="middle" class="app">应用数据</text>
  <line x1="60" y1="350" x2="333" y2="350" stroke="var(--g)" stroke-width="1.5" marker-end="url(#arrg)"/>

  <text x="197" y="402" text-anchor="middle" class="note">证书明文传输；也允许不具前向保密的 RSA 密钥交换</text>

  <!-- ===== TLS 1.3 ===== -->
  <rect x="395" y="44" width="375" height="370" rx="6" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="582" y="68" text-anchor="middle" class="head" fill="var(--g)">TLS 1.3：1-RTT 后即可发应用数据</text>

  <rect x="410" y="80" width="70" height="32" rx="4" fill="var(--b)" fill-opacity="0.12" stroke="var(--b)" stroke-width="1.2"/>
  <text x="445" y="100" text-anchor="middle" class="peer">Client</text>
  <rect x="685" y="80" width="70" height="32" rx="4" fill="var(--g)" fill-opacity="0.12" stroke="var(--g)" stroke-width="1.2"/>
  <text x="720" y="100" text-anchor="middle" class="peer">Server</text>
  <line x1="445" y1="112" x2="445" y2="384" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="720" y1="112" x2="720" y2="384" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="582" y="131" text-anchor="middle" class="msg">ClientHello + key_share</text>
  <text x="582" y="144" text-anchor="middle" class="msg">（SNI、ALPN、supported_versions）</text>
  <line x1="445" y1="150" x2="718" y2="150" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="582" y="194" text-anchor="middle" class="msg">ServerHello + key_share</text>
  <line x1="720" y1="200" x2="447" y2="200" stroke="var(--fg)" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="582" y="231" text-anchor="middle" class="enc">{EncryptedExtensions、[CertificateRequest]、</text>
  <text x="582" y="244" text-anchor="middle" class="enc">Certificate、CertificateVerify、Finished}</text>
  <line x1="720" y1="250" x2="447" y2="250" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>

  <text x="582" y="294" text-anchor="middle" class="enc">{[Certificate、CertificateVerify]、Finished}</text>
  <line x1="445" y1="300" x2="718" y2="300" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrp)"/>

  <text x="582" y="344" text-anchor="middle" class="app">应用数据（可与上一条一起发出）</text>
  <line x1="445" y1="350" x2="718" y2="350" stroke="var(--g)" stroke-width="1.5" marker-end="url(#arrg)"/>

  <text x="582" y="402" text-anchor="middle" class="note">{ } 用握手密钥加密；[ ] 仅在 mTLS 时出现</text>
</svg>
