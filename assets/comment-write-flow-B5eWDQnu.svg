<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">发评论写入链路</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">接入与校验</text>
  <text class="sub" x="40" y="88">评论服务</text>
  <text class="desc" x="650" y="70" text-anchor="end">登录态、对象是否允许评论、内容长度</text>
  <text class="desc" x="650" y="88" text-anchor="end">频控与重复内容检查，命中直接拒绝</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="160" fill="var(--r)">同步机审</text>
  <text class="sub" x="40" y="178">几毫秒内完成</text>
  <text class="desc" x="650" y="160" text-anchor="end">敏感词 AC 自动机、黑名单、风控评分</text>
  <text class="desc" x="650" y="178" text-anchor="end">明显违规直接拒绝，可疑的标记为待审或仅自己可见</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">写入 MySQL</text>
  <text class="sub" x="40" y="268">一个本地事务</text>
  <text class="desc" x="650" y="250" text-anchor="end">插入评论，状态为已发布、待审或仅自己可见</text>
  <text class="desc" x="650" y="268" text-anchor="end">同一事务写本地消息表，按 obj_id 落在同一分库</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="340" fill="var(--b)">MQ 评论事件</text>
  <text class="sub" x="40" y="358">以 obj_id 为 key</text>
  <text class="desc" x="650" y="340" text-anchor="end">发布、审核结果、删除都走同一个主题</text>
  <text class="desc" x="650" y="358" text-anchor="end">下游按状态变化处理，消费幂等</text>
  <line class="arr" x1="97" y1="374" x2="97" y2="402"/>
  <line class="arr" x1="259" y1="374" x2="259" y2="402"/>
  <line class="arr" x1="421" y1="374" x2="421" y2="402"/>
  <line class="arr" x1="583" y1="374" x2="583" y2="402"/>

  <rect class="layer" x="20" y="404" width="154" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="97" y="428" text-anchor="middle" fill="var(--r)">异步审核</text>
  <text class="sub" x="97" y="448" text-anchor="middle">模型 + 人审，回写状态</text>
  <rect class="layer" x="182" y="404" width="154" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="259" y="428" text-anchor="middle" fill="var(--y)">计数服务</text>
  <text class="sub" x="259" y="448" text-anchor="middle">评论数、回复数加减</text>
  <rect class="layer" x="344" y="404" width="154" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="421" y="428" text-anchor="middle" fill="var(--g)">缓存与热评</text>
  <text class="sub" x="421" y="448" text-anchor="middle">时间列表、热度 ZSet</text>
  <rect class="layer" x="506" y="404" width="154" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="583" y="428" text-anchor="middle" fill="var(--p)">通知中心</text>
  <text class="sub" x="583" y="448" text-anchor="middle">提醒被回复的人</text>
</svg>
