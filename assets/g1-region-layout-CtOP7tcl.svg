<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .title { font-size: 14px; font-weight: 700; }
    .cell  { font-size: 13px; font-weight: 600; }
    .lg    { font-size: 12px; }
    .desc  { font-size: 11px; fill: var(--muted); }
    .e { fill: var(--b); fill-opacity: 0.16; stroke: var(--b); stroke-width: 1.5; }
    .s { fill: var(--g); fill-opacity: 0.16; stroke: var(--g); stroke-width: 1.5; }
    .o { fill: var(--y); fill-opacity: 0.16; stroke: var(--y); stroke-width: 1.5; }
    .h { fill: var(--r); fill-opacity: 0.16; stroke: var(--r); stroke-width: 1.5; }
    .f { fill: var(--card); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">G1 堆的 Region 分布（每格一个等大 Region）</text>

  <!-- 行 1：y=44 -->
  <rect class="e" x="45"  y="44" width="70" height="44" rx="4"/><text x="80"  y="71" text-anchor="middle" class="cell">E</text>
  <rect class="e" x="125" y="44" width="70" height="44" rx="4"/><text x="160" y="71" text-anchor="middle" class="cell">E</text>
  <rect class="s" x="205" y="44" width="70" height="44" rx="4"/><text x="240" y="71" text-anchor="middle" class="cell">S</text>
  <rect class="o" x="285" y="44" width="70" height="44" rx="4"/><text x="320" y="71" text-anchor="middle" class="cell">O</text>
  <rect class="o" x="365" y="44" width="70" height="44" rx="4"/><text x="400" y="71" text-anchor="middle" class="cell">O</text>
  <rect class="h" x="445" y="44" width="70" height="44" rx="4"/><text x="480" y="71" text-anchor="middle" class="cell">H</text>
  <rect class="h" x="525" y="44" width="70" height="44" rx="4"/><text x="560" y="71" text-anchor="middle" class="cell">HC</text>
  <rect class="f" x="605" y="44" width="70" height="44" rx="4"/><text x="640" y="71" text-anchor="middle" class="desc">空闲</text>

  <!-- 行 2：y=98 -->
  <rect class="o" x="45"  y="98" width="70" height="44" rx="4"/><text x="80"  y="125" text-anchor="middle" class="cell">O</text>
  <rect class="e" x="125" y="98" width="70" height="44" rx="4"/><text x="160" y="125" text-anchor="middle" class="cell">E</text>
  <rect class="f" x="205" y="98" width="70" height="44" rx="4"/><text x="240" y="125" text-anchor="middle" class="desc">空闲</text>
  <rect class="o" x="285" y="98" width="70" height="44" rx="4"/><text x="320" y="125" text-anchor="middle" class="cell">O</text>
  <rect class="s" x="365" y="98" width="70" height="44" rx="4"/><text x="400" y="125" text-anchor="middle" class="cell">S</text>
  <rect class="e" x="445" y="98" width="70" height="44" rx="4"/><text x="480" y="125" text-anchor="middle" class="cell">E</text>
  <rect class="o" x="525" y="98" width="70" height="44" rx="4"/><text x="560" y="125" text-anchor="middle" class="cell">O</text>
  <rect class="f" x="605" y="98" width="70" height="44" rx="4"/><text x="640" y="125" text-anchor="middle" class="desc">空闲</text>

  <!-- 行 3：y=152 -->
  <rect class="e" x="45"  y="152" width="70" height="44" rx="4"/><text x="80"  y="179" text-anchor="middle" class="cell">E</text>
  <rect class="o" x="125" y="152" width="70" height="44" rx="4"/><text x="160" y="179" text-anchor="middle" class="cell">O</text>
  <rect class="f" x="205" y="152" width="70" height="44" rx="4"/><text x="240" y="179" text-anchor="middle" class="desc">空闲</text>
  <rect class="o" x="285" y="152" width="70" height="44" rx="4"/><text x="320" y="179" text-anchor="middle" class="cell">O</text>
  <rect class="e" x="365" y="152" width="70" height="44" rx="4"/><text x="400" y="179" text-anchor="middle" class="cell">E</text>
  <rect class="h" x="445" y="152" width="70" height="44" rx="4"/><text x="480" y="179" text-anchor="middle" class="cell">H</text>
  <rect class="h" x="525" y="152" width="70" height="44" rx="4"/><text x="560" y="179" text-anchor="middle" class="cell">HC</text>
  <rect class="h" x="605" y="152" width="70" height="44" rx="4"/><text x="640" y="179" text-anchor="middle" class="cell">HC</text>

  <!-- 图例：y=216 -->
  <rect class="e" x="45"  y="216" width="14" height="14" rx="2"/><text x="65"  y="228" class="lg">E Eden</text>
  <rect class="s" x="150" y="216" width="14" height="14" rx="2"/><text x="170" y="228" class="lg">S Survivor</text>
  <rect class="o" x="275" y="216" width="14" height="14" rx="2"/><text x="295" y="228" class="lg">O Old</text>
  <rect class="h" x="370" y="216" width="14" height="14" rx="2"/><text x="390" y="228" class="lg">H / HC Humongous 起始 / 连续</text>
  <rect class="f" x="605" y="216" width="14" height="14" rx="2"/><text x="625" y="228" class="lg">空闲</text>

  <text x="360" y="266" text-anchor="middle" class="desc">Region 大小 1MB–32MB（2 的幂，JDK 18 起上限 512MB）；对象 ≥ Region 一半即分配到连续的 Humongous Region</text>
</svg>
