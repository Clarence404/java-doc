<svg viewBox="0 0 680 574" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    .layer { fill:var(--card); stroke-width:1.5; }
    .name { font-weight:600; font-size:13px; }
    .sub { fill:var(--muted); font-size:11px; }
    .desc { fill:var(--fg); font-size:11px; }
    .arr { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="var(--fg)">分片直传对象存储流程</text>

  <rect class="layer" x="20" y="44" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="70" fill="var(--p)">计算指纹</text>
  <text class="sub" x="40" y="88">浏览器 Web Worker</text>
  <text class="desc" x="650" y="70" text-anchor="end">分块增量计算整个文件的 SHA-256</text>
  <text class="desc" x="650" y="88" text-anchor="end">在 Worker 中执行，不阻塞页面</text>
  <line class="arr" x1="340" y1="104" x2="340" y2="132"/>

  <rect class="layer" x="20" y="134" width="640" height="60" rx="8" stroke="var(--b)"/>
  <text class="name" x="40" y="160" fill="var(--b)">初始化</text>
  <text class="sub" x="40" y="178">POST /uploads</text>
  <text class="desc" x="650" y="160" text-anchor="end">已有同内容文件：下发抽样挑战（秒传）</text>
  <text class="desc" x="650" y="178" text-anchor="end">否则创建分片上传，续传时返回已传分片</text>
  <line class="arr" x1="340" y1="194" x2="340" y2="222"/>

  <rect class="layer" x="20" y="224" width="640" height="60" rx="8" stroke="var(--g)"/>
  <text class="name" x="40" y="250" fill="var(--g)">分片直传</text>
  <text class="sub" x="40" y="268">PUT 预签名 URL</text>
  <text class="desc" x="650" y="250" text-anchor="end">浏览器并发 4 路直传对象存储</text>
  <text class="desc" x="650" y="268" text-anchor="end">每片单独签名，有效 15 分钟，失败重试</text>
  <line class="arr" x1="340" y1="284" x2="340" y2="312"/>

  <rect class="layer" x="20" y="314" width="640" height="60" rx="8" stroke="var(--y)"/>
  <text class="name" x="40" y="340" fill="var(--y)">合并</text>
  <text class="sub" x="40" y="358">POST /complete</text>
  <text class="desc" x="650" y="340" text-anchor="end">服务端 ListParts 校验片数与总大小</text>
  <text class="desc" x="650" y="358" text-anchor="end">状态 CAS 防并发，再 CompleteMultipartUpload</text>
  <line class="arr" x1="340" y1="374" x2="340" y2="402"/>

  <rect class="layer" x="20" y="404" width="640" height="60" rx="8" stroke="var(--r)"/>
  <text class="name" x="40" y="430" fill="var(--r)">落库</text>
  <text class="sub" x="40" y="448">本地事务</text>
  <text class="desc" x="650" y="430" text-anchor="end">写 file_object、user_file 与本地消息</text>
  <text class="desc" x="650" y="448" text-anchor="end">对象键由服务端生成，文件名只作展示</text>
  <line class="arr" x1="340" y1="464" x2="340" y2="492"/>

  <rect class="layer" x="20" y="494" width="640" height="60" rx="8" stroke="var(--p)"/>
  <text class="name" x="40" y="520" fill="var(--p)">异步处理</text>
  <text class="sub" x="40" y="538">MQ 消费者</text>
  <text class="desc" x="650" y="520" text-anchor="end">流式重算 SHA-256，一致才标记 VERIFIED</text>
  <text class="desc" x="650" y="538" text-anchor="end">生成缩略图、内容审核</text>

</svg>
