<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .title { font-size:14px; font-weight:700; fill:var(--fg); }
    .box-title { font-size:13px; font-weight:700; fill:var(--fg); }
    .desc { font-size:11px; fill:var(--muted); }
    .label { font-size:11px; font-weight:700; fill:var(--b); }
  </style>
  <defs>
    <marker id="arrow-log-pipeline" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
  </defs>
  <text class="title" x="480" y="26" text-anchor="middle">Kubernetes 日志采集链路：stdout → 节点 Agent → 存储 → 查询</text>

  <rect x="20" y="90" width="130" height="120" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="85" y="130" text-anchor="middle">应用 Pod</text>
  <text class="desc" x="85" y="155" text-anchor="middle">stdout JSON</text>
  <text class="desc" x="85" y="178" text-anchor="middle">traceId 在 MDC</text>
  <line x1="150" y1="150" x2="178" y2="150" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>

  <rect x="180" y="90" width="130" height="120" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="245" y="130" text-anchor="middle">容器运行时</text>
  <text class="desc" x="245" y="155" text-anchor="middle">/var/log/pods</text>
  <text class="desc" x="245" y="178" text-anchor="middle">按大小轮转</text>
  <line x1="310" y1="150" x2="338" y2="150" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>

  <rect x="340" y="90" width="150" height="120" rx="8" fill="var(--card)" stroke="var(--y)" stroke-width="1.5"/>
  <text class="box-title" x="415" y="130" text-anchor="middle">节点采集 Agent</text>
  <text class="desc" x="415" y="155" text-anchor="middle">Fluent Bit / Vector</text>
  <text class="desc" x="415" y="178" text-anchor="middle">OTel Collector</text>
  <line x1="490" y1="150" x2="518" y2="150" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>

  <rect x="520" y="90" width="120" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="box-title" x="580" y="130" text-anchor="middle">缓冲（可选）</text>
  <text class="desc" x="580" y="155" text-anchor="middle">Kafka / 网关层</text>
  <text class="desc" x="580" y="178" text-anchor="middle">削峰 / 解耦</text>

  <line x1="640" y1="110" x2="668" y2="82" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>
  <line x1="640" y1="150" x2="668" y2="150" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>
  <line x1="640" y1="190" x2="668" y2="218" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>

  <rect x="670" y="50" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="740" y="76" text-anchor="middle">Loki</text>
  <text class="desc" x="740" y="96" text-anchor="middle">标签索引 · LogQL</text>
  <rect x="670" y="120" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="740" y="146" text-anchor="middle">Elasticsearch</text>
  <text class="desc" x="740" y="166" text-anchor="middle">全文倒排索引</text>
  <rect x="670" y="190" width="140" height="60" rx="8" fill="var(--card)" stroke="var(--g)" stroke-width="1.5"/>
  <text class="box-title" x="740" y="216" text-anchor="middle">ClickHouse</text>
  <text class="desc" x="740" y="236" text-anchor="middle">列存 · SQL</text>

  <line x1="810" y1="80" x2="838" y2="80" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>
  <line x1="810" y1="150" x2="838" y2="150" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>
  <line x1="810" y1="220" x2="838" y2="220" stroke="var(--b)" stroke-width="1.5" marker-end="url(#arrow-log-pipeline)"/>

  <rect x="840" y="50" width="100" height="200" rx="8" fill="var(--card)" stroke="var(--p)" stroke-width="1.5"/>
  <text class="box-title" x="890" y="120" text-anchor="middle">查询</text>
  <text class="desc" x="890" y="145" text-anchor="middle">Grafana</text>
  <text class="desc" x="890" y="170" text-anchor="middle">Kibana</text>
  <text class="desc" x="890" y="195" text-anchor="middle">日志告警</text>

  <rect x="20" y="280" width="920" height="40" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text class="desc" x="480" y="305" text-anchor="middle">贯穿全链路的治理：源头控量 · 管道脱敏 · 采样与限流 · 标签基数控制 · 分级保留 · 冷热分层</text>
</svg>
